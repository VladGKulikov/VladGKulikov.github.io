<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<rect width="1600" height="900" fill="#FFFFFF"/>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#4676A8"/></marker></defs>
<text x="60" y="70" font-family="Arial, sans-serif" font-size="39.1" font-weight="700" fill="#202A3B">A spectrum of generation orders</text>
<text x="60" y="108" font-family="Arial, sans-serif" font-size="19.6" fill="#56657A">Block size changes parallelism, cache reuse, and revision granularity</text>
<rect x="80" y="230" width="430" height="330" rx="18" fill="#E8F1FB" stroke="#C9D4E2" stroke-width="2"/>
<text x="105" y="277" text-anchor="start" font-family="Arial, sans-serif" font-size="23.5" font-weight="700" fill="#202A3B">
<tspan x="105" dy="0">AR · block = 1</tspan>
</text>
<text x="105" y="316" text-anchor="start" font-family="Arial, sans-serif" font-size="19.6" font-weight="400" fill="#56657A">
<tspan x="105" dy="0">Flexible length</tspan>
<tspan x="105" dy="24">Exact prefix KV</tspan>
<tspan x="105" dy="24">No native revision</tspan>
</text>
<line x1="520" y1="395" x2="570" y2="395" stroke="#4676A8" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="590" y="230" width="430" height="330" rx="18" fill="#E8F6EC" stroke="#C9D4E2" stroke-width="2"/>
<text x="615" y="277" text-anchor="start" font-family="Arial, sans-serif" font-size="28.2" font-weight="700" fill="#202A3B">
<tspan x="615" dy="0">Block diffusion</tspan>
</text>
<text x="615" y="316" text-anchor="start" font-family="Arial, sans-serif" font-size="19.6" font-weight="400" fill="#56657A">
<tspan x="615" dy="0">Parallelism within a block</tspan>
<tspan x="615" dy="24">KV for completed prefix</tspan>
<tspan x="615" dy="24">Flexible length</tspan>
</text>
<line x1="1030" y1="395" x2="1080" y2="395" stroke="#4676A8" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="1100" y="230" width="430" height="330" rx="18" fill="#EFE8FA" stroke="#C9D4E2" stroke-width="2"/>
<text x="1125" y="277" text-anchor="start" font-family="Arial, sans-serif" font-size="28.2" font-weight="700" fill="#202A3B">
<tspan x="1125" dy="0">Full canvas</tspan>
</text>
<text x="1125" y="316" text-anchor="start" font-family="Arial, sans-serif" font-size="19.6" font-weight="400" fill="#56657A">
<tspan x="1125" dy="0">Maximum parallelism</tspan>
<tspan x="1125" dy="24">The canvas keeps changing</tspan>
<tspan x="1125" dy="24">No reusable canvas KV</tspan>
</text>
<rect x="250" y="655" width="1100" height="130" rx="18" fill="#FFF2CF" stroke="#C9D4E2" stroke-width="2"/>
<text x="275" y="702" text-anchor="start" font-family="Arial, sans-serif" font-size="28.2" font-weight="700" fill="#202A3B">
<tspan x="275" dy="0">Not the only route</tspan>
</text>
<text x="275" y="741" text-anchor="start" font-family="Arial, sans-serif" font-size="22.3" font-weight="600" fill="#56657A">
<tspan x="275" dy="0">Semi-autoregressive and variable-length samplers also exist outside a fixed block-diffusion</tspan>
<tspan x="275" dy="24">construction.</tspan>
</text>
</svg>
