<rect x="260" y="590" width="1080" height="135" rx="18" fill="#E4F5F3" stroke="#C9D4E2" stroke-width="2"/>
<text x="285" y="637" text-anchor="start" font-family="Arial, sans-serif" font-size="28.2" font-weight="700" fill="#202A3B">
<tspan x="285" dy="0">The selected kernel</tspan>
</text>
<text x="285" y="676" text-anchor="start" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#56657A">
<tspan x="285" dy="0">q(xₜⁱ=x₀ⁱ)=1−t     q(xₜⁱ=[MASK])=t</tspan>
</text>
<text x="800" y="790" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.6" font-weight="400" fill="#56657A">
<tspan x="800" dy="0">Other dLLMs may use substitution or general categorical transitions.</tspan>
