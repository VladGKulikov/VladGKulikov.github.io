<rect x="455" y="240" width="305" height="230" rx="18" fill="#E8F1FB" stroke="#C9D4E2" stroke-width="2"/>
<text x="480" y="287" text-anchor="start" font-family="Arial, sans-serif" font-size="23.5" font-weight="700" fill="#202A3B">
<tspan x="480" dy="0">t = 0.35</tspan>
</text>
<text x="480" y="326" text-anchor="start" font-family="Arial, sans-serif" font-size="19.6" font-weight="400" fill="#56657A">
