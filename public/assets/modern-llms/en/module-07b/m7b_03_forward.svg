</text>
<line x1="768" y1="355" x2="828" y2="355" stroke="#4676A8" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="840" y="240" width="305" height="230" rx="18" fill="#FFF2CF" stroke="#C9D4E2" stroke-width="2"/>
<text x="865" y="287" text-anchor="start" font-family="Arial, sans-serif" font-size="23.5" font-weight="700" fill="#202A3B">
<tspan x="865" dy="0">t = 0.70</tspan>
</text>
<text x="865" y="326" text-anchor="start" font-family="Arial, sans-serif" font-size="19.6" font-weight="400" fill="#56657A">
