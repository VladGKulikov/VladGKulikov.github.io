<text x="1250" y="287" text-anchor="start" font-family="Arial, sans-serif" font-size="23.5" font-weight="700" fill="#202A3B">
<tspan x="1250" dy="0">t = 1</tspan>
</text>
<text x="1250" y="326" text-anchor="start" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#56657A">
