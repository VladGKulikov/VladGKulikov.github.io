<svg viewBox="0 0 940 330" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <title>The data-filtering pipeline</title>
  <desc>Six stages from CommonCrawl to a corpus; the flagships and the synthetic loop.</desc>
  <defs><marker id="a82" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M1 1 L8 4.5 L1 8 Z" fill="#4C566A"/></marker></defs>
  <text x="30" y="30" font-size="23" font-weight="700" fill="#2E3440">From the dump to the corpus: the pretraining data-filtering pipeline</text>

  <rect x="40" y="54" width="120" height="54" rx="8" fill="#F8ECEC" stroke="#BF616A"/>
  <text x="100" y="76" text-anchor="middle" font-size="16.6" font-weight="700" fill="#2E3440">CommonCrawl</text>
  <text x="100" y="94" text-anchor="middle" font-size="11.8" fill="#4C566A">~240T raw tokens</text>

  <g font-size="9" text-anchor="middle">
    <rect x="186" y="54" width="108" height="54" rx="8" fill="#E8EEF5" stroke="#5E81AC"/><text x="240" y="74" font-weight="600" fill="#2E3440" font-size="12.3">1 · language ID</text><text x="240" y="92" fill="#4C566A" font-size="13.8">fastText</text>
    <rect x="310" y="54" width="108" height="54" rx="8" fill="#E8EEF5" stroke="#5E81AC"/><text x="364" y="74" font-weight="600" fill="#2E3440" font-size="13.8">2 · repeats</text><text x="364" y="92" fill="#4C566A" font-size="12.1" font-weight="600">lines · n-grams</text>
    <rect x="434" y="54" width="108" height="54" rx="8" fill="#E8EEF5" stroke="#5E81AC"/><text x="488" y="74" font-weight="600" fill="#2E3440" font-size="13.1">3 · heuristics</text><text x="488" y="92" fill="#4C566A" font-weight="600">letters · lengths · stop words</text>
    <rect x="558" y="54" width="108" height="54" rx="8" fill="#E8EEF5" stroke="#5E81AC"/><text x="612" y="74" font-weight="600" fill="#2E3440" font-size="13.8">4 · dedup</text><text x="612" y="92" fill="#4C566A" font-size="12.4" font-weight="600">MinHash + LSH</text>
    <rect x="682" y="54" width="108" height="54" rx="8" fill="#E8EEF5" stroke="#5E81AC"/><text x="736" y="74" font-weight="600" fill="#2E3440" font-size="13.5">5 · classifier</text><text x="736" y="92" fill="#4C566A">quality fastText/BERT</text>
    <rect x="806" y="54" width="100" height="54" rx="8" fill="#E8EEF5" stroke="#5E81AC"/><text x="856" y="74" font-weight="600" fill="#2E3440" font-size="10.8">6 · toxicity/PII</text><text x="856" y="92" fill="#4C566A" font-size="11.2">detect and cut</text>
  </g>
  <g stroke="#4C566A" stroke-width="1.1">
    <line x1="160" y1="81" x2="182" y2="81" marker-end="url(#a82)"/><line x1="294" y1="81" x2="306" y2="81" marker-end="url(#a82)"/><line x1="418" y1="81" x2="430" y2="81" marker-end="url(#a82)"/><line x1="542" y1="81" x2="554" y2="81" marker-end="url(#a82)"/><line x1="666" y1="81" x2="678" y2="81" marker-end="url(#a82)"/><line x1="790" y1="81" x2="802" y2="81" marker-end="url(#a82)"/>
  </g>

  <rect x="40" y="136" width="860" height="76" rx="12" fill="#EFF4EA" stroke="#A3BE8C" stroke-width="1.2"/>
  <text x="58" y="158" font-size="16.6" font-weight="700" fill="#2E3440">The flagships at the pipeline's output</text>
  <g font-size="9.5" fill="#2E3440">
    <text x="58" y="180" font-size="11.5">FineWeb <tspan font-weight="600">15T</tspan> · FineWeb-Edu <tspan font-weight="600">1.3T</tspan> (an LLM classifier of “educational value”) · Nemotron-CC <tspan font-weight="600">6.3T</tspan> (+Math, ~150B verified)</text>
    <text x="58" y="200" font-size="11.5">DCLM: curation as a competition — <tspan font-weight="600">240T → 4T</tspan> · code: StackV2/V3 (+reviews, commits) · math: MegaMath <tspan font-weight="600">370B</tspan></text>
  </g>

  <rect x="40" y="228" width="500" height="60" rx="12" fill="#F3EEF3" stroke="#B48EAD"/>
  <text x="58" y="250" font-size="16.6" font-weight="700" fill="#2E3440">The synthetic loop (a 2026 standard)</text>
  <text x="58" y="270" font-size="11.5" fill="#2E3440">ProX: a small LM rewrites the messy web before use;</text>
  <text x="58" y="284" font-size="11.5" fill="#2E3440">Cosmopedia v2: 25M “textbook-style” examples</text>

  <rect x="560" y="228" width="340" height="60" rx="12" fill="#FAF5E3" stroke="#EBCB8B"/>
  <text x="578" y="250" font-size="16.6" font-weight="700" fill="#2E3440">The multimodal projection</text>
  <text x="578" y="270" font-size="11.2" fill="#2E3440" font-weight="600">image-text pairs and interleaved documents — the same</text>
  <text x="578" y="284" font-size="11.6" fill="#2E3440" font-weight="600">pipeline + consistency filters; the modality is staged</text>

  <text x="30" y="316" font-size="11.5" fill="#2E3440">The stage order runs cheap to costly: the model classifier only sees what survived the heuristics and the dedup (§5).</text>
</svg>
