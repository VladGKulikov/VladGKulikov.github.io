<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="892" viewBox="0 0 1100 892">
<title>One block, two residual additions</title>
<desc>Normalization feeds a transformation branch; the skip connection carries its input.</desc>
<rect width="1100" height="892" fill="#FFFFFF"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9 Z" fill="#4C566A"/></marker></defs>
