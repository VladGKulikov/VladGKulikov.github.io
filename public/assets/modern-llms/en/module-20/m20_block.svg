<rect x="400" y="444" width="300" height="70" rx="12" fill="#EFF4EA" stroke="#D8DEE9" stroke-width="1.3"/>
<text x="550.0" y="485.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="400" fill="#2E3440" text-anchor="middle">+ → Z</text>
