<rect x="400" y="652" width="300" height="70" rx="12" fill="#F3EEF3" stroke="#D8DEE9" stroke-width="1.3"/>
<text x="550.0" y="693.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="400" fill="#2E3440" text-anchor="middle">SwiGLU</text>
<path d="M550,722 L550,751" fill="none" stroke="#4C566A" stroke-width="2" marker-end="url(#arrow)"/>
