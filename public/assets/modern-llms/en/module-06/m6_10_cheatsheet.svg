</text>
<rect x="1045" y="190" width="450" height="230" rx="18" fill="#FFF2D3" stroke="#C8D2E1" stroke-width="2"/>
<text x="1070" y="238" text-anchor="start" font-family="Arial, sans-serif" font-size="28.2" font-weight="700" fill="#20293A">
