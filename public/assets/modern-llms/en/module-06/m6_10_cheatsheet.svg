</text>
<text x="80" y="277" text-anchor="start" font-family="Arial, sans-serif" font-size="19.6" font-weight="400" fill="#596579">
<tspan x="80" dy="0">only with a declared counting convention</tspan>
</text>
<rect x="550" y="190" width="450" height="230" rx="18" fill="#E8F6EA" stroke="#C8D2E1" stroke-width="2"/>
