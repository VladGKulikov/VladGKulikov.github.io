<tspan x="80" dy="24">shared ≠ known content</tspan>
</text>
<rect x="550" y="500" width="450" height="230" rx="18" fill="#FCE5E8" stroke="#C8D2E1" stroke-width="2"/>
<text x="575" y="548" text-anchor="start" font-family="Arial, sans-serif" font-size="28.2" font-weight="700" fill="#20293A">
<tspan x="575" dy="0">Inference</tspan>
</text>
<text x="575" y="587" text-anchor="start" font-family="Arial, sans-serif" font-size="19.6" font-weight="400" fill="#596579">
