<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<rect width="1600" height="900" fill="#FFFFFF"/>
<text x="58" y="62" font-family="Arial, sans-serif" font-size="39.1" font-weight="700" fill="#20293A">Mixture of Experts: module map</text>
<text x="58" y="101" font-family="Arial, sans-serif" font-size="19.6" fill="#596579">Architectural sparsity, routing, and systems cost</text>
<defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#465A73"/></marker></defs>
<rect x="55" y="190" width="450" height="230" rx="18" fill="#E7F0FB" stroke="#C8D2E1" stroke-width="2"/>
<text x="80" y="238" text-anchor="start" font-family="Arial, sans-serif" font-size="23.5" font-weight="700" fill="#20293A">
