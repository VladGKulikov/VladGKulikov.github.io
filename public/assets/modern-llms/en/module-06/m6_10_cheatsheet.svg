</text>
<rect x="55" y="500" width="450" height="230" rx="18" fill="#EEE8FA" stroke="#C8D2E1" stroke-width="2"/>
<text x="80" y="548" text-anchor="start" font-family="Arial, sans-serif" font-size="28.2" font-weight="700" fill="#20293A">
