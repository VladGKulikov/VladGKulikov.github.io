<svg viewBox="0 0 940 360" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <title>Tool-use SFT</title>
  <desc>A trajectory with a tool call and observation; the decisions the model must learn.</desc>
  <defs><marker id="a118" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M1 1 L8 4.5 L1 8 Z" fill="#4C566A"/></marker></defs>
  <text x="30" y="30" font-size="23" font-weight="700" fill="#2E3440">SFT for tool use (§12)</text>

  <rect x="40" y="52" width="560" height="180" rx="12" fill="#ECEFF4" stroke="#D8DEE9"/>
  <text x="58" y="74" font-size="16.6" font-weight="700" fill="#2E3440">The data format: a dialogue with two new reply genres</text>
  <g font-family="ui-monospace, Menlo, monospace" font-size="8.8" fill="#2E3440">
    <text x="58" y="98" font-size="13.8" font-weight="600">[user] What's the weather in Tel Aviv?</text>
    <text x="58" y="120" fill="#5E81AC" font-size="13.8" font-weight="600">[assistant] &lt;tool_call&gt;{"name": "get_weather",</text>
    <text x="58" y="136" fill="#5E81AC" font-size="13.8" font-weight="600">            "arguments": {"city": "Tel Aviv"}}&lt;/tool_call&gt;</text>
    <text x="58" y="158" fill="#D08770" font-size="13.8" font-weight="600">[tool_response] {"temp": 28, "condition": "sunny"}</text>
    <text x="58" y="180" fill="#A3BE8C" font-size="13.8" font-weight="600">[assistant] It's currently 28°C and sunny in Tel Aviv.</text>
  </g>
  <text x="58" y="206" font-size="10.6" fill="#4C566A">the call is strict JSON in tags; after tool_response the model phrases the answer for the human;</text>
  <text x="58" y="220" font-size="10.8" fill="#4C566A">data sources include xLAM and ToolACE; synthetic data still needs provenance and verification</text>

  <rect x="620" y="52" width="280" height="180" rx="8" fill="#E8EEF5" stroke="#5E81AC" stroke-width="1.2"/>
  <text x="638" y="74" font-size="16.6" font-weight="700" fill="#2E3440">Decisions taught by SFT (Q6)</text>
  <g font-size="9" fill="#2E3440">
    <text x="638" y="98" font-size="13.8">1 · strict call structure:</text>
    <text x="638" y="114" fill="#4C566A" font-size="11.5">arguments, required fields</text>
    <text x="638" y="136" font-size="11.5">2 · reading observations</text>
    <text x="638" y="158" font-size="11.5">3 · multi-step chains</text>
    <text x="638" y="174" fill="#4C566A" font-size="11.5">and parallel calls</text>
    <text x="638" y="196" font-size="11.5">4 · escalation to the user</text>
    <text x="638" y="212" fill="#4C566A" font-size="11.5">when the tool did not help</text>
  </g>

  <rect x="40" y="250" width="860" height="52" rx="12" fill="#EFF4EA" stroke="#A3BE8C" stroke-width="1.3"/>
  <text x="58" y="272" font-size="15.6" font-weight="700" fill="#2E3440">Evaluate separate dimensions:</text>
  <text x="330" y="272" font-size="11.5" fill="#2E3440">Evaluate schema · selection · execution · multi-turn completion</text>
  <text x="58" y="292" font-size="11.5" fill="#4C566A">“can generate JSON” ≠ “can use tools”: arguments, observations, errors, and retries all matter</text>

  <text x="30" y="330" font-size="11.5" fill="#2E3440">The call protocol lives in the template (§4): tags, JSON wrappers, or a Harmony channel must match the model;</text>
  <text x="30" y="346" font-size="11.5" fill="#2E3440">environment observations are context; assistant calls and reactions are supervised actions.</text>
</svg>
