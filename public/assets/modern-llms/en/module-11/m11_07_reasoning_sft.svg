<svg viewBox="0 0 940 360" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <title>SFT on reasoning demonstrations</title>
  <desc>The trace-distillation pipeline: the teacher, tasks, traces, student SFT; the results and the s1 arithmetic.</desc>
  <defs><marker id="a117" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M1 1 L8 4.5 L1 8 Z" fill="#4C566A"/></marker></defs>
  <text x="30" y="30" font-size="23" font-weight="700" fill="#2E3440">Transferring solutions: a distillation pipeline (§11)</text>

  <g font-size="9" text-anchor="middle">
    <rect x="40" y="56" width="180" height="66" rx="8" fill="#F3EEF3" stroke="#B48EAD" stroke-width="1.2"/>
    <text x="130" y="78" font-weight="700" font-size="15.2" fill="#2E3440">Strong teacher model</text>
    <text x="130" y="96" fill="#2E3440" font-size="9.5">a model with high-quality solutions</text>
    <text x="130" y="112" font-size="10.5" fill="#4C566A">the expensive part: generation</text>
    <rect x="262" y="56" width="170" height="66" rx="8" fill="#ECEFF4" stroke="#D8DEE9"/>
    <text x="347" y="78" font-weight="700" font-size="15.5" fill="#2E3440">Thousands of tasks</text>
    <text x="347" y="96" fill="#2E3440" font-size="13.8" font-weight="600">math · code · science</text>
    <text x="347" y="112" font-size="13.8" fill="#4C566A" font-weight="600">+ answer verification</text>
    <rect x="474" y="56" width="190" height="66" rx="8" fill="#FAF5E3" stroke="#EBCB8B" stroke-width="1.2"/>
    <text x="569" y="78" font-weight="700" font-size="16.6" fill="#2E3440">Traces</text>
    <text x="569" y="96" fill="#2E3440" font-size="13.8">long sequences:</text>
    <text x="569" y="112" font-size="13.8" fill="#4C566A" font-weight="600">solution + final answer</text>
    <rect x="706" y="56" width="194" height="66" rx="8" fill="#EFF4EA" stroke="#A3BE8C" stroke-width="1.3"/>
    <text x="803" y="78" font-weight="700" font-size="16.6" fill="#2E3440">Student SFT</text>
    <text x="803" y="96" fill="#2E3440" font-size="12.7">target: solution and answer</text>
    <text x="803" y="112" font-size="11.9" fill="#4C566A">safe packing is important (§6)</text>
  </g>
  <g stroke="#4C566A" stroke-width="1.1">
    <line x1="220" y1="89" x2="258" y2="89" marker-end="url(#a117)"/>
    <line x1="432" y1="89" x2="470" y2="89" marker-end="url(#a117)"/>
    <line x1="664" y1="89" x2="702" y2="89" marker-end="url(#a117)"/>
  </g>

  <rect x="40" y="142" width="430" height="102" rx="12" fill="#ECEFF4" stroke="#D8DEE9"/>
  <text x="58" y="164" font-size="13.8" font-weight="700" fill="#2E3440">Author-reported results</text>
  <g font-size="9.5" fill="#2E3440">
    <text x="58" y="188" font-size="13.8" font-weight="600"><tspan font-weight="700">R1-Distill-Qwen-7B</tspan>: 55.5% pass@1 on AIME24</text>
    <text x="58" y="206" font-size="11.5">32B: 72.6% AIME24 and 94.3% MATH-500</text>
    <text x="58" y="230" font-size="11.5"><tspan font-weight="700">s1</tspan>: 1K problems; 5 epochs; 26 min on 16 H100s</text>
  </g>

  <rect x="490" y="142" width="410" height="102" rx="12" fill="#EFF4EA" stroke="#A3BE8C" stroke-width="1.3"/>
  <text x="508" y="164" font-size="16.6" font-weight="700" fill="#2E3440">A separate one-pass teaching scenario</text>
  <g font-family="ui-monospace, Menlo, monospace" font-size="9.5" fill="#2E3440">
    <text x="508" y="188" font-size="12.4" font-weight="600">1K × 9K tok = 9.0e6 → C = 6·N·D = 1.73e18 FLOPs</text>
    <text x="508" y="208" font-size="13.8" font-weight="600">8 accelerators @40% MFU → <tspan font-weight="700" fill="#A3BE8C">9 minutes</tspan></text>
  </g>
  <text x="508" y="232" font-size="11.5" fill="#4C566A">an arithmetic estimate, not the s1 runtime</text>

  <rect x="40" y="262" width="860" height="52" rx="12" fill="#F8ECEC" stroke="#BF616A"/>
  <text x="58" y="284" font-size="12.2" font-weight="700" fill="#2E3440">The honest frame (Q5):</text>
  <text x="230" y="284" font-size="11.5" fill="#2E3440">SFT transfers solution structure and teacher artifacts; evaluate quality separately.</text>
  <text x="58" y="304" font-size="11.5" fill="#4C566A">a small set can help a strong base model, but selection and protocol determine the result</text>

  <text x="30" y="344" font-size="11.5" fill="#2E3440">Long sequences require careful packing and more activation memory · solution tokens</text>
  <text x="30" y="358" font-size="11.5" fill="#2E3440">may be supervised together with the final answer (§5).</text>
</svg>
