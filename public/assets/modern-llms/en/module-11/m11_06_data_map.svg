<svg viewBox="0 0 940 380" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <title>An SFT data map</title>
  <desc>Three functions: general dialogue, reasoning demonstrations, and tool trajectories.</desc>
  <defs><marker id="a116" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M1 1 L8 4.5 L1 8 Z" fill="#4C566A"/></marker></defs>
  <text x="30" y="30" font-size="23" font-weight="700" fill="#2E3440">Three shelves of one mix (§8)</text>

  <rect x="40" y="52" width="278" height="230" rx="8" fill="#E8EEF5" stroke="#5E81AC" stroke-width="1.2"/>
  <text x="58" y="76" font-size="16.6" font-weight="700" fill="#2E3440">General instructions</text>
  <g font-size="9" fill="#2E3440">
    <text x="58" y="100" fill="#4C566A" font-size="13.8" font-weight="600">OpenAssistant · UltraChat</text>
    <text x="58" y="122" font-weight="600" font-size="13.8">The MAGPIE family (§10)</text>
    <text x="58" y="138" fill="#4C566A" font-size="11.5">synthetics from an empty template</text>
    <text x="58" y="160" font-weight="600" font-size="13.8">Tülu 3: an open mixture</text>
    <text x="58" y="176" fill="#4C566A" font-size="13.8" font-weight="600">dialogue · math · code · safety</text>
    <text x="58" y="198" font-weight="600" font-size="13.8">role: instruction following</text>
    <text x="58" y="214" fill="#4C566A" font-size="11.5">and general response style</text>
    <text x="58" y="236" font-size="11.5">audit licenses and duplicates</text>
    <text x="58" y="262" fill="#4C566A" font-size="11.5">coverage matters more than row count</text>
  </g>

  <rect x="332" y="52" width="278" height="230" rx="8" fill="#F3EEF3" stroke="#B48EAD" stroke-width="1.2"/>
  <text x="350" y="76" font-size="16.6" font-weight="700" fill="#2E3440">Reasoning demonstrations</text>
  <g font-size="9" fill="#2E3440">
    <text x="350" y="100" font-weight="600" font-size="13.8">R1-Distill: about 800K examples</text>
    <text x="350" y="116" fill="#4C566A" font-size="11.5">600K reasoning + 200K general</text>
    <text x="350" y="138" font-weight="600" font-size="13.8">s1K: 1,000 selected problems</text>
    <text x="350" y="154" fill="#4C566A" font-size="11.5">five epochs; 26 min on 16 H100s</text>
    <text x="350" y="176" font-size="11.5">open corpora still require audits</text>
    <text x="350" y="192" fill="#4C566A" font-size="11.5">for leakage, style, and verification</text>
    <text x="350" y="214" font-size="13.8" font-weight="600">math · code · science</text>
    <text x="350" y="240" fill="#4C566A" font-size="11.5">long traces change activation memory,</text>
    <text x="350" y="256" fill="#4C566A" font-size="11.5">packing, and the token distribution</text>
  </g>

  <rect x="624" y="52" width="276" height="230" rx="8" fill="#EFF4EA" stroke="#A3BE8C" stroke-width="1.2"/>
  <text x="642" y="76" font-size="16.6" font-weight="700" fill="#2E3440">Tool trajectories</text>
  <g font-size="9" fill="#2E3440">
    <text x="642" y="100" font-weight="600" font-size="13.8">xLAM / Tool-Calling Trove</text>
    <text x="642" y="116" fill="#4C566A" font-size="12.8" font-weight="600">Salesforce · 60K single-turn examples</text>
    <text x="642" y="138" font-size="11.5">ToolACE: a broad API pool</text>
    <text x="642" y="154" fill="#4C566A" font-size="13.8" font-weight="600">rules + model verification</text>
    <text x="642" y="176" font-size="13.8" font-weight="600">multi-turn data</text>
    <text x="642" y="192" fill="#4C566A" font-size="11.5">adds dependent actions</text>
    <text x="642" y="218" font-weight="600" font-size="13.8">measure separately:</text>
    <text x="642" y="234" font-weight="600" font-size="10.7">schema · choice · execution · completion (§12)</text>
    <text x="642" y="258" fill="#4C566A" font-size="11.5">there is no universal multiplier</text>
  </g>

  <g stroke="#4C566A" stroke-width="1.1" fill="none">
    <path d="M179 282 C 179 306, 340 312, 452 316" marker-end="url(#a116)"/>
    <path d="M471 282 L 471 312" marker-end="url(#a116)"/>
    <path d="M762 282 C 762 306, 600 312, 490 316" marker-end="url(#a116)"/>
  </g>
  <rect x="261" y="318" width="420" height="46" rx="12" fill="#FAF5E3" stroke="#EBCB8B" stroke-width="1.3"/>
  <text x="471" y="334" text-anchor="middle" font-size="16.6" font-weight="700" fill="#2E3440">The mix is assembled to a profile</text>
  <text x="471" y="348" text-anchor="middle" font-size="12" fill="#4C566A">proportions follow target skills and risks;</text>
  <text x="471" y="359" text-anchor="middle" font-size="12" fill="#4C566A">quality is checked on held-out evaluations (§9)</text>

  <text x="30" y="376" font-size="9.7" font-style="italic" fill="#4C566A">size does not replace provenance, licensing, quality, or coverage</text>
</svg>
