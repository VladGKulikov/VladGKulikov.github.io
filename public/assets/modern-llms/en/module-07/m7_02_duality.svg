<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<rect width="1600" height="900" fill="white"/>
<text x="70" y="70" font-family="Arial" font-size="39.1" font-weight="700" fill="#2E3440">State Space Duality: one operator, three routes</text>
<text x="70" y="110" font-family="Arial" font-size="19.6" fill="#5B6472">The equivalence applies to a structured class of semiseparable matrices</text>
<rect x="90" y="240" width="410" height="260" rx="18" fill="#EAF1FB" stroke="#CBD3DF" stroke-width="2"/>
<text x="116" y="288" text-anchor="start" font-family="Arial" font-size="28.2" font-weight="700" fill="#2E3440">
<tspan x="116" dy="0">Recurrent decode</tspan>
</text>
<text x="116" y="329" text-anchor="start" font-family="Arial" font-size="23.5" font-weight="600" fill="#5B6472">
<tspan x="116" dy="0">hₜ = Aₜhₜ₋₁ + Bₜxₜ</tspan>
<tspan x="116" dy="25">fixed state</tspan>
</text>
<rect x="595" y="240" width="410" height="260" rx="18" fill="#EDF7ED" stroke="#CBD3DF" stroke-width="2"/>
<text x="621" y="288" text-anchor="start" font-family="Arial" font-size="28.2" font-weight="700" fill="#2E3440">
<tspan x="621" dy="0">Parallel scan</tspan>
</text>
<text x="621" y="329" text-anchor="start" font-family="Arial" font-size="19.6" font-weight="400" fill="#5B6472">
<tspan x="621" dy="0">associative composition</tspan>
<tspan x="621" dy="25">logarithmic depth</tspan>
</text>
<rect x="1100" y="240" width="410" height="260" rx="18" fill="#F3EDFA" stroke="#CBD3DF" stroke-width="2"/>
<text x="1126" y="288" text-anchor="start" font-family="Arial" font-size="28.2" font-weight="700" fill="#2E3440">
<tspan x="1126" dy="0">Chunked matrix form</tspan>
</text>
<text x="1126" y="329" text-anchor="start" font-family="Arial" font-size="19.6" font-weight="400" fill="#5B6472">
<tspan x="1126" dy="0">dense work inside chunks</tspan>
<tspan x="1126" dy="25">state across boundaries</tspan>
</text>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#4C78A8"/></marker></defs>
<line x1="500" y1="370" x2="585" y2="370" stroke="#4C78A8" stroke-width="3" marker-end="url(#a)"/>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#4C78A8"/></marker></defs>
<line x1="1005" y1="370" x2="1090" y2="370" stroke="#4C78A8" stroke-width="3" marker-end="url(#a)"/>
<rect x="240" y="610" width="1120" height="145" rx="18" fill="#FCEBEC" stroke="#CBD3DF" stroke-width="2"/>
<text x="266" y="658" text-anchor="start" font-family="Arial" font-size="28.2" font-weight="700" fill="#2E3440">
<tspan x="266" dy="0">Scope</tspan>
</text>
<text x="266" y="699" text-anchor="start" font-family="Arial" font-size="19.6" font-weight="400" fill="#5B6472">
<tspan x="266" dy="0">Not every SSM equals softmax attention; mathematically equal forms need not be bitwise</tspan>
<tspan x="266" dy="25">identical.</tspan>
</text>
</svg>
