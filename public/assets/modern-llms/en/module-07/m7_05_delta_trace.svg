<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<rect width="1600" height="900" fill="white"/>
<text x="70" y="70" font-family="Arial" font-size="39.1" font-weight="700" fill="#2E3440">Delta rule: correction instead of accumulation</text>
<text x="70" y="110" font-family="Arial" font-size="19.6" fill="#5B6472">The same key writes a new value over the old association</text>
<rect x="55" y="260" width="330" height="270" rx="18" fill="#EAF1FB" stroke="#CBD3DF" stroke-width="2"/>
<text x="81" y="308" text-anchor="start" font-family="Arial" font-size="28.2" font-weight="700" fill="#2E3440">
<tspan x="81" dy="0">First write</tspan>
</text>
<text x="81" y="349" text-anchor="start" font-family="Arial" font-size="23.5" font-weight="600" fill="#5B6472">
<tspan x="81" dy="0">v₁ = (1,2)</tspan>
</text>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#4C78A8"/></marker></defs>
<line x1="393" y1="395" x2="437" y2="395" stroke="#4C78A8" stroke-width="3" marker-end="url(#a)"/>
<rect x="445" y="260" width="330" height="270" rx="18" fill="#FCEBEC" stroke="#CBD3DF" stroke-width="2"/>
<text x="471" y="308" text-anchor="start" font-family="Arial" font-size="28.2" font-weight="700" fill="#2E3440">
<tspan x="471" dy="0">Additive update</tspan>
</text>
<text x="471" y="349" text-anchor="start" font-family="Arial" font-size="23.5" font-weight="600" fill="#5B6472">
<tspan x="471" dy="0">read → (4,6)</tspan>
<tspan x="471" dy="25">old + new</tspan>
</text>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#4C78A8"/></marker></defs>
<line x1="783" y1="395" x2="827" y2="395" stroke="#4C78A8" stroke-width="3" marker-end="url(#a)"/>
<rect x="835" y="260" width="330" height="270" rx="18" fill="#FFF5DD" stroke="#CBD3DF" stroke-width="2"/>
<text x="861" y="308" text-anchor="start" font-family="Arial" font-size="28.2" font-weight="700" fill="#2E3440">
<tspan x="861" dy="0">Delta β=0.5</tspan>
</text>
<text x="861" y="349" text-anchor="start" font-family="Arial" font-size="23.5" font-weight="600" fill="#5B6472">
<tspan x="861" dy="0">read → (2,3)</tspan>
<tspan x="861" dy="25">partial replacement</tspan>
</text>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#4C78A8"/></marker></defs>
<line x1="1173" y1="395" x2="1217" y2="395" stroke="#4C78A8" stroke-width="3" marker-end="url(#a)"/>
<rect x="1225" y="260" width="330" height="270" rx="18" fill="#EDF7ED" stroke="#CBD3DF" stroke-width="2"/>
<text x="1251" y="308" text-anchor="start" font-family="Arial" font-size="28.2" font-weight="700" fill="#2E3440">
<tspan x="1251" dy="0">Delta β=1</tspan>
</text>
<text x="1251" y="349" text-anchor="start" font-family="Arial" font-size="23.5" font-weight="600" fill="#5B6472">
<tspan x="1251" dy="0">read → (3,4)</tspan>
<tspan x="1251" dy="25">exact replacement</tspan>
</text>
<text x="800" y="690" text-anchor="middle" font-family="Arial" font-size="28.2" font-weight="700" fill="#4C78A8">
<tspan x="800" dy="0">S′ = gS + β(v − gSk)kᵀ</tspan>
</text>
</svg>
