<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker></defs>
<rect width="100%" height="100%" fill="#F8FAFC"/><text x="60" y="69" font-family="DejaVu Sans, Arial, sans-serif" font-size="35" font-weight="700" fill="#172033" text-anchor="start"><tspan x="60" dy="0">DeepSeek-R1: an isolated experiment and a deployable multi-stage recipe</tspan></text><text x="60" y="121" font-family="DejaVu Sans, Arial, sans-serif" font-size="23.5" font-weight="600" fill="#526071" text-anchor="start"><tspan x="60" dy="0">R1-Zero reveals what RL can discover; the full R1 adds format, data selection, and a broader assistant contract.</tspan></text><text x="70" y="205" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="700" fill="#172033" text-anchor="start"><tspan x="70" dy="0">R1-Zero</tspan></text><text x="70" y="505" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="700" fill="#172033" text-anchor="start"><tspan x="70" dy="0">DeepSeek-R1</tspan></text><rect x="240" y="220" width="285" height="205" rx="24" fill="#DCEBFA" stroke="#CBD5E1" stroke-width="2"/><text x="268" y="270" font-family="DejaVu Sans, Arial, sans-serif" font-size="28.2" font-weight="700" fill="#172033" text-anchor="start"><tspan x="268" dy="0">Base model</tspan></text><text x="268" y="307" font-family="DejaVu Sans, Arial, sans-serif" font-size="19.6" font-weight="400" fill="#526071" text-anchor="start"><tspan x="268" dy="0">No preliminary SFT that</tspan><tspan x="268" dy="24">demonstrates the</tspan><tspan x="268" dy="24">format</tspan></text><path d="M525,322 L558,322" stroke="#475569" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="570" y="220" width="285" height="205" rx="24" fill="#DFF3E4" stroke="#CBD5E1" stroke-width="2"/><text x="598" y="270" font-family="DejaVu Sans, Arial, sans-serif" font-size="28.2" font-weight="700" fill="#172033" text-anchor="start"><tspan x="598" dy="0">RLVR</tspan></text><text x="598" y="307" font-family="DejaVu Sans, Arial, sans-serif" font-size="19.6" font-weight="400" fill="#526071" text-anchor="start"><tspan x="598" dy="0">Verifiable reward plus</tspan><tspan x="598" dy="24">formatting constraints</tspan></text><path d="M855,322 L888,322" stroke="#475569" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="900" y="220" width="285" height="205" rx="24" fill="#FFF1CC" stroke="#CBD5E1" stroke-width="2"/><text x="928" y="270" font-family="DejaVu Sans, Arial, sans-serif" font-size="28.2" font-weight="700" fill="#172033" text-anchor="start"><tspan x="928" dy="0">Emergent</tspan><tspan x="928" dy="29">behavior</tspan></text><text x="928" y="336" font-family="DejaVu Sans, Arial, sans-serif" font-size="19.6" font-weight="400" fill="#526071" text-anchor="start"><tspan x="928" dy="0">Longer paths,</tspan><tspan x="928" dy="24">self-checking, and</tspan><tspan x="928" dy="24">course correction</tspan></text><path d="M1185,322 L1218,322" stroke="#475569" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="1230" y="220" width="285" height="205" rx="24" fill="#FBE2E7" stroke="#CBD5E1" stroke-width="2"/><text x="1258" y="270" font-family="DejaVu Sans, Arial, sans-serif" font-size="28.2" font-weight="700" fill="#172033" text-anchor="start"><tspan x="1258" dy="0">Limitations</tspan></text><text x="1258" y="307" font-family="DejaVu Sans, Arial, sans-serif" font-size="19.6" font-weight="400" fill="#526071" text-anchor="start"><tspan x="1258" dy="0">Language mixing and</tspan><tspan x="1258" dy="24">poor readability</tspan></text><rect x="240" y="520" width="285" height="205" rx="24" fill="#DCEBFA" stroke="#CBD5E1" stroke-width="2"/><text x="268" y="570" font-family="DejaVu Sans, Arial, sans-serif" font-size="28.2" font-weight="700" fill="#172033" text-anchor="start"><tspan x="268" dy="0">Cold start</tspan></text><text x="268" y="607" font-family="DejaVu Sans, Arial, sans-serif" font-size="19.6" font-weight="400" fill="#526071" text-anchor="start"><tspan x="268" dy="0">A small SFT set of</tspan><tspan x="268" dy="24">readable solutions</tspan></text><path d="M525,622 L558,622" stroke="#475569" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="570" y="520" width="285" height="205" rx="24" fill="#DFF3E4" stroke="#CBD5E1" stroke-width="2"/><text x="598" y="570" font-family="DejaVu Sans, Arial, sans-serif" font-size="28.2" font-weight="700" fill="#172033" text-anchor="start"><tspan x="598" dy="0">Reasoning RL</tspan></text><text x="598" y="607" font-family="DejaVu Sans, Arial, sans-serif" font-size="19.6" font-weight="400" fill="#526071" text-anchor="start"><tspan x="598" dy="0">Exploration under</tspan><tspan x="598" dy="24">verifiable reward</tspan></text><path d="M855,622 L888,622" stroke="#475569" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="900" y="520" width="285" height="205" rx="24" fill="#FFF1CC" stroke="#CBD5E1" stroke-width="2"/><text x="928" y="570" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="700" fill="#172033" text-anchor="start"><tspan x="928" dy="0">Selection + SFT</tspan></text><text x="928" y="607" font-family="DejaVu Sans, Arial, sans-serif" font-size="19.6" font-weight="400" fill="#526071" text-anchor="start"><tspan x="928" dy="0">Successful trajectories</tspan><tspan x="928" dy="24">become new training</tspan><tspan x="928" dy="24">data</tspan></text><path d="M1185,622 L1218,622" stroke="#475569" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="1230" y="520" width="285" height="205" rx="24" fill="#FBE2E7" stroke="#CBD5E1" stroke-width="2"/><text x="1258" y="570" font-family="DejaVu Sans, Arial, sans-serif" font-size="28.2" font-weight="700" fill="#172033" text-anchor="start"><tspan x="1258" dy="0">General RL</tspan></text><text x="1258" y="607" font-family="DejaVu Sans, Arial, sans-serif" font-size="19.6" font-weight="400" fill="#526071" text-anchor="start"><tspan x="1258" dy="0">Helpfulness, safety,</tspan><tspan x="1258" dy="24">and instruction</tspan><tspan x="1258" dy="24">following</tspan></text><rect x="80" y="750" width="1440" height="95" rx="24" fill="#EDE5FA" stroke="#CBD5E1" stroke-width="2"/><text x="110" y="797" font-family="DejaVu Sans, Arial, sans-serif" font-size="23.5" font-weight="600" fill="#172033" text-anchor="start"><tspan x="110" dy="0">Lesson: SFT and RL play different roles. SFT establishes form, RL explores, and selection turns discovered</tspan><tspan x="110" dy="28">strategies into data.</tspan></text></svg>