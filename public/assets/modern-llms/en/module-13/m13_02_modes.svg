<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker></defs>
<rect width="100%" height="100%" fill="#F8FAFC"/><text x="60" y="72" font-family="DejaVu Sans, Arial, sans-serif" font-size="38" font-weight="700" fill="#172033" text-anchor="start"><tspan x="60" dy="0">Three ways to spend inference-time computation</tspan></text><text x="60" y="121" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400" fill="#526071" text-anchor="start"><tspan x="60" dy="0">They can be combined, but they solve different problems and create different systems constraints.</tspan></text><rect x="80" y="215" width="450" height="355" rx="24" fill="#DCEBFA" stroke="#CBD5E1" stroke-width="2"/><text x="108" y="271" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="700" fill="#172033" text-anchor="start"><tspan x="108" dy="0">Sequential depth</tspan></text><text x="108" y="312" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400" fill="#526071" text-anchor="start"><tspan x="108" dy="0">One path becomes longer</tspan><tspan x="108" dy="29">through planning, checking,</tspan><tspan x="108" dy="29">backtracking, or tool use.</tspan></text><rect x="80" y="600" width="450" height="100" rx="24" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/><text x="108" y="644" font-family="DejaVu Sans, Arial, sans-serif" font-size="28.2" font-weight="700" fill="#172033" text-anchor="start"><tspan x="108" dy="0"></tspan></text><text x="108" y="674" font-family="DejaVu Sans, Arial, sans-serif" font-size="19.6" font-weight="400" fill="#526071" text-anchor="start"><tspan x="108" dy="0">Question: when should it stop?</tspan></text><rect x="590" y="215" width="450" height="355" rx="24" fill="#DFF3E4" stroke="#CBD5E1" stroke-width="2"/><text x="618" y="271" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="700" fill="#172033" text-anchor="start"><tspan x="618" dy="0">Parallel breadth</tspan></text><text x="618" y="312" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400" fill="#526071" text-anchor="start"><tspan x="618" dy="0">Independent candidates or</tspan><tspan x="618" dy="29">agents widen the search</tspan><tspan x="618" dy="29">distribution.</tspan></text><rect x="590" y="600" width="450" height="100" rx="24" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/><text x="618" y="644" font-family="DejaVu Sans, Arial, sans-serif" font-size="28.2" font-weight="700" fill="#172033" text-anchor="start"><tspan x="618" dy="0"></tspan></text><text x="618" y="670" font-family="DejaVu Sans, Arial, sans-serif" font-size="18.3" font-weight="400" fill="#526071" text-anchor="start"><tspan x="618" dy="0">Question: how should outputs be selected or</tspan><tspan x="618" dy="20">merged?</tspan></text><rect x="1100" y="215" width="450" height="355" rx="24" fill="#EDE5FA" stroke="#CBD5E1" stroke-width="2"/><text x="1128" y="271" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="700" fill="#172033" text-anchor="start"><tspan x="1128" dy="0">Adaptive allocation</tspan></text><text x="1128" y="312" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400" fill="#526071" text-anchor="start"><tspan x="1128" dy="0">Difficulty, confidence, or</tspan><tspan x="1128" dy="29">environment feedback chooses</tspan><tspan x="1128" dy="29">the budget and strategy.</tspan></text><rect x="1100" y="600" width="450" height="100" rx="24" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/><text x="1128" y="644" font-family="DejaVu Sans, Arial, sans-serif" font-size="28.2" font-weight="700" fill="#172033" text-anchor="start"><tspan x="1128" dy="0"></tspan></text><text x="1128" y="674" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="400" fill="#526071" text-anchor="start"><tspan x="1128" dy="0">Question: what does a routing error cost?</tspan></text><rect x="80" y="745" width="1440" height="95" rx="24" fill="#FFF1CC" stroke="#CBD5E1" stroke-width="2"/><text x="110" y="792" font-family="DejaVu Sans, Arial, sans-serif" font-size="23.5" font-weight="600" fill="#172033" text-anchor="start"><tspan x="110" dy="0">Cross-cutting layer: verification and control. Without it, depth can become repetition and breadth an</tspan><tspan x="110" dy="28">expensive pile of text.</tspan></text></svg>