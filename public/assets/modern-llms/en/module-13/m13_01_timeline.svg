<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker></defs>
<rect width="100%" height="100%" fill="#F8FAFC"/><text x="60" y="72" font-family="DejaVu Sans, Arial, sans-serif" font-size="38" font-weight="700" fill="#172033" text-anchor="start"><tspan x="60" dy="0">How inference compute became a separate scaling axis</tspan></text><text x="60" y="121" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400" fill="#526071" text-anchor="start"><tspan x="60" dy="0">The field moved from prompting heuristics toward trained, controllable, and adaptive compute contracts.</tspan></text><rect x="45" y="210" width="270" height="430" rx="24" fill="#DCEBFA" stroke="#CBD5E1" stroke-width="2"/><text x="73" y="259" font-family="DejaVu Sans, Arial, sans-serif" font-size="26.8" font-weight="700" fill="#172033" text-anchor="start"><tspan x="73" dy="0">Before 2024</tspan><tspan x="73" dy="28">CoT and</tspan><tspan x="73" dy="28">self-consistency</tspan></text><text x="73" y="353" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="400" fill="#526071" text-anchor="start"><tspan x="73" dy="0">Long explanations</tspan><tspan x="73" dy="26">and repeated</tspan><tspan x="73" dy="26">sampling are applied</tspan><tspan x="73" dy="26">as external</tspan><tspan x="73" dy="26">prompting</tspan><tspan x="73" dy="26">strategies.</tspan></text><path d="M315,425 L343,425" stroke="#475569" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="355" y="210" width="270" height="430" rx="24" fill="#DFF3E4" stroke="#CBD5E1" stroke-width="2"/><text x="383" y="259" font-family="DejaVu Sans, Arial, sans-serif" font-size="28.2" font-weight="700" fill="#172033" text-anchor="start"><tspan x="383" dy="0">September</tspan><tspan x="383" dy="28">2024</tspan><tspan x="383" dy="28">OpenAI o1</tspan></text><text x="383" y="353" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="400" fill="#526071" text-anchor="start"><tspan x="383" dy="0">Training compute</tspan><tspan x="383" dy="26">and time spent on a</tspan><tspan x="383" dy="26">solution are</tspan><tspan x="383" dy="26">presented as two</tspan><tspan x="383" dy="26">scaling axes.</tspan></text><path d="M625,425 L653,425" stroke="#475569" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="665" y="210" width="270" height="430" rx="24" fill="#FFF1CC" stroke="#CBD5E1" stroke-width="2"/><text x="693" y="259" font-family="DejaVu Sans, Arial, sans-serif" font-size="28.2" font-weight="700" fill="#172033" text-anchor="start"><tspan x="693" dy="0">January 2025</tspan><tspan x="693" dy="28">DeepSeek-R1</tspan></text><text x="693" y="325" font-family="DejaVu Sans, Arial, sans-serif" font-size="22.1" font-weight="600" fill="#526071" text-anchor="start"><tspan x="693" dy="0">R1-Zero isolates RL</tspan><tspan x="693" dy="26">on verifiable reward;</tspan><tspan x="693" dy="26">the full R1 adds a</tspan><tspan x="693" dy="26">multi-stage recipe.</tspan></text><path d="M935,425 L963,425" stroke="#475569" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="975" y="210" width="270" height="430" rx="24" fill="#EDE5FA" stroke="#CBD5E1" stroke-width="2"/><text x="1003" y="259" font-family="DejaVu Sans, Arial, sans-serif" font-size="28.2" font-weight="700" fill="#172033" text-anchor="start"><tspan x="1003" dy="0">2024–2025</tspan><tspan x="1003" dy="28">Inference-time</tspan><tspan x="1003" dy="28">scaling</tspan></text><text x="1003" y="353" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="400" fill="#526071" text-anchor="start"><tspan x="1003" dy="0">Research separates</tspan><tspan x="1003" dy="26">depth, breadth,</tspan><tspan x="1003" dy="26">verifiers, and</tspan><tspan x="1003" dy="26">adaptive budget</tspan><tspan x="1003" dy="26">allocation.</tspan></text><path d="M1245,425 L1273,425" stroke="#475569" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="1285" y="210" width="270" height="430" rx="24" fill="#FBE2E7" stroke="#CBD5E1" stroke-width="2"/><text x="1313" y="259" font-family="DejaVu Sans, Arial, sans-serif" font-size="23.5" font-weight="700" fill="#172033" text-anchor="start"><tspan x="1313" dy="0">Snapshot</tspan><tspan x="1313" dy="28">2026-08-04</tspan><tspan x="1313" dy="28">API contracts</tspan></text><text x="1313" y="353" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="400" fill="#526071" text-anchor="start"><tspan x="1313" dy="0">Effort levels,</tspan><tspan x="1313" dy="26">dynamic modes,</tspan><tspan x="1313" dy="26">hidden reasoning,</tspan><tspan x="1313" dy="26">and multi-agent</tspan><tspan x="1313" dy="26">work require a</tspan><tspan x="1313" dy="26">passport.</tspan></text><rect x="80" y="710" width="1440" height="115" rx="24" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/><text x="110" y="759" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="600" fill="#172033" text-anchor="start"><tspan x="110" dy="0">The modern control is not merely “more tokens”: distinguish single-path depth, search breadth,</tspan><tspan x="110" dy="31">selection policy, and systems cost.</tspan></text></svg>