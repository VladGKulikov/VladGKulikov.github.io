<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker></defs>
<rect width="100%" height="100%" fill="#F8FAFC"/><text x="60" y="72" font-family="DejaVu Sans, Arial, sans-serif" font-size="38" font-weight="700" fill="#172033" text-anchor="start"><tspan x="60" dy="0">Why more inference compute does not guarantee a better answer</tspan></text><text x="60" y="121" font-family="DejaVu Sans, Arial, sans-serif" font-size="23.5" font-weight="600" fill="#526071" text-anchor="start"><tspan x="60" dy="0">Test-time scaling is limited by model capability, search dynamics, verification, and systems cost.</tspan></text><rect x="70" y="220" width="350" height="430" rx="24" fill="#FBE2E7" stroke="#CBD5E1" stroke-width="2"/><text x="98" y="275" font-family="DejaVu Sans, Arial, sans-serif" font-size="29" font-weight="700" fill="#172033" text-anchor="start"><tspan x="98" dy="0">Capability ceiling</tspan></text><text x="98" y="316" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400" fill="#526071" text-anchor="start"><tspan x="98" dy="0">Extra tokens cannot</tspan><tspan x="98" dy="29">create knowledge or</tspan><tspan x="98" dy="29">representations missing</tspan><tspan x="98" dy="29">from the base model.</tspan></text><rect x="455" y="220" width="350" height="430" rx="24" fill="#FFF1CC" stroke="#CBD5E1" stroke-width="2"/><text x="483" y="275" font-family="DejaVu Sans, Arial, sans-serif" font-size="29" font-weight="700" fill="#172033" text-anchor="start"><tspan x="483" dy="0">Non-monotonicity</tspan></text><text x="483" y="316" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400" fill="#526071" text-anchor="start"><tspan x="483" dy="0">The model may revise a</tspan><tspan x="483" dy="29">correct answer away,</tspan><tspan x="483" dy="29">repeat itself, or</tspan><tspan x="483" dy="29">propagate an early error.</tspan></text><rect x="840" y="220" width="350" height="430" rx="24" fill="#EDE5FA" stroke="#CBD5E1" stroke-width="2"/><text x="868" y="275" font-family="DejaVu Sans, Arial, sans-serif" font-size="29" font-weight="700" fill="#172033" text-anchor="start"><tspan x="868" dy="0">Selection error</tspan></text><text x="868" y="316" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400" fill="#526071" text-anchor="start"><tspan x="868" dy="0">The verifier caps the</tspan><tspan x="868" dy="29">value of sampling and</tspan><tspan x="868" dy="29">may itself be exploited.</tspan></text><rect x="1225" y="220" width="350" height="430" rx="24" fill="#DCEBFA" stroke="#CBD5E1" stroke-width="2"/><text x="1253" y="275" font-family="DejaVu Sans, Arial, sans-serif" font-size="29" font-weight="700" fill="#172033" text-anchor="start"><tspan x="1253" dy="0">Systems cost</tspan></text><text x="1253" y="316" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400" fill="#526071" text-anchor="start"><tspan x="1253" dy="0">Latency, FLOPs, and KV</tspan><tspan x="1253" dy="29">memory rise while</tspan><tspan x="1253" dy="29">serving concurrency</tspan><tspan x="1253" dy="29">falls.</tspan></text><rect x="80" y="720" width="1440" height="105" rx="24" fill="#DFF3E4" stroke="#CBD5E1" stroke-width="2"/><text x="110" y="769" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="600" fill="#172033" text-anchor="start"><tspan x="110" dy="0">A mature policy can add compute, stop early, switch strategies, or call an exact tool when the</tspan><tspan x="110" dy="31">evidence demands it.</tspan></text></svg>