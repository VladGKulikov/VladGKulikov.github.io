<text x="54" y="677" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" fill="#2E3440" text-anchor="start">Excluded</text>
<text x="484" y="677" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" fill="#2E3440" text-anchor="start">Scales, activations, temporary buffers, runtime reserve.</text>
