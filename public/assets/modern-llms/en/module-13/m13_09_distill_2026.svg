<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker></defs>
<rect width="100%" height="100%" fill="#F8FAFC"/><text x="60" y="72" font-family="DejaVu Sans, Arial, sans-serif" font-size="38" font-weight="700" fill="#172033" text-anchor="start"><tspan x="60" dy="0">Reasoning distillation transfers trajectories, not hidden capability</tspan></text><text x="60" y="121" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400" fill="#526071" text-anchor="start"><tspan x="60" dy="0">A strong teacher turns successful solutions into data; the student learns observable procedures within its own base-model</tspan><tspan x="60" dy="29">ceiling.</tspan></text><rect x="100" y="210" width="420" height="280" rx="24" fill="#DCEBFA" stroke="#CBD5E1" stroke-width="2"/><text x="128" y="266" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="700" fill="#172033" text-anchor="start"><tspan x="128" dy="0">Teacher</tspan></text><text x="128" y="307" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400" fill="#526071" text-anchor="start"><tspan x="128" dy="0">Produces diverse successful</tspan><tspan x="128" dy="29">traces, revisions, and checks.</tspan></text><path d="M520,350 L580,350" stroke="#475569" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="600" y="210" width="420" height="280" rx="24" fill="#FFF1CC" stroke="#CBD5E1" stroke-width="2"/><text x="628" y="266" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="700" fill="#172033" text-anchor="start"><tspan x="628" dy="0">Data selection</tspan></text><text x="628" y="307" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400" fill="#526071" text-anchor="start"><tspan x="628" dy="0">Filters for correctness, quality,</tspan><tspan x="628" dy="29">diversity, and length.</tspan></text><path d="M1020,350 L1080,350" stroke="#475569" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="1100" y="210" width="420" height="280" rx="24" fill="#DFF3E4" stroke="#CBD5E1" stroke-width="2"/><text x="1128" y="266" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="700" fill="#172033" text-anchor="start"><tspan x="1128" dy="0">Student</tspan></text><text x="1128" y="307" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400" fill="#526071" text-anchor="start"><tspan x="1128" dy="0">SFT transfers format,</tspan><tspan x="1128" dy="29">operations, checking habits,</tspan><tspan x="1128" dy="29">and domain heuristics.</tspan></text><rect x="190" y="560" width="570" height="170" rx="24" fill="#EDE5FA" stroke="#CBD5E1" stroke-width="2"/><text x="218" y="613" font-family="DejaVu Sans, Arial, sans-serif" font-size="28.2" font-weight="700" fill="#172033" text-anchor="start"><tspan x="218" dy="0">What transfers</tspan></text><text x="218" y="652" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="400" fill="#526071" text-anchor="start"><tspan x="218" dy="0">Forms and procedures represented in the</tspan><tspan x="218" dy="27">training traces.</tspan></text><rect x="840" y="560" width="570" height="170" rx="24" fill="#FBE2E7" stroke="#CBD5E1" stroke-width="2"/><text x="868" y="613" font-family="DejaVu Sans, Arial, sans-serif" font-size="28.2" font-weight="700" fill="#172033" text-anchor="start"><tspan x="868" dy="0">What does not follow</tspan></text><text x="868" y="652" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="400" fill="#526071" text-anchor="start"><tspan x="868" dy="0">The teacher’s knowledge, capacity, or</tspan><tspan x="868" dy="27">out-of-distribution generalization.</tspan></text><rect x="80" y="770" width="1440" height="80" rx="24" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/><text x="110" y="818" font-family="DejaVu Sans, Arial, sans-serif" font-size="23.5" font-weight="600" fill="#172033" text-anchor="start"><tspan x="110" dy="0">Evaluate the distillate as its own model: quality, length, cost, calibration, and robustness on new tasks.</tspan></text></svg>