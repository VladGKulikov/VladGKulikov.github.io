<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker></defs>
<rect width="100%" height="100%" fill="#F8FAFC"/><text x="60" y="72" font-family="DejaVu Sans, Arial, sans-serif" font-size="38" font-weight="700" fill="#172033" text-anchor="start"><tspan x="60" dy="0">Four test-time compute paradigms</tspan></text><text x="60" y="121" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400" fill="#526071" text-anchor="start"><tspan x="60" dy="0">Compute quantity alone does not define the algorithm; ask where new search state appears and who evaluates it.</tspan></text><rect x="70" y="220" width="350" height="430" rx="24" fill="#DCEBFA" stroke="#CBD5E1" stroke-width="2"/><text x="98" y="275" font-family="DejaVu Sans, Arial, sans-serif" font-size="29" font-weight="700" fill="#172033" text-anchor="start"><tspan x="98" dy="0">Long trajectory</tspan></text><text x="98" y="316" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400" fill="#526071" text-anchor="start"><tspan x="98" dy="0">One model continues</tspan><tspan x="98" dy="29">reasoning. Useful for</tspan><tspan x="98" dy="29">tightly coupled</tspan><tspan x="98" dy="29">multi-step problems.</tspan></text><rect x="455" y="220" width="350" height="430" rx="24" fill="#DFF3E4" stroke="#CBD5E1" stroke-width="2"/><text x="483" y="275" font-family="DejaVu Sans, Arial, sans-serif" font-size="29" font-weight="700" fill="#172033" text-anchor="start"><tspan x="483" dy="0">Repeated</tspan><tspan x="483" dy="35">sampling</tspan></text><text x="483" y="351" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400" fill="#526071" text-anchor="start"><tspan x="483" dy="0">Independent candidates</tspan><tspan x="483" dy="29">raise the chance of</tspan><tspan x="483" dy="29">finding a successful path.</tspan></text><rect x="840" y="220" width="350" height="430" rx="24" fill="#FFF1CC" stroke="#CBD5E1" stroke-width="2"/><text x="868" y="275" font-family="DejaVu Sans, Arial, sans-serif" font-size="29" font-weight="700" fill="#172033" text-anchor="start"><tspan x="868" dy="0">Verifier-guided</tspan><tspan x="868" dy="35">search</tspan></text><text x="868" y="351" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400" fill="#526071" text-anchor="start"><tspan x="868" dy="0">A checker ranks, prunes,</tspan><tspan x="868" dy="29">or stops generation.</tspan></text><rect x="1225" y="220" width="350" height="430" rx="24" fill="#EDE5FA" stroke="#CBD5E1" stroke-width="2"/><text x="1253" y="275" font-family="DejaVu Sans, Arial, sans-serif" font-size="29" font-weight="700" fill="#172033" text-anchor="start"><tspan x="1253" dy="0">Adaptive policy</tspan></text><text x="1253" y="316" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400" fill="#526071" text-anchor="start"><tspan x="1253" dy="0">Budget and search</tspan><tspan x="1253" dy="29">strategy are chosen per</tspan><tspan x="1253" dy="29">request and feedback</tspan><tspan x="1253" dy="29">signal.</tspan></text><rect x="80" y="720" width="1440" height="105" rx="24" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/><text x="110" y="769" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="600" fill="#172033" text-anchor="start"><tspan x="110" dy="0">Compare at fixed cost, time, or generated tokens. Without a matched-budget protocol, “better”</tspan><tspan x="110" dy="31">remains ambiguous.</tspan></text></svg>