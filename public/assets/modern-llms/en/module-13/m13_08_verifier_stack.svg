<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker></defs>
<rect width="100%" height="100%" fill="#F8FAFC"/><text x="60" y="72" font-family="DejaVu Sans, Arial, sans-serif" font-size="38" font-weight="700" fill="#172033" text-anchor="start"><tspan x="60" dy="0">Verifier families: from executable rules to reasoning judges</tspan></text><text x="60" y="121" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400" fill="#526071" text-anchor="start"><tspan x="60" dy="0">The most elaborate judge is not automatically the best; prefer the most accurate and transparent signal the task affords.</tspan></text><rect x="45" y="215" width="270" height="445" rx="24" fill="#DCEBFA" stroke="#CBD5E1" stroke-width="2"/><text x="73" y="268" font-family="DejaVu Sans, Arial, sans-serif" font-size="28.2" font-weight="700" fill="#172033" text-anchor="start"><tspan x="73" dy="0">Exact rule</tspan></text><text x="73" y="307" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="400" fill="#526071" text-anchor="start"><tspan x="73" dy="0">Compiler, unit tests,</tspan><tspan x="73" dy="27">symbolic algebra,</tspan><tspan x="73" dy="27">proof kernel, or</tspan><tspan x="73" dy="27">simulator.</tspan></text><rect x="355" y="215" width="270" height="445" rx="24" fill="#DFF3E4" stroke="#CBD5E1" stroke-width="2"/><text x="383" y="268" font-family="DejaVu Sans, Arial, sans-serif" font-size="28.2" font-weight="700" fill="#172033" text-anchor="start"><tspan x="383" dy="0">Outcome RM</tspan></text><text x="383" y="307" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="400" fill="#526071" text-anchor="start"><tspan x="383" dy="0">One score for the</tspan><tspan x="383" dy="27">whole solution;</tspan><tspan x="383" dy="27">cheaper labels,</tspan><tspan x="383" dy="27">weak error</tspan><tspan x="383" dy="27">localization.</tspan></text><rect x="665" y="215" width="270" height="445" rx="24" fill="#FFF1CC" stroke="#CBD5E1" stroke-width="2"/><text x="693" y="268" font-family="DejaVu Sans, Arial, sans-serif" font-size="28.2" font-weight="700" fill="#172033" text-anchor="start"><tspan x="693" dy="0">Process RM</tspan></text><text x="693" y="307" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="400" fill="#526071" text-anchor="start"><tspan x="693" dy="0">Step scores support</tspan><tspan x="693" dy="27">dense feedback and</tspan><tspan x="693" dy="27">pruning, but labels</tspan><tspan x="693" dy="27">are expensive.</tspan></text><rect x="975" y="215" width="270" height="445" rx="24" fill="#EDE5FA" stroke="#CBD5E1" stroke-width="2"/><text x="1003" y="268" font-family="DejaVu Sans, Arial, sans-serif" font-size="28.2" font-weight="700" fill="#172033" text-anchor="start"><tspan x="1003" dy="0">GenRM</tspan></text><text x="1003" y="307" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="400" fill="#526071" text-anchor="start"><tspan x="1003" dy="0">Critique and verdict</tspan><tspan x="1003" dy="27">via next-token</tspan><tspan x="1003" dy="27">prediction;</tspan><tspan x="1003" dy="27">reasoning inside</tspan><tspan x="1003" dy="27">verification.</tspan></text><rect x="1285" y="215" width="270" height="445" rx="24" fill="#FBE2E7" stroke="#CBD5E1" stroke-width="2"/><text x="1313" y="268" font-family="DejaVu Sans, Arial, sans-serif" font-size="28.2" font-weight="700" fill="#172033" text-anchor="start"><tspan x="1313" dy="0">Reasoning</tspan><tspan x="1313" dy="32">RM</tspan></text><text x="1313" y="339" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="400" fill="#526071" text-anchor="start"><tspan x="1313" dy="0">A rubric or analysis</tspan><tspan x="1313" dy="27">precedes the score;</tspan><tspan x="1313" dy="27">research recipes</tspan><tspan x="1313" dy="27">such as RM-R1.</tspan></text><rect x="80" y="720" width="1440" height="105" rx="24" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/><text x="110" y="769" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="600" fill="#172033" text-anchor="start"><tspan x="110" dy="0">For code and formal tasks, start with executable verification. In subjective domains a judge</tspan><tspan x="110" dy="31">represents a rubric or preference, not objective truth.</tspan></text></svg>