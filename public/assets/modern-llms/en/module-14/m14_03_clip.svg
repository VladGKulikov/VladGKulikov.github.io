<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker></defs>
<rect width="100%" height="100%" fill="#F8FAFC"/><text x="60" y="72" font-family="DejaVu Sans, Arial, sans-serif" font-size="38" font-weight="700" fill="#172033" text-anchor="start"><tspan x="60" dy="0">Contrastive learning: geometry matters more than the slogan</tspan></text><text x="60" y="121" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400" fill="#526071" text-anchor="start"><tspan x="60" dy="0">A 4×4 teaching matrix exposes temperature; SigLIP changes normalization, not the importance of negative examples.</tspan></text><rect x="80" y="215" width="440" height="430" rx="24" fill="#DCEBFA" stroke="#CBD5E1" stroke-width="2"/><text x="108" y="272" font-family="DejaVu Sans, Arial, sans-serif" font-size="31" font-weight="700" fill="#172033" text-anchor="start"><tspan x="108" dy="0">CLIP / InfoNCE</tspan></text><text x="108" y="313" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400" fill="#526071" text-anchor="start"><tspan x="108" dy="0">Diagonal 0.8, background 0.2. At</tspan><tspan x="108" dy="29">τ=0.1: p+=0.992619,</tspan><tspan x="108" dy="29">loss=0.007409. At τ=0.5:</tspan><tspan x="108" dy="29">p+=0.525325, loss=0.643738.</tspan></text><rect x="580" y="215" width="440" height="430" rx="24" fill="#FFF1CC" stroke="#CBD5E1" stroke-width="2"/><text x="608" y="272" font-family="DejaVu Sans, Arial, sans-serif" font-size="31" font-weight="700" fill="#172033" text-anchor="start"><tspan x="608" dy="0">Uniform reference</tspan></text><text x="608" y="313" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400" fill="#526071" text-anchor="start"><tspan x="608" dy="0">If all similarities match, loss=ln</tspan><tspan x="608" dy="29">N. For N=4: 1.386294. This is a</tspan><tspan x="608" dy="29">random-matching reference, not</tspan><tspan x="608" dy="29">a global floor.</tspan></text><rect x="1080" y="215" width="440" height="430" rx="24" fill="#DFF3E4" stroke="#CBD5E1" stroke-width="2"/><text x="1108" y="272" font-family="DejaVu Sans, Arial, sans-serif" font-size="31" font-weight="700" fill="#172033" text-anchor="start"><tspan x="1108" dy="0">SigLIP</tspan></text><text x="1108" y="313" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400" fill="#526071" text-anchor="start"><tspan x="1108" dy="0">Pairwise sigmoid terms avoid a</tspan><tspan x="1108" dy="29">global softmax denominator.</tspan><tspan x="1108" dy="29">Batch composition and</tspan><tspan x="1108" dy="29">negatives still affect learning.</tspan></text><rect x="80" y="720" width="1440" height="105" rx="24" fill="#EDE5FA" stroke="#CBD5E1" stroke-width="2"/><text x="112" y="768" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="600" fill="#172033" text-anchor="start"><tspan x="112" dy="0">A batch of size N gives N−1 in-batch negatives per row, but statistical returns saturate and depend</tspan><tspan x="112" dy="31">on pair quality.</tspan></text></svg>