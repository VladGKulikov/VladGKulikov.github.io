<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker></defs>
<rect width="100%" height="100%" fill="#F8FAFC"/><text x="60" y="72" font-family="DejaVu Sans, Arial, sans-serif" font-size="38" font-weight="700" fill="#172033" text-anchor="start"><tspan x="60" dy="0">Thinker–Talker: one conversation, different output roles</tspan></text><text x="60" y="121" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400" fill="#526071" text-anchor="start"><tspan x="60" dy="0">TMRoPE aligns time across input modalities; ARIA coordinates variable text and speech token rates at output.</tspan></text><rect x="75" y="205" width="420" height="300" rx="24" fill="#DCEBFA" stroke="#CBD5E1" stroke-width="2"/><text x="103" y="261" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="700" fill="#172033" text-anchor="start"><tspan x="103" dy="0">Input encoders</tspan></text><text x="103" y="301" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="400" fill="#526071" text-anchor="start"><tspan x="103" dy="0">Text, vision, video, and audio</tspan><tspan x="103" dy="28">become feature blocks with</tspan><tspan x="103" dy="28">temporal and spatial</tspan><tspan x="103" dy="28">coordinates.</tspan></text><path d="M495,355 L575,355" stroke="#475569" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="590" y="205" width="420" height="300" rx="24" fill="#DFF3E4" stroke="#CBD5E1" stroke-width="2"/><text x="618" y="261" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="700" fill="#172033" text-anchor="start"><tspan x="618" dy="0">Thinker</tspan></text><text x="618" y="301" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="400" fill="#526071" text-anchor="start"><tspan x="618" dy="0">Multimodal reasoning and text</tspan><tspan x="618" dy="28">generation. Qwen3.5-Omni uses</tspan><tspan x="618" dy="28">Hybrid-Attention MoE.</tspan></text><path d="M1010,355 L1090,355" stroke="#475569" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="1105" y="205" width="420" height="300" rx="24" fill="#FFF1CC" stroke="#CBD5E1" stroke-width="2"/><text x="1133" y="261" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="700" fill="#172033" text-anchor="start"><tspan x="1133" dy="0">Talker</tspan></text><text x="1133" y="301" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="400" fill="#526071" text-anchor="start"><tspan x="1133" dy="0">Thinker hidden state → codec</tspan><tspan x="1133" dy="28">tokens → sliding-window audio</tspan><tspan x="1133" dy="28">decoder → streaming speech.</tspan></text><rect x="260" y="550" width="500" height="145" rx="24" fill="#EDE5FA" stroke="#CBD5E1" stroke-width="2"/><text x="288" y="601" font-family="DejaVu Sans, Arial, sans-serif" font-size="28.2" font-weight="700" fill="#172033" text-anchor="start"><tspan x="288" dy="0">TMRoPE</tspan></text><text x="288" y="638" font-family="DejaVu Sans, Arial, sans-serif" font-size="19.6" font-weight="400" fill="#526071" text-anchor="start"><tspan x="288" dy="0">One time scale for audio/video while vision</tspan><tspan x="288" dy="24">retains height and width.</tspan></text><rect x="840" y="550" width="500" height="145" rx="24" fill="#FBE2E7" stroke="#CBD5E1" stroke-width="2"/><text x="868" y="601" font-family="DejaVu Sans, Arial, sans-serif" font-size="28.2" font-weight="700" fill="#172033" text-anchor="start"><tspan x="868" dy="0">ARIA</tspan></text><text x="868" y="638" font-family="DejaVu Sans, Arial, sans-serif" font-size="19.6" font-weight="400" fill="#526071" text-anchor="start"><tspan x="868" dy="0">Adaptively aligns variable text and speech</tspan><tspan x="868" dy="24">token rates.</tspan></text><rect x="80" y="745" width="1440" height="95" rx="24" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/><text x="112" y="792" font-family="DejaVu Sans, Arial, sans-serif" font-size="23.5" font-weight="600" fill="#172033" text-anchor="start"><tspan x="112" dy="0">End-to-end does not mean monolithic: one trainable system can coordinate several specialized modules.</tspan></text></svg>