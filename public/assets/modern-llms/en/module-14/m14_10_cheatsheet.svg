<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker></defs>
<rect width="100%" height="100%" fill="#F8FAFC"/><text x="60" y="72" font-family="DejaVu Sans, Arial, sans-serif" font-size="38" font-weight="700" fill="#172033" text-anchor="start"><tspan x="60" dy="0">Multimodality: a map of budgets and architecture decisions</tspan></text><text x="60" y="121" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400" fill="#526071" text-anchor="start"><tspan x="60" dy="0">Identify processor and fusion topology first; only then convert media into tokens, KV, latency, and cost.</tspan></text><rect x="70" y="205" width="460" height="210" rx="24" fill="#DCEBFA" stroke="#CBD5E1" stroke-width="2"/><text x="98" y="258" font-family="DejaVu Sans, Arial, sans-serif" font-size="28.2" font-weight="700" fill="#172033" text-anchor="start"><tspan x="98" dy="0">Architectures</tspan></text><text x="98" y="296" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="400" fill="#526071" text-anchor="start"><tspan x="98" dy="0">contrastive encoder · connector VLM ·</tspan><tspan x="98" dy="26">unified generation · omni output</tspan></text><rect x="580" y="205" width="460" height="210" rx="24" fill="#DFF3E4" stroke="#CBD5E1" stroke-width="2"/><text x="608" y="258" font-family="DejaVu Sans, Arial, sans-serif" font-size="28.2" font-weight="700" fill="#172033" text-anchor="start"><tspan x="608" dy="0">Image</tspan></text><text x="608" y="296" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="400" fill="#526071" text-anchor="start"><tspan x="608" dy="0">336→576 · 4 tiles + thumbnail→2880 ·</tspan><tspan x="608" dy="26">1008 + 2×2 merger→1296 visual</tspan><tspan x="608" dy="26">tokens</tspan></text><rect x="1090" y="205" width="460" height="210" rx="24" fill="#FFF1CC" stroke="#CBD5E1" stroke-width="2"/><text x="1118" y="258" font-family="DejaVu Sans, Arial, sans-serif" font-size="28.2" font-weight="700" fill="#172033" text-anchor="start"><tspan x="1118" dy="0">KV scope</tspan></text><text x="1118" y="296" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="400" fill="#526071" text-anchor="start"><tspan x="1118" dy="0">128 KiB/token only for visual positions</tspan><tspan x="1118" dy="26">inside decoder self-attention</tspan></text><rect x="70" y="450" width="460" height="210" rx="24" fill="#EDE5FA" stroke="#CBD5E1" stroke-width="2"/><text x="98" y="503" font-family="DejaVu Sans, Arial, sans-serif" font-size="28.2" font-weight="700" fill="#172033" text-anchor="start"><tspan x="98" dy="0">Video</tspan></text><text x="98" y="541" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="400" fill="#526071" text-anchor="start"><tspan x="98" dy="0">2 h @1 fps: 4.15M tokens; a 252K</tspan><tspan x="98" dy="26">budget retains 437 or 1750 frames</tspan></text><rect x="580" y="450" width="460" height="210" rx="24" fill="#FBE2E7" stroke="#CBD5E1" stroke-width="2"/><text x="608" y="503" font-family="DejaVu Sans, Arial, sans-serif" font-size="28.2" font-weight="700" fill="#172033" text-anchor="start"><tspan x="608" dy="0">Connectors</tspan></text><text x="608" y="541" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="400" fill="#526071" text-anchor="start"><tspan x="608" dy="0">MLP changes width · Q-Former changes</tspan><tspan x="608" dy="26">count · cross-attn changes memory</tspan><tspan x="608" dy="26">placement</tspan></text><rect x="1090" y="450" width="460" height="210" rx="24" fill="#DCEBFA" stroke="#CBD5E1" stroke-width="2"/><text x="1118" y="503" font-family="DejaVu Sans, Arial, sans-serif" font-size="28.2" font-weight="700" fill="#172033" text-anchor="start"><tspan x="1118" dy="0">Omni speech</tspan></text><text x="1118" y="541" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="400" fill="#526071" text-anchor="start"><tspan x="1118" dy="0">Thinker reasoning/text · Talker codec</tspan><tspan x="1118" dy="26">tokens · TMRoPE input time · ARIA</tspan><tspan x="1118" dy="26">output rates</tspan></text><rect x="80" y="735" width="1440" height="105" rx="24" fill="#DFF3E4" stroke="#CBD5E1" stroke-width="2"/><text x="112" y="783" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="600" fill="#172033" text-anchor="start"><tspan x="112" dy="0">Passport: processor → fusion → state → output decoder → artifact status → measurements. A</tspan><tspan x="112" dy="31">capability label is insufficient.</tspan></text></svg>