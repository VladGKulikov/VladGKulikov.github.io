<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker></defs>
<rect width="100%" height="100%" fill="#F8FAFC"/><text x="60" y="72" font-family="DejaVu Sans, Arial, sans-serif" font-size="38" font-weight="700" fill="#172033" text-anchor="start"><tspan x="60" dy="0">The connector decides which resource to save</tspan></text><text x="60" y="121" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400" fill="#526071" text-anchor="start"><tspan x="60" dy="0">Feature width, visual-position count, and visual-memory placement are three independent design axes.</tspan></text><rect x="85" y="215" width="420" height="430" rx="24" fill="#DCEBFA" stroke="#CBD5E1" stroke-width="2"/><text x="113" y="271" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="700" fill="#172033" text-anchor="start"><tspan x="113" dy="0">MLP projector</tspan></text><text x="113" y="312" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400" fill="#526071" text-anchor="start"><tspan x="113" dy="0">1024→4096→4096: 20,979,712</tspan><tspan x="113" dy="29">parameters. Changes width</tspan><tspan x="113" dy="29">but usually preserves patch</tspan><tspan x="113" dy="29">count.</tspan></text><rect x="590" y="215" width="420" height="430" rx="24" fill="#DFF3E4" stroke="#CBD5E1" stroke-width="2"/><text x="618" y="271" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="700" fill="#172033" text-anchor="start"><tspan x="618" dy="0">Q-Former /</tspan><tspan x="618" dy="36">Resampler</tspan></text><text x="618" y="348" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400" fill="#526071" text-anchor="start"><tspan x="618" dy="0">Learned queries compress</tspan><tspan x="618" dy="29">vision features into a fixed</tspan><tspan x="618" dy="29">output set. Context falls; a</tspan><tspan x="618" dy="29">bottleneck appears.</tspan></text><rect x="1095" y="215" width="420" height="430" rx="24" fill="#EDE5FA" stroke="#CBD5E1" stroke-width="2"/><text x="1123" y="271" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="700" fill="#172033" text-anchor="start"><tspan x="1123" dy="0">Gated</tspan><tspan x="1123" dy="36">cross-attention</tspan></text><text x="1123" y="348" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400" fill="#526071" text-anchor="start"><tspan x="1123" dy="0">Vision stays outside the text</tspan><tspan x="1123" dy="29">stream. Sequence length falls,</tspan><tspan x="1123" dy="29">but the LLM architecture</tspan><tspan x="1123" dy="29">changes.</tspan></text><rect x="80" y="720" width="1440" height="105" rx="24" fill="#FFF1CC" stroke="#CBD5E1" stroke-width="2"/><text x="112" y="768" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="600" fill="#172033" text-anchor="start"><tspan x="112" dy="0">Dense-equivalent LLaVA scenario: 29.455 H100-equivalent hours under stated 6ND/MFU</tspan><tspan x="112" dy="31">assumptions. Not wall-clock and not a lower bound.</tspan></text></svg>