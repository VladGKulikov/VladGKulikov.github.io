<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker></defs>
<rect width="100%" height="100%" fill="#F8FAFC"/><text x="60" y="72" font-family="DejaVu Sans, Arial, sans-serif" font-size="38" font-weight="700" fill="#172033" text-anchor="start"><tspan x="60" dy="0">A public architectural snapshot on 4 August 2026</tspan></text><text x="60" y="121" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400" fill="#526071" text-anchor="start"><tspan x="60" dy="0">Compare documented I/O and topology instead of inferring proprietary internals from API behavior.</tspan></text><rect x="70" y="205" width="460" height="225" rx="24" fill="#DCEBFA" stroke="#CBD5E1" stroke-width="2"/><text x="98" y="259" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="700" fill="#172033" text-anchor="start"><tspan x="98" dy="0">Qwen3-VL</tspan></text><text x="98" y="297" font-family="DejaVu Sans, Arial, sans-serif" font-size="20.8" font-weight="600" fill="#526071" text-anchor="start"><tspan x="98" dy="0">text + image + video → text</tspan><tspan x="98" dy="26">256K · dynamic resolution · interleaved</tspan><tspan x="98" dy="26">M-RoPE · DeepStack</tspan></text><rect x="580" y="205" width="460" height="225" rx="24" fill="#DFF3E4" stroke="#CBD5E1" stroke-width="2"/><text x="608" y="259" font-family="DejaVu Sans, Arial, sans-serif" font-size="28.2" font-weight="700" fill="#172033" text-anchor="start"><tspan x="608" dy="0">InternVL3.5</tspan></text><text x="608" y="297" font-family="DejaVu Sans, Arial, sans-serif" font-size="22.3" font-weight="600" fill="#526071" text-anchor="start"><tspan x="608" dy="0">text + image + video → text</tspan><tspan x="608" dy="26">Visual Resolution Router · decoupled</tspan><tspan x="608" dy="26">vision/LLM deployment</tspan></text><rect x="1090" y="205" width="460" height="225" rx="24" fill="#FFF1CC" stroke="#CBD5E1" stroke-width="2"/><text x="1118" y="259" font-family="DejaVu Sans, Arial, sans-serif" font-size="28.2" font-weight="700" fill="#172033" text-anchor="start"><tspan x="1118" dy="0">Qwen3.5-Omni</tspan></text><text x="1118" y="297" font-family="DejaVu Sans, Arial, sans-serif" font-size="20.5" font-weight="600" fill="#526071" text-anchor="start"><tspan x="1118" dy="0">text + image + audio + video → text +</tspan><tspan x="1118" dy="26">speech</tspan><tspan x="1118" dy="26">Thinker–Talker · TMRoPE · ARIA · 256K</tspan></text><rect x="70" y="465" width="460" height="225" rx="24" fill="#EDE5FA" stroke="#CBD5E1" stroke-width="2"/><text x="98" y="519" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="700" fill="#172033" text-anchor="start"><tspan x="98" dy="0">InternVL-U</tspan></text><text x="98" y="557" font-family="DejaVu Sans, Arial, sans-serif" font-size="23.5" font-weight="600" fill="#526071" text-anchor="start"><tspan x="98" dy="0">understanding + reasoning + image</tspan><tspan x="98" dy="26">generation/editing</tspan><tspan x="98" dy="26">4B · multimodal LLM + MMDiT head</tspan></text><rect x="580" y="465" width="460" height="225" rx="24" fill="#FBE2E7" stroke="#CBD5E1" stroke-width="2"/><text x="608" y="519" font-family="DejaVu Sans, Arial, sans-serif" font-size="28.2" font-weight="700" fill="#172033" text-anchor="start"><tspan x="608" dy="0">Chameleon</tspan></text><text x="608" y="557" font-family="DejaVu Sans, Arial, sans-serif" font-size="23.5" font-weight="600" fill="#526071" text-anchor="start"><tspan x="608" dy="0">text/image input and output</tspan><tspan x="608" dy="26">discrete-token early fusion</tspan></text><rect x="1090" y="465" width="460" height="225" rx="24" fill="#DCEBFA" stroke="#CBD5E1" stroke-width="2"/><text x="1118" y="519" font-family="DejaVu Sans, Arial, sans-serif" font-size="28.2" font-weight="700" fill="#172033" text-anchor="start"><tspan x="1118" dy="0">Janus</tspan></text><text x="1118" y="557" font-family="DejaVu Sans, Arial, sans-serif" font-size="23.5" font-weight="600" fill="#526071" text-anchor="start"><tspan x="1118" dy="0">text/image input and output</tspan><tspan x="1118" dy="26">separate visual pathways · shared</tspan><tspan x="1118" dy="26">Transformer</tspan></text><rect x="80" y="755" width="1440" height="90" rx="24" fill="#DFF3E4" stroke="#CBD5E1" stroke-width="2"/><text x="112" y="800" font-family="DejaVu Sans, Arial, sans-serif" font-size="23.5" font-weight="600" fill="#172033" text-anchor="start"><tspan x="112" dy="0">For proprietary APIs, record documented inputs, outputs, limits, price, and date. One endpoint does not prove one</tspan><tspan x="112" dy="27">architecture.</tspan></text></svg>