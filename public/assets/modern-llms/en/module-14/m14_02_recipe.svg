<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker></defs>
<rect width="100%" height="100%" fill="#F8FAFC"/><text x="60" y="72" font-family="DejaVu Sans, Arial, sans-serif" font-size="38" font-weight="700" fill="#172033" text-anchor="start"><tspan x="60" dy="0">A modular VLM: where vision meets language</tspan></text><text x="60" y="121" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400" fill="#526071" text-anchor="start"><tspan x="60" dy="0">The same “encoder + connector + LLM” slogan can imply very different sequence, memory, and reuse contracts.</tspan></text><rect x="90" y="205" width="420" height="255" rx="24" fill="#DCEBFA" stroke="#CBD5E1" stroke-width="2"/><text x="118" y="260" font-family="DejaVu Sans, Arial, sans-serif" font-size="29" font-weight="700" fill="#172033" text-anchor="start"><tspan x="118" dy="0">1 · Vision encoder</tspan></text><text x="118" y="299" font-family="DejaVu Sans, Arial, sans-serif" font-size="21.4" font-weight="600" fill="#526071" text-anchor="start"><tspan x="118" dy="0">Pixels → patches → visual</tspan><tspan x="118" dy="27">features. Defines resolution, grid,</tspan><tspan x="118" dy="27">temporal stride, and information</tspan><tspan x="118" dy="27">loss.</tspan></text><path d="M510,333 L580,333" stroke="#475569" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="590" y="205" width="420" height="255" rx="24" fill="#DFF3E4" stroke="#CBD5E1" stroke-width="2"/><text x="618" y="260" font-family="DejaVu Sans, Arial, sans-serif" font-size="29" font-weight="700" fill="#172033" text-anchor="start"><tspan x="618" dy="0">2 · Connector</tspan></text><text x="618" y="299" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="400" fill="#526071" text-anchor="start"><tspan x="618" dy="0">Changes feature width,</tspan><tspan x="618" dy="27">visual-position count, or access</tspan><tspan x="618" dy="27">pattern.</tspan></text><path d="M1010,333 L1080,333" stroke="#475569" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="1090" y="205" width="420" height="255" rx="24" fill="#FFF1CC" stroke="#CBD5E1" stroke-width="2"/><text x="1118" y="260" font-family="DejaVu Sans, Arial, sans-serif" font-size="29" font-weight="700" fill="#172033" text-anchor="start"><tspan x="1118" dy="0">3 · Language decoder</tspan></text><text x="1118" y="299" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="400" fill="#526071" text-anchor="start"><tspan x="1118" dy="0">Generates text and consumes</tspan><tspan x="1118" dy="27">vision through self-attention or</tspan><tspan x="1118" dy="27">separate cross-attention.</tspan></text><rect x="90" y="505" width="420" height="180" rx="24" fill="#EDE5FA" stroke="#CBD5E1" stroke-width="2"/><text x="118" y="556" font-family="DejaVu Sans, Arial, sans-serif" font-size="28.2" font-weight="700" fill="#172033" text-anchor="start"><tspan x="118" dy="0">Stream insertion</tspan></text><text x="118" y="593" font-family="DejaVu Sans, Arial, sans-serif" font-size="19.6" font-weight="400" fill="#526071" text-anchor="start"><tspan x="118" dy="0">Visual positions create ordinary</tspan><tspan x="118" dy="24">decoder KV. Section 7 accounting</tspan><tspan x="118" dy="24">applies.</tspan></text><rect x="590" y="505" width="420" height="180" rx="24" fill="#FBE2E7" stroke="#CBD5E1" stroke-width="2"/><text x="618" y="556" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="700" fill="#172033" text-anchor="start"><tspan x="618" dy="0">Q-Former / Resampler</tspan></text><text x="618" y="593" font-family="DejaVu Sans, Arial, sans-serif" font-size="19.6" font-weight="400" fill="#526071" text-anchor="start"><tspan x="618" dy="0">Many patch features become a</tspan><tspan x="618" dy="24">bounded set of query outputs.</tspan></text><rect x="1090" y="505" width="420" height="180" rx="24" fill="#DCEBFA" stroke="#CBD5E1" stroke-width="2"/><text x="1118" y="556" font-family="DejaVu Sans, Arial, sans-serif" font-size="28.2" font-weight="700" fill="#172033" text-anchor="start"><tspan x="1118" dy="0">Gated cross-attention</tspan></text><text x="1118" y="593" font-family="DejaVu Sans, Arial, sans-serif" font-size="19.6" font-weight="400" fill="#526071" text-anchor="start"><tspan x="1118" dy="0">Vision stays in separate memory; text</tspan><tspan x="1118" dy="24">sequence length does not grow per</tspan><tspan x="1118" dy="24">patch.</tspan></text><rect x="80" y="735" width="1440" height="100" rx="24" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/><text x="112" y="783" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="600" fill="#172033" text-anchor="start"><tspan x="112" dy="0">Identify fusion topology before pricing memory: identical encoder features can create very different</tspan><tspan x="112" dy="31">KV and compute.</tspan></text></svg>