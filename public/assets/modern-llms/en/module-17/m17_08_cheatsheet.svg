<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<rect width="1600" height="900" fill="#FFFFFF"/>
<text x="70" y="72" font-family="Arial, sans-serif" font-size="39.1" font-weight="700" fill="#2E3440">LLM evaluation in one page</text>
<text x="70" y="112" font-family="Arial, sans-serif" font-size="19.6" fill="#5B6472">A good score is not the finish line; it is one link in an evidence chain</text>
<rect x="70" y="200" width="420" height="230" rx="18" fill="#EAF1FB" stroke="#CBD3DF" stroke-width="2"/>
<text x="98" y="250" text-anchor="start" font-family="Arial, sans-serif" font-size="28.2" font-weight="700" fill="#2E3440">
<tspan x="98" dy="0">1. Decision</tspan>
</text>
<text x="98" y="291" text-anchor="start" font-family="Arial, sans-serif" font-size="19.6" font-weight="400" fill="#5B6472">
<tspan x="98" dy="0">State the product choice, risk</tspan>
<tspan x="98" dy="25">tolerance, and budget first.</tspan>
</text>
<rect x="555" y="200" width="420" height="230" rx="18" fill="#EDF7ED" stroke="#CBD3DF" stroke-width="2"/>
<text x="583" y="250" text-anchor="start" font-family="Arial, sans-serif" font-size="28.2" font-weight="700" fill="#2E3440">
<tspan x="583" dy="0">2. Measurement axes</tspan>
</text>
<text x="583" y="291" text-anchor="start" font-family="Arial, sans-serif" font-size="19.6" font-weight="400" fill="#5B6472">
<tspan x="583" dy="0">Capability, safety, cost, latency,</tspan>
<tspan x="583" dy="25">and critical slices.</tspan>
</text>
<rect x="1040" y="200" width="420" height="230" rx="18" fill="#FFF5DD" stroke="#CBD3DF" stroke-width="2"/>
<text x="1068" y="250" text-anchor="start" font-family="Arial, sans-serif" font-size="28.2" font-weight="700" fill="#2E3440">
<tspan x="1068" dy="0">3. Protocol</tspan>
</text>
<text x="1068" y="291" text-anchor="start" font-family="Arial, sans-serif" font-size="19.5" font-weight="400" fill="#5B6472">
<tspan x="1068" dy="0">Dataset version, prompt, scaffolding,</tspan>
<tspan x="1068" dy="25">sampling, tools, and attempt count.</tspan>
</text>
<rect x="70" y="500" width="420" height="230" rx="18" fill="#F3EDFA" stroke="#CBD3DF" stroke-width="2"/>
<text x="98" y="550" text-anchor="start" font-family="Arial, sans-serif" font-size="28.2" font-weight="700" fill="#2E3440">
<tspan x="98" dy="0">4. Uncertainty</tspan>
</text>
<text x="98" y="591" text-anchor="start" font-family="Arial, sans-serif" font-size="19.6" font-weight="400" fill="#5B6472">
<tspan x="98" dy="0">Paired outcomes, intervals, pass@k,</tspan>
<tspan x="98" dy="25">and sample size.</tspan>
</text>
<rect x="555" y="500" width="420" height="230" rx="18" fill="#FCEBEC" stroke="#CBD3DF" stroke-width="2"/>
<text x="583" y="550" text-anchor="start" font-family="Arial, sans-serif" font-size="28.2" font-weight="700" fill="#2E3440">
<tspan x="583" dy="0">5. Observability</tspan>
</text>
<text x="583" y="591" text-anchor="start" font-family="Arial, sans-serif" font-size="19.6" font-weight="400" fill="#5B6472">
<tspan x="583" dy="0">One call per item; store output,</tspan>
<tspan x="583" dy="25">cost, latency, and failure.</tspan>
</text>
<rect x="1040" y="500" width="420" height="230" rx="18" fill="#E8F7F5" stroke="#CBD3DF" stroke-width="2"/>
<text x="1068" y="550" text-anchor="start" font-family="Arial, sans-serif" font-size="28.2" font-weight="700" fill="#2E3440">
<tspan x="1068" dy="0">6. Decide and refresh</tspan>
</text>
<text x="1068" y="591" text-anchor="start" font-family="Arial, sans-serif" font-size="19.2" font-weight="400" fill="#5B6472">
<tspan x="1068" dy="0">Read failures, test product transfer,</tspan>
<tspan x="1068" dy="25">and update the golden set.</tspan>
</text></svg>
