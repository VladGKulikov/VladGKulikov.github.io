<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<rect width="1600" height="900" fill="#FFFFFF"/>
<text x="70" y="72" font-family="Arial, sans-serif" font-size="39.1" font-weight="700" fill="#2E3440">The evolution of LLM evaluation</text>
<text x="70" y="112" font-family="Arial, sans-serif" font-size="19.6" fill="#5B6472">Each evaluation regime repairs a concrete weakness of the previous one</text>
<rect x="70" y="210" width="320" height="330" rx="18" fill="#EAF1FB" stroke="#CBD3DF" stroke-width="2"/>
<text x="98" y="259" text-anchor="start" font-family="Arial, sans-serif" font-size="23.8" font-weight="700" fill="#2E3440">
<tspan x="98" dy="0">2017–2022</tspan>
<tspan x="98" dy="28">Fixed suites and human</tspan>
<tspan x="98" dy="28">comparisons</tspan>
</text>
<text x="98" y="355" text-anchor="start" font-family="Arial, sans-serif" font-size="20.3" font-weight="600" fill="#5B6472">
<tspan x="98" dy="0">MMLU · BIG-bench · HELM</tspan>
<tspan x="98" dy="25">human preferences</tspan>
</text>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#4C78A8"/></marker></defs>
<line x1="402" y1="375" x2="432" y2="375" stroke="#4C78A8" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="450" y="210" width="320" height="330" rx="18" fill="#EDF7ED" stroke="#CBD3DF" stroke-width="2"/>
<text x="478" y="259" text-anchor="start" font-family="Arial, sans-serif" font-size="22.7" font-weight="700" fill="#2E3440">
<tspan x="478" dy="0">2023–2024</tspan>
<tspan x="478" dy="28">Judges, code, and agent</tspan>
<tspan x="478" dy="28">tasks</tspan>
</text>
<text x="478" y="355" text-anchor="start" font-family="Arial, sans-serif" font-size="22.9" font-weight="600" fill="#5B6472">
<tspan x="478" dy="0">MT-Bench · SWE-bench</tspan>
<tspan x="478" dy="25">LiveBench · OSWorld</tspan>
</text>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#4C78A8"/></marker></defs>
<line x1="782" y1="375" x2="812" y2="375" stroke="#4C78A8" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="830" y="210" width="320" height="330" rx="18" fill="#FFF5DD" stroke="#CBD3DF" stroke-width="2"/>
<text x="858" y="259" text-anchor="start" font-family="Arial, sans-serif" font-size="28.2" font-weight="700" fill="#2E3440">
<tspan x="858" dy="0">2025</tspan>
<tspan x="858" dy="28">Lower ceilings and</tspan>
<tspan x="858" dy="28">harder tasks</tspan>
</text>
<text x="858" y="355" text-anchor="start" font-family="Arial, sans-serif" font-size="23.5" font-weight="600" fill="#5B6472">
<tspan x="858" dy="0">HLE · FrontierMath</tspan>
<tspan x="858" dy="25">ARC-AGI-2</tspan>
</text>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#4C78A8"/></marker></defs>
<line x1="1162" y1="375" x2="1192" y2="375" stroke="#4C78A8" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="1210" y="210" width="320" height="330" rx="18" fill="#F3EDFA" stroke="#CBD3DF" stroke-width="2"/>
<text x="1238" y="259" text-anchor="start" font-family="Arial, sans-serif" font-size="27.9" font-weight="700" fill="#2E3440">
<tspan x="1238" dy="0">2026</tspan>
<tspan x="1238" dy="28">Audit, refresh, and</tspan>
<tspan x="1238" dy="28">interaction</tspan>
</text>
<text x="1238" y="355" text-anchor="start" font-family="Arial, sans-serif" font-size="19.5" font-weight="600" fill="#5B6472">
<tspan x="1238" dy="0">HLE-Verified · OSWorld 2.0</tspan>
<tspan x="1238" dy="25">ARC-AGI-3 · private sets</tspan>
</text>
<rect x="371.0" y="413.0" width="98.0" height="24" rx="10" fill="#FFFFFF" fill-opacity="0.96"/>
<text x="420.0" y="432" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#9A5B50">
<tspan x="420.0" dy="0">saturation</tspan>
</text>
<rect x="739.0" y="413.0" width="122.0" height="24" rx="10" fill="#FFFFFF" fill-opacity="0.96"/>
<text x="800.0" y="432" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#9A5B50">
<tspan x="800.0" dy="0">contamination</tspan>
</text>
<rect x="1123.0" y="413.0" width="114.0" height="24" rx="10" fill="#FFFFFF" fill-opacity="0.96"/>
<text x="1180.0" y="432" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#9A5B50">
<tspan x="1180.0" dy="0">weak realism</tspan>
</text>
<rect x="190" y="640" width="1220" height="150" rx="18" fill="#E8F7F5" stroke="#CBD3DF" stroke-width="2"/>
<text x="218" y="691" text-anchor="start" font-family="Arial, sans-serif" font-size="28.2" font-weight="700" fill="#2E3440">
<tspan x="218" dy="0">The main shift</tspan>
</text>
<text x="218" y="734" text-anchor="start" font-family="Arial, sans-serif" font-size="19.6" font-weight="400" fill="#5B6472">
<tspan x="218" dy="0">A modern stack does not replace every old metric with one new score; it adds versions, slices,</tspan>
<tspan x="218" dy="26">uncertainty, cost, and private product tests.</tspan>
</text></svg>
