<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker></defs>
<rect width="100%" height="100%" fill="#F8FAFC"/><text x="70" y="70" font-family="Arial, DejaVu Sans, sans-serif" font-size="38" font-weight="700" fill="#172033" text-anchor="start"><tspan x="70" dy="0">Direct preference methods alter different parts of the training</tspan><tspan x="70" dy="48">contract</tspan></text><text x="70" y="120" font-family="Arial, DejaVu Sans, sans-serif" font-size="23" font-weight="400" fill="#526071" text-anchor="start"><tspan x="70" dy="0">The choice depends on labels, the reference policy, normalization, and whether SFT and preferences share</tspan><tspan x="70" dy="29">one objective.</tspan></text><rect x="65" y="215" width="260" height="445" rx="24" fill="#DCEBFA" stroke="#CBD5E1" stroke-width="2"/><text x="93" y="272" font-family="DejaVu Sans, Arial, sans-serif" font-size="31" font-weight="700" fill="#172033" text-anchor="start"><tspan x="93" dy="0">DPO</tspan></text><text x="93" y="312" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="400" fill="#526071" text-anchor="start"><tspan x="93" dy="0">Preference pairs ·</tspan><tspan x="93" dy="28">explicit reference</tspan><tspan x="93" dy="28">policy · logistic</tspan><tspan x="93" dy="28">pair loss</tspan></text><rect x="370" y="215" width="260" height="445" rx="24" fill="#DFF3E4" stroke="#CBD5E1" stroke-width="2"/><text x="398" y="272" font-family="DejaVu Sans, Arial, sans-serif" font-size="31" font-weight="700" fill="#172033" text-anchor="start"><tspan x="398" dy="0">IPO</tspan></text><text x="398" y="312" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="400" fill="#526071" text-anchor="start"><tspan x="398" dy="0">Preference pairs ·</tspan><tspan x="398" dy="28">finite target gap</tspan><tspan x="398" dy="28">rather than</tspan><tspan x="398" dy="28">unbounded</tspan><tspan x="398" dy="28">separation</tspan></text><rect x="675" y="215" width="260" height="445" rx="24" fill="#FFF1CC" stroke="#CBD5E1" stroke-width="2"/><text x="703" y="272" font-family="DejaVu Sans, Arial, sans-serif" font-size="31" font-weight="700" fill="#172033" text-anchor="start"><tspan x="703" dy="0">KTO</tspan></text><text x="703" y="308" font-family="DejaVu Sans, Arial, sans-serif" font-size="20.2" font-weight="600" fill="#526071" text-anchor="start"><tspan x="703" dy="0">Individual</tspan><tspan x="703" dy="23">desirable/undesirable</tspan><tspan x="703" dy="23">labels · a reference</tspan><tspan x="703" dy="23">point</tspan></text><rect x="980" y="215" width="260" height="445" rx="24" fill="#EDE5FA" stroke="#CBD5E1" stroke-width="2"/><text x="1008" y="272" font-family="DejaVu Sans, Arial, sans-serif" font-size="31" font-weight="700" fill="#172033" text-anchor="start"><tspan x="1008" dy="0">SimPO</tspan></text><text x="1008" y="312" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="400" fill="#526071" text-anchor="start"><tspan x="1008" dy="0">Preference pairs ·</tspan><tspan x="1008" dy="28">no separate</tspan><tspan x="1008" dy="28">reference policy ·</tspan><tspan x="1008" dy="28">length-normalized</tspan><tspan x="1008" dy="28">sequence score</tspan></text><rect x="1285" y="215" width="260" height="445" rx="24" fill="#FBE2E7" stroke="#CBD5E1" stroke-width="2"/><text x="1313" y="272" font-family="DejaVu Sans, Arial, sans-serif" font-size="31" font-weight="700" fill="#172033" text-anchor="start"><tspan x="1313" dy="0">ORPO</tspan></text><text x="1313" y="312" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="400" fill="#526071" text-anchor="start"><tspan x="1313" dy="0">SFT and</tspan><tspan x="1313" dy="28">preferences in</tspan><tspan x="1313" dy="28">one objective · no</tspan><tspan x="1313" dy="28">separate</tspan><tspan x="1313" dy="28">reference policy</tspan></text><rect x="100" y="720" width="1400" height="100" rx="24" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/><text x="130" y="760" font-family="Arial, DejaVu Sans, sans-serif" font-size="25" font-weight="600" fill="#172033" text-anchor="start"><tspan x="130" dy="0">There is no universal winner: compare data requirements and objective geometry, not method names.</tspan></text></svg>