<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker></defs>
<rect width="100%" height="100%" fill="#F8FAFC"/><text x="70" y="70" font-family="Arial, DejaVu Sans, sans-serif" font-size="38" font-weight="700" fill="#172033" text-anchor="start"><tspan x="70" dy="0">Three published ways to broaden the post-training signal</tspan></text><text x="70" y="120" font-family="Arial, DejaVu Sans, sans-serif" font-size="23" font-weight="400" fill="#526071" text-anchor="start"><tspan x="70" dy="0">Open recipes support mechanism-level claims; the behavior of a closed model does not reveal its exact</tspan><tspan x="70" dy="29">training stack.</tspan></text><rect x="80" y="220" width="450" height="390" rx="24" fill="#DCEBFA" stroke="#CBD5E1" stroke-width="2"/><text x="108" y="275" font-family="DejaVu Sans, Arial, sans-serif" font-size="29" font-weight="700" fill="#172033" text-anchor="start"><tspan x="108" dy="0">Constitutional AI /</tspan><tspan x="108" dy="35">RLAIF</tspan></text><text x="108" y="351" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400" fill="#526071" text-anchor="start"><tspan x="108" dy="0">The model critiques and revises</tspan><tspan x="108" dy="29">responses under principles; AI</tspan><tspan x="108" dy="29">preferences then train a reward</tspan><tspan x="108" dy="29">model and an RL policy.</tspan></text><rect x="585" y="220" width="450" height="390" rx="24" fill="#DFF3E4" stroke="#CBD5E1" stroke-width="2"/><text x="613" y="275" font-family="DejaVu Sans, Arial, sans-serif" font-size="29" font-weight="700" fill="#172033" text-anchor="start"><tspan x="613" dy="0">DeepSeek-R1</tspan></text><text x="613" y="316" font-family="DejaVu Sans, Arial, sans-serif" font-size="23.5" font-weight="600" fill="#526071" text-anchor="start"><tspan x="613" dy="0">Cold-start SFT → reasoning RL →</tspan><tspan x="613" dy="29">rejection sampling and renewed</tspan><tspan x="613" dy="29">SFT → broader RL for helpfulness</tspan><tspan x="613" dy="29">and safety.</tspan></text><rect x="1090" y="220" width="450" height="390" rx="24" fill="#EDE5FA" stroke="#CBD5E1" stroke-width="2"/><text x="1118" y="275" font-family="DejaVu Sans, Arial, sans-serif" font-size="29" font-weight="700" fill="#172033" text-anchor="start"><tspan x="1118" dy="0">Interactive</tspan><tspan x="1118" dy="35">environments</tspan></text><text x="1118" y="351" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400" fill="#526071" text-anchor="start"><tspan x="1118" dy="0">NeMo Gym defines data, agent</tspan><tspan x="1118" dy="29">wrapper, tools, and verification;</tspan><tspan x="1118" dy="29">NeMo RL and verl organize</tspan><tspan x="1118" dy="29">multi-turn rollouts and updates.</tspan></text><rect x="110" y="690" width="1380" height="125" rx="24" fill="#FFF1CC" stroke="#CBD5E1" stroke-width="2"/><text x="140" y="735" font-family="Arial, DejaVu Sans, sans-serif" font-size="23.5" font-weight="600" fill="#172033" text-anchor="start"><tspan x="140" dy="0">For a closed system, the defensible statement is: “the exact post-training recipe is undisclosed.”</tspan><tspan x="140" dy="31">Thinking modes, hidden reasoning, and tool use do not identify the algorithm.</tspan></text></svg>