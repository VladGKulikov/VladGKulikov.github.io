<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker></defs>
<rect width="100%" height="100%" fill="#F8FAFC"/><text x="70" y="70" font-family="Arial, DejaVu Sans, sans-serif" font-size="38" font-weight="700" fill="#172033" text-anchor="start"><tspan x="70" dy="0">GRPO: a relative signal constructed inside a response group</tspan></text><text x="70" y="120" font-family="Arial, DejaVu Sans, sans-serif" font-size="23" font-weight="400" fill="#526071" text-anchor="start"><tspan x="70" dy="0">Group normalization removes the separate value model, but it does not make the estimator automatically</tspan><tspan x="70" dy="29">unbiased.</tspan></text><rect x="55" y="220" width="250" height="330" rx="24" fill="#DCEBFA" stroke="#CBD5E1" stroke-width="2"/><text x="83" y="273" font-family="DejaVu Sans, Arial, sans-serif" font-size="28.2" font-weight="700" fill="#172033" text-anchor="start"><tspan x="83" dy="0">Prompt</tspan></text><text x="83" y="312" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="400" fill="#526071" text-anchor="start"><tspan x="83" dy="0">One task x</tspan></text><path d="M305,385 L355,385" stroke="#475569" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="365" y="220" width="250" height="330" rx="24" fill="#DFF3E4" stroke="#CBD5E1" stroke-width="2"/><text x="393" y="273" font-family="DejaVu Sans, Arial, sans-serif" font-size="28.2" font-weight="700" fill="#172033" text-anchor="start"><tspan x="393" dy="0">G responses</tspan></text><text x="393" y="312" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="400" fill="#526071" text-anchor="start"><tspan x="393" dy="0">The current policy</tspan><tspan x="393" dy="27">produces several</tspan><tspan x="393" dy="27">rollouts</tspan></text><path d="M615,385 L665,385" stroke="#475569" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="675" y="220" width="250" height="330" rx="24" fill="#FFF1CC" stroke="#CBD5E1" stroke-width="2"/><text x="703" y="273" font-family="DejaVu Sans, Arial, sans-serif" font-size="28.2" font-weight="700" fill="#172033" text-anchor="start"><tspan x="703" dy="0">Reward</tspan></text><text x="703" y="312" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="400" fill="#526071" text-anchor="start"><tspan x="703" dy="0">A verifier or</tspan><tspan x="703" dy="27">reward model</tspan><tspan x="703" dy="27">scores each</tspan><tspan x="703" dy="27">response</tspan></text><path d="M925,385 L975,385" stroke="#475569" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="985" y="220" width="250" height="330" rx="24" fill="#EDE5FA" stroke="#CBD5E1" stroke-width="2"/><text x="1013" y="273" font-family="DejaVu Sans, Arial, sans-serif" font-size="28.2" font-weight="700" fill="#172033" text-anchor="start"><tspan x="1013" dy="0">Advantage</tspan></text><text x="1013" y="312" font-family="DejaVu Sans, Arial, sans-serif" font-size="23.5" font-weight="600" fill="#526071" text-anchor="start"><tspan x="1013" dy="0">Ai = (ri −</tspan><tspan x="1013" dy="27">mean(r))/std(r)</tspan></text><path d="M1235,385 L1285,385" stroke="#475569" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="1295" y="220" width="250" height="330" rx="24" fill="#FBE2E7" stroke="#CBD5E1" stroke-width="2"/><text x="1323" y="273" font-family="DejaVu Sans, Arial, sans-serif" font-size="28.2" font-weight="700" fill="#172033" text-anchor="start"><tspan x="1323" dy="0">Update</tspan></text><text x="1323" y="312" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="400" fill="#526071" text-anchor="start"><tspan x="1323" dy="0">A clipped PPO-like</tspan><tspan x="1323" dy="27">objective</tspan></text><rect x="75" y="640" width="700" height="150" rx="24" fill="#DFF3E4" stroke="#CBD5E1" stroke-width="2"/><text x="105" y="685" font-family="Arial, DejaVu Sans, sans-serif" font-size="23" font-weight="400" fill="#172033" text-anchor="start"><tspan x="105" dy="0">Teaching group: [1,0,0,1,0,0,1,0] → mean=0.375,</tspan><tspan x="105" dy="31">std=0.484, success +1.291, failure −0.775.</tspan></text><rect x="825" y="640" width="700" height="150" rx="24" fill="#FBE2E7" stroke="#CBD5E1" stroke-width="2"/><text x="855" y="685" font-family="Arial, DejaVu Sans, sans-serif" font-size="23.5" font-weight="600" fill="#172033" text-anchor="start"><tspan x="855" dy="0">At p=0.3 and G=8, the probability that every reward is</tspan><tspan x="855" dy="31">equal is 5.77%. Such a group carries no relative</tspan><tspan x="855" dy="31">signal.</tspan></text></svg>