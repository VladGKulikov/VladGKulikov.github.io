<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker></defs>
<rect width="100%" height="100%" fill="#F8FAFC"/><text x="70" y="70" font-family="Arial, DejaVu Sans, sans-serif" font-size="38" font-weight="700" fill="#172033" text-anchor="start"><tspan x="70" dy="0">Learning from feedback: a decision map</tspan></text><text x="70" y="120" font-family="Arial, DejaVu Sans, sans-serif" font-size="23" font-weight="400" fill="#526071" text-anchor="start"><tspan x="70" dy="0">Start with the available signal and its acquisition cost, not with an algorithm name.</tspan></text><rect x="70" y="215" width="350" height="470" rx="24" fill="#DCEBFA" stroke="#CBD5E1" stroke-width="2"/><text x="98" y="269" font-family="DejaVu Sans, Arial, sans-serif" font-size="28.2" font-weight="700" fill="#172033" text-anchor="start"><tspan x="98" dy="0">Signal</tspan></text><text x="98" y="309" font-family="DejaVu Sans, Arial, sans-serif" font-size="23.5" font-weight="600" fill="#526071" text-anchor="start"><tspan x="98" dy="0">Demonstrations → SFT</tspan><tspan x="98" dy="28">Pairs → DPO / reward</tspan><tspan x="98" dy="28">model</tspan><tspan x="98" dy="28">Binary labels → KTO</tspan><tspan x="98" dy="28">Verifiable reward → RLVR</tspan></text><rect x="455" y="215" width="350" height="470" rx="24" fill="#DFF3E4" stroke="#CBD5E1" stroke-width="2"/><text x="483" y="269" font-family="DejaVu Sans, Arial, sans-serif" font-size="28.2" font-weight="700" fill="#172033" text-anchor="start"><tspan x="483" dy="0">Algorithmic</tspan><tspan x="483" dy="34">contract</tspan></text><text x="483" y="343" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="400" fill="#526071" text-anchor="start"><tspan x="483" dy="0">RLHF: RM + PPO + KL</tspan><tspan x="483" dy="28">DPO: fixed pairs +</tspan><tspan x="483" dy="28">reference</tspan><tspan x="483" dy="28">RLOO: leave-one-out</tspan><tspan x="483" dy="28">baseline</tspan><tspan x="483" dy="28">GRPO: within-group</tspan><tspan x="483" dy="28">normalization</tspan></text><rect x="840" y="215" width="350" height="470" rx="24" fill="#FFF1CC" stroke="#CBD5E1" stroke-width="2"/><text x="868" y="269" font-family="DejaVu Sans, Arial, sans-serif" font-size="28.2" font-weight="700" fill="#172033" text-anchor="start"><tspan x="868" dy="0">Teaching</tspan><tspan x="868" dy="34">scenarios</tspan></text><text x="868" y="343" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="400" fill="#526071" text-anchor="start"><tspan x="868" dy="0">75% wins → logit 1.099</tspan><tspan x="868" dy="28">PPO states: 269.2 GiB</tspan><tspan x="868" dy="28">DPO states: 134.6 GiB</tspan><tspan x="868" dy="28">Rollout/update: 39.3× in</tspan><tspan x="868" dy="28">the stated scenario</tspan></text><rect x="1225" y="215" width="350" height="470" rx="24" fill="#FBE2E7" stroke="#CBD5E1" stroke-width="2"/><text x="1253" y="269" font-family="DejaVu Sans, Arial, sans-serif" font-size="28.2" font-weight="700" fill="#172033" text-anchor="start"><tspan x="1253" dy="0">Primary risks</tspan></text><text x="1253" y="309" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="400" fill="#526071" text-anchor="start"><tspan x="1253" dy="0">Misspecified reward model</tspan><tspan x="1253" dy="28">Verifier exploitation</tspan><tspan x="1253" dy="28">Degenerate groups</tspan><tspan x="1253" dy="28">Length bias</tspan><tspan x="1253" dy="28">Stale rollouts</tspan></text><rect x="90" y="735" width="1420" height="95" rx="24" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/><text x="120" y="772" font-family="Arial, DejaVu Sans, sans-serif" font-size="23.5" font-weight="600" fill="#172033" text-anchor="start"><tspan x="120" dy="0">A method passport should record data, reward, sampling policy, normalization, KL treatment,</tspan><tspan x="120" dy="31">degenerate-group handling, and systems design.</tspan></text></svg>