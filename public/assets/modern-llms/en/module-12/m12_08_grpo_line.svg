<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker></defs>
<rect width="100%" height="100%" fill="#F8FAFC"/><text x="70" y="70" font-family="Arial, DejaVu Sans, sans-serif" font-size="38" font-weight="700" fill="#172033" text-anchor="start"><tspan x="70" dy="0">After GRPO: different failures require different repairs</tspan></text><text x="70" y="120" font-family="Arial, DejaVu Sans, sans-serif" font-size="23" font-weight="400" fill="#526071" text-anchor="start"><tspan x="70" dy="0">Later methods are not one linear “better GRPO”; they modify different parts of the recipe.</tspan></text><rect x="65" y="215" width="260" height="445" rx="24" fill="#FBE2E7" stroke="#CBD5E1" stroke-width="2"/><text x="93" y="267" font-family="DejaVu Sans, Arial, sans-serif" font-size="28.2" font-weight="700" fill="#172033" text-anchor="start"><tspan x="93" dy="0">Degenerate</tspan><tspan x="93" dy="31">groups</tspan></text><text x="93" y="337" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="400" fill="#526071" text-anchor="start"><tspan x="93" dy="0">DAPO dynamic</tspan><tspan x="93" dy="27">sampling removes</tspan><tspan x="93" dy="27">groups with no</tspan><tspan x="93" dy="27">relative signal.</tspan></text><rect x="370" y="215" width="260" height="445" rx="24" fill="#DCEBFA" stroke="#CBD5E1" stroke-width="2"/><text x="398" y="267" font-family="DejaVu Sans, Arial, sans-serif" font-size="28.2" font-weight="700" fill="#172033" text-anchor="start"><tspan x="398" dy="0">Exploration</tspan></text><text x="398" y="306" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="400" fill="#526071" text-anchor="start"><tspan x="398" dy="0">DAPO Clip-Higher</tspan><tspan x="398" dy="27">asymmetrically</tspan><tspan x="398" dy="27">expands the</tspan><tspan x="398" dy="27">allowed probability</tspan><tspan x="398" dy="27">increase.</tspan></text><rect x="675" y="215" width="260" height="445" rx="24" fill="#DFF3E4" stroke="#CBD5E1" stroke-width="2"/><text x="703" y="267" font-family="DejaVu Sans, Arial, sans-serif" font-size="28.2" font-weight="700" fill="#172033" text-anchor="start"><tspan x="703" dy="0">Response</tspan><tspan x="703" dy="31">length</tspan></text><text x="703" y="337" font-family="DejaVu Sans, Arial, sans-serif" font-size="23.5" font-weight="600" fill="#526071" text-anchor="start"><tspan x="703" dy="0">Token-level</tspan><tspan x="703" dy="27">policy-gradient</tspan><tspan x="703" dy="27">loss and Dr. GRPO</tspan><tspan x="703" dy="27">revisit</tspan><tspan x="703" dy="27">normalization.</tspan></text><rect x="980" y="215" width="260" height="445" rx="24" fill="#FFF1CC" stroke="#CBD5E1" stroke-width="2"/><text x="1008" y="267" font-family="DejaVu Sans, Arial, sans-serif" font-size="28.2" font-weight="700" fill="#172033" text-anchor="start"><tspan x="1008" dy="0">Estimator</tspan><tspan x="1008" dy="31">theory</tspan></text><text x="1008" y="337" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="400" fill="#526071" text-anchor="start"><tspan x="1008" dy="0">Group advantages</tspan><tspan x="1008" dy="27">are centered yet</tspan><tspan x="1008" dy="27">may be biased</tspan><tspan x="1008" dy="27">relative to the true</tspan><tspan x="1008" dy="27">advantage.</tspan></text><rect x="1285" y="215" width="260" height="445" rx="24" fill="#EDE5FA" stroke="#CBD5E1" stroke-width="2"/><text x="1313" y="267" font-family="DejaVu Sans, Arial, sans-serif" font-size="28.2" font-weight="700" fill="#172033" text-anchor="start"><tspan x="1313" dy="0">Systems cost</tspan></text><text x="1313" y="306" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="400" fill="#526071" text-anchor="start"><tspan x="1313" dy="0">Asynchronous</tspan><tspan x="1313" dy="27">generation and</tspan><tspan x="1313" dy="27">separate pools</tspan><tspan x="1313" dy="27">improve utilization</tspan><tspan x="1313" dy="27">but create stale</tspan><tspan x="1313" dy="27">rollouts.</tspan></text><rect x="95" y="720" width="1410" height="100" rx="24" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/><text x="125" y="760" font-family="Arial, DejaVu Sans, sans-serif" font-size="24" font-weight="600" fill="#172033" text-anchor="start"><tspan x="125" dy="0">Before comparing recipes, record the reward, averaging unit, KL treatment, zero-variance rule, and</tspan><tspan x="125" dy="33">rollout age.</tspan></text></svg>