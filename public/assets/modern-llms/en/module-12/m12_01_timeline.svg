<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker></defs>
<rect width="100%" height="100%" fill="#F8FAFC"/><text x="70" y="70" font-family="Arial, DejaVu Sans, sans-serif" font-size="38" font-weight="700" fill="#172033" text-anchor="start"><tspan x="70" dy="0">From human comparisons to reinforcement learning in environments</tspan></text><text x="70" y="120" font-family="Arial, DejaVu Sans, sans-serif" font-size="23" font-weight="400" fill="#526071" text-anchor="start"><tspan x="70" dy="0">The history changes both the loss function and the way training signal is produced.</tspan></text><rect x="60" y="205" width="210" height="410" rx="24" fill="#DCEBFA" stroke="#CBD5E1" stroke-width="2"/><text x="88" y="253" font-family="DejaVu Sans, Arial, sans-serif" font-size="27.2" font-weight="700" fill="#172033" text-anchor="start"><tspan x="88" dy="0">2017 ·</tspan><tspan x="88" dy="26">Human</tspan><tspan x="88" dy="26">Preferences</tspan></text><text x="88" y="343" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="400" fill="#526071" text-anchor="start"><tspan x="88" dy="0">Pairwise</tspan><tspan x="88" dy="26">judgments</tspan><tspan x="88" dy="26">train an</tspan><tspan x="88" dy="26">explicit reward</tspan><tspan x="88" dy="26">model.</tspan></text><path d="M270,410 L305,410" stroke="#475569" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="315" y="205" width="210" height="410" rx="24" fill="#DFF3E4" stroke="#CBD5E1" stroke-width="2"/><text x="343" y="254" font-family="DejaVu Sans, Arial, sans-serif" font-size="27.3" font-weight="700" fill="#172033" text-anchor="start"><tspan x="343" dy="0">2022 ·</tspan><tspan x="343" dy="28">InstructGPT</tspan></text><text x="343" y="320" font-family="DejaVu Sans, Arial, sans-serif" font-size="23.5" font-weight="600" fill="#526071" text-anchor="start"><tspan x="343" dy="0">SFT → reward</tspan><tspan x="343" dy="26">model → PPO</tspan><tspan x="343" dy="26">with a KL</tspan><tspan x="343" dy="26">anchor.</tspan></text><path d="M525,410 L560,410" stroke="#475569" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="570" y="205" width="210" height="410" rx="24" fill="#FFF1CC" stroke="#CBD5E1" stroke-width="2"/><text x="598" y="254" font-family="DejaVu Sans, Arial, sans-serif" font-size="28.2" font-weight="700" fill="#172033" text-anchor="start"><tspan x="598" dy="0">2023 · DPO</tspan></text><text x="598" y="292" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="400" fill="#526071" text-anchor="start"><tspan x="598" dy="0">Fixed pairs</tspan><tspan x="598" dy="26">train the policy</tspan><tspan x="598" dy="26">without an</tspan><tspan x="598" dy="26">explicit reward</tspan><tspan x="598" dy="26">model or</tspan><tspan x="598" dy="26">online RL.</tspan></text><path d="M780,410 L815,410" stroke="#475569" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="825" y="205" width="210" height="410" rx="24" fill="#EDE5FA" stroke="#CBD5E1" stroke-width="2"/><text x="853" y="254" font-family="DejaVu Sans, Arial, sans-serif" font-size="28.2" font-weight="700" fill="#172033" text-anchor="start"><tspan x="853" dy="0">2024 ·</tspan><tspan x="853" dy="28">RLOO and</tspan><tspan x="853" dy="28">GRPO</tspan></text><text x="853" y="348" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="400" fill="#526071" text-anchor="start"><tspan x="853" dy="0">Multiple</tspan><tspan x="853" dy="26">responses to</tspan><tspan x="853" dy="26">one prompt</tspan><tspan x="853" dy="26">create an</tspan><tspan x="853" dy="26">in-group</tspan><tspan x="853" dy="26">baseline.</tspan></text><path d="M1035,410 L1070,410" stroke="#475569" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="1080" y="205" width="210" height="410" rx="24" fill="#FBE2E7" stroke="#CBD5E1" stroke-width="2"/><text x="1108" y="254" font-family="DejaVu Sans, Arial, sans-serif" font-size="28.2" font-weight="700" fill="#172033" text-anchor="start"><tspan x="1108" dy="0">2025 ·</tspan><tspan x="1108" dy="28">DAPO and</tspan><tspan x="1108" dy="28">Dr. GRPO</tspan></text><text x="1108" y="348" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="400" fill="#526071" text-anchor="start"><tspan x="1108" dy="0">Clipping, group</tspan><tspan x="1108" dy="26">selection,</tspan><tspan x="1108" dy="26">length</tspan><tspan x="1108" dy="26">normalization,</tspan><tspan x="1108" dy="26">and</tspan><tspan x="1108" dy="26">degenerate</tspan><tspan x="1108" dy="26">cases are</tspan><tspan x="1108" dy="26">revisited.</tspan></text><path d="M1290,410 L1325,410" stroke="#475569" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="1335" y="205" width="210" height="410" rx="24" fill="#DCEBFA" stroke="#CBD5E1" stroke-width="2"/><text x="1363" y="250" font-family="DejaVu Sans, Arial, sans-serif" font-size="25.9" font-weight="700" fill="#172033" text-anchor="start"><tspan x="1363" dy="0">2026 ·</tspan><tspan x="1363" dy="23">Environments</tspan><tspan x="1363" dy="23">and systems</tspan></text><text x="1363" y="334" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="400" fill="#526071" text-anchor="start"><tspan x="1363" dy="0">verl, NeMo RL,</tspan><tspan x="1363" dy="26">and NeMo Gym</tspan><tspan x="1363" dy="26">connect</tspan><tspan x="1363" dy="26">generation,</tspan><tspan x="1363" dy="26">verification,</tspan><tspan x="1363" dy="26">updates, and</tspan><tspan x="1363" dy="26">rollout</tspan><tspan x="1363" dy="26">freshness.</tspan></text><rect x="90" y="690" width="1420" height="125" rx="24" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/><text x="120" y="735" font-family="Arial, DejaVu Sans, sans-serif" font-size="25" font-weight="600" fill="#172033" text-anchor="start"><tspan x="120" dy="0">The central shift: from a static comparison dataset to a continuous policy → environment → reward →</tspan><tspan x="120" dy="34">update loop.</tspan></text></svg>