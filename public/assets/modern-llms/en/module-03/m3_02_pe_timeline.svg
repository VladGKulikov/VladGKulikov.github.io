<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<rect width="1600" height="900" fill="#FFFFFF"/>
<text x="70" y="72" font-family="Arial, sans-serif" font-size="39.1" font-weight="700" fill="#2E3440">Positional mechanisms: a branching history</text>
<text x="70" y="112" font-family="Arial, sans-serif" font-size="19.6" fill="#5B6472">Modern systems do not reduce to one universally winning formula</text>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#4C78A8"/></marker></defs>
<rect x="70" y="185" width="420" height="190" rx="18" fill="#EAF1FB" stroke="#CBD3DF" stroke-width="2"/>
<text x="98" y="235" text-anchor="start" font-family="Arial, sans-serif" font-size="28.2" font-weight="700" fill="#2E3440">
<tspan x="98" dy="0">2017</tspan>
</text>
<text x="98" y="274" text-anchor="start" font-family="Arial, sans-serif" font-size="23" font-weight="600" fill="#5B6472">
<tspan x="98" dy="0">Sinusoidal / learned absolute PE</tspan>
</text>
<line x1="500" y1="280" x2="540" y2="280" stroke="#4C78A8" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="555" y="185" width="420" height="190" rx="18" fill="#EDF7ED" stroke="#CBD3DF" stroke-width="2"/>
<text x="583" y="235" text-anchor="start" font-family="Arial, sans-serif" font-size="28.2" font-weight="700" fill="#2E3440">
<tspan x="583" dy="0">2018–2019</tspan>
</text>
<text x="583" y="274" text-anchor="start" font-family="Arial, sans-serif" font-size="19.6" font-weight="400" fill="#5B6472">
<tspan x="583" dy="0">Relative representations</tspan>
<tspan x="583" dy="25">Transformer-XL</tspan>
</text>
<line x1="985" y1="280" x2="1025" y2="280" stroke="#4C78A8" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="1040" y="185" width="420" height="190" rx="18" fill="#F3EDFA" stroke="#CBD3DF" stroke-width="2"/>
<text x="1068" y="235" text-anchor="start" font-family="Arial, sans-serif" font-size="28.2" font-weight="700" fill="#2E3440">
<tspan x="1068" dy="0">2021</tspan>
</text>
<text x="1068" y="274" text-anchor="start" font-family="Arial, sans-serif" font-size="23.5" font-weight="600" fill="#5B6472">
<tspan x="1068" dy="0">RoPE · ALiBi</tspan>
</text>
<rect x="70" y="520" width="420" height="230" rx="18" fill="#FFF5DD" stroke="#CBD3DF" stroke-width="2"/>
<text x="98" y="570" text-anchor="start" font-family="Arial, sans-serif" font-size="28.2" font-weight="700" fill="#2E3440">
<tspan x="98" dy="0">Context extension</tspan>
</text>
<text x="98" y="609" text-anchor="start" font-family="Arial, sans-serif" font-size="19.9" font-weight="600" fill="#5B6472">
<tspan x="98" dy="0">PI · NTK-aware · YaRN · LongRoPE ·</tspan>
<tspan x="98" dy="25">Llama3-style</tspan>
</text>
<line x1="1250" y1="390" x2="280" y2="505" stroke="#4C78A8" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="555" y="520" width="420" height="230" rx="18" fill="#FCEBEC" stroke="#CBD3DF" stroke-width="2"/>
<text x="583" y="570" text-anchor="start" font-family="Arial, sans-serif" font-size="28.2" font-weight="700" fill="#2E3440">
<tspan x="583" dy="0">NoPE and hybrids</tspan>
</text>
<text x="583" y="609" text-anchor="start" font-family="Arial, sans-serif" font-size="19.6" font-weight="400" fill="#5B6472">
<tspan x="583" dy="0">Pure NoPE · partial RoPE ·</tspan>
<tspan x="583" dy="25">interleaved RoPE/NoPE · local</tspan>
<tspan x="583" dy="25">attention</tspan>
</text>
<line x1="1250" y1="390" x2="765" y2="505" stroke="#4C78A8" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="1040" y="520" width="420" height="230" rx="18" fill="#E8F7F5" stroke="#CBD3DF" stroke-width="2"/>
<text x="1068" y="570" text-anchor="start" font-family="Arial, sans-serif" font-size="28.2" font-weight="700" fill="#2E3440">
<tspan x="1068" dy="0">Multimodal coordinates</tspan>
</text>
<text x="1068" y="609" text-anchor="start" font-family="Arial, sans-serif" font-size="22.9" font-weight="600" fill="#5B6472">
<tspan x="1068" dy="0">M-RoPE · TMRoPE · spatial and</tspan>
<tspan x="1068" dy="25">time-aligned IDs</tspan>
</text>
<line x1="1250" y1="390" x2="1250" y2="505" stroke="#4C78A8" stroke-width="3" marker-end="url(#arrow)"/>
</svg>
