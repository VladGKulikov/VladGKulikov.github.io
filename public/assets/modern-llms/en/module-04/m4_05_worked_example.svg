<rect x="562" y="132" width="498" height="147" rx="12" fill="#EFF4EA" stroke="#D8DEE9" stroke-width="1.3"/>
<text x="586" y="172" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" fill="#2E3440" text-anchor="start">k = [0, 1, 1, −0.5]</text>
<text x="586" y="211" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" fill="#2E3440" text-anchor="start">Position n=1</text>
<text x="586" y="236" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" fill="#2E3440" text-anchor="start">Angles: 1 and 0.01 rad</text>
<path d="M289,279 L289,312" fill="none" stroke="#4C566A" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="40" y="315" width="498" height="112" rx="12" fill="#E8EEF5" stroke="#D8DEE9" stroke-width="1.3"/>
