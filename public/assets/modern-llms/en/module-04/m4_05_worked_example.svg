<rect x="150" y="467" width="800" height="125" rx="12" fill="#F3EEF3" stroke="#D8DEE9" stroke-width="1.3"/>
<text x="174" y="507" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" fill="#2E3440" text-anchor="start">Dot product: 1.144248</text>
<text x="174" y="546" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" fill="#2E3440" text-anchor="start">Attention logit: 1.144248 / √4 = 0.572124</text>
<text x="40" y="639" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" fill="#4C566A" text-anchor="start">(m,n): (3,1) → (7,5) → (2,0). All have m−n=2; both quantities stay unchanged.</text>
