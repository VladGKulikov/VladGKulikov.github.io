<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="678" viewBox="0 0 1100 678">
<title>One displacement, one dot product</title>
<desc>Adjacent pairs, D=4, base=10,000; fixed q and k.</desc>
<rect width="1100" height="678" fill="#FFFFFF"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9 Z" fill="#4C566A"/></marker></defs>
<text x="40" y="52" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="700" fill="#2E3440" text-anchor="start">One displacement, one dot product</text>
<text x="40" y="97" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" fill="#4C566A" text-anchor="start">Adjacent pairs, D=4, base=10,000; fixed q and k.</text>
<rect x="40" y="132" width="498" height="147" rx="12" fill="#E8EEF5" stroke="#D8DEE9" stroke-width="1.3"/>
<text x="64" y="172" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" fill="#2E3440" text-anchor="start">q = [1, 0, 0.5, 0.5]</text>
<text x="64" y="211" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" fill="#2E3440" text-anchor="start">Position m=3</text>
