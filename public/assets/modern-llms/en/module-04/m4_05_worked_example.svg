<text x="586" y="394" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" fill="#2E3440" text-anchor="start">[-0.8415, 0.5403, 1.0049, -0.4900]</text>
<path d="M289,427 L550,461" fill="none" stroke="#4C566A" stroke-width="2" marker-end="url(#arrow)"/>
