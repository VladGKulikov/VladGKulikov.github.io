<text x="64" y="394" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" fill="#2E3440" text-anchor="start">[-0.9900, 0.1411, 0.4848, 0.5148]</text>
<path d="M811,279 L811,312" fill="none" stroke="#4C566A" stroke-width="2" marker-end="url(#arrow)"/>
