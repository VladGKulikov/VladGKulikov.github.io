<rect x="810" y="205" width="145" height="115" rx="18" fill="#EAF1FB" stroke="#CBD3DF" stroke-width="2"/>
<text x="828" y="242" text-anchor="start" font-family="Arial,sans-serif" font-size="20.2" font-weight="700" fill="#2E3440">
<tspan x="828" dy="0">local W=128</tspan>
</text>
<defs><marker id="a32" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#4C78A8"/></marker></defs>
