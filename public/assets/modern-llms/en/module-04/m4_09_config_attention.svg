<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<rect width="1600" height="900" fill="#FFFFFF"/>
<text x="70" y="70" font-family="Arial,sans-serif" font-size="39.1" font-weight="700" fill="#2E3440">gpt-oss attention passport</text>
<text x="70" y="108" font-family="Arial,sans-serif" font-size="19.6" fill="#5B6472">Open code makes cache geometry and connectivity explicit</text>
<rect x="60" y="180" width="460" height="190" rx="18" fill="#EAF1FB" stroke="#CBD3DF" stroke-width="2"/>
<text x="86" y="231" text-anchor="start" font-family="Arial,sans-serif" font-size="28.2" font-weight="700" fill="#2E3440">
<tspan x="86" dy="0">64 query-heads</tspan>
</text>
<rect x="565" y="180" width="460" height="190" rx="18" fill="#EDF7ED" stroke="#CBD3DF" stroke-width="2"/>
<text x="591" y="231" text-anchor="start" font-family="Arial,sans-serif" font-size="28.2" font-weight="700" fill="#2E3440">
<tspan x="591" dy="0">8 KV-heads</tspan>
</text>
<rect x="1070" y="180" width="460" height="190" rx="18" fill="#FFF5DD" stroke="#CBD3DF" stroke-width="2"/>
<text x="1096" y="231" text-anchor="start" font-family="Arial,sans-serif" font-size="28.2" font-weight="700" fill="#2E3440">
<tspan x="1096" dy="0">group size 8</tspan>
</text>
<rect x="60" y="450" width="460" height="190" rx="18" fill="#F3EDFA" stroke="#CBD3DF" stroke-width="2"/>
<text x="86" y="501" text-anchor="start" font-family="Arial,sans-serif" font-size="28.2" font-weight="700" fill="#2E3440">
<tspan x="86" dy="0">18 window-128</tspan>
</text>
<rect x="565" y="450" width="460" height="190" rx="18" fill="#E8F7F5" stroke="#CBD3DF" stroke-width="2"/>
<text x="591" y="501" text-anchor="start" font-family="Arial,sans-serif" font-size="28.2" font-weight="700" fill="#2E3440">
<tspan x="591" dy="0">18 full</tspan>
</text>
<rect x="1070" y="450" width="460" height="190" rx="18" fill="#FCEBEC" stroke="#CBD3DF" stroke-width="2"/>
<text x="1096" y="501" text-anchor="start" font-family="Arial,sans-serif" font-size="28.2" font-weight="700" fill="#2E3440">
<tspan x="1096" dy="0">learned sink/head</tspan>
</text>
<rect x="390" y="710" width="820" height="105" rx="18" fill="#FFF5DD" stroke="#CBD3DF" stroke-width="2"/>
<text x="416" y="760" text-anchor="start" font-family="Arial,sans-serif" font-size="28.2" font-weight="700" fill="#2E3440">
<tspan x="416" dy="0">KV @ 131K ≈ 4.504 GiB</tspan>
</text>
<text x="416" y="802" text-anchor="start" font-family="Arial,sans-serif" font-size="23.5" font-weight="600" fill="#5B6472">
<tspan x="416" dy="0">all-full equivalent = 9 GiB</tspan>
</text>
</svg>
