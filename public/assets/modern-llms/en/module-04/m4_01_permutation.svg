<text x="40" y="434" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" fill="#4C566A" text-anchor="start">Attn(PX) = P Attn(X): output rows move too. A fixed causal mask breaks this symmetry.</text>
