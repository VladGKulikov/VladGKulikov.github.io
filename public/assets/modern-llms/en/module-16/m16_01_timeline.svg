<text x="490" y="296" font-family="DejaVu Sans,Arial,sans-serif" font-size="28.2" font-weight="700" fill="#263238" text-anchor="middle">Guided generation</text>
<text x="375" y="385" font-family="DejaVu Sans,Arial,sans-serif" font-size="19.2" font-weight="600" fill="#263238" text-anchor="start">machine-readable actions</text>
