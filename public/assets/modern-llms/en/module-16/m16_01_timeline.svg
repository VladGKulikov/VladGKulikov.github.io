<text x="800" y="800" font-family="DejaVu Sans,Arial,sans-serif" font-size="23.5" font-weight="600" fill="#263238" text-anchor="middle">Shift: from a text pattern to a system with protocol,</text>
<text x="800" y="831" font-family="DejaVu Sans,Arial,sans-serif" font-size="23.5" font-weight="600" fill="#263238" text-anchor="middle">state, authority, and verification.</text>
