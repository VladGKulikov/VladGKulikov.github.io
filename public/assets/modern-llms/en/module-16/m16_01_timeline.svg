<text x="1305" y="437" font-family="DejaVu Sans,Arial,sans-serif" font-size="19.6" font-weight="400" fill="#263238" text-anchor="start">orchestration</text>
<text x="1305" y="464" font-family="DejaVu Sans,Arial,sans-serif" font-size="19.6" font-weight="400" fill="#263238" text-anchor="start">and recovery</text>
