<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="574" viewBox="0 0 1100 574">
<title>MCP: protocol and authority</title>
<desc>2026-07-28 revision: version and capabilities accompany each request.</desc>
<rect width="1100" height="574" fill="#FFFFFF"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9 Z" fill="#4C566A"/></marker></defs>
<text x="40" y="52" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="700" fill="#2E3440" text-anchor="start">MCP: protocol and authority</text>
<text x="40" y="97" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" fill="#4C566A" text-anchor="start">2026-07-28 revision: version and capabilities accompany each request.</text>
<rect x="40" y="132" width="460" height="180" rx="12" fill="#E8EEF5" stroke="#D8DEE9" stroke-width="1.3"/>
<text x="60" y="170" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" fill="#2E3440" text-anchor="start">Host and MCP client</text>
<text x="60" y="209" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" fill="#2E3440" text-anchor="start">Task, context, authorization policy, and</text>
<text x="60" y="234" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" fill="#2E3440" text-anchor="start">verification.</text>
<rect x="600" y="132" width="460" height="180" rx="12" fill="#EFF4EA" stroke="#D8DEE9" stroke-width="1.3"/>
<text x="620" y="170" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" fill="#2E3440" text-anchor="start">MCP server</text>
<text x="620" y="209" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" fill="#2E3440" text-anchor="start">Capability descriptions and execution of an</text>
<text x="620" y="234" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" fill="#2E3440" text-anchor="start">authorized request.</text>
<path d="M505,202 L590,202" fill="none" stroke="#4C566A" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M590,257 L505,257" fill="none" stroke="#4C566A" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="150" y="367" width="800" height="140" rx="12" fill="#FAF0E8" stroke="#D8DEE9" stroke-width="1.3"/>
<text x="170" y="405" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" fill="#2E3440" text-anchor="start">Trust boundary</text>
<text x="170" y="444" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" fill="#2E3440" text-anchor="start">Server text is data. Connectivity does not authorize every action.</text>
</svg>
