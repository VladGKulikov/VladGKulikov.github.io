<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="957" viewBox="0 0 1100 957">
<title>Six seconds of audio: distinguish the units</title>
<desc>Two separate teaching scenarios; the codec is not a continuation of the feature path.</desc>
<rect width="1100" height="957" fill="#FFFFFF"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9 Z" fill="#4C566A"/></marker></defs>
<text x="40" y="52" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="700" fill="#2E3440" text-anchor="start">Six seconds of audio: distinguish the units</text>
<text x="40" y="97" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" fill="#4C566A" text-anchor="start">Two separate teaching scenarios; the codec is not a continuation of the feature path.</text>
<rect x="45" y="132" width="1010" height="105" rx="12" fill="#E8EEF5" stroke="#D8DEE9" stroke-width="1.3"/>
<text x="65" y="170" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" fill="#2E3440" text-anchor="start">Continuous features for model input</text>
<text x="65" y="209" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" fill="#2E3440" text-anchor="start">16 kHz: 96,000 samples. Window 400, hop 160; right padding.</text>
<rect x="45" y="277" width="470" height="170" rx="12" fill="#E8EEF5" stroke="#D8DEE9" stroke-width="1.3"/>
<text x="65" y="315" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" fill="#2E3440" text-anchor="start">600 windows → spectra 600 × 201</text>
<text x="65" y="354" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" fill="#2E3440" text-anchor="start">Overlapping windows do not lengthen the</text>
<text x="65" y="379" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" fill="#2E3440" text-anchor="start">recording.</text>
<path d="M523,362 L574,362" fill="none" stroke="#4C566A" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="585" y="277" width="470" height="170" rx="12" fill="#EFF4EA" stroke="#D8DEE9" stroke-width="1.3"/>
<text x="605" y="315" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" fill="#2E3440" text-anchor="start">Pool 4 frames → 150 positions</text>
<text x="605" y="354" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" fill="#2E3440" text-anchor="start">After projection: 18.75 MiB KV at 128</text>
<text x="605" y="379" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" fill="#2E3440" text-anchor="start">KiB/position.</text>
<rect x="45" y="487" width="1010" height="105" rx="12" fill="#E8EEF5" stroke="#D8DEE9" stroke-width="1.3"/>
<text x="65" y="525" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" fill="#2E3440" text-anchor="start">Separate discrete-codec scenario</text>
<text x="65" y="564" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" fill="#2E3440" text-anchor="start">75 frames/s; 8 books of 1,024 entries. Each index occupies 10 bits.</text>
<rect x="45" y="632" width="470" height="170" rx="12" fill="#F3EEF3" stroke="#D8DEE9" stroke-width="1.3"/>
<text x="65" y="670" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" fill="#2E3440" text-anchor="start">450 temporal frames</text>
<text x="65" y="709" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" fill="#2E3440" text-anchor="start">Each frame contains eight indices, one per</text>
<text x="65" y="734" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" fill="#2E3440" text-anchor="start">codebook.</text>
<path d="M523,717 L574,717" fill="none" stroke="#4C566A" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="585" y="632" width="470" height="170" rx="12" fill="#EFF4EA" stroke="#D8DEE9" stroke-width="1.3"/>
<text x="605" y="670" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" fill="#2E3440" text-anchor="start">3,600 indices → 36,000 bits</text>
<text x="605" y="709" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" fill="#2E3440" text-anchor="start">6,000 payload bits/s; excludes file overhead</text>
<text x="605" y="734" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" fill="#2E3440" text-anchor="start">and side information.</text>
<text x="40" y="854" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" fill="#4C566A" text-anchor="start">Decoder sequence length depends on how codes are combined or predicted.</text>
<text x="40" y="878" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" fill="#4C566A" text-anchor="start">3,600 indices do not automatically imply 3,600 ordinary KV positions.</text>
</svg>
