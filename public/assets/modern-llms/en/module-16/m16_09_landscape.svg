<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#718096"/></marker></defs>
<rect width="1600" height="900" fill="#ffffff"/>
<text x="60" y="72" font-family="DejaVu Sans,Arial,sans-serif" font-size="39.1" font-weight="700" fill="#17324d">Four action surfaces for agent systems</text>
<rect x="55" y="155" width="730" height="270" rx="18" fill="#e8f1fb" stroke="#cbd5e1" stroke-width="2"/>
<text x="95" y="220" font-family="DejaVu Sans,Arial,sans-serif" font-size="28.2" font-weight="700" fill="#263238" text-anchor="start">APIs and SDKs</text>
<text x="95" y="280" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="400" fill="#263238" text-anchor="start">typed tools · handoffs</text>
<text x="95" y="310" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="400" fill="#263238" text-anchor="start">tracing</text>
<text x="95" y="360" font-family="DejaVu Sans,Arial,sans-serif" font-size="19.6" font-weight="400" fill="#52606d" text-anchor="start">risk: incorrect authority</text>
<rect x="815" y="155" width="730" height="270" rx="18" fill="#eaf7ef" stroke="#cbd5e1" stroke-width="2"/>
<text x="855" y="220" font-family="DejaVu Sans,Arial,sans-serif" font-size="28.2" font-weight="700" fill="#263238" text-anchor="start">Terminal and code</text>
<text x="855" y="280" font-family="DejaVu Sans,Arial,sans-serif" font-size="23.5" font-weight="600" fill="#263238" text-anchor="start">files · commands · tests</text>
<text x="855" y="310" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="400" fill="#263238" text-anchor="start">version control</text>
<text x="855" y="345" font-family="DejaVu Sans,Arial,sans-serif" font-size="19.6" font-weight="400" fill="#52606d" text-anchor="start">risk: unsafe execution</text>
<text x="855" y="372" font-family="DejaVu Sans,Arial,sans-serif" font-size="19.6" font-weight="400" fill="#52606d" text-anchor="start">interface drift</text>
<rect x="55" y="480" width="730" height="270" rx="18" fill="#fff5df" stroke="#cbd5e1" stroke-width="2"/>
<text x="95" y="545" font-family="DejaVu Sans,Arial,sans-serif" font-size="28.2" font-weight="700" fill="#263238" text-anchor="start">Browser and desktop</text>
<text x="95" y="605" font-family="DejaVu Sans,Arial,sans-serif" font-size="23.5" font-weight="600" fill="#263238" text-anchor="start">screenshots · clicks · forms</text>
<text x="95" y="635" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="400" fill="#263238" text-anchor="start">applications</text>
<text x="95" y="670" font-family="DejaVu Sans,Arial,sans-serif" font-size="19.6" font-weight="400" fill="#52606d" text-anchor="start">risk: grounding errors</text>
<text x="95" y="697" font-family="DejaVu Sans,Arial,sans-serif" font-size="19.6" font-weight="400" fill="#52606d" text-anchor="start">prompt injection</text>
<rect x="815" y="480" width="730" height="270" rx="18" fill="#f2ecfb" stroke="#cbd5e1" stroke-width="2"/>
<text x="855" y="545" font-family="DejaVu Sans,Arial,sans-serif" font-size="28.2" font-weight="700" fill="#263238" text-anchor="start">Durable workflows</text>
<text x="855" y="605" font-family="DejaVu Sans,Arial,sans-serif" font-size="23.5" font-weight="600" fill="#263238" text-anchor="start">queues · checkpoints</text>
<text x="855" y="635" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="400" fill="#263238" text-anchor="start">subagents</text>
<text x="855" y="670" font-family="DejaVu Sans,Arial,sans-serif" font-size="19.6" font-weight="400" fill="#52606d" text-anchor="start">risk: stale state</text>
<text x="855" y="697" font-family="DejaVu Sans,Arial,sans-serif" font-size="19.6" font-weight="400" fill="#52606d" text-anchor="start">duplicate side effects</text>
<text x="800" y="835" font-family="DejaVu Sans,Arial,sans-serif" font-size="28.2" font-weight="700" fill="#263238" text-anchor="middle">Every result belongs to a model + harness + environment triple</text>
</svg>