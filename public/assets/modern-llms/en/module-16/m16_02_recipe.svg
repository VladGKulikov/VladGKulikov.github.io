<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="578" viewBox="0 0 1100 578">
<title>Where vision meets language</title>
<desc>Fusion location changes state layout; equal patch counts do not imply equal KV.</desc>
<rect width="1100" height="578" fill="#FFFFFF"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9 Z" fill="#4C566A"/></marker></defs>
<text x="40" y="52" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="700" fill="#2E3440" text-anchor="start">Where vision meets language</text>
<text x="40" y="97" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" fill="#4C566A" text-anchor="start">Fusion location changes state layout; equal patch counts do not imply equal KV.</text>
<rect x="100" y="132" width="900" height="100" rx="12" fill="#E8EEF5" stroke="#D8DEE9" stroke-width="1.3"/>
<text x="120" y="170" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" fill="#2E3440" text-anchor="start">Pixels → processor → vision encoder</text>
<text x="120" y="209" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" fill="#2E3440" text-anchor="start">Output: N vectors of width D.</text>
<path d="M285,234 L285,257" fill="none" stroke="#4C566A" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="40" y="262" width="490" height="195" rx="12" fill="#E8EEF5" stroke="#D8DEE9" stroke-width="1.3"/>
<text x="60" y="300" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" fill="#2E3440" text-anchor="start">Decoder-stream insertion</text>
<text x="60" y="339" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" fill="#2E3440" text-anchor="start">Projector → visual positions next to text →</text>
<text x="60" y="364" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" fill="#2E3440" text-anchor="start">self-attention → ordinary KV.</text>
<path d="M815,234 L815,257" fill="none" stroke="#4C566A" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="570" y="262" width="490" height="195" rx="12" fill="#E8EEF5" stroke="#D8DEE9" stroke-width="1.3"/>
<text x="590" y="300" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" fill="#2E3440" text-anchor="start">Separate memory</text>
<text x="590" y="339" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" fill="#2E3440" text-anchor="start">Resampler → visual memory → cross-attention in</text>
<text x="590" y="364" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" fill="#2E3440" text-anchor="start">language layers.</text>
<text x="40" y="499" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" fill="#4C566A" text-anchor="start">The 128 KiB/position formula applies only to the declared self-attention geometry.</text>
</svg>
