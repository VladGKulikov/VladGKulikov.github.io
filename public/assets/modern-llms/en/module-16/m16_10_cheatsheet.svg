<text x="473" y="554" font-family="DejaVu Sans,Arial,sans-serif" font-size="28.2" font-weight="700" fill="#263238" text-anchor="start">How is failure</text>
<text x="473" y="579" font-family="DejaVu Sans,Arial,sans-serif" font-size="28.2" font-weight="700" fill="#263238" text-anchor="start">handled?</text>
<text x="473" y="635" font-family="DejaVu Sans,Arial,sans-serif" font-size="23.5" font-weight="600" fill="#52606d" text-anchor="start">verify · retry</text>
<text x="473" y="656" font-family="DejaVu Sans,Arial,sans-serif" font-size="19.6" font-weight="400" fill="#52606d" text-anchor="start">idempotency</text>
