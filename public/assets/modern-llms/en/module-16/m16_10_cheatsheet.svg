<text x="1253" y="505" font-family="DejaVu Sans,Arial,sans-serif" font-size="30" font-weight="700" fill="#17324d" text-anchor="start">8</text>
<text x="1253" y="554" font-family="DejaVu Sans,Arial,sans-serif" font-size="28.2" font-weight="700" fill="#263238" text-anchor="start">What defines</text>
<text x="1253" y="579" font-family="DejaVu Sans,Arial,sans-serif" font-size="28.2" font-weight="700" fill="#263238" text-anchor="start">the score?</text>
<text x="1253" y="635" font-family="DejaVu Sans,Arial,sans-serif" font-size="23.5" font-weight="600" fill="#52606d" text-anchor="start">model · harness</text>
<text x="1253" y="656" font-family="DejaVu Sans,Arial,sans-serif" font-size="19.6" font-weight="400" fill="#52606d" text-anchor="start">environment</text>
<rect x="200" y="785" width="1200" height="70" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<text x="800" y="830" font-family="DejaVu Sans,Arial,sans-serif" font-size="28.2" font-weight="700" fill="#263238" text-anchor="middle">A strong model does not replace system invariants.</text>
