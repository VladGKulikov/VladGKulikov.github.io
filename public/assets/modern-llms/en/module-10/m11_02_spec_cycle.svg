<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560">
<title>Causal verification of one branch</title>
<desc>At each position, p and q use the same history.</desc>
<rect width="1100" height="560" fill="#FFFFFF"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9 Z" fill="#4C566A"/></marker></defs>
<text x="40" y="52" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="700" fill="#2E3440" text-anchor="start">Causal verification of one branch</text>
<text x="40" y="97" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" fill="#4C566A" text-anchor="start">At each position, p and q use the same history.</text>
<rect x="40" y="132" width="320" height="140" rx="12" fill="#E8EEF5" stroke="#D8DEE9" stroke-width="1.3"/>
<text x="60" y="170" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" fill="#2E3440" text-anchor="start">Propose</text>
<text x="60" y="209" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" fill="#2E3440" text-anchor="start">x₁, x₂, x₃ ~ q</text>
<path d="M365,202 L385,202" fill="none" stroke="#4C566A" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="390" y="132" width="320" height="140" rx="12" fill="#E8EEF5" stroke="#D8DEE9" stroke-width="1.3"/>
<text x="410" y="170" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" fill="#2E3440" text-anchor="start">Verify the batch</text>
<text x="410" y="209" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" fill="#2E3440" text-anchor="start">p₁, p₂, p₃, p₄</text>
<path d="M715,202 L735,202" fill="none" stroke="#4C566A" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="740" y="132" width="320" height="140" rx="12" fill="#E8EEF5" stroke="#D8DEE9" stroke-width="1.3"/>
<text x="760" y="170" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" fill="#2E3440" text-anchor="start">Accept left to right</text>
<text x="760" y="209" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" fill="#2E3440" text-anchor="start">u &lt; min(1, p(x)/q(x))</text>
<rect x="40" y="322" width="490" height="160" rx="12" fill="#FAF0E8" stroke="#D8DEE9" stroke-width="1.3"/>
<text x="60" y="360" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" fill="#2E3440" text-anchor="start">First rejection</text>
<text x="60" y="399" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" fill="#2E3440" text-anchor="start">Accepted prefix + a token from r.</text>
<text x="60" y="424" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" fill="#2E3440" text-anchor="start">Roll back the remaining branch and its KV.</text>
<rect x="570" y="322" width="490" height="160" rx="12" fill="#EFF4EA" stroke="#D8DEE9" stroke-width="1.3"/>
<text x="590" y="360" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" fill="#2E3440" text-anchor="start">All accepted</text>
<text x="590" y="399" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" fill="#2E3440" text-anchor="start">All proposals + a token from p₄.</text>
<text x="590" y="424" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" fill="#2E3440" text-anchor="start">EOS and length limits can stop the cycle.</text>
<path d="M900,277 L290,317" fill="none" stroke="#4C566A" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M920,277 L810,317" fill="none" stroke="#4C566A" stroke-width="2" marker-end="url(#arrow)"/>
<text x="40" y="521" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" fill="#4C566A" text-anchor="start">r = positive part of (p − q), normalized by its sum.</text>
</svg>
