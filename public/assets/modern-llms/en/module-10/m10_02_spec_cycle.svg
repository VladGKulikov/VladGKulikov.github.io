<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 330" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <title>The speculative decoding cycle</title>
  <desc>The draft proposes gamma tokens, the target verifies in one forward; accept/resample/bonus.</desc>
  <defs><marker id="a102" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M1 1 L8 4.5 L1 8 Z" fill="#4C566A"/></marker></defs>
  <text x="30" y="30" font-size="23" font-weight="700" fill="#2E3440">One propose–verify cycle (γ = 5)</text>

  <rect x="40" y="56" width="150" height="60" rx="8" fill="#ECEFF4" stroke="#D8DEE9"/>
  <text x="115" y="82" text-anchor="middle" font-size="16.6" font-weight="700" fill="#2E3440">Prefix</text>
  <text x="115" y="100" text-anchor="middle" font-size="12.9" fill="#4C566A">the request context</text>

  <rect x="230" y="56" width="200" height="60" rx="8" fill="#E8EEF5" stroke="#5E81AC" stroke-width="1.3"/>
  <text x="330" y="78" text-anchor="middle" font-size="16.6" font-weight="700" fill="#2E3440">Proposer (cheap)</text>
  <text x="330" y="96" text-anchor="middle" font-size="13.8" fill="#2E3440">autoregressively: t₁ … t₅</text>
  <text x="330" y="110" text-anchor="middle" font-size="12" fill="#4C566A">with its own q(tᵢ)</text>

  <rect x="470" y="56" width="210" height="60" rx="8" fill="#F3EEF3" stroke="#B48EAD" stroke-width="1.3"/>
  <text x="575" y="78" text-anchor="middle" font-size="13" font-weight="700" fill="#2E3440">Target: ONE batched forward</text>
  <text x="575" y="96" text-anchor="middle" font-size="12.9" fill="#2E3440" font-weight="600">γ + 1 positions at once → p(tᵢ)</text>
  <text x="575" y="110" text-anchor="middle" font-size="12" fill="#4C566A">a wider decode operation (§10)</text>

  <rect x="720" y="56" width="180" height="60" rx="8" fill="#EFF4EA" stroke="#A3BE8C" stroke-width="1.3"/>
  <text x="810" y="78" text-anchor="middle" font-size="16.6" font-weight="700" fill="#2E3440">Verification</text>
  <text x="810" y="96" text-anchor="middle" font-size="13.8" fill="#2E3440">left to right</text>
  <text x="810" y="110" text-anchor="middle" font-size="12" fill="#4C566A">up to the first rejection</text>

  <g stroke="#4C566A" stroke-width="1.1">
    <line x1="190" y1="86" x2="226" y2="86" marker-end="url(#a102)"/>
    <line x1="430" y1="86" x2="466" y2="86" marker-end="url(#a102)"/>
    <line x1="680" y1="86" x2="716" y2="86" marker-end="url(#a102)"/>
  </g>

  <rect x="40" y="140" width="420" height="80" rx="12" fill="#EFF4EA" stroke="#A3BE8C"/>
  <text x="58" y="162" font-size="16.6" font-weight="700" fill="#2E3440">The acceptance rule</text>
  <text x="58" y="184" font-size="13" font-family="DejaVu Sans Mono, ui-monospace, Menlo, monospace" fill="#2E3440" font-weight="600">accept tᵢ with probability min(1, p(tᵢ)/q(tᵢ))</text>
  <text x="58" y="206" font-size="11.5" fill="#4C566A">good proposals (p ≥ q) always pass; dubious ones — with chance p/q</text>

  <rect x="480" y="140" width="420" height="80" rx="12" fill="#F8ECEC" stroke="#BF616A"/>
  <text x="498" y="162" font-size="16.6" font-weight="700" fill="#2E3440">The first rejection → correction</text>
  <text x="498" y="184" font-size="13.8" font-family="DejaVu Sans Mono, ui-monospace, Menlo, monospace" fill="#2E3440" font-weight="600">a new token ~ norm((p − q)₊)</text>
  <text x="498" y="206" font-size="10" fill="#4C566A">the mass the draft under-delivered returns — the cycle still emits ≥ 1 token</text>

  <rect x="40" y="236" width="860" height="46" rx="12" fill="#E8EEF5" stroke="#5E81AC"/>
  <text x="58" y="256" font-size="10.2" font-weight="700" fill="#2E3440">All γ accepted → the bonus:</text>
  <text x="230" y="256" font-size="10.1" fill="#2E3440">the target has already computed the next position's distribution — the token comes for free; a cycle emits up to γ + 1 tokens.</text>
  <text x="58" y="272" font-size="11.5" fill="#4C566A">Exact algorithm: every emitted token follows the target distribution p; proposer quality affects speed (§5).</text>

  <text x="30" y="310" font-size="11.5" fill="#2E3440">Scenario cost: γ proposer steps (each a fraction c of a target step) + one verification → S = E / (1 + γc) — §7.</text>
</svg>