<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 330" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <title>The 2026 multiplier stack</title>
  <desc>Quantization, speculation, serving, and architecture reshape the shared bottleneck profile.</desc>
  <defs><marker id="a109" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M1 1 L8 4.5 L1 8 Z" fill="#4C566A"/></marker></defs>
  <text x="30" y="30" font-size="23" font-weight="700" fill="#2E3440">Optimizations interact: find the new bottleneck after every change</text>

  <rect x="40" y="60" width="120" height="66" rx="8" fill="#ECEFF4" stroke="#D8DEE9"/>
  <text x="100" y="88" text-anchor="middle" font-size="16.6" font-weight="700" fill="#2E3440">bf16</text>
  <text x="100" y="106" text-anchor="middle" font-size="10.7" fill="#4C566A">baseline: 209 tok/s</text>

  <g font-size="9" text-anchor="middle">
    <rect x="196" y="60" width="160" height="66" rx="8" fill="#E8EEF5" stroke="#5E81AC" stroke-width="1.2"/>
    <text x="276" y="82" font-weight="700" font-size="16.6" fill="#2E3440">Quantization</text>
    <text x="276" y="100" fill="#2E3440" font-size="13.4" font-weight="600">INT4 / NVFP4 / W4A4</text>
    <text x="276" y="116" fill="#4C566A" font-size="12.7" font-weight="600">ceiling → 744–838 (§11)</text>
    <rect x="392" y="60" width="160" height="66" rx="8" fill="#EFF4EA" stroke="#A3BE8C" stroke-width="1.2"/>
    <text x="472" y="82" font-weight="700" font-size="16.6" fill="#2E3440">Speculation</text>
    <text x="472" y="100" fill="#2E3440" font-size="13.8" font-weight="600">EAGLE-3 / MTP</text>
    <text x="472" y="116" fill="#4C566A" font-size="12">E tokens per read (§7)</text>
    <rect x="588" y="60" width="160" height="66" rx="8" fill="#F3EEF3" stroke="#B48EAD" stroke-width="1.2"/>
    <text x="668" y="82" font-weight="700" font-size="16.6" fill="#2E3440">Serving (M9)</text>
    <text x="668" y="100" fill="#2E3440" font-size="13" font-weight="600">Paged · batching · PD</text>
    <text x="668" y="116" fill="#4C566A" font-size="12">the Goodput machine</text>
    <rect x="784" y="60" width="116" height="66" rx="8" fill="#FAF5E3" stroke="#EBCB8B" stroke-width="1.2"/>
    <text x="842" y="82" font-weight="700" font-size="14.9" fill="#2E3440">Architecture</text>
    <text x="842" y="100" fill="#2E3440" font-size="12.7" font-weight="600">MLA · DSA (M4)</text>
    <text x="842" y="116" fill="#4C566A" font-size="12">KV bytes down</text>
  </g>
  <g stroke="#4C566A" stroke-width="1.1">
    <line x1="160" y1="93" x2="192" y2="93" marker-end="url(#a109)"/>
    <line x1="356" y1="93" x2="388" y2="93" marker-end="url(#a109)"/>
    <line x1="552" y1="93" x2="584" y2="93" marker-end="url(#a109)"/>
    <line x1="748" y1="93" x2="780" y2="93" marker-end="url(#a109)"/>
  </g>

  <rect x="40" y="150" width="530" height="90" rx="12" fill="#EFF4EA" stroke="#A3BE8C" stroke-width="1.4"/>
  <text x="58" y="174" font-size="16.6" font-weight="700" fill="#2E3440">Joint arithmetic scenario: an NVFP4-like payload plus MTP</text>
  <text x="58" y="198" font-size="13.8" font-family="DejaVu Sans Mono, ui-monospace, Menlo, monospace" fill="#2E3440" font-weight="600">1.875 / 1.05 × BW / 4.50 GB (4.19 GiB) = 1,329 tok/s</text>
  <text x="58" y="220" font-size="11.2" fill="#2E3440" font-weight="600"><tspan font-weight="700">×6.3</tspan> over the M9 baseline — the funnel's top: the KV tax and overheads will eat a share</text>

  <rect x="590" y="150" width="310" height="90" rx="12" fill="#FAF0E8" stroke="#D08770"/>
  <text x="608" y="174" font-size="13.8" font-weight="700" fill="#2E3440">Re-profile the combined system</text>
  <text x="608" y="196" font-size="11.5" fill="#2E3440">multipliers from isolated tests</text>
  <text x="608" y="214" font-size="11.5" fill="#2E3440">are not independent;</text>
  <text x="608" y="232" font-size="11.5" fill="#4C566A">remeasure TTFT, ITL, and goodput</text>

  <rect x="40" y="256" width="860" height="42" rx="8" fill="#ECEFF4" stroke="#D8DEE9"/>
  <text x="58" y="276" font-size="10" fill="#2E3440"><tspan font-weight="700">Compatibility:</tspan> the §4 verify guarantee holds with respect to the QUANTIZED model; an MTP head quantized by the same pipeline loses less than external drafters.</text>
  <text x="58" y="292" font-size="11.5" fill="#4C566A">QLoRA: a frozen four-bit base plus higher-precision adapters; a fine-tuning memory method, not speculative inference</text>
</svg>