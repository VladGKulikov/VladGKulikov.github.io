<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 380" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <title>The drafter taxonomy</title>
  <desc>A separate model, heads on the target, model-free, the MTP self-draft; the red zone of inapplicability.</desc>
  <text x="30" y="30" font-size="23" font-weight="700" fill="#2E3440">Where proposals come from: four families</text>

  <rect x="40" y="52" width="205" height="176" rx="8" fill="#ECEFF4" stroke="#D8DEE9"/>
  <text x="58" y="76" font-size="16.6" font-weight="700" fill="#2E3440">A separate model</text>
  <g font-size="9" fill="#2E3440">
    <text x="58" y="98" font-size="9.1">a small model proposes for a larger one</text>
    <text x="58" y="116" fill="#4C566A" font-size="11.5">simple and compatible, but:</text>
    <text x="58" y="134" font-size="13.8" font-weight="600">· a second weight stack</text>
    <text x="58" y="152" font-size="13.8" font-weight="600">· distribution mismatch</text>
    <text x="58" y="176" fill="#4C566A" font-size="11.5">a clear reference design;</text>
    <text x="58" y="192" fill="#4C566A" font-size="11.5">useful with a compatible</text>
    <text x="58" y="208" fill="#4C566A" font-size="11.5">tokenizer and artifact</text>
  </g>

  <rect x="260" y="52" width="215" height="176" rx="8" fill="#E8EEF5" stroke="#5E81AC" stroke-width="1.3"/>
  <text x="278" y="76" font-size="13" font-weight="700" fill="#2E3440">Heads and learned proposers</text>
  <g font-size="9" fill="#2E3440">
    <text x="278" y="98" font-size="13.8">Medusa: parallel heads,</text>
    <text x="278" y="114" fill="#4C566A" font-size="11.5">a candidate tree at verification</text>
    <text x="278" y="134" font-size="9.3">EAGLE: proposals from target features</text>
    <text x="278" y="154" font-weight="700" font-size="9">EAGLE-3: direct tokens + feature fusion</text>
    <text x="278" y="172">authors report up to 6.5× in tested settings;</text>
    <text x="278" y="188" font-size="10.6">the number requires remeasurement</text>
    <text x="278" y="204" font-size="11.5">on another engine and workload</text>
    <text x="278" y="220" fill="#4C566A">requires a compatible proposer checkpoint</text>
  </g>

  <rect x="490" y="52" width="205" height="176" rx="8" fill="#FAF5E3" stroke="#EBCB8B"/>
  <text x="508" y="76" font-size="16.6" font-weight="700" fill="#2E3440">No model at all</text>
  <g font-size="9" fill="#2E3440">
    <text x="508" y="98" font-size="11.4" font-weight="600">n-gram / suffix: find a pattern</text>
    <text x="508" y="114" font-size="11.5">in context, propose its tail</text>
    <text x="508" y="132" fill="#4C566A" font-size="9.9">no neural proposer; useful for code</text>
    <text x="508" y="148" fill="#4C566A" font-size="11.5">and literal text repetition</text>
    <text x="508" y="172" font-size="11.5">Lookahead: Jacobi iterations</text>
    <text x="508" y="188" font-size="11.5">of parallel decoding</text>
    <text x="508" y="208" fill="#4C566A" font-size="11.5">with no draft at all</text>
  </g>

  <rect x="710" y="52" width="190" height="176" rx="8" fill="#EFF4EA" stroke="#A3BE8C" stroke-width="1.4"/>
  <text x="728" y="76" font-size="16.6" font-weight="700" fill="#2E3440">Native MTP</text>
  <g font-size="9" fill="#2E3440">
    <text x="728" y="98" font-weight="600">future-token prediction modules (M8)</text>
    <text x="728" y="114" font-size="11.5">can serve as a proposer</text>
    <text x="728" y="134" font-weight="700" font-size="9.6">no separate full draft checkpoint</text>
    <text x="728" y="152" font-size="11.5">acceptance and cost remain</text>
    <text x="728" y="168" font-size="13.8" font-weight="600">workload-dependent</text>
    <text x="728" y="190" fill="#4C566A" font-size="9.2">supported by current engines → §9;</text>
    <text x="728" y="206" fill="#4C566A" font-size="10.4">configuration is model-specific</text>
  </g>

  <rect x="40" y="248" width="860" height="76" rx="12" fill="#F8ECEC" stroke="#BF616A" stroke-width="1.2"/>
  <text x="58" y="272" font-size="16.6" font-weight="700" fill="#2E3440">When speculation may fail to pay for itself (Q2)</text>
  <g font-size="9.5" fill="#2E3440">
    <text x="58" y="294" font-size="11.5">low acceptance · expensive proposal · high concurrency that already saturates target compute ·</text>
    <text x="58" y="312" font-size="11.5">short outputs with little repetition · tokenizer mismatch · inefficient verification; there is no universal numeric cutoff</text>
  </g>

  <text x="30" y="352" font-size="11.5" fill="#2E3440">The formula criterion: S &lt; 1 when E &lt; 1 + γc — a low α or an expensive draft turns the accelerator into a brake (§7);</text>
  <text x="30" y="368" font-size="11.5" fill="#2E3440">the main use case is memory-bound, medium-to-low-QPS inference where ITL matters.</text>
</svg>