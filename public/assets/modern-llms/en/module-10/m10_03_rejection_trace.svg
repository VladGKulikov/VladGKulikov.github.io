<svg viewBox="0 0 940 320" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <title>The rejection trace</title>
  <desc>A table of p, q, acceptance probabilities and the residual; alpha and the componentwise unbiasedness balance.</desc>
  <text x="30" y="30" font-size="23" font-weight="700" fill="#2E3440">Worked example A: unbiasedness by number (a 5-token vocabulary)</text>

  <rect x="40" y="52" width="620" height="168" rx="12" fill="#ECEFF4" stroke="#D8DEE9"/>
  <g font-family="DejaVu Sans Mono, ui-monospace, Menlo, monospace" font-size="10.5" fill="#2E3440">
    <text x="60" y="78" font-size="13.8" font-weight="600">token            0      1      2      3      4</text>
    <line x1="60" y1="86" x2="640" y2="86" stroke="#D8DEE9" stroke-width="0.8"/>
    <text x="60" y="106" font-size="13.8" font-weight="600">p (target)     0.40   0.30   0.15   0.10   0.05</text>
    <text x="60" y="128" font-size="13.8" font-weight="600">q (draft)      0.25   0.35   0.20   0.10   0.10</text>
    <text x="60" y="150" font-size="13.8" font-weight="600">min(1, p/q)    <tspan fill="#A3BE8C" font-weight="700">1</tspan>      0.857  0.75   <tspan fill="#A3BE8C" font-weight="700">1</tspan>      0.5</text>
    <text x="60" y="172" font-size="13.8" font-weight="600">(p − q)₊       <tspan fill="#D08770" font-weight="700">0.15</tspan>   0      0      0      0</text>
    <text x="60" y="194" font-size="13.8" font-weight="600">min(p,q)+0.15·resid = <tspan font-weight="700">0.40   0.30   0.15   0.10   0.05  = p ✓</tspan></text>
  </g>

  <rect x="680" y="52" width="220" height="168" rx="8" fill="#EFF4EA" stroke="#A3BE8C" stroke-width="1.2"/>
  <text x="698" y="76" font-size="16.6" font-weight="700" fill="#2E3440">What this shows</text>
  <g font-size="9" fill="#2E3440">
    <text x="698" y="98" font-size="13.8" font-weight="600">α = Σ min(p, q) = <tspan font-weight="700">0.85</tspan></text>
    <text x="698" y="116" fill="#4C566A" font-size="13.8" font-weight="600">= 1 − TV(p, q): acceptance</text>
    <text x="698" y="132" fill="#4C566A" font-size="11.5">measures distribution closeness</text>
    <text x="698" y="156" font-size="11.5">the residual → token 0: all</text>
    <text x="698" y="172" font-size="10.8">the mass the draft under-delivered</text>
    <text x="698" y="196" fill="#4C566A" font-size="11.5">E(0.85, γ=4) = 3.71 tok/cycle (§6)</text>
  </g>

  <rect x="40" y="236" width="860" height="48" rx="12" fill="#E8EEF5" stroke="#5E81AC"/>
  <text x="58" y="256" font-size="10.9" font-weight="700" fill="#2E3440">The unbiasedness balance:</text>
  <text x="235" y="256" font-size="10.2" fill="#2E3440">P(emit t) = min(pₜ, qₜ) + (1 − α)·residₜ ≡ pₜ — componentwise; a “rejection” is not lost but converted into a correction sample.</text>
  <text x="58" y="274" font-size="11.5" fill="#4C566A">course verification holds this as an assert and confirms it by a 20,000-cycle Monte Carlo (§14)</text>

  <text x="898" y="310" font-size="9.7" font-style="italic" fill="#4C566A" text-anchor="end">the scheme — Leviathan et al., arXiv 2211.17192; course-verified values</text>
</svg>
