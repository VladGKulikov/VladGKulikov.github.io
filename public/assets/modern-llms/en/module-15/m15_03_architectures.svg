<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<rect width="1600" height="900" fill="#F7F9FC"/>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#7B8794"/></marker></defs>
<text x="70" y="72" font-family="DejaVu Sans,Arial,sans-serif" font-size="39.1" font-weight="700" fill="#263238" text-anchor="start"><tspan x="70" dy="0">Where query and document are allowed to interact</tspan></text>
<text x="70" y="112" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="400" fill="#5F6B78" text-anchor="start"><tspan x="70" dy="0">Expressiveness is paid for with query-time compute or index size</tspan></text>
<rect x="70" y="205" width="450" height="500" rx="22" fill="#FFFFFF" stroke="#C7D0DC" stroke-width="2"/>
<rect x="70" y="205" width="450" height="8" rx="4" fill="#3D6FB6"/>
<text x="102" y="253" font-family="DejaVu Sans,Arial,sans-serif" font-size="29" font-weight="700" fill="#263238" text-anchor="start"><tspan x="102" dy="0">Bi-encoder</tspan></text>
<text x="102" y="305.22" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="400" fill="#5F6B78" text-anchor="start"><tspan x="102" dy="0">One query vector</tspan><tspan x="102" dy="31.28">One document vector</tspan><tspan x="102" dy="31.28">Fast corpus-wide search</tspan><tspan x="102" dy="31.28">Token structure compressed away</tspan></text>
<rect x="575" y="205" width="450" height="500" rx="22" fill="#FFFFFF" stroke="#C7D0DC" stroke-width="2"/>
<rect x="575" y="205" width="450" height="8" rx="4" fill="#B85B5B"/>
<text x="607" y="253" font-family="DejaVu Sans,Arial,sans-serif" font-size="29" font-weight="700" fill="#263238" text-anchor="start"><tspan x="607" dy="0">Cross-encoder</tspan></text>
<text x="607" y="305.22" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="400" fill="#5F6B78" text-anchor="start"><tspan x="607" dy="0">Joint pair encoding</tspan><tspan x="607" dy="31.28">Fine token interaction</tspan><tspan x="607" dy="31.28">Score cannot be precomputed</tspan><tspan x="607" dy="31.28">Use on a bounded list</tspan></text>
<rect x="1080" y="205" width="450" height="500" rx="22" fill="#FFFFFF" stroke="#C7D0DC" stroke-width="2"/>
<rect x="1080" y="205" width="450" height="8" rx="4" fill="#7B5BA7"/>
<text x="1112" y="253" font-family="DejaVu Sans,Arial,sans-serif" font-size="29" font-weight="700" fill="#263238" text-anchor="start"><tspan x="1112" dy="0">Late interaction</tspan></text>
<text x="1112" y="305.22" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="400" fill="#5F6B78" text-anchor="start"><tspan x="1112" dy="0">Many document vectors</tspan><tspan x="1112" dy="31.28">Token-level MaxSim score</tspan><tspan x="1112" dy="31.28">Documents encoded in advance</tspan><tspan x="1112" dy="31.28">Substantially larger index</tspan></text>
<line x1="520" y1="455" x2="563" y2="455" stroke="#7B8794" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="1025" y1="455" x2="1068" y2="455" stroke="#7B8794" stroke-width="3" marker-end="url(#arrow)"/>
<text x="295" y="760" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="400" fill="#5F6B78" text-anchor="middle"><tspan x="295" dy="0">early compression</tspan></text>
<text x="800" y="760" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="400" fill="#5F6B78" text-anchor="middle"><tspan x="800" dy="0">full interaction</tspan></text>
<text x="1305" y="760" font-family="DejaVu Sans,Arial,sans-serif" font-size="23.5" font-weight="600" fill="#5F6B78" text-anchor="middle"><tspan x="1305" dy="0">multi-vector compromise</tspan></text>
</svg>
