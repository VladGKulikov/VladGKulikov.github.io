<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="539" viewBox="0 0 1100 539">
<title>R1: shared base, different training stages</title>
<desc>R1-Zero omits reasoning SFT; it still starts from a pretrained model.</desc>
<rect width="1100" height="539" fill="#FFFFFF"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9 Z" fill="#4C566A"/></marker></defs>
<text x="40" y="52" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="700" fill="#2E3440" text-anchor="start">R1: shared base, different training stages</text>
<text x="40" y="97" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" fill="#4C566A" text-anchor="start">R1-Zero omits reasoning SFT; it still starts from a pretrained model.</text>
<rect x="140" y="132" width="820" height="110" rx="12" fill="#E8EEF5" stroke="#D8DEE9" stroke-width="1.3"/>
<text x="160" y="170" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" fill="#2E3440" text-anchor="start">DeepSeek-V3-Base</text>
<text x="160" y="209" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" fill="#2E3440" text-anchor="start">Pretrained language representations.</text>
<path d="M390,244 L290,284" fill="none" stroke="#4C566A" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M710,244 L810,284" fill="none" stroke="#4C566A" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="40" y="287" width="495" height="185" rx="12" fill="#F3EEF3" stroke="#D8DEE9" stroke-width="1.3"/>
<text x="60" y="325" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" fill="#2E3440" text-anchor="start">R1-Zero</text>
<text x="60" y="364" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" fill="#2E3440" text-anchor="start">RL with verifiable rewards.</text>
<text x="60" y="389" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" fill="#2E3440" text-anchor="start">Self-checking, with readability problems.</text>
<rect x="565" y="287" width="495" height="185" rx="12" fill="#EFF4EA" stroke="#D8DEE9" stroke-width="1.3"/>
<text x="585" y="325" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" fill="#2E3440" text-anchor="start">DeepSeek-R1</text>
<text x="585" y="364" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" fill="#2E3440" text-anchor="start">Cold-start SFT → RL → sampled data; V3-Base →</text>
<text x="585" y="389" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" fill="#2E3440" text-anchor="start">SFT on these data → broader RL.</text>
</svg>
