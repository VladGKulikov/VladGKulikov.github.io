<svg viewBox="0 0 900 440" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <title>The BPE trace: six merges</title>
  <desc>Six BPE training steps on the toy corpus with exact frequencies: letters assembled from bytes and the birth of the « л» chunk.</desc>
  <defs><marker id="a23" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1 L9 5 L1 9 Z" fill="#4C566A"/></marker></defs>
  <text x="30" y="30" font-size="22" font-weight="700" fill="#2E3440">The BPE trace: how tokens are born (course-verified frequencies)</text>
  <text x="30" y="52" font-size="13.2" fill="#4C566A">corpus: <tspan font-family="ui-monospace, Menlo, monospace" fill="#2E3440">«низко низко летали ласточки, ласточки летали низко»</tspan> · pre-tok: 8 chunks · start: 93 bytes</text>

  <!-- -->
  <g font-size="9.5" font-weight="700" fill="#4C566A">
    <text x="50" y="86" font-size="15.9" font-weight="700">STEP</text><text x="130" y="86" font-size="15.9" font-weight="700">MERGED PAIR</text><text x="470" y="86" font-size="12.5" font-weight="700">FREQUENCY</text><text x="580" y="86" font-size="15.9" font-weight="700">NEW TOKEN</text>
  </g>
  <line x1="40" y1="94" x2="860" y2="94" stroke="#D8DEE9" stroke-width="1"/>

  <g font-family="ui-monospace, Menlo, monospace" font-size="11">
    <!-- -->
    <text x="55" y="122" fill="#2E3440" font-size="13.2" font-weight="600">1</text>
    <rect x="130" y="106" width="52" height="24" rx="4" fill="#ECEFF4" stroke="#D8DEE9"/><text x="156" y="122" text-anchor="middle" fill="#4C566A" font-size="13.2" font-weight="600">D0</text>
    <text x="192" y="122" fill="#4C566A" font-size="13.2" font-weight="600">+</text>
    <rect x="206" y="106" width="52" height="24" rx="4" fill="#ECEFF4" stroke="#D8DEE9"/><text x="232" y="122" text-anchor="middle" fill="#4C566A" font-size="13.2" font-weight="600">B8</text>
    <text x="485" y="122" fill="#2E3440" font-size="13.2" font-weight="600">7</text>
    <line x1="530" y1="118" x2="566" y2="118" stroke="#4C566A" stroke-width="1" marker-end="url(#a23)"/>
    <rect x="580" y="106" width="52" height="24" rx="4" fill="#EFF4EA" stroke="#A3BE8C" stroke-width="1.5"/><text x="606" y="122" text-anchor="middle" fill="#2E3440" font-size="13.2" font-weight="600">и</text>
    <text x="648" y="122" font-family="inherit" font-size="13.2" fill="#4C566A" font-weight="600">← a letter assembled from halves</text>

    <text x="55" y="166" fill="#2E3440" font-size="13.2" font-weight="600">2</text>
    <rect x="130" y="150" width="52" height="24" rx="4" fill="#ECEFF4" stroke="#D8DEE9"/><text x="156" y="166" text-anchor="middle" fill="#2E3440" font-size="13.2" font-weight="600">' '</text>
    <text x="192" y="166" fill="#4C566A" font-size="13.2" font-weight="600">+</text>
    <rect x="206" y="150" width="52" height="24" rx="4" fill="#ECEFF4" stroke="#D8DEE9"/><text x="232" y="166" text-anchor="middle" fill="#4C566A" font-size="13.2" font-weight="600">D0</text>
    <text x="485" y="166" fill="#2E3440" font-size="13.2" font-weight="600">6</text>
    <line x1="530" y1="162" x2="566" y2="162" stroke="#4C566A" stroke-width="1" marker-end="url(#a23)"/>
    <rect x="580" y="150" width="76" height="24" rx="4" fill="#FAF5E3" stroke="#EBCB8B" stroke-width="1.5"/><text x="618" y="166" text-anchor="middle" font-size="13.2" fill="#4C566A" font-weight="600">20·D0</text>
    <text x="672" y="166" font-family="inherit" font-size="12.2" fill="#4C566A" font-weight="600">← an "ugly": space + half a letter</text>

    <text x="55" y="210" fill="#2E3440" font-size="13.2" font-weight="600">3</text>
    <rect x="130" y="194" width="52" height="24" rx="4" fill="#ECEFF4" stroke="#D8DEE9"/><text x="156" y="210" text-anchor="middle" fill="#4C566A" font-size="13.2" font-weight="600">D0</text>
    <text x="192" y="210" fill="#4C566A" font-size="13.2" font-weight="600">+</text>
    <rect x="206" y="194" width="52" height="24" rx="4" fill="#ECEFF4" stroke="#D8DEE9"/><text x="232" y="210" text-anchor="middle" fill="#4C566A" font-size="13.2" font-weight="600">BA</text>
    <text x="485" y="210" fill="#2E3440" font-size="13.2" font-weight="600">5</text>
    <line x1="530" y1="206" x2="566" y2="206" stroke="#4C566A" stroke-width="1" marker-end="url(#a23)"/>
    <rect x="580" y="194" width="52" height="24" rx="4" fill="#EFF4EA" stroke="#A3BE8C" stroke-width="1.5"/><text x="606" y="210" text-anchor="middle" fill="#2E3440" font-size="13.2" font-weight="600">к</text>

    <text x="55" y="254" fill="#2E3440" font-size="13.2" font-weight="600">4</text>
    <rect x="130" y="238" width="52" height="24" rx="4" fill="#ECEFF4" stroke="#D8DEE9"/><text x="156" y="254" text-anchor="middle" fill="#4C566A" font-size="13.2" font-weight="600">D0</text>
    <text x="192" y="254" fill="#4C566A" font-size="13.2" font-weight="600">+</text>
    <rect x="206" y="238" width="52" height="24" rx="4" fill="#ECEFF4" stroke="#D8DEE9"/><text x="232" y="254" text-anchor="middle" fill="#4C566A" font-size="13.2" font-weight="600">BE</text>
    <text x="485" y="254" fill="#2E3440" font-size="13.2" font-weight="600">5</text>
    <line x1="530" y1="250" x2="566" y2="250" stroke="#4C566A" stroke-width="1" marker-end="url(#a23)"/>
    <rect x="580" y="238" width="52" height="24" rx="4" fill="#EFF4EA" stroke="#A3BE8C" stroke-width="1.5"/><text x="606" y="254" text-anchor="middle" fill="#2E3440" font-size="13.2" font-weight="600">о</text>

    <text x="55" y="298" fill="#2E3440" font-size="13.2" font-weight="600">5</text>
    <rect x="130" y="282" width="76" height="24" rx="4" fill="#FAF5E3" stroke="#EBCB8B"/><text x="168" y="298" text-anchor="middle" font-size="13.2" fill="#4C566A" font-weight="600">20·D0</text>
    <text x="216" y="298" fill="#4C566A" font-size="13.2" font-weight="600">+</text>
    <rect x="230" y="282" width="52" height="24" rx="4" fill="#ECEFF4" stroke="#D8DEE9"/><text x="256" y="298" text-anchor="middle" fill="#4C566A" font-size="13.2" font-weight="600">BB</text>
    <text x="485" y="298" fill="#2E3440" font-size="13.2" font-weight="600">4</text>
    <line x1="530" y1="294" x2="566" y2="294" stroke="#4C566A" stroke-width="1" marker-end="url(#a23)"/>
    <rect x="580" y="282" width="60" height="24" rx="4" fill="#EFF4EA" stroke="#A3BE8C" stroke-width="1.5"/><text x="610" y="298" text-anchor="middle" fill="#2E3440" font-size="13.2" font-weight="600">' л'</text>
    <text x="656" y="298" font-family="inherit" font-size="11.6" fill="#4C566A" font-weight="600">← the future « летали», « ласточки»</text>

    <text x="55" y="342" fill="#2E3440" font-size="13.2" font-weight="600">6</text>
    <rect x="130" y="326" width="60" height="24" rx="4" fill="#EFF4EA" stroke="#A3BE8C"/><text x="160" y="342" text-anchor="middle" fill="#2E3440" font-size="13.2" font-weight="600">' л'</text>
    <text x="200" y="342" fill="#4C566A" font-size="13.2" font-weight="600">+</text>
    <rect x="214" y="326" width="52" height="24" rx="4" fill="#ECEFF4" stroke="#D8DEE9"/><text x="240" y="342" text-anchor="middle" fill="#4C566A" font-size="13.2" font-weight="600">D0</text>
    <text x="485" y="342" fill="#2E3440" font-size="13.2" font-weight="600">4</text>
    <line x1="530" y1="338" x2="566" y2="338" stroke="#4C566A" stroke-width="1" marker-end="url(#a23)"/>
    <rect x="580" y="326" width="96" height="24" rx="4" fill="#FAF5E3" stroke="#EBCB8B" stroke-width="1.5"/><text x="628" y="342" text-anchor="middle" font-size="13.2" fill="#4C566A" font-weight="600">' л'+D0</text>
  </g>

  <line x1="40" y1="368" x2="860" y2="368" stroke="#D8DEE9" stroke-width="1"/>
  <text x="30" y="394" font-size="11" fill="#2E3440">After six steps: <tspan font-weight="700">93 bytes → 62 tokens</tspan>; the vocabulary honestly passes through a stage of "junk" intermediate tokens —</text>
  <text x="30" y="412" font-size="11" fill="#2E3440">they fall out of use once longer merges appear, yet stay in the vocabulary forever (undertrained tokens, §10).</text>
</svg>
