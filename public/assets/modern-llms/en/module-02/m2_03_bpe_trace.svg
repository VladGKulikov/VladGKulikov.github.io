<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="632" viewBox="0 0 1100 632">
<title>Six merges: 93 bytes → 62 tokens</title>
<desc>низко низко летали ласточки, ласточки летали низко</desc>
<rect width="1100" height="632" fill="#FFFFFF"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9 Z" fill="#4C566A"/></marker></defs>
<text x="40" y="52" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="700" fill="#2E3440" text-anchor="start">Six merges: 93 bytes → 62 tokens</text>
<text x="40" y="97" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" fill="#4C566A" text-anchor="start">низко низко летали ласточки, ласточки летали низко</text>
<rect x="40.0" y="132" width="498.0" height="124" rx="12" fill="#E8EEF5" stroke="#D8DEE9" stroke-width="1.3"/>
<text x="64.0" y="176" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" fill="#2E3440" text-anchor="start">1. D0 + B8 → 256</text>
<text x="64.0" y="217" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" fill="#4C566A" text-anchor="start">7 × · и</text>
<rect x="562.0" y="132" width="498.0" height="124" rx="12" fill="#ECEFF4" stroke="#D8DEE9" stroke-width="1.3"/>
<text x="586.0" y="176" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" fill="#2E3440" text-anchor="start">2. 20 + D0 → 257</text>
<text x="586.0" y="217" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" fill="#4C566A" text-anchor="start">6 × · space + a letter prefix</text>
<rect x="40.0" y="280" width="498.0" height="124" rx="12" fill="#EFF4EA" stroke="#D8DEE9" stroke-width="1.3"/>
<text x="64.0" y="324" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" fill="#2E3440" text-anchor="start">3. D0 + BA → 258</text>
<text x="64.0" y="365" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" fill="#4C566A" text-anchor="start">5 × · к</text>
<rect x="562.0" y="280" width="498.0" height="124" rx="12" fill="#FAF0E8" stroke="#D8DEE9" stroke-width="1.3"/>
<text x="586.0" y="324" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" fill="#2E3440" text-anchor="start">4. D0 + BE → 259</text>
<text x="586.0" y="365" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" fill="#4C566A" text-anchor="start">5 × · о</text>
<rect x="40.0" y="428" width="498.0" height="124" rx="12" fill="#F3EEF3" stroke="#D8DEE9" stroke-width="1.3"/>
<text x="64.0" y="472" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" fill="#2E3440" text-anchor="start">5. 257 + BB → 260</text>
<text x="64.0" y="513" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" fill="#4C566A" text-anchor="start">4 × · space + л</text>
<rect x="562.0" y="428" width="498.0" height="124" rx="12" fill="#FAF5E3" stroke="#D8DEE9" stroke-width="1.3"/>
<text x="586.0" y="472" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" fill="#2E3440" text-anchor="start">6. 260 + D0 → 261</text>
<text x="586.0" y="513" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" fill="#4C566A" text-anchor="start">4 × · “ л” + the next letter’s prefix</text>
<text x="40" y="593" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" fill="#4C566A" text-anchor="start">Base bytes use hex; IDs from 256 use decimal. An individual token may contain only part of a letter.</text>
</svg>
