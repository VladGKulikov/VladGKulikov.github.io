<svg viewBox="0 0 940 400" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <title>The KV compression map</title>
  <desc>Four approaches with figures, the sheet's eviction trace and the four-layer rule.</desc>
  <text x="30" y="30" font-size="23" font-weight="700" fill="#2E3440">Compress without losing: four approaches to the KV contents</text>

  <rect x="40" y="52" width="212" height="150" rx="8" fill="#F8ECEC" stroke="#BF616A" stroke-width="1.2"/>
  <text x="58" y="74" font-size="16.6" font-weight="700" fill="#2E3440">1 · Eviction</text>
  <g font-size="9" fill="#2E3440">
    <text x="58" y="96" font-size="11.4">StreamingLLM: sink-4 + a window</text>
    <text x="58" y="112" fill="#4C566A" font-size="11.5">10–20× · a blind rule</text>
    <text x="58" y="132" font-size="11.5">H2O: min accumulated mass</text>
    <text x="58" y="148" font-size="11.5">SnapKV: an observation window</text>
    <text x="58" y="164" fill="#4C566A" font-size="11.5">5–10× · QUEST: query-aware</text>
    <text x="58" y="186" fill="#BF616A" font-weight="600" font-size="13.8">tokens are lost forever</text>
  </g>

  <rect x="268" y="52" width="212" height="150" rx="8" fill="#E8EEF5" stroke="#5E81AC" stroke-width="1.2"/>
  <text x="286" y="74" font-size="16.6" font-weight="700" fill="#2E3440">2 · Quantization</text>
  <g font-size="9" fill="#2E3440">
    <text x="286" y="96" font-size="13.8">KIVI 2-bit: per-channel K,</text>
    <text x="286" y="112" font-size="11.4" font-weight="600">per-token V · merged into vLLM</text>
    <text x="286" y="132" font-size="11.5">KVQuant 3-bit pre-RoPE (10M)</text>
    <text x="286" y="152" font-weight="700" font-size="12.7">TurboQuant (ICLR'26): 3 bits,</text>
    <text x="286" y="168" font-weight="600" font-size="12">2.7× of the info limit, ≥6× / 8×,</text>
    <text x="286" y="186" fill="#4C566A" font-size="10.2" font-weight="600">data-oblivious · the ceiling 101→174</text>
  </g>

  <rect x="496" y="52" width="212" height="150" rx="8" fill="#EFF4EA" stroke="#A3BE8C" stroke-width="1.2"/>
  <text x="514" y="74" font-size="16.6" font-weight="700" fill="#2E3440">3 · Low-rank</text>
  <g font-size="9" fill="#2E3440">
    <text x="514" y="96" font-size="13.8" font-weight="600">Palu / LoRC: post hoc</text>
    <text x="514" y="116" font-weight="600" font-size="13.8">MLA (V2): 93.3% savings —</text>
    <text x="514" y="132" font-size="11.5">an architectural decision,</text>
    <text x="514" y="148" fill="#4C566A" font-size="11.5">not post-hoc compression;</text>
    <text x="514" y="168" fill="#4C566A" font-size="11.5">the “architecture ↔</text>
    <text x="514" y="184" fill="#4C566A" font-size="9.4">compression” line is blurred on purpose</text>
  </g>

  <rect x="724" y="52" width="176" height="150" rx="8" fill="#F3EEF3" stroke="#B48EAD" stroke-width="1.2"/>
  <text x="742" y="74" font-size="14.1" font-weight="700" fill="#2E3440">4 · Latent (frontier)</text>
  <g font-size="9" fill="#2E3440">
    <text x="742" y="96" font-size="12.1">Attention Matching: 50×</text>
    <text x="742" y="116" font-size="11.5">TriAttention: 10.7×</text>
    <text x="742" y="132" fill="#4C566A" font-size="11.5">on AIME25 at matched</text>
    <text x="742" y="148" fill="#4C566A" font-size="10.9" font-weight="600">accuracy · research-stage</text>
  </g>

  <rect x="40" y="218" width="560" height="98" rx="12" fill="#ECEFF4" stroke="#D8DEE9"/>
  <text x="58" y="240" font-size="16.6" font-weight="700" fill="#2E3440">The sheet's eviction trace (16 tokens, budget 8, seed 7)</text>
  <g font-family="DejaVu Sans Mono, ui-monospace, Menlo, monospace" font-size="9.5" fill="#2E3440">
    <text x="58" y="262" font-size="13.8" font-weight="600">H2O (top-8 by mass):      {0, 1, 2, 5, 7, 8, 14, 15}</text>
    <text x="58" y="282" font-size="13.8" font-weight="600">StreamingLLM (4 + 4):     {0, 1, 2, 3, 12, 13, 14, 15}</text>
    <text x="58" y="302" font-size="13.8" font-weight="600">the blind rule loses the heavy hitters: <tspan fill="#BF616A" font-weight="700">{5, 7, 8}</tspan></text>
  </g>

  <rect x="620" y="218" width="280" height="98" rx="8" fill="#FAF5E3" stroke="#EBCB8B"/>
  <text x="638" y="240" font-size="16.6" font-weight="700" fill="#2E3440">Two warnings of 2026</text>
  <g font-size="9" fill="#2E3440">
    <text x="638" y="262" font-size="11.5">reasoning models are eviction-sensitive</text>
    <text x="638" y="278" fill="#4C566A" font-size="11.5">(2512.12008: H2O/SnapKV > StreamingLLM)</text>
    <text x="638" y="296" font-size="11.3">protecting prompt boundaries beats scoring</text>
    <text x="638" y="310" fill="#4C566A" font-size="11.5">(2605.18053: the attribution is a confound)</text>
  </g>

  <rect x="40" y="332" width="860" height="46" rx="12" fill="#EFF4EA" stroke="#A3BE8C" stroke-width="1.3"/>
  <text x="58" y="352" font-size="12.1" font-weight="700" fill="#2E3440">The 2026 four-layer rule:</text>
  <text x="250" y="352" font-size="9.9" fill="#2E3440">(1) architecture: MLA/DSA → the GQA baseline · (2) quantization: FP8/NVFP4 for weights + 3-bit TurboQuant for the cache ·</text>
  <text x="58" y="370" font-size="11.5" fill="#2E3440">(3) storage: LMCache/Mooncake → DRAM/NVMe · (4) eviction — only when the budget leaves no choice (Q8).</text>
</svg>
