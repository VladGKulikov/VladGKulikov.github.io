<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="963" viewBox="0 0 1100 963">
<title>A document passes through several decisions</title>
<desc>Filter order changes rejection attribution; retain stage counts</desc>
<rect width="1100" height="963" fill="#FFFFFF"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9 Z" fill="#4C566A"/></marker></defs>
<text x="40" y="52" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="700" fill="#2E3440" text-anchor="start">A document passes through several decisions</text>
<text x="40" y="97" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" fill="#4C566A" text-anchor="start">Filter order changes rejection attribution; retain stage counts</text>
<rect x="170" y="132" width="890" height="130" rx="12" fill="#E8EEF5" stroke="#D8DEE9" stroke-width="1.3"/>
<text x="190" y="170" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" fill="#2E3440" text-anchor="start">1. Extraction and language</text>
<text x="190" y="209" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" fill="#2E3440" text-anchor="start">Content rather than navigation; language-specific calibration.</text>
<path d="M125,197 L125,287" fill="none" stroke="#4C566A" stroke-width="2" marker-end="url(#arrow)"/>
<text x="45" y="205" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="700" fill="#2E3440" text-anchor="start">1</text>
<rect x="170" y="287" width="890" height="130" rx="12" fill="#E8EEF5" stroke="#D8DEE9" stroke-width="1.3"/>
<text x="190" y="325" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" fill="#2E3440" text-anchor="start">2. Heuristics</text>
<text x="190" y="364" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" fill="#2E3440" text-anchor="start">Repetition, broken text, boilerplate.</text>
<path d="M125,352 L125,442" fill="none" stroke="#4C566A" stroke-width="2" marker-end="url(#arrow)"/>
<text x="45" y="360" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="700" fill="#2E3440" text-anchor="start">2</text>
<rect x="170" y="442" width="890" height="130" rx="12" fill="#E8EEF5" stroke="#D8DEE9" stroke-width="1.3"/>
<text x="190" y="480" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" fill="#2E3440" text-anchor="start">3. Duplicates</text>
<text x="190" y="519" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" fill="#2E3440" text-anchor="start">Shingles → MinHash/LSH candidates → retention policy.</text>
<path d="M125,507 L125,597" fill="none" stroke="#4C566A" stroke-width="2" marker-end="url(#arrow)"/>
<text x="45" y="515" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="700" fill="#2E3440" text-anchor="start">3</text>
<rect x="170" y="597" width="890" height="130" rx="12" fill="#E8EEF5" stroke="#D8DEE9" stroke-width="1.3"/>
<text x="190" y="635" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" fill="#2E3440" text-anchor="start">4. Quality and admissibility</text>
<text x="190" y="674" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" fill="#2E3440" text-anchor="start">Learning value; separately, policy and personal data.</text>
<path d="M125,662 L125,752" fill="none" stroke="#4C566A" stroke-width="2" marker-end="url(#arrow)"/>
<text x="45" y="670" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="700" fill="#2E3440" text-anchor="start">4</text>
<rect x="170" y="752" width="890" height="130" rx="12" fill="#EFF4EA" stroke="#D8DEE9" stroke-width="1.3"/>
<text x="190" y="790" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" fill="#2E3440" text-anchor="start">5. Mixture</text>
<text x="190" y="829" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" fill="#2E3440" text-anchor="start">Domain shares × budget → presentations and effective epochs.</text>
<text x="45" y="825" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="700" fill="#2E3440" text-anchor="start">5</text>
<text x="40" y="924" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" fill="#4C566A" text-anchor="start">Candidate pool, filtered corpus, and run-token count are distinct quantities.</text>
</svg>
