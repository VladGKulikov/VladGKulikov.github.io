<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="528" viewBox="0 0 1100 528">
<title>Two successive residual updates</title>
<desc>Pre-LN: the FFN reads the state after the attention update.</desc>
<rect width="1100" height="528" fill="#FFFFFF"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9 Z" fill="#4C566A"/></marker></defs>
<text x="40" y="52" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="700" fill="#2E3440" text-anchor="start">Two successive residual updates</text>
<text x="40" y="97" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" fill="#4C566A" text-anchor="start">Pre-LN: the FFN reads the state after the attention update.</text>
<rect x="40" y="192" width="130" height="64" rx="12" fill="#EFF4EA" stroke="#D8DEE9" stroke-width="1.3"/>
<text x="105.0" y="229" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="600" fill="#2E3440" text-anchor="middle">h</text>
<rect x="235" y="192" width="150" height="64" rx="12" fill="#E8EEF5" stroke="#D8DEE9" stroke-width="1.3"/>
<text x="310.0" y="229" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="600" fill="#2E3440" text-anchor="middle">N₁</text>
<rect x="450" y="192" width="200" height="64" rx="12" fill="#F3EEF3" stroke="#D8DEE9" stroke-width="1.3"/>
<text x="550.0" y="229" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="600" fill="#2E3440" text-anchor="middle">Attention</text>
<rect x="725" y="192" width="90" height="64" rx="12" fill="#FAF0E8" stroke="#D8DEE9" stroke-width="1.3"/>
<text x="770.0" y="229" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="600" fill="#2E3440" text-anchor="middle">+</text>
<rect x="880" y="192" width="180" height="64" rx="12" fill="#EFF4EA" stroke="#D8DEE9" stroke-width="1.3"/>
<text x="970.0" y="229" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="600" fill="#2E3440" text-anchor="middle">h′</text>
<path d="M170,224 L235,224" fill="none" stroke="#4C566A" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M385,224 L450,224" fill="none" stroke="#4C566A" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M650,224 L725,224" fill="none" stroke="#4C566A" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M815,224 L880,224" fill="none" stroke="#4C566A" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M105,192 L105,150" fill="none" stroke="#4C566A" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M105,150 L770,150" fill="none" stroke="#4C566A" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M770,150 L770,192" fill="none" stroke="#4C566A" stroke-width="2" marker-end="url(#arrow)"/>
<text x="255" y="133" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" fill="#4C566A" text-anchor="start">Direct state path</text>
<rect x="40" y="382" width="130" height="64" rx="12" fill="#EFF4EA" stroke="#D8DEE9" stroke-width="1.3"/>
<text x="105.0" y="419" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="600" fill="#2E3440" text-anchor="middle">h′</text>
<rect x="235" y="382" width="150" height="64" rx="12" fill="#E8EEF5" stroke="#D8DEE9" stroke-width="1.3"/>
<text x="310.0" y="419" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="600" fill="#2E3440" text-anchor="middle">N₂</text>
<rect x="450" y="382" width="200" height="64" rx="12" fill="#F3EEF3" stroke="#D8DEE9" stroke-width="1.3"/>
<text x="550.0" y="419" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="600" fill="#2E3440" text-anchor="middle">FFN</text>
<rect x="725" y="382" width="90" height="64" rx="12" fill="#FAF0E8" stroke="#D8DEE9" stroke-width="1.3"/>
<text x="770.0" y="419" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="600" fill="#2E3440" text-anchor="middle">+</text>
<rect x="880" y="382" width="180" height="64" rx="12" fill="#EFF4EA" stroke="#D8DEE9" stroke-width="1.3"/>
<text x="970.0" y="419" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="600" fill="#2E3440" text-anchor="middle">h⁺</text>
<path d="M170,414 L235,414" fill="none" stroke="#4C566A" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M385,414 L450,414" fill="none" stroke="#4C566A" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M650,414 L725,414" fill="none" stroke="#4C566A" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M815,414 L880,414" fill="none" stroke="#4C566A" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M105,382 L105,340" fill="none" stroke="#4C566A" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M105,340 L770,340" fill="none" stroke="#4C566A" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M770,340 L770,382" fill="none" stroke="#4C566A" stroke-width="2" marker-end="url(#arrow)"/>
<text x="255" y="323" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" fill="#4C566A" text-anchor="start">Direct state path</text>
<text x="40" y="489" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" fill="#4C566A" text-anchor="start">h′ = h + Attention(N₁(h)) → h⁺ = h′ + FFN(N₂(h′))</text>
</svg>
