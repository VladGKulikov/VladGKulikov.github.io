<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="640" viewBox="0 0 1100 640">
<title>How a document assistant prepares an answer</title>
<desc>Teaching question: how long should an experiment log be kept?</desc>
<rect width="1100" height="640" fill="#FFFFFF"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9 Z" fill="#4C566A"/></marker></defs>
<text x="40" y="52" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="700" fill="#2E3440" text-anchor="start">How a document assistant prepares an answer</text>
<text x="40" y="97" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" fill="#4C566A" text-anchor="start">Teaching question: how long should an experiment log be kept?</text>
<rect x="40" y="132" width="310" height="172" rx="12" fill="#E8EEF5" stroke="#D8DEE9" stroke-width="1.3"/>
<text x="64" y="174" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" fill="#2E3440" text-anchor="start">Documents</text>
<text x="64" y="215" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" fill="#2E3440" text-anchor="start">A: log — 30 days</text>
<text x="64" y="240" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" fill="#2E3440" text-anchor="start">B: export — 7 days</text>
<rect x="395" y="132" width="310" height="172" rx="12" fill="#EFF4EA" stroke="#D8DEE9" stroke-width="1.3"/>
<text x="419" y="174" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" fill="#2E3440" text-anchor="start">1. Retrieval</text>
<text x="419" y="215" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" fill="#2E3440" text-anchor="start">Select the passage about</text>
<text x="419" y="240" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" fill="#2E3440" text-anchor="start">logs: document A.</text>
<rect x="750" y="132" width="310" height="172" rx="12" fill="#F3EEF3" stroke="#D8DEE9" stroke-width="1.3"/>
<text x="774" y="174" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" fill="#2E3440" text-anchor="start">2. Model</text>
<text x="774" y="215" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" fill="#2E3440" text-anchor="start">Read the question and</text>
<text x="774" y="240" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" fill="#2E3440" text-anchor="start">passage A. Prepare a</text>
<text x="774" y="265" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" fill="#2E3440" text-anchor="start">response.</text>
<path d="M359,218 L384,218" fill="none" stroke="#4C566A" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M714,218 L739,218" fill="none" stroke="#4C566A" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="750" y="356" width="310" height="172" rx="12" fill="#F3EEF3" stroke="#D8DEE9" stroke-width="1.3"/>
<text x="774" y="398" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" fill="#2E3440" text-anchor="start">Candidate answer</text>
<text x="774" y="439" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" fill="#2E3440" text-anchor="start">“30 days”, citing document</text>
<text x="774" y="464" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" fill="#2E3440" text-anchor="start">A.</text>
<rect x="395" y="356" width="310" height="172" rx="12" fill="#FAF0E8" stroke="#D8DEE9" stroke-width="1.3"/>
<text x="419" y="398" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" fill="#2E3440" text-anchor="start">3. Acceptance check</text>
<text x="419" y="439" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" fill="#2E3440" text-anchor="start">Is the number correct?</text>
<text x="419" y="464" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" fill="#2E3440" text-anchor="start">Does the quoted passage</text>
<text x="419" y="489" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" fill="#2E3440" text-anchor="start">support this answer?</text>
<rect x="40" y="356" width="310" height="172" rx="12" fill="#EFF4EA" stroke="#D8DEE9" stroke-width="1.3"/>
<text x="64" y="398" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" fill="#2E3440" text-anchor="start">Accepted answer</text>
<text x="64" y="439" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" fill="#2E3440" text-anchor="start">Both checks passed.</text>
<text x="64" y="464" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" fill="#2E3440" text-anchor="start">Otherwise the response is</text>
<text x="64" y="489" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" fill="#2E3440" text-anchor="start">not accepted.</text>
<path d="M905,314 L905,346" fill="none" stroke="#4C566A" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M740,442 L715,442" fill="none" stroke="#4C566A" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M385,442 L360,442" fill="none" stroke="#4C566A" stroke-width="2" marker-end="url(#arrow)"/>
<text x="40" y="577" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" fill="#4C566A" text-anchor="start">Fictional documents. “7 days, A” gives the wrong period; “30 days, B” lacks support. A manual reference check is not a</text>
<text x="40" y="601" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" fill="#4C566A" text-anchor="start">general semantic judge.</text>
</svg>
