<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 410" width="920" height="410">
  <title>How to use the reference module</title>
  <desc>Two routes: readers who already know the basic Transformer proceed directly to Module 1, while newcomers complete four anchor steps and then return to the core track.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M1 1 L9 5 L1 9 Z" fill="#4C566A"/>
    </marker>
    <marker id="arrBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M1 1 L9 5 L1 9 Z" fill="#5E81AC"/>
    </marker>
  </defs>
  <text x="460.0" y="28" text-anchor="middle" font-family="DejaVu Sans, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="600" fill="#2E3440">How to use the reference module</text>
  <rect x="45" y="105" width="190" height="96" rx="7" fill="#ECEFF4" stroke="#B48EAD" stroke-width="1.5"/>
  <text x="140" y="135" text-anchor="middle" font-family="DejaVu Sans, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" fill="#2E3440">
    <tspan x="140" dy="0" font-weight="600">Can you sketch</tspan>
    <tspan x="140" dy="19" font-weight="600">a Transformer from memory?</tspan>
  </text>
  <line x1="235" y1="153" x2="325" y2="105" stroke="#A3BE8C" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="272" y="120" text-anchor="middle" font-family="DejaVu Sans, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="600" fill="#A3BE8C">yes</text>
  <rect x="325" y="62" width="250" height="85" rx="7" fill="#FFFFFF" stroke="#A3BE8C" stroke-width="1.5"/>
  <text x="450" y="91" text-anchor="middle" font-family="DejaVu Sans, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" fill="#2E3440">
    <tspan x="450" dy="0" font-weight="600">You may skip M18</tspan>
    <tspan x="450" dy="19" font-weight="600">or keep it as a refresher</tspan>
  </text>
  <line x1="575" y1="104" x2="715" y2="104" stroke="#A3BE8C" stroke-width="1.2" marker-end="url(#arr)"/>
  <rect x="715" y="62" width="160" height="85" rx="7" fill="#ECEFF4" stroke="#A3BE8C" stroke-width="1.5"/>
  <text x="795" y="91" text-anchor="middle" font-family="DejaVu Sans, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="700" fill="#2E3440">
    <tspan x="795" dy="0" font-weight="700">Module 1</tspan>
    <tspan x="795" dy="19" font-weight="700">core track</tspan>
  </text>
  <line x1="235" y1="170" x2="325" y2="218" stroke="#D08770" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="273" y="205" text-anchor="middle" font-family="DejaVu Sans, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="600" fill="#D08770">no</text>
  <rect x="325" y="190" width="120" height="78" rx="7" fill="#FFFFFF" stroke="#5E81AC" stroke-width="1.5"/>
  <text x="385" y="220" text-anchor="middle" font-family="DejaVu Sans, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="600" fill="#2E3440">
    <tspan x="385" dy="0" font-weight="600">Tokens +</tspan>
    <tspan x="385" dy="16" font-weight="600">positions</tspan>
  </text>
  <rect x="475" y="190" width="120" height="78" rx="7" fill="#FFFFFF" stroke="#88C0D0" stroke-width="1.5"/>
  <text x="535" y="220" text-anchor="middle" font-family="DejaVu Sans, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="600" fill="#2E3440">
    <tspan x="535" dy="0" font-weight="600">Q, K, V +</tspan>
    <tspan x="535" dy="16" font-weight="600">attention</tspan>
  </text>
  <rect x="625" y="190" width="120" height="78" rx="7" fill="#FFFFFF" stroke="#B48EAD" stroke-width="1.5"/>
  <text x="685" y="220" text-anchor="middle" font-family="DejaVu Sans, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="600" fill="#2E3440">
    <tspan x="685" dy="0" font-weight="600">Residual +</tspan>
    <tspan x="685" dy="16" font-weight="600">Norm + FFN</tspan>
  </text>
  <rect x="775" y="190" width="120" height="78" rx="7" fill="#FFFFFF" stroke="#D08770" stroke-width="1.5"/>
  <text x="835" y="220" text-anchor="middle" font-family="DejaVu Sans, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="600" fill="#2E3440">
    <tspan x="835" dy="0" font-weight="600">Training +</tspan>
    <tspan x="835" dy="16" font-weight="600">generation</tspan>
  </text>
  <line x1="445" y1="229" x2="475" y2="229" stroke="#4C566A" stroke-width="1.2" marker-end="url(#arr)"/>
  <line x1="595" y1="229" x2="625" y2="229" stroke="#4C566A" stroke-width="1.2" marker-end="url(#arr)"/>
  <line x1="745" y1="229" x2="775" y2="229" stroke="#4C566A" stroke-width="1.2" marker-end="url(#arr)"/>
  <line x1="835" y1="268" x2="835" y2="320" stroke="#A3BE8C" stroke-width="1.2" marker-end="url(#arr)"/>
  <rect x="650" y="320" width="225" height="55" rx="7" fill="#ECEFF4" stroke="#A3BE8C" stroke-width="1.5"/>
  <text x="762" y="343" text-anchor="middle" font-family="DejaVu Sans, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="600" fill="#2E3440">
    <tspan x="762" dy="0" font-weight="600">Return to Module 1</tspan>
    <tspan x="762" dy="16" font-weight="600">with no hidden entry barrier</tspan>
  </text>
  <text x="45" y="390" text-anchor="start" font-family="DejaVu Sans, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9" font-weight="400" fill="#4C566A" font-style="italic">Reference status means “read out of order,” not “safe to misunderstand.”</text>
</svg>
