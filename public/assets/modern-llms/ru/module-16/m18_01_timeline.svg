<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="924" viewBox="0 0 1100 924">
<title>Как расширялся агентный цикл</title>
<desc>Каждый слой добавляет возможности и собственные границы.</desc>
<rect width="1100" height="924" fill="#FFFFFF"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9 Z" fill="#4C566A"/></marker></defs>
<text x="40" y="52" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="700" fill="#2E3440" text-anchor="start">Как расширялся агентный цикл</text>
<text x="40" y="97" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" fill="#4C566A" text-anchor="start">Каждый слой добавляет возможности и собственные границы.</text>
<text x="40" y="171" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" fill="#2E3440" text-anchor="start">2022</text>
<rect x="225" y="132" width="835" height="124" rx="12" fill="#E8EEF5" stroke="#D8DEE9" stroke-width="1.3"/>
<text x="245" y="170" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" fill="#2E3440" text-anchor="start">ReAct</text>
<text x="245" y="209" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" fill="#2E3440" text-anchor="start">Рассуждение → действие → новое наблюдение.</text>
<path d="M195,202 L195,274" fill="none" stroke="#4C566A" stroke-width="2" marker-end="url(#arrow)"/>
<text x="40" y="319" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" fill="#2E3440" text-anchor="start">2023</text>
<rect x="225" y="280" width="835" height="124" rx="12" fill="#E8EEF5" stroke="#D8DEE9" stroke-width="1.3"/>
<text x="245" y="318" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" fill="#2E3440" text-anchor="start">Структурированный вывод</text>
<text x="245" y="357" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" fill="#2E3440" text-anchor="start">Грамматика и схема ограничивают форму вызова.</text>
<path d="M195,350 L195,422" fill="none" stroke="#4C566A" stroke-width="2" marker-end="url(#arrow)"/>
<text x="40" y="467" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" fill="#2E3440" text-anchor="start">2024</text>
<rect x="225" y="428" width="835" height="124" rx="12" fill="#E8EEF5" stroke="#D8DEE9" stroke-width="1.3"/>
<text x="245" y="466" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" fill="#2E3440" text-anchor="start">CodeAct / SWE-agent</text>
<text x="245" y="505" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" fill="#2E3440" text-anchor="start">Язык действий и интерфейс влияют на результат.</text>
<path d="M195,498 L195,570" fill="none" stroke="#4C566A" stroke-width="2" marker-end="url(#arrow)"/>
<text x="40" y="615" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" fill="#2E3440" text-anchor="start">2024–26</text>
<rect x="225" y="576" width="835" height="124" rx="12" fill="#E8EEF5" stroke="#D8DEE9" stroke-width="1.3"/>
<text x="245" y="614" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" fill="#2E3440" text-anchor="start">MCP</text>
<text x="245" y="653" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" fill="#2E3440" text-anchor="start">Общий протокол доступа к внешним возможностям.</text>
<path d="M195,646 L195,718" fill="none" stroke="#4C566A" stroke-width="2" marker-end="url(#arrow)"/>
<text x="40" y="763" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" fill="#2E3440" text-anchor="start">2025–26</text>
<rect x="225" y="724" width="835" height="124" rx="12" fill="#E8EEF5" stroke="#D8DEE9" stroke-width="1.3"/>
<text x="245" y="762" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" fill="#2E3440" text-anchor="start">Долговечное выполнение</text>
<text x="245" y="801" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" fill="#2E3440" text-anchor="start">Состояние, полномочия, контрольные точки и делегирование.</text>
</svg>
