<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="578" viewBox="0 0 1100 578">
<title>Где зрение встречается с языком</title>
<desc>Две точки слияния создают разную память; одинаковое число патчей не означает одинаковый KV.</desc>
<rect width="1100" height="578" fill="#FFFFFF"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9 Z" fill="#4C566A"/></marker></defs>
<text x="40" y="52" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="700" fill="#2E3440" text-anchor="start">Где зрение встречается с языком</text>
<text x="40" y="97" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" fill="#4C566A" text-anchor="start">Две точки слияния создают разную память; одинаковое число патчей не означает одинаковый KV.</text>
<rect x="100" y="132" width="900" height="100" rx="12" fill="#E8EEF5" stroke="#D8DEE9" stroke-width="1.3"/>
<text x="120" y="170" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" fill="#2E3440" text-anchor="start">Пиксели → процессор → визуальный энкодер</text>
<text x="120" y="209" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" fill="#2E3440" text-anchor="start">Результат: N векторов ширины D.</text>
<path d="M285,234 L285,257" fill="none" stroke="#4C566A" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="40" y="262" width="490" height="195" rx="12" fill="#E8EEF5" stroke="#D8DEE9" stroke-width="1.3"/>
<text x="60" y="300" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" fill="#2E3440" text-anchor="start">Вставка в декодер</text>
<text x="60" y="339" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" fill="#2E3440" text-anchor="start">Проектор → визуальные позиции рядом с</text>
<text x="60" y="364" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" fill="#2E3440" text-anchor="start">текстом → self-attention → обычный KV.</text>
<path d="M815,234 L815,257" fill="none" stroke="#4C566A" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="570" y="262" width="490" height="195" rx="12" fill="#E8EEF5" stroke="#D8DEE9" stroke-width="1.3"/>
<text x="590" y="300" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" fill="#2E3440" text-anchor="start">Отдельная память</text>
<text x="590" y="339" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" fill="#2E3440" text-anchor="start">Ресемплер → визуальная память →</text>
<text x="590" y="364" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" fill="#2E3440" text-anchor="start">cross-attention в языковых слоях.</text>
<text x="40" y="499" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" fill="#4C566A" text-anchor="start">Формула 128 KiB/позицию относится только к объявленной геометрии self-attention.</text>
</svg>
