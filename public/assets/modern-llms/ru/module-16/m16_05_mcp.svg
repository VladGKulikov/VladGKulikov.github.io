<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#718096"/></marker></defs>
<rect width="1600" height="900" fill="#ffffff"/>
<text x="60" y="72" font-family="DejaVu Sans,Arial,sans-serif" font-size="39.1" font-weight="700" fill="#17324d">MCP стандартизирует соединение; доверие остаётся у хоста</text>
<rect x="70" y="175" width="430" height="430" rx="18" fill="#e8f1fb" stroke="#cbd5e1" stroke-width="2"/>
<rect x="610" y="235" width="380" height="315" rx="18" fill="#eaf7ef" stroke="#cbd5e1" stroke-width="2"/>
<rect x="1080" y="175" width="450" height="430" rx="18" fill="#f2ecfb" stroke="#cbd5e1" stroke-width="2"/>
<text x="285" y="240" font-family="DejaVu Sans,Arial,sans-serif" font-size="31" font-weight="700" fill="#263238" text-anchor="middle">Хост</text>
<text x="110" y="315" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="400" fill="#263238" text-anchor="start">• пользовательская сессия</text>
<text x="110" y="370" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="400" fill="#263238" text-anchor="start">• политика и подтверждения</text>
<text x="110" y="425" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="400" fill="#263238" text-anchor="start">• версии схем и журнал</text>
<text x="800" y="295" font-family="DejaVu Sans,Arial,sans-serif" font-size="28" font-weight="700" fill="#263238" text-anchor="middle">MCP-клиент</text>
<text x="650" y="370" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="400" fill="#263238" text-anchor="start">соединение</text>
<text x="650" y="413" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="400" fill="#263238" text-anchor="start">маршрутизация</text>
<text x="650" y="456" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="400" fill="#263238" text-anchor="start">сообщения</text>
<text x="1305" y="240" font-family="DejaVu Sans,Arial,sans-serif" font-size="30" font-weight="700" fill="#263238" text-anchor="middle">MCP-сервер</text>
<text x="1120" y="315" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="400" fill="#263238" text-anchor="start">• инструменты / ресурсы</text>
<text x="1120" y="354" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="400" fill="#263238" text-anchor="start">• промпты</text>
<text x="1120" y="393" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="400" fill="#263238" text-anchor="start">• внешние данные</text>
<text x="1120" y="432" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="400" fill="#263238" text-anchor="start">  и действия</text>
<text x="1120" y="471" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="400" fill="#263238" text-anchor="start">• собственная зона доверия</text>
<line x1="500" y1="390" x2="595" y2="390" stroke="#718096" stroke-width="3" marker-end="url(#arrow)"/>
<text x="547.5" y="380.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="20.4" font-weight="400" fill="#52606d" text-anchor="middle">протокол</text>
<line x1="990" y1="390" x2="1065" y2="390" stroke="#718096" stroke-width="3" marker-end="url(#arrow)"/>
<text x="1027.5" y="380.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="20.4" font-weight="400" fill="#52606d" text-anchor="middle">протокол</text>
<rect x="145" y="670" width="1310" height="145" rx="18" fill="#fdecec" stroke="#cbd5e1" stroke-width="2"/>
<text x="800" y="715" font-family="DejaVu Sans,Arial,sans-serif" font-size="28.2" font-weight="700" fill="#263238" text-anchor="middle">MCP не решает: стоит ли вызывать инструмент;</text>
<text x="800" y="742" font-family="DejaVu Sans,Arial,sans-serif" font-size="28.2" font-weight="700" fill="#263238" text-anchor="middle">имеет ли пользователь право; безопасно ли исполнение.</text>
<text x="800" y="787" font-family="DejaVu Sans,Arial,sans-serif" font-size="20.4" font-weight="400" fill="#52606d" text-anchor="middle">Эти инварианты проверяют хост и исполняющая обвязка.</text>
</svg>