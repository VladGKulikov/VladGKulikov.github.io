<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="661" viewBox="0 0 1100 661">
<title>Thinker–Talker: входное время и выходной темп</title>
<desc>TMRoPE размещает события; ARIA согласует текст и речевые коды в Qwen3.5-Omni.</desc>
<rect width="1100" height="661" fill="#FFFFFF"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9 Z" fill="#4C566A"/></marker></defs>
<text x="40" y="52" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="700" fill="#2E3440" text-anchor="start">Thinker–Talker: входное время и выходной темп</text>
<text x="40" y="97" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" fill="#4C566A" text-anchor="start">TMRoPE размещает события; ARIA согласует текст и речевые коды в Qwen3.5-Omni.</text>
<rect x="60" y="132" width="980" height="120" rx="12" fill="#E8EEF5" stroke="#D8DEE9" stroke-width="1.3"/>
<text x="80" y="170" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" fill="#2E3440" text-anchor="start">Энкодеры → Thinker</text>
<text x="80" y="209" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" fill="#2E3440" text-anchor="start">Мультимодальные признаки → общий контекст → текст и скрытые состояния.</text>
<path d="M550,255 L550,286" fill="none" stroke="#4C566A" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="60" y="294" width="980" height="115" rx="12" fill="#E8EEF5" stroke="#D8DEE9" stroke-width="1.3"/>
<text x="80" y="332" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" fill="#2E3440" text-anchor="start">Talker</text>
<text x="80" y="371" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" fill="#2E3440" text-anchor="start">Скрытые состояния и текст → поток дискретных аудиокодов.</text>
<path d="M285,416 L285,439" fill="none" stroke="#4C566A" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="40" y="444" width="490" height="140" rx="12" fill="#E8EEF5" stroke="#D8DEE9" stroke-width="1.3"/>
<text x="60" y="482" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" fill="#2E3440" text-anchor="start">Qwen2.5-Omni</text>
<text x="60" y="521" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" fill="#2E3440" text-anchor="start">Скользящий DiT → фрагменты звука.</text>
<path d="M815,416 L815,439" fill="none" stroke="#4C566A" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="570" y="444" width="490" height="140" rx="12" fill="#E8EEF5" stroke="#D8DEE9" stroke-width="1.3"/>
<text x="590" y="482" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" fill="#2E3440" text-anchor="start">Qwen3.5-Omni</text>
<text x="590" y="521" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" fill="#2E3440" text-anchor="start">RVQ + MTP → причинная ConvNet → звук.</text>
</svg>
