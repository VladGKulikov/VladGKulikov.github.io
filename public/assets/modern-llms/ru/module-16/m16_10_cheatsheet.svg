<text x="83" y="635" font-family="DejaVu Sans,Arial,sans-serif" font-size="23.5" font-weight="600" fill="#52606d" text-anchor="start">кэш · память</text>
<text x="83" y="656" font-family="DejaVu Sans,Arial,sans-serif" font-size="19.6" font-weight="400" fill="#52606d" text-anchor="start">контрольные точки</text>
<rect x="435" y="450" width="350" height="245" rx="18" fill="#fdecec" stroke="#cbd5e1" stroke-width="2"/>
<text x="473" y="505" font-family="DejaVu Sans,Arial,sans-serif" font-size="30" font-weight="700" fill="#17324d" text-anchor="start">6</text>
<text x="473" y="554" font-family="DejaVu Sans,Arial,sans-serif" font-size="28.2" font-weight="700" fill="#263238" text-anchor="start">Как ловится</text>
<text x="473" y="579" font-family="DejaVu Sans,Arial,sans-serif" font-size="28.2" font-weight="700" fill="#263238" text-anchor="start">ошибка?</text>
<text x="473" y="635" font-family="DejaVu Sans,Arial,sans-serif" font-size="23.5" font-weight="600" fill="#52606d" text-anchor="start">проверка · повтор</text>
<text x="473" y="656" font-family="DejaVu Sans,Arial,sans-serif" font-size="19.6" font-weight="400" fill="#52606d" text-anchor="start">идемпотентность</text>
<rect x="825" y="450" width="350" height="245" rx="18" fill="#e8f1fb" stroke="#cbd5e1" stroke-width="2"/>
<text x="863" y="505" font-family="DejaVu Sans,Arial,sans-serif" font-size="30" font-weight="700" fill="#17324d" text-anchor="start">7</text>
<text x="863" y="554" font-family="DejaVu Sans,Arial,sans-serif" font-size="28.2" font-weight="700" fill="#263238" text-anchor="start">Что можно</text>
<text x="863" y="579" font-family="DejaVu Sans,Arial,sans-serif" font-size="28.2" font-weight="700" fill="#263238" text-anchor="start">распараллелить?</text>
<text x="863" y="635" font-family="DejaVu Sans,Arial,sans-serif" font-size="19.6" font-weight="400" fill="#52606d" text-anchor="start">граф зависимостей</text>
<text x="863" y="656" font-family="DejaVu Sans,Arial,sans-serif" font-size="19.6" font-weight="400" fill="#52606d" text-anchor="start">слияние</text>
<rect x="1215" y="450" width="350" height="245" rx="18" fill="#eaf7ef" stroke="#cbd5e1" stroke-width="2"/>
<text x="1253" y="505" font-family="DejaVu Sans,Arial,sans-serif" font-size="30" font-weight="700" fill="#17324d" text-anchor="start">8</text>
<text x="1253" y="554" font-family="DejaVu Sans,Arial,sans-serif" font-size="28.2" font-weight="700" fill="#263238" text-anchor="start">Что входит</text>
<text x="1253" y="579" font-family="DejaVu Sans,Arial,sans-serif" font-size="28.2" font-weight="700" fill="#263238" text-anchor="start">в оценку?</text>
<text x="1253" y="635" font-family="DejaVu Sans,Arial,sans-serif" font-size="23.5" font-weight="600" fill="#52606d" text-anchor="start">модель · обвязка</text>
<text x="1253" y="656" font-family="DejaVu Sans,Arial,sans-serif" font-size="19.6" font-weight="400" fill="#52606d" text-anchor="start">среда</text>
<rect x="200" y="785" width="1200" height="70" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<text x="800" y="830" font-family="DejaVu Sans,Arial,sans-serif" font-size="28.2" font-weight="700" fill="#263238" text-anchor="middle">Сильная модель не компенсирует отсутствие системных инвариантов.</text>
