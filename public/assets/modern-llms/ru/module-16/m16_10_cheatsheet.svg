<text x="863" y="244" font-family="DejaVu Sans,Arial,sans-serif" font-size="28.2" font-weight="700" fill="#263238" text-anchor="start">Что проверяется</text>
<text x="863" y="269" font-family="DejaVu Sans,Arial,sans-serif" font-size="28.2" font-weight="700" fill="#263238" text-anchor="start">до запуска?</text>
<text x="863" y="325" font-family="DejaVu Sans,Arial,sans-serif" font-size="23.5" font-weight="600" fill="#52606d" text-anchor="start">грамматика · схема</text>
<text x="863" y="346" font-family="DejaVu Sans,Arial,sans-serif" font-size="19.6" font-weight="400" fill="#52606d" text-anchor="start">полномочия</text>
<rect x="1215" y="140" width="350" height="245" rx="18" fill="#f2ecfb" stroke="#cbd5e1" stroke-width="2"/>
