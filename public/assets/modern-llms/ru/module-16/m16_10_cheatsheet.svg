<text x="473" y="325" font-family="DejaVu Sans,Arial,sans-serif" font-size="23.5" font-weight="600" fill="#52606d" text-anchor="start">функция · план · код</text>
<rect x="825" y="140" width="350" height="245" rx="18" fill="#fff5df" stroke="#cbd5e1" stroke-width="2"/>
