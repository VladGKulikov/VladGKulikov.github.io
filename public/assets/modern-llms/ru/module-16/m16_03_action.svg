<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#718096"/></marker></defs>
<rect width="1600" height="900" fill="#ffffff"/>
<text x="60" y="72" font-family="DejaVu Sans,Arial,sans-serif" font-size="39.1" font-weight="700" fill="#17324d">Три способа выразить следующий шаг</text>
<rect x="50" y="145" width="480" height="570" rx="18" fill="#e8f1fb" stroke="#cbd5e1" stroke-width="2"/>
<text x="290" y="220" font-family="DejaVu Sans,Arial,sans-serif" font-size="29" font-weight="700" fill="#263238" text-anchor="middle">ReAct</text>
<text x="92" y="315" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="400" fill="#263238" text-anchor="start">• действие после каждого</text>
<text x="92" y="354" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="400" fill="#263238" text-anchor="start">  наблюдения</text>
<text x="92" y="393" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="400" fill="#263238" text-anchor="start">• высокая адаптивность</text>
<text x="92" y="432" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="400" fill="#263238" text-anchor="start">• больше обменов и</text>
<text x="92" y="471" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="400" fill="#263238" text-anchor="start">  длиннее история</text>
<rect x="560" y="145" width="480" height="570" rx="18" fill="#eaf7ef" stroke="#cbd5e1" stroke-width="2"/>
<text x="800" y="220" font-family="DejaVu Sans,Arial,sans-serif" font-size="29" font-weight="700" fill="#263238" text-anchor="middle">Plan-and-Execute</text>
<text x="602" y="315" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="400" fill="#263238" text-anchor="start">• явный список обязательств</text>
<text x="602" y="354" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="400" fill="#263238" text-anchor="start">• план можно проверить</text>
<text x="602" y="393" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="400" fill="#263238" text-anchor="start">  заранее</text>
<text x="602" y="432" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="400" fill="#263238" text-anchor="start">• перепланирование при</text>
<text x="602" y="471" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="400" fill="#263238" text-anchor="start">  неожиданном результате</text>
<rect x="1070" y="145" width="480" height="570" rx="18" fill="#fff5df" stroke="#cbd5e1" stroke-width="2"/>
<text x="1310" y="220" font-family="DejaVu Sans,Arial,sans-serif" font-size="29" font-weight="700" fill="#263238" text-anchor="middle">CodeAct</text>
<text x="1112" y="315" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="400" fill="#263238" text-anchor="start">• циклы и условия внутри кода</text>
<text x="1112" y="354" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="400" fill="#263238" text-anchor="start">• композиция в одном</text>
<text x="1112" y="393" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="400" fill="#263238" text-anchor="start">  действии</text>
<text x="1112" y="432" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="400" fill="#263238" text-anchor="start">• обязательна настоящая</text>
<text x="1112" y="471" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="400" fill="#263238" text-anchor="start">  песочница</text>
<rect x="165" y="750" width="1270" height="105" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<text x="800" y="793" font-family="DejaVu Sans,Arial,sans-serif" font-size="23.5" font-weight="600" fill="#263238" text-anchor="middle">Учебный сценарий CodeAct: 450 → 160 токенов (2.8125×);</text>
<text x="800" y="822" font-family="DejaVu Sans,Arial,sans-serif" font-size="23.5" font-weight="600" fill="#263238" text-anchor="middle">5 → 1 переход (5×). Это не сравнение методов на тестовом стенде.</text>
</svg>