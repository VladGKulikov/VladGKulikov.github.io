<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 502" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <title>Источники черновых предложений</title>
  <desc>Отдельная модель, дополнительные головы, поиск повторов и нативный MTP; условия, при которых метод может не окупиться.</desc>
  <text x="30" y="30" font-size="23" font-weight="700" fill="#2E3440">Откуда берутся предложения: четыре семейства</text>

  <rect x="40" y="52" width="205" height="270" rx="12" fill="#ECEFF4" stroke="#D8DEE9"/>
  <text x="58" y="76" font-size="16.6" font-weight="700" fill="#2E3440">Отдельная модель</text>
  <g font-size="9" fill="#2E3440">
    <text x="58" y="98">маленькая модель предлагает для большой</text>
    <text x="58" y="116" fill="#4C566A" font-size="11.5">просто и совместимо, но:</text>
    <text x="58" y="134" font-size="13.8" font-weight="600">· второй набор весов</text>
    <text x="58" y="152" font-size="11" font-weight="600">· расхождение распределений</text>
    <text x="58" y="176" fill="#4C566A" font-size="11.5">понятный базовый путь;</text>
    <text x="58" y="192" fill="#4C566A" font-size="11.5">полезен при совместимом</text>
    <text x="58" y="208" fill="#4C566A" font-size="11.5">токенизаторе и артефакте</text>
  </g>

  <rect x="260" y="52" width="215" height="270" rx="12" fill="#E8EEF5" stroke="#5E81AC" stroke-width="1.3"/>
  <text x="278" y="75" font-size="14" font-weight="700" fill="#2E3440">
    <tspan x="278" dy="0">Головы и обучаемые</tspan><tspan x="278" dy="18">черновики</tspan>
  </text>
  <g font-size="11.5" fill="#2E3440">
    <text x="278" y="118">Medusa: параллельные головы,</text>
    <text x="278" y="136" fill="#4C566A">дерево кандидатов на проверке</text>
    <text x="278" y="158"><tspan x="278">EAGLE: черновик по внутренним</tspan><tspan x="278" dy="18">признакам</tspan></text>
    <text x="278" y="202" font-weight="700"><tspan x="278">EAGLE-3: прямые токены и</tspan><tspan x="278" dy="18">объединение признаков</tspan></text>
    <text x="278" y="238">авторы сообщают до 6.5×</text>
    <text x="278" y="254">в своих условиях; число</text>
    <text x="278" y="270">не переносится без измерения</text>
    <text x="278" y="286" fill="#4C566A">на другой движок и нагрузку</text>
    <text x="278" y="306" fill="#4C566A">нужен совместимый чекпойнт</text>
    <text x="278" y="318" fill="#4C566A" font-size="10.5">черновика</text>
  </g>

  <rect x="490" y="52" width="205" height="270" rx="12" fill="#FAF5E3" stroke="#EBCB8B"/>
  <text x="508" y="76" font-size="16.6" font-weight="700" fill="#2E3440">Без модели вовсе</text>
  <g font-size="11.5" fill="#2E3440">
    <text x="508" y="105" font-weight="600"><tspan x="508">n-граммы / суффиксы:</tspan><tspan x="508" dy="18">найти в контексте n-грамму</tspan><tspan x="508" dy="18">и предложить хвост</tspan></text>
    <text x="508" y="169" fill="#4C566A"><tspan x="508">без нейронного черновика;</tspan><tspan x="508" dy="18">полезно для кода и буквального</tspan><tspan x="508" dy="18">повторения текста</tspan></text>
    <text x="508" y="233"><tspan x="508">Lookahead: якоби-итерации</tspan><tspan x="508" dy="18">параллельного декода</tspan></text>
    <text x="508" y="279" fill="#4C566A">без черновика вообще</text>
  </g>

  <rect x="710" y="52" width="190" height="270" rx="12" fill="#EFF4EA" stroke="#A3BE8C" stroke-width="1.4"/>
  <text x="728" y="76" font-size="16.6" font-weight="700" fill="#2E3440">Нативный MTP</text>
  <g font-size="11.5" fill="#2E3440">
    <text x="728" y="105"><tspan x="728">модули предсказания</tspan><tspan x="728" dy="18">будущих токенов (М8)</tspan><tspan x="728" dy="18">могут служить черновиком</tspan></text>
    <text x="728" y="169" font-weight="700"><tspan x="728">не нужен отдельный</tspan><tspan x="728" dy="18">полный чекпойнт</tspan></text>
    <text x="728" y="215"><tspan x="728">выигрыш зависит от доли</tspan><tspan x="728" dy="18">принятия и стоимости</tspan><tspan x="728" dy="18">предложения</tspan></text>
    <text x="728" y="275" fill="#4C566A">поддерживается движками</text>
    <text x="728" y="291" fill="#4C566A">→ §9; конфигурация зависит</text>
    <text x="728" y="309" fill="#4C566A">от модели</text>
  </g>

  <rect x="40" y="342" width="860" height="92" rx="12" fill="#F8ECEC" stroke="#BF616A" stroke-width="1.2"/>
  <text x="58" y="370" font-size="16.6" font-weight="700" fill="#2E3440">Когда спекулятивное декодирование может не окупиться (В2)</text>
  <g font-size="9.5" fill="#2E3440">
    <text x="58" y="398" font-size="11.5">низкая доля принятия · дорогой черновик · высокая конкурентная нагрузка, уже хорошо использующая GPU ·</text>
    <text x="58" y="418" font-size="11.1">короткий вывод без повторов · несовместимый токенизатор · слабая реализация проверки; фиксированных универсальных порогов нет</text>
  </g>

  <text x="30" y="467" font-size="11.5" fill="#2E3440">Формульный критерий: S &lt; 1 при E &lt; 1 + γc — низкая α или дорогой черновик превращают ускорение в замедление (§7);</text>
  <text x="30" y="487" font-size="11.5" fill="#2E3440">основной рабочий режим — нагрузка со средней или низкой интенсивностью запросов, ограниченная пропускной способностью памяти.</text>
</svg>
