<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 330" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <title>Цикл спекулятивного декодирования</title>
  <desc>Черновая модель предлагает гамма токенов, основная модель проверяет их одним проходом; показаны принятие, коррекция и дополнительный токен.</desc>
  <defs><marker id="a102" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M1 1 L8 4.5 L1 8 Z" fill="#4C566A"/></marker></defs>
  <text x="30" y="30" font-size="23" font-weight="700" fill="#2E3440">Один цикл «предложи–проверь» (γ = 5)</text>

  <rect x="40" y="56" width="150" height="60" rx="8" fill="#ECEFF4" stroke="#D8DEE9"/>
  <text x="115" y="82" text-anchor="middle" font-size="16.6" font-weight="700" fill="#2E3440">Префикс</text>
  <text x="115" y="100" text-anchor="middle" font-size="13.8" fill="#4C566A">контекст запроса</text>

  <rect x="230" y="56" width="200" height="60" rx="8" fill="#E8EEF5" stroke="#5E81AC" stroke-width="1.3"/>
  <text x="330" y="78" text-anchor="middle" font-size="16.6" font-weight="700" fill="#2E3440">Черновая модель</text>
  <text x="330" y="96" text-anchor="middle" font-size="13.7" fill="#2E3440">авторегрессивно: t₁ … t₅</text>
  <text x="330" y="110" text-anchor="middle" font-size="12" fill="#4C566A">со своими q(tᵢ)</text>

  <rect x="470" y="56" width="210" height="60" rx="8" fill="#F3EEF3" stroke="#B48EAD" stroke-width="1.3"/>
  <text x="575" y="78" text-anchor="middle" font-size="11.9" font-weight="700" fill="#2E3440">Основная модель: ОДИН проход</text>
  <text x="575" y="96" text-anchor="middle" font-size="11.3" fill="#2E3440">несколько позиций разом → p(tᵢ)</text>
  <text x="575" y="110" text-anchor="middle" font-size="9.1" fill="#4C566A">более широкий шаг декодирования (§10)</text>

  <rect x="720" y="56" width="180" height="60" rx="8" fill="#EFF4EA" stroke="#A3BE8C" stroke-width="1.3"/>
  <text x="810" y="78" text-anchor="middle" font-size="16.6" font-weight="700" fill="#2E3440">Проверка</text>
  <text x="810" y="96" text-anchor="middle" font-size="13.8" fill="#2E3440">слева направо</text>
  <text x="810" y="110" text-anchor="middle" font-size="12" fill="#4C566A">до первого отказа</text>

  <g stroke="#4C566A" stroke-width="1.1">
    <line x1="190" y1="86" x2="226" y2="86" marker-end="url(#a102)"/>
    <line x1="430" y1="86" x2="466" y2="86" marker-end="url(#a102)"/>
    <line x1="680" y1="86" x2="716" y2="86" marker-end="url(#a102)"/>
  </g>

  <rect x="40" y="140" width="420" height="80" rx="12" fill="#EFF4EA" stroke="#A3BE8C"/>
  <text x="58" y="162" font-size="16.6" font-weight="700" fill="#2E3440">Правило приёма</text>
  <text x="58" y="184" font-size="13.3" font-family="DejaVu Sans Mono, ui-monospace, Menlo, monospace" fill="#2E3440" font-weight="600">принять tᵢ с вероятностью min(1, p(tᵢ)/q(tᵢ))</text>
  <text x="58" y="206" font-size="9.5" fill="#4C566A">хорошие предложения (p ≥ q) проходят всегда; сомнительные — с шансом p/q</text>

  <rect x="480" y="140" width="420" height="80" rx="12" fill="#F8ECEC" stroke="#BF616A"/>
  <text x="498" y="162" font-size="16.6" font-weight="700" fill="#2E3440">Первый отказ → коррекция</text>
  <text x="498" y="184" font-size="13.8" font-family="DejaVu Sans Mono, ui-monospace, Menlo, monospace" fill="#2E3440" font-weight="600">новый токен ~ norm((p − q)₊)</text>
  <text x="498" y="206" font-size="9" fill="#4C566A">недостающая у черновика масса возвращается — цикл всё равно выдаёт ≥ 1 токен</text>

  <rect x="40" y="236" width="860" height="46" rx="12" fill="#E8EEF5" stroke="#5E81AC"/>
  <text x="58" y="256" font-size="11.2" font-weight="700" fill="#2E3440">Все γ приняты → бонус:</text>
  <text x="230" y="256" font-size="9.8" fill="#2E3440">основная модель уже посчитала следующую позицию — цикл выдаёт дополнительный токен и возвращает до γ + 1 токенов.</text>
  <text x="58" y="272" font-size="11" fill="#4C566A">Точный алгоритм: закон каждого выданного токена равен распределению основной модели p; качество черновика влияет на скорость (§5).</text>

  <text x="30" y="310" font-size="11.5" fill="#2E3440">Сценарная стоимость: γ шагов черновика (доля c от шага основной модели) + одна проверка → S = E / (1 + γc) — §7.</text>
</svg>