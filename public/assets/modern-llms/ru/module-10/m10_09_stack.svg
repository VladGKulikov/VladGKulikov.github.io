<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 330" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <title>Взаимодействие оптимизаций</title>
  <desc>Квантизация, спекулятивное декодирование, обслуживание запросов и архитектура меняют общий профиль узких мест.</desc>
  <defs><marker id="a109" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M1 1 L8 4.5 L1 8 Z" fill="#4C566A"/></marker></defs>
  <text x="30" y="30" font-size="21.4" font-weight="700" fill="#2E3440">Оптимизации взаимодействуют: после каждого шага ищем новое узкое место</text>

  <rect x="40" y="60" width="120" height="66" rx="8" fill="#ECEFF4" stroke="#D8DEE9"/>
  <text x="100" y="88" text-anchor="middle" font-size="16.6" font-weight="700" fill="#2E3440">bf16</text>
  <text x="100" y="106" text-anchor="middle" font-size="9" fill="#4C566A">исходная оценка: 209 ток/с</text>

  <g font-size="9" text-anchor="middle">
    <rect x="196" y="60" width="160" height="66" rx="8" fill="#E8EEF5" stroke="#5E81AC" stroke-width="1.2"/>
    <text x="276" y="82" font-weight="700" font-size="16.6" fill="#2E3440">Квантизация</text>
    <text x="276" y="100" fill="#2E3440" font-size="13.4" font-weight="600">INT4 / NVFP4 / W4A4</text>
    <text x="276" y="116" fill="#4C566A" font-size="11.6" font-weight="600">потолок → 744–838 (§11)</text>
    <rect x="392" y="60" width="160" height="66" rx="8" fill="#EFF4EA" stroke="#A3BE8C" stroke-width="1.2"/>
    <text x="472" y="82" font-weight="700" font-size="10" fill="#2E3440">Спекулятивное декодирование</text>
    <text x="472" y="100" fill="#2E3440" font-size="13.8" font-weight="600">EAGLE-3 / MTP</text>
    <text x="472" y="116" fill="#4C566A" font-size="11.1">E токенов за чтение (§7)</text>
    <rect x="588" y="60" width="160" height="66" rx="8" fill="#F3EEF3" stroke="#B48EAD" stroke-width="1.2"/>
    <text x="668" y="82" font-weight="700" font-size="14.5" fill="#2E3440">Обслуживание (М9)</text>
    <text x="668" y="100" fill="#2E3440" font-size="13" font-weight="600">Paged · батчинг · PD</text>
    <text x="668" y="116" fill="#4C566A">полезная пропускная способность</text>
    <rect x="784" y="60" width="116" height="66" rx="8" fill="#FAF5E3" stroke="#EBCB8B" stroke-width="1.2"/>
    <text x="842" y="82" font-weight="700" font-size="14.7" fill="#2E3440">Архитектура</text>
    <text x="842" y="100" fill="#2E3440" font-size="13" font-weight="600">MLA · DSA (М4)</text>
    <text x="842" y="116" fill="#4C566A" font-size="9.9">меньше KV-данных</text>
  </g>
  <g stroke="#4C566A" stroke-width="1.1">
    <line x1="160" y1="93" x2="192" y2="93" marker-end="url(#a109)"/>
    <line x1="356" y1="93" x2="388" y2="93" marker-end="url(#a109)"/>
    <line x1="552" y1="93" x2="584" y2="93" marker-end="url(#a109)"/>
    <line x1="748" y1="93" x2="780" y2="93" marker-end="url(#a109)"/>
  </g>

  <rect x="40" y="150" width="530" height="90" rx="12" fill="#EFF4EA" stroke="#A3BE8C" stroke-width="1.4"/>
  <text x="58" y="174" font-size="13.2" font-weight="700" fill="#2E3440">Совместный арифметический сценарий: NVFP4-подобный объём + MTP</text>
  <text x="58" y="198" font-size="13.8" font-family="DejaVu Sans Mono, ui-monospace, Menlo, monospace" fill="#2E3440" font-weight="600">1.875 / 1.05 × BW / 4.50 GB (4.19 GiB) = 1 329 ток/с</text>
  <text x="58" y="220" font-size="9.9" fill="#2E3440" font-weight="600"><tspan font-weight="700">×6.3</tspan> к исходной оценке М9 — верхняя граница: KV-трафик и накладные расходы съедят часть</text>

  <rect x="590" y="150" width="310" height="90" rx="12" fill="#FAF0E8" stroke="#D08770"/>
  <text x="608" y="174" font-size="12.5" font-weight="700" fill="#2E3440">После сочетания — новое профилирование</text>
  <text x="608" y="196" font-size="11.5" fill="#2E3440">коэффициенты из раздельных измерений</text>
  <text x="608" y="214" font-size="11.5" fill="#2E3440">не являются независимыми;</text>
  <text x="608" y="232" font-size="8.5" fill="#4C566A">TTFT, ITL и полезная пропускная способность измеряются заново</text>

  <rect x="40" y="256" width="860" height="42" rx="8" fill="#ECEFF4" stroke="#D8DEE9"/>
  <text x="58" y="276" font-size="11.3" fill="#2E3440"><tspan font-weight="700">Совместимость:</tspan> точная гарантия §4 относится к КВАНТОВАННОЙ основной модели; после квантизации долю принятия измеряют заново.</text>
  <text x="58" y="292" font-size="11.5" fill="#4C566A">QLoRA: 4-битная замороженная база + адаптеры высокой точности; это экономия памяти дообучения, а не спекулятивный инференс</text>
</svg>