<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 645" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <title>Шпаргалка модуля 10</title>
  <desc>Алгоритм и гарантия, формулы E и S, зоопарк, лестница битов и FP4-война, сборка, грабли.</desc>
  <text x="30" y="30" font-size="22.5" font-weight="700" fill="#2E3440">Шпаргалка · Два рычага и один принцип измерения</text>

  <rect x="40" y="48" width="840" height="56" rx="12" fill="#ECEFF4" stroke="#D8DEE9"/>
  <g font-family="DejaVu Sans Mono, ui-monospace, Menlo, monospace" font-size="10" fill="#2E3440">
    <text x="60" y="70" font-size="12.3" font-weight="600">принять с min(1, p/q) · отказ → norm((p−q)₊) · все γ приняты → бонус · закон выданного ≡ p (теорема)</text>
    <text x="60" y="92" font-size="12.1" font-weight="600">пример: α = Σ min(p,q) = 0.85 = 1 − TV(p,q) · баланс min(p,q) + (1−α)·r = p ✓ (проверено методом Монте-Карло)</text>
  </g>

  <rect x="40" y="118" width="410" height="190" rx="12" fill="#E8EEF5" stroke="#5E81AC"/>
  <text x="58" y="142" font-size="16.2" font-weight="700" fill="#2E3440">Формулы цикла</text>
  <g font-size="9.5" fill="#2E3440">
    <text x="58" y="166" font-size="13.5" font-weight="600">E = (1 − α^{γ+1})/(1 − α) · асимптота 1/(1−α)</text>
    <text x="58" y="186" font-size="10.6" font-weight="600">S = E/(1 + γc) · внешний черновик: γ* = 6 → 2.47× (пологий максимум)</text>
    <text x="58" y="208" font-weight="700" font-size="10.9">MTP-сценарий: α=0.875, γ=1, c=0.05 → 1.79× (заданные параметры)</text>
    <text x="58" y="228" fill="#4C566A" font-size="13.5" font-weight="600">γ = 1 ⇒ E ≤ 2 · охоться за α, не за γ · S&lt;1 при E&lt;1+γc</text>
  </g>

  <rect x="470" y="118" width="410" height="190" rx="12" fill="#EFF4EA" stroke="#A3BE8C" stroke-width="1.2"/>
  <text x="488" y="142" font-size="16.2" font-weight="700" fill="#2E3440">Источники предложений</text>
  <g font-size="9.5" fill="#2E3440">
    <text x="488" y="166" font-size="11.5">отдельная модель · Medusa (головы и дерево)</text>
    <text x="488" y="184" font-size="11.5">· n-граммы и суффиксы</text>
    <text x="488" y="206" font-size="11.5" font-weight="600">EAGLE-3: прямое предсказание токенов</text>
    <text x="488" y="224" font-size="11.5" font-weight="600">и признаки нескольких уровней</text>
    <text x="488" y="246" font-size="11.5">MTP: встроенный источник предложений</text>
    <text x="488" y="264" font-size="11.5">для поддерживаемых моделей; выигрыш измеряется</text>
    <text x="488" y="286" font-size="11.5" fill="#BF616A">риски: низкая α · дорогой черновик</text>
    <text x="488" y="302" font-size="11.5" fill="#BF616A">· насыщенная нагрузка · несовместимость</text>
  </g>

  <rect x="40" y="322" width="410" height="122" rx="12" fill="#F3EEF3" stroke="#B48EAD"/>
  <text x="58" y="346" font-size="16.2" font-weight="700" fill="#2E3440">Лестница битов (8B, потолки М9)</text>
  <g font-size="9.5" fill="#2E3440">
    <text x="58" y="370" font-size="11.3">16 → 8 → 4.5 → 4.25 → 4 бит/вес (арифметический объём весов)</text>
    <text x="58" y="390" font-size="11.3">209 → 419 → 744 → 788 → 838 ток/с</text>
    <text x="58" y="410" font-size="11">на учебном векторе с выбросом: MSE FP4-сетки в 3.3 раза ниже</text>
    <text x="58" y="430" fill="#4C566A" font-size="10.5" font-weight="600">MR-GPTQ: PTQ с учётом формата; FP4 не автоматически лучше INT4</text>
  </g>

  <rect x="470" y="322" width="410" height="122" rx="12" fill="#FAF5E3" stroke="#EBCB8B"/>
  <text x="488" y="346" font-size="13.5" font-weight="700" fill="#2E3440">FP4-война и этажи</text>
  <g font-size="9.5" fill="#2E3440">
    <text x="488" y="370" font-size="9.6">NVFP4: E2M1 + масштаб E4M3 на 16 значений + глобальный FP32-масштаб</text>
    <text x="488" y="390">MXFP4: E2M1 + E8M0 на 32 значения; качество и скорость зависят от стека</text>
    <text x="488" y="410" font-size="10.9">Command A+: заявлено W4A4-развёртывание на 1×B200 или 2×H100</text>
    <text x="488" y="430" fill="#4C566A" font-size="10.3">BitNet {−1,0,+1}: выигрыш требует специализированного исполнения</text>
  </g>

  <rect x="40" y="458" width="840" height="62" rx="12" fill="#FAF0E8" stroke="#D08770"/>
  <text x="58" y="482" font-size="16.2" font-weight="700" fill="#2E3440">Сборка</text>
  <text x="58" y="502" font-size="11" fill="#2E3440">проверка нескольких позиций → сценарий 594 ток/с · NVFP4-подобный объём + MTP-сценарий → 1 329 ток/с; оба числа — верхние оценки</text>
  <text x="58" y="516" font-size="13.3" fill="#2E3440" font-weight="600">квантизация + спекуляция + обслуживание + архитектура: после каждого шага заново определяем узкое место</text>

  <rect x="40" y="534" width="840" height="70" rx="12" fill="#ECEFF4" stroke="#D8DEE9"/>
  <text x="58" y="556" font-size="16.2" font-weight="700" fill="#2E3440">Грабли</text>
  <text x="58" y="576" font-size="10.9" fill="#2E3440">точная гарантия — относительно квантованной модели · размер группы сам по себе не доказывает формат · сценарии — верхние оценки,</text>
  <text x="58" y="596" font-size="11.3" fill="#2E3440">не результаты измерений · заявления разработчиков читаются с условиями · решение принимается по профилю своей нагрузки</text>

  <text x="30" y="628" font-size="9.5" font-style="italic" fill="#4C566A">развёрнутая версия — раздел 20 лекции; значения воспроизведены проверочным кодом курса</text>
</svg>
