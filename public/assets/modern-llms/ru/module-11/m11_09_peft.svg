<svg viewBox="0 0 940 380" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <title>Карта PEFT</title>
  <desc>Механика LoRA, арифметика листа, смета QLoRA, семейство вариантов и правило выбора.</desc>
  <defs><marker id="a119" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M1 1 L8 4.5 L1 8 Z" fill="#4C566A"/></marker></defs>
  <text x="30" y="30" font-size="23" font-weight="700" fill="#2E3440">Низкоранговая адаптация: LoRA как отправная точка (§16)</text>

  <rect x="40" y="52" width="400" height="150" rx="12" fill="#E8EEF5" stroke="#5E81AC" stroke-width="1.3"/>
  <text x="58" y="74" font-size="16.6" font-weight="700" fill="#2E3440">Механика</text>
  <text x="58" y="100" font-size="13.8" font-family="ui-monospace, Menlo, monospace" fill="#2E3440" font-weight="600">h = W·x + (α/r)·B·A·x</text>
  <g font-size="9" fill="#2E3440">
    <text x="58" y="124" font-size="11.5"><tspan font-weight="600" fill="#4C566A">W заморожена</tspan> · учатся A (r×d<tspan baseline-shift="sub" font-size="8.3">in</tspan>) и B (d<tspan baseline-shift="sub" font-size="8.3">out</tspan>×r)</text>
    <text x="58" y="142" font-size="11.5">параметров на матрицу: r·(d<tspan baseline-shift="sub" font-size="8.3">in</tspan> + d<tspan baseline-shift="sub" font-size="8.3">out</tspan>)</text>
    <text x="58" y="164" fill="#4C566A" font-size="10.2">малое число обучаемых параметров допускает иной диапазон шага:</text>
    <text x="58" y="180" fill="#4C566A" font-size="11.5">LoRA часто 1e-4…3e-4; полное дообучение 5e-6…2e-5 (§7)</text>
  </g>

  <rect x="460" y="52" width="440" height="150" rx="12" fill="#EFF4EA" stroke="#A3BE8C" stroke-width="1.3"/>
  <text x="478" y="74" font-size="16.6" font-weight="700" fill="#2E3440">Арифметика листа (8B · GQA · q,k,v,o · r=16)</text>
  <g font-family="ui-monospace, Menlo, monospace" font-size="9.3" fill="#2E3440">
    <text x="478" y="98" font-size="13.8" font-weight="600">на слой: 425 984 → всего 13.63M = 0.17% базы</text>
    <text x="478" y="118" font-size="12.8" font-weight="600">состояния: полное 119,7 GiB → LoRA 208 MiB (×589)</text>
  </g>
  <g font-size="9" fill="#2E3440">
    <text x="478" y="142" font-weight="600" font-size="13.4">Нижняя оценка QLoRA (М10 §15): 4-битные веса ≈ 3,74 GiB</text>
    <text x="478" y="158" font-size="13.8" font-weight="600">+ адаптеры bf16 26 MiB + состояния 208 MiB</text>
    <text x="478" y="176" fill="#A3BE8C" font-weight="700" font-size="13.8">→ нижняя оценка состояний ≈ 3,97 GiB;</text>
    <text x="478" y="192" fill="#4C566A" font-size="11.4">активации, временные буферы и накладные расходы не включены</text>
  </g>

  <rect x="40" y="218" width="560" height="98" rx="12" fill="#F3EEF3" stroke="#B48EAD"/>
  <text x="58" y="240" font-size="16.6" font-weight="700" fill="#2E3440">Варианты метода</text>
  <g font-size="9" fill="#2E3440">
    <text x="58" y="262" font-size="11.5"><tspan font-weight="600">DoRA</tspan> — разделяет величину и направление обновления</text>
    <text x="58" y="280" font-size="11.5"><tspan font-weight="600">rsLoRA</tspan> меняет масштабирование · <tspan font-weight="600">PiSSA</tspan> использует инициализацию SVD</text>
    <text x="58" y="298" font-size="13.8" font-weight="600"><tspan font-weight="600">LoRA+ / LoRA-FA</tspan> меняют обучение A и B; результат зависит от задачи</text>
  </g>

  <rect x="620" y="218" width="280" height="98" rx="8" fill="#FAF5E3" stroke="#EBCB8B"/>
  <text x="638" y="240" font-size="16.6" font-weight="700" fill="#2E3440">Правило выбора (В7)</text>
  <g font-size="9" fill="#2E3440">
    <text x="638" y="262">полное дообучение — глубокий сдвиг и достаточные ресурсы</text>
    <text x="638" y="280" font-weight="600"><tspan font-weight="700">LoRA/QLoRA — сильная практическая база сравнения</tspan></text>
    <text x="638" y="298" fill="#4C566A" font-size="10.3">варианты проверяют на удержанных задачах</text>
  </g>

  <text x="30" y="342" font-size="11.5" fill="#2E3440">Бонус адаптеров: файлы по ~26 MiB — хранятся, версионируются и жонглируются как обычные артефакты; ранги 8/16 —</text>
  <text x="30" y="358" font-size="11.5" fill="#2E3440">ранг и целевые матрицы выбирают по качеству и стоимости; GQA уменьшает проекции K/V (М4).</text>
</svg>
