<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker></defs>
<rect width="100%" height="100%" fill="#F8FAFC"/><text x="70" y="70" font-family="Arial, DejaVu Sans, sans-serif" font-size="38" font-weight="700" fill="#172033" text-anchor="start"><tspan x="70" dy="0">От человеческих сравнений к RL в интерактивных средах</tspan></text><text x="70" y="120" font-family="Arial, DejaVu Sans, sans-serif" font-size="23" font-weight="400" fill="#526071" text-anchor="start"><tspan x="70" dy="0">История меняет не только функцию потерь, но и способ получения обучающего сигнала.</tspan></text><rect x="60" y="205" width="210" height="410" rx="24" fill="#DCEBFA" stroke="#CBD5E1" stroke-width="2"/><text x="88" y="253" font-family="DejaVu Sans, Arial, sans-serif" font-size="27.2" font-weight="700" fill="#172033" text-anchor="start"><tspan x="88" dy="0">2017 ·</tspan><tspan x="88" dy="26">Human</tspan><tspan x="88" dy="26">Preferences</tspan></text><text x="88" y="339" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="400" fill="#526071" text-anchor="start"><tspan x="88" dy="0">Сравнения</tspan><tspan x="88" dy="20">обучают явную</tspan><tspan x="88" dy="20">модель</tspan><tspan x="88" dy="20">вознаграждения.</tspan></text><path d="M270,410 L305,410" stroke="#475569" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="315" y="205" width="210" height="410" rx="24" fill="#DFF3E4" stroke="#CBD5E1" stroke-width="2"/><text x="343" y="254" font-family="DejaVu Sans, Arial, sans-serif" font-size="27.3" font-weight="700" fill="#172033" text-anchor="start"><tspan x="343" dy="0">2022 ·</tspan><tspan x="343" dy="28">InstructGPT</tspan></text><text x="343" y="317" font-family="DejaVu Sans, Arial, sans-serif" font-size="19.7" font-weight="600" fill="#526071" text-anchor="start"><tspan x="343" dy="0">SFT → модель</tspan><tspan x="343" dy="22">вознаграждения</tspan><tspan x="343" dy="22">→ PPO с</tspan><tspan x="343" dy="22">KL-якорем.</tspan></text><path d="M525,410 L560,410" stroke="#475569" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="570" y="205" width="210" height="410" rx="24" fill="#FFF1CC" stroke="#CBD5E1" stroke-width="2"/><text x="598" y="254" font-family="DejaVu Sans, Arial, sans-serif" font-size="28.2" font-weight="700" fill="#172033" text-anchor="start"><tspan x="598" dy="0">2023 · DPO</tspan></text><text x="598" y="289" font-family="DejaVu Sans, Arial, sans-serif" font-size="19.6" font-weight="400" fill="#526071" text-anchor="start"><tspan x="598" dy="0">Фиксированные</tspan><tspan x="598" dy="22">пары обучают</tspan><tspan x="598" dy="22">политику без</tspan><tspan x="598" dy="22">отдельной</tspan><tspan x="598" dy="22">модели</tspan><tspan x="598" dy="22">вознаграждения</tspan><tspan x="598" dy="22">и онлайн-RL.</tspan></text><path d="M780,410 L815,410" stroke="#475569" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="825" y="205" width="210" height="410" rx="24" fill="#EDE5FA" stroke="#CBD5E1" stroke-width="2"/><text x="853" y="254" font-family="DejaVu Sans, Arial, sans-serif" font-size="28.2" font-weight="700" fill="#172033" text-anchor="start"><tspan x="853" dy="0">2024 ·</tspan><tspan x="853" dy="28">RLOO и</tspan><tspan x="853" dy="28">GRPO</tspan></text><text x="853" y="348" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="400" fill="#526071" text-anchor="start"><tspan x="853" dy="0">Несколько</tspan><tspan x="853" dy="26">ответов на</tspan><tspan x="853" dy="26">запрос дают</tspan><tspan x="853" dy="26">базовую</tspan><tspan x="853" dy="26">линию внутри</tspan><tspan x="853" dy="26">группы.</tspan></text><path d="M1035,410 L1070,410" stroke="#475569" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="1080" y="205" width="210" height="410" rx="24" fill="#FBE2E7" stroke="#CBD5E1" stroke-width="2"/><text x="1108" y="254" font-family="DejaVu Sans, Arial, sans-serif" font-size="28.2" font-weight="700" fill="#172033" text-anchor="start"><tspan x="1108" dy="0">2025 ·</tspan><tspan x="1108" dy="28">DAPO и Dr.</tspan><tspan x="1108" dy="28">GRPO</tspan></text><text x="1108" y="348" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="400" fill="#526071" text-anchor="start"><tspan x="1108" dy="0">Исправляются</tspan><tspan x="1108" dy="26">клиппинг,</tspan><tspan x="1108" dy="26">выбор групп,</tspan><tspan x="1108" dy="26">длиновая</tspan><tspan x="1108" dy="26">нормировка и</tspan><tspan x="1108" dy="26">вырожденные</tspan><tspan x="1108" dy="26">случаи.</tspan></text><path d="M1290,410 L1325,410" stroke="#475569" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="1335" y="205" width="210" height="410" rx="24" fill="#DCEBFA" stroke="#CBD5E1" stroke-width="2"/><text x="1363" y="254" font-family="DejaVu Sans, Arial, sans-serif" font-size="28.2" font-weight="700" fill="#172033" text-anchor="start"><tspan x="1363" dy="0">2026 ·</tspan><tspan x="1363" dy="28">Среды и</tspan><tspan x="1363" dy="28">системы</tspan></text><text x="1363" y="348" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="400" fill="#526071" text-anchor="start"><tspan x="1363" dy="0">verl, NeMo RL</tspan><tspan x="1363" dy="26">и NeMo Gym</tspan><tspan x="1363" dy="26">связывают</tspan><tspan x="1363" dy="26">генерацию,</tspan><tspan x="1363" dy="26">проверку,</tspan><tspan x="1363" dy="26">обновление и</tspan><tspan x="1363" dy="26">свежесть</tspan><tspan x="1363" dy="26">траекторий.</tspan></text><rect x="90" y="690" width="1420" height="125" rx="24" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/><text x="120" y="735" font-family="Arial, DejaVu Sans, sans-serif" font-size="25" font-weight="600" fill="#172033" text-anchor="start"><tspan x="120" dy="0">Основной сдвиг: от статического набора сравнений — к непрерывному циклу «политика → среда → награда →</tspan><tspan x="120" dy="34">обновление».</tspan></text></svg>