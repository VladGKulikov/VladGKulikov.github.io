<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker></defs>
<rect width="100%" height="100%" fill="#F8FAFC"/><text x="70" y="70" font-family="Arial, DejaVu Sans, sans-serif" font-size="38" font-weight="700" fill="#172033" text-anchor="start"><tspan x="70" dy="0">Обучение по обратной связи: карта решений</tspan></text><text x="70" y="120" font-family="Arial, DejaVu Sans, sans-serif" font-size="23" font-weight="400" fill="#526071" text-anchor="start"><tspan x="70" dy="0">Начните не с названия алгоритма, а с доступного сигнала и стоимости его получения.</tspan></text><rect x="70" y="215" width="350" height="470" rx="24" fill="#DCEBFA" stroke="#CBD5E1" stroke-width="2"/><text x="98" y="269" font-family="DejaVu Sans, Arial, sans-serif" font-size="28.2" font-weight="700" fill="#172033" text-anchor="start"><tspan x="98" dy="0">Сигнал</tspan></text><text x="98" y="309" font-family="DejaVu Sans, Arial, sans-serif" font-size="23.5" font-weight="600" fill="#526071" text-anchor="start"><tspan x="98" dy="0">Демонстрации → SFT</tspan><tspan x="98" dy="28">Пары → DPO / модель</tspan><tspan x="98" dy="28">вознаграждения</tspan><tspan x="98" dy="28">Бинарные метки → KTO</tspan><tspan x="98" dy="28">Проверяемая награда →</tspan><tspan x="98" dy="28">RLVR</tspan></text><rect x="455" y="215" width="350" height="470" rx="24" fill="#DFF3E4" stroke="#CBD5E1" stroke-width="2"/><text x="483" y="269" font-family="DejaVu Sans, Arial, sans-serif" font-size="28.2" font-weight="700" fill="#172033" text-anchor="start"><tspan x="483" dy="0">Алгоритмический</tspan><tspan x="483" dy="34">контракт</tspan></text><text x="483" y="343" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="400" fill="#526071" text-anchor="start"><tspan x="483" dy="0">RLHF: RM + PPO + KL</tspan><tspan x="483" dy="28">DPO: фиксированные</tspan><tspan x="483" dy="28">пары + референс</tspan><tspan x="483" dy="28">RLOO: базовая линия по</tspan><tspan x="483" dy="28">остальным ответам</tspan><tspan x="483" dy="28">GRPO: нормировка</tspan><tspan x="483" dy="28">внутри группы</tspan></text><rect x="840" y="215" width="350" height="470" rx="24" fill="#FFF1CC" stroke="#CBD5E1" stroke-width="2"/><text x="868" y="269" font-family="DejaVu Sans, Arial, sans-serif" font-size="28.2" font-weight="700" fill="#172033" text-anchor="start"><tspan x="868" dy="0">Численные</tspan><tspan x="868" dy="34">сценарии</tspan></text><text x="868" y="343" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="400" fill="#526071" text-anchor="start"><tspan x="868" dy="0">75% побед → логит</tspan><tspan x="868" dy="28">1.099</tspan><tspan x="868" dy="28">Состояния PPO: 269.2</tspan><tspan x="868" dy="28">GiB</tspan><tspan x="868" dy="28">Состояния DPO: 134.6</tspan><tspan x="868" dy="28">GiB</tspan><tspan x="868" dy="28">Траектории/обновление:</tspan><tspan x="868" dy="28">39.3× в сценарии</tspan></text><rect x="1225" y="215" width="350" height="470" rx="24" fill="#FBE2E7" stroke="#CBD5E1" stroke-width="2"/><text x="1253" y="269" font-family="DejaVu Sans, Arial, sans-serif" font-size="28.2" font-weight="700" fill="#172033" text-anchor="start"><tspan x="1253" dy="0">Главные риски</tspan></text><text x="1253" y="309" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="400" fill="#526071" text-anchor="start"><tspan x="1253" dy="0">Ошибочная модель</tspan><tspan x="1253" dy="28">вознаграждения</tspan><tspan x="1253" dy="28">Взлом проверяющего</tspan><tspan x="1253" dy="28">сигнала</tspan><tspan x="1253" dy="28">Вырожденные группы</tspan><tspan x="1253" dy="28">Смещение длины</tspan><tspan x="1253" dy="28">Устаревшие траектории</tspan></text><rect x="90" y="735" width="1420" height="95" rx="24" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/><text x="120" y="772" font-family="Arial, DejaVu Sans, sans-serif" font-size="23.5" font-weight="600" fill="#172033" text-anchor="start"><tspan x="120" dy="0">Паспорт метода должен фиксировать данные, награду, политику генерации, нормировку, KL, обработку</tspan><tspan x="120" dy="31">вырожденных групп и инфраструктуру.</tspan></text></svg>