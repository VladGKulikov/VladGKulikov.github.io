<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker></defs>
<rect width="100%" height="100%" fill="#F8FAFC"/><text x="70" y="70" font-family="Arial, DejaVu Sans, sans-serif" font-size="38" font-weight="700" fill="#172033" text-anchor="start"><tspan x="70" dy="0">GRPO: относительный сигнал внутри группы ответов</tspan></text><text x="70" y="120" font-family="Arial, DejaVu Sans, sans-serif" font-size="23" font-weight="400" fill="#526071" text-anchor="start"><tspan x="70" dy="0">Групповая нормировка устраняет отдельную модель ценности, но не делает оценку автоматически несмещённой.</tspan></text><rect x="55" y="220" width="250" height="330" rx="24" fill="#DCEBFA" stroke="#CBD5E1" stroke-width="2"/><text x="83" y="273" font-family="DejaVu Sans, Arial, sans-serif" font-size="28.2" font-weight="700" fill="#172033" text-anchor="start"><tspan x="83" dy="0">Запрос</tspan></text><text x="83" y="312" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="400" fill="#526071" text-anchor="start"><tspan x="83" dy="0">Одна задача x</tspan></text><path d="M305,385 L355,385" stroke="#475569" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="365" y="220" width="250" height="330" rx="24" fill="#DFF3E4" stroke="#CBD5E1" stroke-width="2"/><text x="393" y="273" font-family="DejaVu Sans, Arial, sans-serif" font-size="28.2" font-weight="700" fill="#172033" text-anchor="start"><tspan x="393" dy="0">G ответов</tspan></text><text x="393" y="312" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="400" fill="#526071" text-anchor="start"><tspan x="393" dy="0">Текущая</tspan><tspan x="393" dy="27">политика</tspan><tspan x="393" dy="27">создаёт</tspan><tspan x="393" dy="27">несколько</tspan><tspan x="393" dy="27">траекторий</tspan></text><path d="M615,385 L665,385" stroke="#475569" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="675" y="220" width="250" height="330" rx="24" fill="#FFF1CC" stroke="#CBD5E1" stroke-width="2"/><text x="703" y="273" font-family="DejaVu Sans, Arial, sans-serif" font-size="28.2" font-weight="700" fill="#172033" text-anchor="start"><tspan x="703" dy="0">Награда</tspan></text><text x="703" y="312" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="400" fill="#526071" text-anchor="start"><tspan x="703" dy="0">Проверяющий</tspan><tspan x="703" dy="27">модуль или</tspan><tspan x="703" dy="27">модель</tspan><tspan x="703" dy="27">вознаграждения</tspan><tspan x="703" dy="27">оценивает</tspan><tspan x="703" dy="27">каждый ответ</tspan></text><path d="M925,385 L975,385" stroke="#475569" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="985" y="220" width="250" height="330" rx="24" fill="#EDE5FA" stroke="#CBD5E1" stroke-width="2"/><text x="1013" y="268" font-family="DejaVu Sans, Arial, sans-serif" font-size="27.8" font-weight="700" fill="#172033" text-anchor="start"><tspan x="1013" dy="0">Преимущество</tspan></text><text x="1013" y="307" font-family="DejaVu Sans, Arial, sans-serif" font-size="23.5" font-weight="600" fill="#526071" text-anchor="start"><tspan x="1013" dy="0">Ai = (ri −</tspan><tspan x="1013" dy="27">mean(r))/std(r)</tspan></text><path d="M1235,385 L1285,385" stroke="#475569" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="1295" y="220" width="250" height="330" rx="24" fill="#FBE2E7" stroke="#CBD5E1" stroke-width="2"/><text x="1323" y="273" font-family="DejaVu Sans, Arial, sans-serif" font-size="28.2" font-weight="700" fill="#172033" text-anchor="start"><tspan x="1323" dy="0">Обновление</tspan></text><text x="1323" y="312" font-family="DejaVu Sans, Arial, sans-serif" font-size="23.5" font-weight="600" fill="#526071" text-anchor="start"><tspan x="1323" dy="0">Клиппированная</tspan><tspan x="1323" dy="27">PPO-подобная</tspan><tspan x="1323" dy="27">цель</tspan></text><rect x="75" y="640" width="700" height="150" rx="24" fill="#DFF3E4" stroke="#CBD5E1" stroke-width="2"/><text x="105" y="685" font-family="Arial, DejaVu Sans, sans-serif" font-size="23" font-weight="400" fill="#172033" text-anchor="start"><tspan x="105" dy="0">Учебная группа: [1,0,0,1,0,0,1,0] → mean=0.375,</tspan><tspan x="105" dy="31">std=0.484, успех +1.291, неуспех −0.775.</tspan></text><rect x="825" y="640" width="700" height="150" rx="24" fill="#FBE2E7" stroke="#CBD5E1" stroke-width="2"/><text x="855" y="685" font-family="Arial, DejaVu Sans, sans-serif" font-size="23" font-weight="600" fill="#172033" text-anchor="start"><tspan x="855" dy="0">При p=0.3 и G=8 вероятность одинаковых наград во всей</tspan><tspan x="855" dy="31">группе равна 5.77%. Такая группа не несёт</tspan><tspan x="855" dy="31">относительного сигнала.</tspan></text></svg>