<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker></defs>
<rect width="100%" height="100%" fill="#F8FAFC"/><text x="70" y="70" font-family="Arial, DejaVu Sans, sans-serif" font-size="38" font-weight="700" fill="#172033" text-anchor="start"><tspan x="70" dy="0">DPO: как пара предпочтений превращается в прямую функцию потерь</tspan></text><text x="70" y="120" font-family="Arial, DejaVu Sans, sans-serif" font-size="23" font-weight="400" fill="#526071" text-anchor="start"><tspan x="70" dy="0">Вывод использует KL-регуляризованную постановку и модель сравнений Bradley–Terry.</tspan></text><rect x="70" y="205" width="350" height="260" rx="24" fill="#DCEBFA" stroke="#CBD5E1" stroke-width="2"/><text x="98" y="257" font-family="DejaVu Sans, Arial, sans-serif" font-size="28.2" font-weight="700" fill="#172033" text-anchor="start"><tspan x="98" dy="0">1 · Оптимальная</tspan><tspan x="98" dy="31">политика</tspan></text><text x="98" y="328" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="400" fill="#526071" text-anchor="start"><tspan x="98" dy="0">π*(y|x) ∝ πref(y|x) ·</tspan><tspan x="98" dy="28">exp(r/β)</tspan></text><path d="M420,335 L445,335" stroke="#475569" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="455" y="205" width="350" height="260" rx="24" fill="#DFF3E4" stroke="#CBD5E1" stroke-width="2"/><text x="483" y="257" font-family="DejaVu Sans, Arial, sans-serif" font-size="28.2" font-weight="700" fill="#172033" text-anchor="start"><tspan x="483" dy="0">2 · Обратное</tspan><tspan x="483" dy="31">выражение</tspan></text><text x="483" y="328" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="400" fill="#526071" text-anchor="start"><tspan x="483" dy="0">r(x,y) = β</tspan><tspan x="483" dy="28">log[π*(y|x)/πref(y|x)] +</tspan><tspan x="483" dy="28">c(x)</tspan></text><path d="M805,335 L830,335" stroke="#475569" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="840" y="205" width="350" height="260" rx="24" fill="#FFF1CC" stroke="#CBD5E1" stroke-width="2"/><text x="868" y="257" font-family="DejaVu Sans, Arial, sans-serif" font-size="28.2" font-weight="700" fill="#172033" text-anchor="start"><tspan x="868" dy="0">3 · Разность пары</tspan></text><text x="868" y="297" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="400" fill="#526071" text-anchor="start"><tspan x="868" dy="0">c(x) сокращается между</tspan><tspan x="868" dy="28">предпочтительным и</tspan><tspan x="868" dy="28">отклонённым ответами.</tspan></text><path d="M1190,335 L1215,335" stroke="#475569" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="1225" y="205" width="350" height="260" rx="24" fill="#EDE5FA" stroke="#CBD5E1" stroke-width="2"/><text x="1253" y="257" font-family="DejaVu Sans, Arial, sans-serif" font-size="28.2" font-weight="700" fill="#172033" text-anchor="start"><tspan x="1253" dy="0">4 · DPO-функция</tspan><tspan x="1253" dy="31">потерь</tspan></text><text x="1253" y="328" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="400" fill="#526071" text-anchor="start"><tspan x="1253" dy="0">−log σ(β[Δ log πθ − Δ log</tspan><tspan x="1253" dy="28">πref])</tspan></text><rect x="70" y="550" width="470" height="220" rx="24" fill="#DFF3E4" stroke="#CBD5E1" stroke-width="2"/><text x="98" y="602" font-family="DejaVu Sans, Arial, sans-serif" font-size="28.2" font-weight="700" fill="#172033" text-anchor="start"><tspan x="98" dy="0">Что исчезает</tspan></text><text x="98" y="642" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="400" fill="#526071" text-anchor="start"><tspan x="98" dy="0">Отдельная модель</tspan><tspan x="98" dy="28">вознаграждения и онлайн-цикл</tspan><tspan x="98" dy="28">PPO.</tspan></text><rect x="580" y="550" width="470" height="220" rx="24" fill="#FFF1CC" stroke="#CBD5E1" stroke-width="2"/><text x="608" y="602" font-family="DejaVu Sans, Arial, sans-serif" font-size="28.2" font-weight="700" fill="#172033" text-anchor="start"><tspan x="608" dy="0">Что остаётся</tspan></text><text x="608" y="642" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="400" fill="#526071" text-anchor="start"><tspan x="608" dy="0">Фиксированные пары, текущая</tspan><tspan x="608" dy="28">политика, референсная политика</tspan><tspan x="608" dy="28">и допущения вывода.</tspan></text><rect x="1090" y="550" width="470" height="220" rx="24" fill="#FBE2E7" stroke="#CBD5E1" stroke-width="2"/><text x="1118" y="602" font-family="DejaVu Sans, Arial, sans-serif" font-size="28.2" font-weight="700" fill="#172033" text-anchor="start"><tspan x="1118" dy="0">Ограничение</tspan></text><text x="1118" y="642" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="400" fill="#526071" text-anchor="start"><tspan x="1118" dy="0">«Неявная награда» — отношение</tspan><tspan x="1118" dy="28">политик внутри модели</tspan><tspan x="1118" dy="28">предпочтений, а не</tspan><tspan x="1118" dy="28">универсальный внешний оценщик.</tspan></text></svg>