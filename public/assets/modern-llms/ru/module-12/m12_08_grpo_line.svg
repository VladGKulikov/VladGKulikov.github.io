<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker></defs>
<rect width="100%" height="100%" fill="#F8FAFC"/><text x="70" y="70" font-family="Arial, DejaVu Sans, sans-serif" font-size="38" font-weight="700" fill="#172033" text-anchor="start"><tspan x="70" dy="0">После GRPO: разные проблемы требуют разных исправлений</tspan></text><text x="70" y="120" font-family="Arial, DejaVu Sans, sans-serif" font-size="23" font-weight="400" fill="#526071" text-anchor="start"><tspan x="70" dy="0">Новые методы нельзя сводить к одной “улучшенной версии GRPO”: они меняют разные элементы рецепта.</tspan></text><rect x="65" y="215" width="260" height="445" rx="24" fill="#FBE2E7" stroke="#CBD5E1" stroke-width="2"/><text x="93" y="265" font-family="DejaVu Sans, Arial, sans-serif" font-size="28.2" font-weight="700" fill="#172033" text-anchor="start"><tspan x="93" dy="0">Вырожденные</tspan><tspan x="93" dy="29">группы</tspan></text><text x="93" y="333" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="400" fill="#526071" text-anchor="start"><tspan x="93" dy="0">Dynamic Sampling</tspan><tspan x="93" dy="27">в DAPO</tspan><tspan x="93" dy="27">исключает</tspan><tspan x="93" dy="27">группы без</tspan><tspan x="93" dy="27">относительного</tspan><tspan x="93" dy="27">сигнала.</tspan></text><rect x="370" y="215" width="260" height="445" rx="24" fill="#DCEBFA" stroke="#CBD5E1" stroke-width="2"/><text x="398" y="265" font-family="DejaVu Sans, Arial, sans-serif" font-size="28.2" font-weight="700" fill="#172033" text-anchor="start"><tspan x="398" dy="0">Исследование</tspan></text><text x="398" y="304" font-family="DejaVu Sans, Arial, sans-serif" font-size="22.9" font-weight="600" fill="#526071" text-anchor="start"><tspan x="398" dy="0">Clip-Higher в DAPO</tspan><tspan x="398" dy="27">асимметрично</tspan><tspan x="398" dy="27">расширяет</tspan><tspan x="398" dy="27">область роста</tspan><tspan x="398" dy="27">вероятности.</tspan></text><rect x="675" y="215" width="260" height="445" rx="24" fill="#DFF3E4" stroke="#CBD5E1" stroke-width="2"/><text x="703" y="267" font-family="DejaVu Sans, Arial, sans-serif" font-size="28.2" font-weight="700" fill="#172033" text-anchor="start"><tspan x="703" dy="0">Длина</tspan><tspan x="703" dy="31">ответа</tspan></text><text x="703" y="337" font-family="DejaVu Sans, Arial, sans-serif" font-size="22.3" font-weight="600" fill="#526071" text-anchor="start"><tspan x="703" dy="0">Token-Level Policy</tspan><tspan x="703" dy="27">Gradient Loss и Dr.</tspan><tspan x="703" dy="27">GRPO</tspan><tspan x="703" dy="27">пересматривают</tspan><tspan x="703" dy="27">нормировку.</tspan></text><rect x="980" y="215" width="260" height="445" rx="24" fill="#FFF1CC" stroke="#CBD5E1" stroke-width="2"/><text x="1008" y="267" font-family="DejaVu Sans, Arial, sans-serif" font-size="28.2" font-weight="700" fill="#172033" text-anchor="start"><tspan x="1008" dy="0">Теория</tspan><tspan x="1008" dy="31">оценки</tspan></text><text x="1008" y="337" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="400" fill="#526071" text-anchor="start"><tspan x="1008" dy="0">Групповое</tspan><tspan x="1008" dy="27">преимущество</tspan><tspan x="1008" dy="27">центрировано, но</tspan><tspan x="1008" dy="27">может быть</tspan><tspan x="1008" dy="27">смещено</tspan><tspan x="1008" dy="27">относительно</tspan><tspan x="1008" dy="27">истинного</tspan><tspan x="1008" dy="27">преимущества.</tspan></text><rect x="1285" y="215" width="260" height="445" rx="24" fill="#EDE5FA" stroke="#CBD5E1" stroke-width="2"/><text x="1313" y="267" font-family="DejaVu Sans, Arial, sans-serif" font-size="28.2" font-weight="700" fill="#172033" text-anchor="start"><tspan x="1313" dy="0">Системная</tspan><tspan x="1313" dy="31">стоимость</tspan></text><text x="1313" y="337" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="400" fill="#526071" text-anchor="start"><tspan x="1313" dy="0">Асинхронная</tspan><tspan x="1313" dy="27">генерация и</tspan><tspan x="1313" dy="27">раздельные пулы</tspan><tspan x="1313" dy="27">ускоряют контур,</tspan><tspan x="1313" dy="27">но создают</tspan><tspan x="1313" dy="27">устаревшие</tspan><tspan x="1313" dy="27">траектории.</tspan></text><rect x="95" y="720" width="1410" height="100" rx="24" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/><text x="125" y="760" font-family="Arial, DejaVu Sans, sans-serif" font-size="24" font-weight="600" fill="#172033" text-anchor="start"><tspan x="125" dy="0">Перед сравнением рецептов фиксируйте: награду, единицу усреднения, KL, обработку нулевой дисперсии и</tspan><tspan x="125" dy="33">возраст траекторий.</tspan></text></svg>