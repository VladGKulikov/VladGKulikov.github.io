<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker></defs>
<rect width="100%" height="100%" fill="#F8FAFC"/><text x="70" y="70" font-family="Arial, DejaVu Sans, sans-serif" font-size="38" font-weight="700" fill="#172033" text-anchor="start"><tspan x="70" dy="0">Классический RLHF: три стадии и четыре логические роли</tspan></text><text x="70" y="120" font-family="Arial, DejaVu Sans, sans-serif" font-size="23" font-weight="400" fill="#526071" text-anchor="start"><tspan x="70" dy="0">Роли задаёт алгоритм; конкретная система не обязана хранить четыре независимые полные копии модели.</tspan></text><rect x="80" y="205" width="440" height="210" rx="24" fill="#DCEBFA" stroke="#CBD5E1" stroke-width="2"/><text x="108" y="261" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="700" fill="#172033" text-anchor="start"><tspan x="108" dy="0">1 · SFT</tspan></text><text x="108" y="302" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400" fill="#526071" text-anchor="start"><tspan x="108" dy="0">Демонстрации создают</tspan><tspan x="108" dy="29">исходную политику.</tspan></text><path d="M520,310 L575,310" stroke="#475569" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="585" y="205" width="440" height="210" rx="24" fill="#DFF3E4" stroke="#CBD5E1" stroke-width="2"/><text x="613" y="259" font-family="DejaVu Sans, Arial, sans-serif" font-size="28.2" font-weight="700" fill="#172033" text-anchor="start"><tspan x="613" dy="0">2 · Модель</tspan><tspan x="613" dy="34">вознаграждения</tspan></text><text x="613" y="334" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400" fill="#526071" text-anchor="start"><tspan x="613" dy="0">Парные сравнения обучают</tspan><tspan x="613" dy="29">rφ(x, y).</tspan></text><path d="M1025,310 L1080,310" stroke="#475569" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="1090" y="205" width="440" height="210" rx="24" fill="#FFF1CC" stroke="#CBD5E1" stroke-width="2"/><text x="1118" y="261" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="700" fill="#172033" text-anchor="start"><tspan x="1118" dy="0">3 · PPO</tspan></text><text x="1118" y="302" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400" fill="#526071" text-anchor="start"><tspan x="1118" dy="0">Политика повышает награду и</tspan><tspan x="1118" dy="29">ограничивает дрейф через KL.</tspan></text><rect x="80" y="485" width="335" height="135" rx="24" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/><text x="108" y="536" font-family="DejaVu Sans, Arial, sans-serif" font-size="28.2" font-weight="700" fill="#172033" text-anchor="start"><tspan x="108" dy="0">Политика</tspan></text><text x="108" y="575" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="400" fill="#526071" text-anchor="start"><tspan x="108" dy="0">обучается</tspan></text><rect x="455" y="485" width="335" height="135" rx="24" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/><text x="483" y="536" font-family="DejaVu Sans, Arial, sans-serif" font-size="28.2" font-weight="700" fill="#172033" text-anchor="start"><tspan x="483" dy="0">Референс</tspan></text><text x="483" y="575" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="400" fill="#526071" text-anchor="start"><tspan x="483" dy="0">заморожен</tspan></text><rect x="830" y="485" width="335" height="135" rx="24" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/><text x="858" y="530" font-family="DejaVu Sans, Arial, sans-serif" font-size="22.9" font-weight="700" fill="#172033" text-anchor="start"><tspan x="858" dy="0">Модель вознаграждения</tspan></text><text x="858" y="569" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="400" fill="#526071" text-anchor="start"><tspan x="858" dy="0">заморожена</tspan></text><rect x="1205" y="485" width="335" height="135" rx="24" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/><text x="1233" y="536" font-family="DejaVu Sans, Arial, sans-serif" font-size="28.2" font-weight="700" fill="#172033" text-anchor="start"><tspan x="1233" dy="0">Критик</tspan></text><text x="1233" y="571" font-family="DejaVu Sans, Arial, sans-serif" font-size="19.6" font-weight="400" fill="#526071" text-anchor="start"><tspan x="1233" dy="0">обучается или разделяет</tspan><tspan x="1233" dy="22">основу</tspan></text><rect x="80" y="680" width="930" height="145" rx="24" fill="#FBE2E7" stroke="#CBD5E1" stroke-width="2"/><text x="110" y="725" font-family="Arial, DejaVu Sans, sans-serif" font-size="22" font-weight="400" fill="#172033" text-anchor="start"><tspan x="110" dy="0">Учебная оценка для 8.03B: 269.2 GiB постоянных состояний при двух</tspan><tspan x="110" dy="30">обучаемых и двух замороженных полных сетях. Не включены активации,</tspan><tspan x="110" dy="30">KV-состояния, шардирование и выгрузка.</tspan></text><rect x="1040" y="680" width="480" height="145" rx="24" fill="#FFF1CC" stroke="#CBD5E1" stroke-width="2"/><text x="1070" y="725" font-family="Arial, DejaVu Sans, sans-serif" font-size="22" font-weight="600" fill="#172033" text-anchor="start"><tspan x="1070" dy="0">KL-якорь ограничивает дрейф, но не</tspan><tspan x="1070" dy="30">исправляет ошибочную награду и не</tspan><tspan x="1070" dy="30">гарантирует безопасность.</tspan></text></svg>