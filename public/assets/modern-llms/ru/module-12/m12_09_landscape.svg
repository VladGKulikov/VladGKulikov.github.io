<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker></defs>
<rect width="100%" height="100%" fill="#F8FAFC"/><text x="70" y="70" font-family="Arial, DejaVu Sans, sans-serif" font-size="38" font-weight="700" fill="#172033" text-anchor="start"><tspan x="70" dy="0">Три опубликованных способа расширить сигнал постобучения</tspan></text><text x="70" y="120" font-family="Arial, DejaVu Sans, sans-serif" font-size="23" font-weight="400" fill="#526071" text-anchor="start"><tspan x="70" dy="0">Открытые рецепты позволяют обсуждать механизм; поведение закрытой модели не раскрывает её точный</tspan><tspan x="70" dy="29">обучающий стек.</tspan></text><rect x="80" y="220" width="450" height="390" rx="24" fill="#DCEBFA" stroke="#CBD5E1" stroke-width="2"/><text x="108" y="275" font-family="DejaVu Sans, Arial, sans-serif" font-size="29" font-weight="700" fill="#172033" text-anchor="start"><tspan x="108" dy="0">Constitutional AI /</tspan><tspan x="108" dy="35">RLAIF</tspan></text><text x="108" y="351" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400" fill="#526071" text-anchor="start"><tspan x="108" dy="0">Модель критикует и</tspan><tspan x="108" dy="29">переписывает ответы по</tspan><tspan x="108" dy="29">принципам; затем</tspan><tspan x="108" dy="29">AI-предпочтения обучают</tspan><tspan x="108" dy="29">модель вознаграждения и</tspan><tspan x="108" dy="29">RL-политику.</tspan></text><rect x="585" y="220" width="450" height="390" rx="24" fill="#DFF3E4" stroke="#CBD5E1" stroke-width="2"/><text x="613" y="275" font-family="DejaVu Sans, Arial, sans-serif" font-size="29" font-weight="700" fill="#172033" text-anchor="start"><tspan x="613" dy="0">DeepSeek-R1</tspan></text><text x="613" y="316" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400" fill="#526071" text-anchor="start"><tspan x="613" dy="0">Начальный SFT → RL для</tspan><tspan x="613" dy="29">рассуждения → отбор решений</tspan><tspan x="613" dy="29">и новый SFT → общий RL для</tspan><tspan x="613" dy="29">полезности и безопасности.</tspan></text><rect x="1090" y="220" width="450" height="390" rx="24" fill="#EDE5FA" stroke="#CBD5E1" stroke-width="2"/><text x="1118" y="275" font-family="DejaVu Sans, Arial, sans-serif" font-size="29" font-weight="700" fill="#172033" text-anchor="start"><tspan x="1118" dy="0">Интерактивные среды</tspan></text><text x="1118" y="316" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400" fill="#526071" text-anchor="start"><tspan x="1118" dy="0">NeMo Gym описывает данные,</tspan><tspan x="1118" dy="29">агента, инструменты и</tspan><tspan x="1118" dy="29">проверку; NeMo RL и verl</tspan><tspan x="1118" dy="29">организуют многотуровые</tspan><tspan x="1118" dy="29">траектории и обновления.</tspan></text><rect x="110" y="690" width="1380" height="125" rx="24" fill="#FFF1CC" stroke="#CBD5E1" stroke-width="2"/><text x="140" y="735" font-family="Arial, DejaVu Sans, sans-serif" font-size="23.1" font-weight="600" fill="#172033" text-anchor="start"><tspan x="140" dy="0">Надёжная формулировка для закрытой системы: “точный рецепт постобучения не раскрыт”. Thinking mode,</tspan><tspan x="140" dy="31">скрытые рассуждения и работа с инструментами не идентифицируют алгоритм.</tspan></text></svg>