<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="763" viewBox="0 0 1100 763">
<title>Кэш сохраняет вычисленные K/V</title>
<desc>При неизменных весах следующий токен получает позицию 3, а не 0.</desc>
<rect width="1100" height="763" fill="#FFFFFF"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9 Z" fill="#4C566A"/></marker></defs>
<text x="40" y="52" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="700" fill="#2E3440" text-anchor="start">Кэш сохраняет вычисленные K/V</text>
<text x="40" y="97" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" fill="#4C566A" text-anchor="start">При неизменных весах следующий токен получает позицию 3, а не 0.</text>
<rect x="150" y="222" width="890" height="220" rx="12" fill="white" stroke="#D8DEE9" stroke-width="1.3"/>
<rect x="180" y="132" width="190" height="65" rx="12" fill="#ECEFF4" stroke="#D8DEE9" stroke-width="1.3"/>
