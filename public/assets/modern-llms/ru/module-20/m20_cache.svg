<text x="935.0" y="280.5" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="400" fill="#2E3440" text-anchor="middle">K (RoPE)</text>
<rect x="840" y="352" width="190" height="65" rx="12" fill="#F3EEF3" stroke="#D8DEE9" stroke-width="1.3"/>
<text x="935.0" y="390.5" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="400" fill="#2E3440" text-anchor="middle">V</text>
<path d="M935,197 L935,237" fill="none" stroke="#4C566A" stroke-width="2" marker-end="url(#arrow)"/>
<text x="40" y="284" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" fill="#2E3440" text-anchor="start">K</text>
<text x="40" y="394" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" fill="#2E3440" text-anchor="start">V</text>
<rect x="840" y="472" width="190" height="75" rx="12" fill="#F3EEF3" stroke="#D8DEE9" stroke-width="1.3"/>
<text x="935.0" y="515.5" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="400" fill="#2E3440" text-anchor="middle">Q (RoPE: 3)</text>
<rect x="320" y="592" width="500" height="80" rx="12" fill="#EFF4EA" stroke="#D8DEE9" stroke-width="1.3"/>
<text x="570.0" y="638.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="400" fill="#2E3440" text-anchor="middle">Новый запрос читает K/V позиций 0–3</text>
<path d="M935,547 L935,632 L825,632" fill="none" stroke="#4C566A" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M570,442 L570,587" fill="none" stroke="#4C566A" stroke-width="2" marker-end="url(#arrow)"/>
<text x="40" y="724" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" fill="#4C566A" text-anchor="start">В каждом слое — свой кэш. Новый шаг добавляет ключ и значение одной позиции.</text>
</svg>
