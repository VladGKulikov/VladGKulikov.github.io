<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="884" viewBox="0 0 1100 884">
<title>Разные механизмы, разные шаги</title>
<desc>Сравниваем состояние и направление вычисления, а не качество моделей.</desc>
<rect width="1100" height="884" fill="#FFFFFF"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9 Z" fill="#4C566A"/></marker></defs>
<text x="40" y="52" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="700" fill="#2E3440" text-anchor="start">Разные механизмы, разные шаги</text>
<text x="40" y="97" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" fill="#4C566A" text-anchor="start">Сравниваем состояние и направление вычисления, а не качество моделей.</text>
<text x="40" y="155" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="700" fill="#2E3440" text-anchor="start">Авторегрессионное внимание</text>
<rect x="40" y="182" width="300" height="100" rx="12" fill="#E8EEF5" stroke="#D8DEE9" stroke-width="1.3"/>
<text x="190.0" y="224.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="400" fill="#2E3440" text-anchor="middle">Префикс</text>
<text x="190.0" y="252.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="400" fill="#2E3440" text-anchor="middle">BOS A B</text>
<path d="M340,232 L395,232" fill="none" stroke="#4C566A" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="400" y="182" width="300" height="100" rx="12" fill="#E8EEF5" stroke="#D8DEE9" stroke-width="1.3"/>
<text x="550.0" y="224.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="400" fill="#2E3440" text-anchor="middle">Запрос + K/V</text>
<text x="550.0" y="252.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="400" fill="#2E3440" text-anchor="middle">доступных позиций</text>
<path d="M700,232 L755,232" fill="none" stroke="#4C566A" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="760" y="182" width="300" height="100" rx="12" fill="#E8EEF5" stroke="#D8DEE9" stroke-width="1.3"/>
<text x="910.0" y="224.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="400" fill="#2E3440" text-anchor="middle">Распределение</text>
<text x="910.0" y="252.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="400" fill="#2E3440" text-anchor="middle">следующего токена</text>
<text x="40" y="320" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" fill="#4C566A" text-anchor="start">Шаг добавляет одну позицию; K/V сохраняются отдельно для каждой позиции.</text>
<text x="40" y="395" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="700" fill="#2E3440" text-anchor="start">SSM</text>
<rect x="40" y="422" width="300" height="100" rx="12" fill="#EFF4EA" stroke="#D8DEE9" stroke-width="1.3"/>
<text x="190.0" y="464.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="400" fill="#2E3440" text-anchor="middle">Прошлое состояние</text>
<text x="190.0" y="492.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="400" fill="#2E3440" text-anchor="middle">+ новый вход</text>
<path d="M340,472 L395,472" fill="none" stroke="#4C566A" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="400" y="422" width="300" height="100" rx="12" fill="#EFF4EA" stroke="#D8DEE9" stroke-width="1.3"/>
<text x="550.0" y="464.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="400" fill="#2E3440" text-anchor="middle">Рекуррентное</text>
<text x="550.0" y="492.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="400" fill="#2E3440" text-anchor="middle">обновление</text>
<path d="M700,472 L755,472" fill="none" stroke="#4C566A" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="760" y="422" width="300" height="100" rx="12" fill="#EFF4EA" stroke="#D8DEE9" stroke-width="1.3"/>
<text x="910.0" y="464.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="400" fill="#2E3440" text-anchor="middle">Новое состояние</text>
<text x="910.0" y="492.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="400" fill="#2E3440" text-anchor="middle">+ выход</text>
<text x="40" y="560" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" fill="#4C566A" text-anchor="start">Шаг обрабатывает входную позицию; форма состояния фиксирована архитектурой.</text>
<text x="40" y="635" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="700" fill="#2E3440" text-anchor="start">Диффузионное уточнение</text>
<rect x="40" y="662" width="300" height="100" rx="12" fill="#F3EEF3" stroke="#D8DEE9" stroke-width="1.3"/>
<text x="190.0" y="704.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="400" fill="#2E3440" text-anchor="middle">Зашумлённая</text>
<text x="190.0" y="732.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="400" fill="#2E3440" text-anchor="middle">последовательность</text>
<path d="M340,712 L395,712" fill="none" stroke="#4C566A" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="400" y="662" width="300" height="100" rx="12" fill="#F3EEF3" stroke="#D8DEE9" stroke-width="1.3"/>
<text x="550.0" y="704.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="400" fill="#2E3440" text-anchor="middle">Деноизер +</text>
<text x="550.0" y="732.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="400" fill="#2E3440" text-anchor="middle">обратный переход</text>
<path d="M700,712 L755,712" fill="none" stroke="#4C566A" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="760" y="662" width="300" height="100" rx="12" fill="#F3EEF3" stroke="#D8DEE9" stroke-width="1.3"/>
<text x="910.0" y="704.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="400" fill="#2E3440" text-anchor="middle">Уточнённая</text>
<text x="910.0" y="732.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="400" fill="#2E3440" text-anchor="middle">последовательность</text>
<text x="40" y="800" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" fill="#4C566A" text-anchor="start">Шаг меняет состояние всей последовательности; до результата ведут разные пути.</text>
</svg>
