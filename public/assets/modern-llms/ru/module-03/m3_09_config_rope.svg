<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<rect width="1600" height="900" fill="#FFFFFF"/>
<text x="70" y="72" font-family="Arial, sans-serif" font-size="39.1" font-weight="700" fill="#2E3440">Как читать RoPE-конфигурацию gpt-oss</text>
<text x="70" y="112" font-family="Arial, sans-serif" font-size="19.6" fill="#5B6472">Поля описывают геометрию масштабирования, но не заменяют журнал обучения</text>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#4C78A8"/></marker></defs>
<rect x="55" y="210" width="280" height="220" rx="18" fill="#EAF1FB" stroke="#CBD3DF" stroke-width="2"/>
<text x="77" y="251" text-anchor="start" font-family="Arial, sans-serif" font-size="23.5" font-weight="700" fill="#2E3440">
<tspan x="77" dy="0">head_dim = 64</tspan>
</text>
<text x="77" y="286" text-anchor="start" font-family="Arial, sans-serif" font-size="19.6" font-weight="400" fill="#5B6472">
<tspan x="77" dy="0">32 rotary-пары</tspan>
</text>
<rect x="355" y="210" width="280" height="220" rx="18" fill="#EDF7ED" stroke="#CBD3DF" stroke-width="2"/>
<text x="377" y="251" text-anchor="start" font-family="Arial, sans-serif" font-size="23.5" font-weight="700" fill="#2E3440">
<tspan x="377" dy="0">rope_theta = 150000</tspan>
</text>
<text x="377" y="286" text-anchor="start" font-family="Arial, sans-serif" font-size="17.4" font-weight="400" fill="#5B6472">
<tspan x="377" dy="0">Геометрическая лестница</tspan>
<tspan x="377" dy="23">частот</tspan>
</text>
<rect x="655" y="210" width="280" height="220" rx="18" fill="#FFF5DD" stroke="#CBD3DF" stroke-width="2"/>
<text x="677" y="251" text-anchor="start" font-family="Arial, sans-serif" font-size="21.3" font-weight="700" fill="#2E3440">
<tspan x="677" dy="0">initial_context_length</tspan>
<tspan x="677" dy="25">= 4096</tspan>
</text>
<text x="677" y="311" text-anchor="start" font-family="Arial, sans-serif" font-size="19.6" font-weight="400" fill="#5B6472">
<tspan x="677" dy="0">Референсная длина</tspan>
<tspan x="677" dy="23">масштабирования</tspan>
</text>
<rect x="955" y="210" width="280" height="220" rx="18" fill="#F3EDFA" stroke="#CBD3DF" stroke-width="2"/>
<text x="977" y="251" text-anchor="start" font-family="Arial, sans-serif" font-size="23.5" font-weight="700" fill="#2E3440">
<tspan x="977" dy="0">factor = 32</tspan>
</text>
<text x="977" y="286" text-anchor="start" font-family="Arial, sans-serif" font-size="19.6" font-weight="400" fill="#5B6472">
<tspan x="977" dy="0">Целевой коэффициент</tspan>
<tspan x="977" dy="23">расширения</tspan>
</text>
<rect x="1255" y="210" width="280" height="220" rx="18" fill="#E8F7F5" stroke="#CBD3DF" stroke-width="2"/>
<text x="1277" y="251" text-anchor="start" font-family="Arial, sans-serif" font-size="23.5" font-weight="700" fill="#2E3440">
<tspan x="1277" dy="0">alpha=1 · beta=32</tspan>
</text>
<text x="1277" y="286" text-anchor="start" font-family="Arial, sans-serif" font-size="19.6" font-weight="400" fill="#5B6472">
<tspan x="1277" dy="0">Параметры частотной</tspan>
<tspan x="1277" dy="23">рампы</tspan>
</text>
<line x1="790" y1="450" x2="790" y2="540" stroke="#4C78A8" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="215" y="560" width="1170" height="125" rx="18" fill="#EAF1FB" stroke="#CBD3DF" stroke-width="2"/>
<text x="243" y="610" text-anchor="start" font-family="Arial, sans-serif" font-size="28.2" font-weight="700" fill="#2E3440">
<tspan x="243" dy="0">Вычисленная геометрия</tspan>
</text>
<text x="243" y="649" text-anchor="start" font-family="Arial, sans-serif" font-size="19.6" font-weight="400" fill="#5B6472">
<tspan x="243" dy="0">Учебная реконструкция: low≈8.09 · high≈17.40 · attention_factor=1.3466 · множитель логита=1.8133;</tspan>
<tspan x="243" dy="25">truncate=True даёт 8/18</tspan>
</text>
<rect x="215" y="720" width="1170" height="110" rx="18" fill="#FCEBEC" stroke="#CBD3DF" stroke-width="2"/>
<text x="243" y="768" text-anchor="start" font-family="Arial, sans-serif" font-size="28.2" font-weight="700" fill="#2E3440">
<tspan x="243" dy="0">Граница доказательства</tspan>
</text>
<text x="243" y="805" text-anchor="start" font-family="Arial, sans-serif" font-size="19.6" font-weight="400" fill="#5B6472">
<tspan x="243" dy="0">Не следует: полное расписание претрейна, число фаз или доказательство качества на всей целевой</tspan>
<tspan x="243" dy="23">длине.</tspan>
</text>
</svg>
