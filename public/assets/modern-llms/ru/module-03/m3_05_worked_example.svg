<svg viewBox="0 0 900 360" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <title>Решённый пример относительности</title>
  <desc>Размерность головы равна 4: показаны углы двух пар, повёрнутые векторы и три пары позиций с одинаковой разностью, дающие один логит.</desc>
  <text x="30" y="30" font-size="22" font-weight="700" fill="#2E3440">Относительность в числах (разобранный пример): d<tspan baseline-shift="sub" font-size="15">head</tspan> = 4, Δ = 2</text>

  <g font-family="DejaVu Sans Mono, ui-monospace, 'SF Mono', Menlo, monospace" font-size="11">
    <text x="30" y="66" fill="#4C566A" font-weight="600">q = (1, 0, 0.5, 0.5)   k = (0, 1, 1, -0.5)   θ₀ = 1 рад/поз · θ₁ = 0.01</text>
  </g>

  <rect x="30" y="84" width="410" height="120" rx="12" fill="#ECEFF4" stroke="#D8DEE9"/>
  <text x="48" y="108" font-size="15.9" font-weight="700" fill="#2E3440">Шаг 1–2 · поворот при m = 3, n = 1</text>
  <g font-family="DejaVu Sans Mono, ui-monospace, 'SF Mono', Menlo, monospace" font-size="10.5" fill="#2E3440">
    <text x="48" y="132" font-size="12.7" font-weight="600">углы пары 0: 3.000 рад (≈172°) · пары 1: 0.030</text>
    <text x="48" y="154" font-size="13.2" font-weight="600">R₃q = (-0.990, 0.141, 0.485, 0.515)</text>
    <text x="48" y="176" font-size="13.2" font-weight="600">R₁k = (-0.842, 0.540, 1.005, -0.490)</text>
  </g>
  <text x="48" y="196" font-size="9.2" fill="#4C566A" font-style="italic">нормы пар не изменились — поворот есть поворот</text>

  <rect x="460" y="84" width="410" height="120" rx="12" fill="#EFF4EA" stroke="#A3BE8C" stroke-width="1.2"/>
  <text x="478" y="108" font-size="15.9" font-weight="700" fill="#2E3440">Шаг 3 · три размещения, одна разность</text>
  <g font-family="DejaVu Sans Mono, ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#2E3440">
    <text x="478" y="134" font-size="13.2" font-weight="600">&lt;R₃q, R₁k&gt; = 1.144248</text>
    <text x="478" y="156" font-size="13.2" font-weight="600">&lt;R₇q, R₅k&gt; = 1.144248</text>
    <text x="478" y="178" font-size="13.2" font-weight="600">&lt;R₂q, R₀k&gt; = 1.144248</text>
  </g>
  <text x="478" y="197" font-size="9.2" fill="#4C566A" font-style="italic">|Δ| меньше 1e-12: сдвиг обеих позиций невидим</text>

  <line x1="30" y1="228" x2="870" y2="228" stroke="#D8DEE9" stroke-width="0.75"/>
  <g font-size="10.5" fill="#2E3440">
    <text x="30" y="254" font-size="11">Почему: &lt;Rₘq, Rₙk&gt; = qᵀRₘᵀRₙk = qᵀRₙ₋ₘk — абсолютные позиции сокращаются тождественно.</text>
    <text x="30" y="276" font-size="11">Быстрая пара (θ₀ = 1) при m = 3 прошла почти пол-оборота; медленная (θ₁ = 0.01) — лишь 0.03 рад:</text>
    <text x="30" y="296" font-size="11">позиция записана «разрядами» разной крупности — тот же принцип, что у синусоид Vaswani.</text>
    <text x="30" y="326" fill="#4C566A" font-style="italic">проверочный код курса закрепляет пример assert'ом на сотнях случайных троек позиций (допуск 1e-10)</text>
  </g>
</svg>
