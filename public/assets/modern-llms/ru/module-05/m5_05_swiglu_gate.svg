<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<rect width="1600" height="900" fill="#FFFFFF"/>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#4C78A8"/></marker></defs>
<text x="70" y="70" font-family="DejaVu Sans, Arial, sans-serif" font-size="34" font-weight="700" fill="#2E3440">SwiGLU: мультипликативный гейт и граф gpt-oss</text>
<text x="70" y="108" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" fill="#5B6472">Clamp подтверждён кодом; исходная мотивация дизайна требует отдельного источника</text>
<rect x="80" y="200" width="650" height="480" rx="18" fill="#EAF1FB" stroke="#CBD3DF" stroke-width="2"/>
<text x="112" y="257" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="700" fill="#2E3440">
<tspan x="112" dy="0">Стандартный SwiGLU</tspan>
</text>
<text x="112" y="302" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="400" fill="#5B6472">
<tspan x="112" dy="0">gate = xWgate</tspan>
<tspan x="112" dy="28">up = xWup</tspan>
<tspan x="112" dy="28">product = SiLU(gate) ⊙ up</tspan>
<tspan x="112" dy="28">out = product Wdown</tspan>
<tspan x="112" dy="28"></tspan>
<tspan x="112" dy="28">Три матрицы создают зависящее от входа</tspan>
<tspan x="112" dy="28">мультипликативное взаимодействие.</tspan>
</text>
<rect x="870" y="200" width="650" height="480" rx="18" fill="#FFF5DD" stroke="#CBD3DF" stroke-width="2"/>
<text x="902" y="257" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="700" fill="#2E3440">
<tspan x="902" dy="0">Публичный вариант gpt-oss</tspan>
</text>
<text x="902" y="302" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="400" fill="#5B6472">
<tspan x="902" dy="0">g ← min(g, 7)</tspan>
<tspan x="902" dy="28">u ← clip(u, −7, 7)</tspan>
<tspan x="902" dy="28">out = g·sigmoid(1.702g)·(u+1)</tspan>
<tspan x="902" dy="28"></tspan>
<tspan x="902" dy="28">Фиксированное ограничение диапазона входит в</tspan>
<tspan x="902" dy="28">функцию, с которой обучались веса. На положительной</tspan>
<tspan x="902" dy="28">диагонали z=7 и z=9 дают ≈56.</tspan>
</text>
<rect x="300" y="735" width="1000" height="100" rx="18" fill="#E8F7F5" stroke="#CBD3DF" stroke-width="2"/>
<text x="323" y="779" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="700" fill="#2E3440">
<tspan x="323" dy="0">Граница доказательства</tspan>
</text>
<text x="323" y="819" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" fill="#5B6472">
<tspan x="323" dy="0">Код устанавливает формулу. «Сделано ради MXFP4» остаётся инженерной интерпретацией без</tspan>
<tspan x="323" dy="24">прямого заявления авторов.</tspan>
</text>
</svg>
