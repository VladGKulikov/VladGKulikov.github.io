<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="534" viewBox="0 0 1100 534">
<title>gpt-oss-120b: от размеров к байтам</title>
<desc>Фиксированная конфигурация и эталонный код, ссылки в §14.</desc>
<rect width="1100" height="534" fill="#FFFFFF"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9 Z" fill="#4C566A"/></marker></defs>
<text x="40" y="52" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="700" fill="#2E3440" text-anchor="start">gpt-oss-120b: от размеров к байтам</text>
<text x="40" y="97" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" fill="#4C566A" text-anchor="start">Фиксированная конфигурация и эталонный код, ссылки в §14.</text>
<rect x="40.0" y="132" width="498.0" height="149" rx="12" fill="#E8EEF5" stroke="#D8DEE9" stroke-width="1.3"/>
<text x="64.0" y="176" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" fill="#2E3440" text-anchor="start">64 / 8 = 8</text>
<text x="64.0" y="217" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" fill="#4C566A" text-anchor="start">Голов запросов / KV-голов</text>
<text x="64.0" y="242" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" fill="#4C566A" text-anchor="start">8 запросов в группе</text>
<rect x="562.0" y="132" width="498.0" height="149" rx="12" fill="#EFF4EA" stroke="#D8DEE9" stroke-width="1.3"/>
<text x="586.0" y="176" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" fill="#2E3440" text-anchor="start">2 × 8 × 64 × 2 = 2048 B</text>
<text x="586.0" y="217" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" fill="#4C566A" text-anchor="start">K + V; 64 координаты; BF16</text>
<text x="586.0" y="242" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" fill="#4C566A" text-anchor="start">На слой и сохранённую позицию</text>
<rect x="40.0" y="305" width="498.0" height="149" rx="12" fill="#F3EEF3" stroke="#D8DEE9" stroke-width="1.3"/>
<text x="64.0" y="349" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" fill="#2E3440" text-anchor="start">18 × 131 072 + 18 × 128</text>
<text x="64.0" y="390" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" fill="#4C566A" text-anchor="start">Записи «слой × позиция»</text>
<text x="64.0" y="415" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" fill="#4C566A" text-anchor="start">При ограниченных локальных кэшах</text>
<rect x="562.0" y="305" width="498.0" height="149" rx="12" fill="#FAF0E8" stroke="#D8DEE9" stroke-width="1.3"/>
<text x="586.0" y="349" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" fill="#2E3440" text-anchor="start">4.50439453125 GiB</text>
<text x="586.0" y="390" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" fill="#4C566A" text-anchor="start">K/V одной последовательности</text>
<text x="586.0" y="415" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" fill="#4C566A" text-anchor="start">Веса и рабочие массивы не включены</text>
<text x="40" y="495" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" fill="#4C566A" text-anchor="start">Эталонный PyTorch-код показывает маски и sink, но не реализует такой ограниченный кэш.</text>
</svg>
