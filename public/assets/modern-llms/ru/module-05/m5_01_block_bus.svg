<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<rect width="1600" height="900" fill="#FFFFFF"/>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#4C78A8"/></marker></defs>
<text x="70" y="70" font-family="DejaVu Sans, Arial, sans-serif" font-size="34" font-weight="700" fill="#2E3440">Residual stream: прямой путь и две поправки</text>
<text x="70" y="108" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" fill="#5B6472">Тождественный маршрут облегчает оптимизацию, но не делает обученные слои необязательными</text>
<rect x="115" y="190" width="1370" height="78" rx="20" fill="#EDF7ED" stroke="#A3BE8C" stroke-width="3"/>
<text x="150" y="238" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="700" fill="#2E3440">
<tspan x="150" dy="0">residual stream h</tspan>
</text>
<line x1="470" y1="229" x2="1430" y2="229" stroke="#4C78A8" stroke-width="3" marker-end="url(#arrow)"/>
<text x="950" y="215" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" fill="#5B6472">
<tspan x="950" dy="0">прямой единичный компонент в якобиане</tspan>
</text>
<rect x="145" y="360" width="480" height="260" rx="18" fill="#EAF1FB" stroke="#CBD3DF" stroke-width="2"/>
<text x="173" y="411" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="700" fill="#2E3440">
<tspan x="173" dy="0">Ветвь attention</tspan>
</text>
<text x="173" y="454" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" fill="#5B6472">
<tspan x="173" dy="0">прочитать Norm₁(h) → вычислить</tspan>
<tspan x="173" dy="25">attention → добавить Δattn в поток</tspan>
</text>
<rect x="975" y="360" width="480" height="260" rx="18" fill="#FFF5DD" stroke="#CBD3DF" stroke-width="2"/>
<text x="1003" y="411" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="700" fill="#2E3440">
<tspan x="1003" dy="0">Ветвь FFN</tspan>
</text>
<text x="1003" y="454" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" fill="#5B6472">
<tspan x="1003" dy="0">прочитать Norm₂(h′) → вычислить</tspan>
<tspan x="1003" dy="25">гейтованный FFN → добавить ΔFFN в</tspan>
<tspan x="1003" dy="25">поток</tspan>
</text>
<line x1="385" y1="360" x2="385" y2="285" stroke="#4C78A8" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="1215" y1="360" x2="1215" y2="285" stroke="#4C78A8" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="625" y1="490" x2="860" y2="490" stroke="#4C78A8" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="975" y1="490" x2="860" y2="490" stroke="#4C78A8" stroke-width="3" marker-end="url(#arrow)"/>
<circle cx="860" cy="490" r="34" fill="white" stroke="#4C78A8" stroke-width="3"/>
<text x="860" y="500" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="31" font-weight="700" fill="#2E3440">
<tspan x="860" dy="0">+</tspan>
</text>
<rect x="260" y="705" width="1080" height="120" rx="18" fill="#E8F7F5" stroke="#CBD3DF" stroke-width="2"/>
<text x="288" y="755" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" fill="#2E3440">
<tspan x="288" dy="0">Что следует из схемы</tspan>
</text>
<text x="288" y="796" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" fill="#5B6472">
<tspan x="288" dy="0">Для сигнала и градиента существует чистый маршрут. Можно ли безопасно удалить уже обученный подслой</tspan>
<tspan x="288" dy="25">— отдельный эмпирический вопрос прореживания (pruning) или абляции.</tspan>
</text>
</svg>
