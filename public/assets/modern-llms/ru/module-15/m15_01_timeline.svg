<text x="132" y="238" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="700" fill="#263238" text-anchor="start"><tspan x="132" dy="0">BM25</tspan><tspan x="132" dy="29.5">и инвертированный индекс</tspan></text>
<text x="102" y="315.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="400" fill="#5F6B78" text-anchor="start"><tspan x="102" dy="0">Точный редкий терм</tspan><tspan x="102" dy="28.560000000000002">остаётся видимым</tspan></text>
