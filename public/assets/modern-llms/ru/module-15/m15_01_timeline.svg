<text x="1044" y="238" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="700" fill="#263238" text-anchor="start"><tspan x="1044" dy="0">Late chunking</tspan><tspan x="1044" dy="29.5">и ColPali</tspan></text>
<text x="1014" y="315.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="400" fill="#5F6B78" text-anchor="start"><tspan x="1014" dy="0">Сохраняются контекст,</tspan><tspan x="1014" dy="28.560000000000002">страница и макет</tspan></text>
