<text x="1318" y="285.5" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="400" fill="#5F6B78" text-anchor="start"><tspan x="1318" dy="0">Поиск становится</tspan><tspan x="1318" dy="28.560000000000002">действием в цикле</tspan></text>
<text x="800" y="760" font-family="DejaVu Sans,Arial,sans-serif" font-size="28.2" font-weight="700" fill="#263238" text-anchor="middle"><tspan x="800" dy="0">Сжатие дешевеет → следующая работа восстанавливает важную деталь</tspan></text>
