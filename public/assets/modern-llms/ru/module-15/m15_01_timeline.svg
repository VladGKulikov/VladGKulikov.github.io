<text x="436" y="238" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="700" fill="#263238" text-anchor="start"><tspan x="436" dy="0">DPR / плотный</tspan><tspan x="436" dy="29.5">bi-encoder</tspan></text>
<text x="406" y="315.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="400" fill="#5F6B78" text-anchor="start"><tspan x="406" dy="0">Перефразировка становится</tspan><tspan x="406" dy="28.560000000000002">геометрической близостью</tspan></text>
