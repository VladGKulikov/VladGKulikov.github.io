<text x="740" y="238" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="700" fill="#263238" text-anchor="start"><tspan x="740" dy="0">ColBERT</tspan><tspan x="740" dy="29.5">Late Interaction</tspan></text>
<text x="710" y="315.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="400" fill="#5F6B78" text-anchor="start"><tspan x="710" dy="0">Возвращается токенная</tspan><tspan x="710" dy="28.560000000000002">структура документа</tspan></text>
