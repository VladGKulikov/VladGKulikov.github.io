<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="735" viewBox="0 0 1100 735">
<title>Как менялись инженерные вопросы</title>
<desc>Периоды перекрываются: новые ограничения добавляются к прежним.</desc>
<rect width="1100" height="735" fill="#FFFFFF"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9 Z" fill="#4C566A"/></marker></defs>
<text x="40" y="52" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="700" fill="#2E3440" text-anchor="start">Как менялись инженерные вопросы</text>
<text x="40" y="97" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" fill="#4C566A" text-anchor="start">Периоды перекрываются: новые ограничения добавляются к прежним.</text>
<text x="40" y="158" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="700" fill="#2E3440" text-anchor="start">2017–2019</text>
<circle cx="238" cy="156" r="6" fill="#5E81AC"/>
<line x1="238" y1="163" x2="238" y2="251" stroke="#D8DEE9" stroke-width="2"/>
<text x="270" y="154" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" fill="#2E3440" text-anchor="start">Архитектура</text>
<text x="270" y="186" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" fill="#4C566A" text-anchor="start">Как обучать сеть на больших корпусах?</text>
<text x="40" y="260" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="700" fill="#2E3440" text-anchor="start">2020–2021</text>
<circle cx="238" cy="258" r="6" fill="#5E81AC"/>
<line x1="238" y1="265" x2="238" y2="353" stroke="#D8DEE9" stroke-width="2"/>
<text x="270" y="256" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" fill="#2E3440" text-anchor="start">Масштаб</text>
<text x="270" y="288" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" fill="#4C566A" text-anchor="start">Как согласовать размер модели и вычисления?</text>
<text x="40" y="362" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="700" fill="#2E3440" text-anchor="start">2022</text>
<circle cx="238" cy="360" r="6" fill="#5E81AC"/>
<line x1="238" y1="367" x2="238" y2="455" stroke="#D8DEE9" stroke-width="2"/>
<text x="270" y="358" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" fill="#2E3440" text-anchor="start">Данные и обучение ассистента</text>
<text x="270" y="390" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" fill="#4C566A" text-anchor="start">Какой обучающий сигнал нужен для полезного ответа?</text>
<text x="40" y="464" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="700" fill="#2E3440" text-anchor="start">2023–2024</text>
<circle cx="238" cy="462" r="6" fill="#5E81AC"/>
<line x1="238" y1="469" x2="238" y2="557" stroke="#D8DEE9" stroke-width="2"/>
<text x="270" y="460" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" fill="#2E3440" text-anchor="start">Память и инференс</text>
<text x="270" y="492" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" fill="#4C566A" text-anchor="start">Как хранить веса и обрабатывать длинный вход?</text>
<text x="40" y="566" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="700" fill="#2E3440" text-anchor="start">2024–2025</text>
<circle cx="238" cy="564" r="6" fill="#5E81AC"/>
<line x1="238" y1="571" x2="238" y2="659" stroke="#D8DEE9" stroke-width="2"/>
<text x="270" y="562" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" fill="#2E3440" text-anchor="start">Вычисления при ответе</text>
<text x="270" y="594" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" fill="#4C566A" text-anchor="start">Как распределять усилия между запросами?</text>
<text x="40" y="668" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="700" fill="#2E3440" text-anchor="start">2025–2026</text>
<circle cx="238" cy="666" r="6" fill="#5E81AC"/>
<text x="270" y="664" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" fill="#2E3440" text-anchor="start">Модель внутри системы</text>
<text x="270" y="696" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" fill="#4C566A" text-anchor="start">Как связать инструменты, разрешения и проверку?</text>
</svg>
