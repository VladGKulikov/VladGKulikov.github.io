<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="571" viewBox="0 0 1100 571">
<title>Плотный блок и выбор экспертов</title>
<desc>Схема одного полносвязного блока. Яркие узлы участвуют в обработке данного токена.</desc>
<rect width="1100" height="571" fill="#FFFFFF"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9 Z" fill="#4C566A"/></marker></defs>
<text x="40" y="52" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="700" fill="#2E3440" text-anchor="start">Плотный блок и выбор экспертов</text>
<text x="40" y="97" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" fill="#4C566A" text-anchor="start">Схема одного полносвязного блока. Яркие узлы участвуют в обработке данного токена.</text>
<rect x="40" y="132" width="498" height="355" rx="12" fill="#E8EEF5" stroke="#D8DEE9" stroke-width="1.3"/>
<text x="64" y="174" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" fill="#2E3440" text-anchor="start">Плотный FFN</text>
<rect x="562" y="132" width="498" height="355" rx="12" fill="#F3EEF3" stroke="#D8DEE9" stroke-width="1.3"/>
<text x="586" y="174" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" fill="#2E3440" text-anchor="start">MoE</text>
<text x="75" y="250" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" fill="#2E3440" text-anchor="start">вектор токена</text>
<path d="M170,267 L170,298" fill="none" stroke="#4C566A" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="75" y="313" width="270" height="64" rx="12" fill="#EFF4EA" stroke="#D8DEE9" stroke-width="1.3"/>
<text x="210.0" y="349" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="700" fill="#2E3440" text-anchor="middle">Один набор матриц</text>
<text x="75" y="426" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" fill="#2E3440" text-anchor="start">Те же веса для всех токенов</text>
<rect x="690" y="216" width="240" height="55" rx="12" fill="#EFF4EA" stroke="#D8DEE9" stroke-width="1.3"/>
<text x="810.0" y="250" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="700" fill="#2E3440" text-anchor="middle">Маршрутизатор</text>
<path d="M810,280 L631,317" fill="none" stroke="#4C566A" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="585" y="331" width="90" height="62" rx="12" fill="#EFF4EA" stroke="#5E81AC" stroke-width="1.3"/>
<text x="630.0" y="369" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="700" fill="#2E3440" text-anchor="middle">E1</text>
<path d="M810,280 L744,317" fill="none" stroke="#4C566A" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="698" y="331" width="90" height="62" rx="12" fill="#ECEFF4" stroke="#D8DEE9" stroke-width="1.3"/>
<text x="743.0" y="369" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="700" fill="#2E3440" text-anchor="middle">E2</text>
<path d="M810,280 L857,317" fill="none" stroke="#4C566A" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="811" y="331" width="90" height="62" rx="12" fill="#EFF4EA" stroke="#5E81AC" stroke-width="1.3"/>
<text x="856.0" y="369" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="700" fill="#2E3440" text-anchor="middle">E3</text>
<path d="M810,280 L970,317" fill="none" stroke="#4C566A" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="924" y="331" width="90" height="62" rx="12" fill="#ECEFF4" stroke="#D8DEE9" stroke-width="1.3"/>
<text x="969.0" y="369" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="700" fill="#2E3440" text-anchor="middle">E4</text>
<text x="585" y="426" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" fill="#2E3440" text-anchor="start">Пример: выбраны 2 из 4. Остальные веса</text>
<text x="585" y="451" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" fill="#2E3440" text-anchor="start">хранятся, но не вычисляют этот токен.</text>
<text x="40" y="532" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" fill="#4C566A" text-anchor="start">Total описывает полный банк весов. Active требует правила подсчёта: эксперты — лишь часть модели.</text>
</svg>
