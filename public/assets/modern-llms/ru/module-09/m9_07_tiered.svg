<svg viewBox="0 0 940 360" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <title>Tiered offloading</title>
  <desc>Иерархия памяти, LMCache, Mooncake и анонсированный NVIDIA CMX.</desc>
  <defs><marker id="a97" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M1 1 L8 4.5 L1 8 Z" fill="#4C566A"/></marker></defs>
  <text x="30" y="30" font-size="23" font-weight="700" fill="#2E3440">Куда выносить KV: иерархия хранения и transport layer</text>

  <g font-size="9.5" text-anchor="middle">
    <rect x="40" y="56" width="190" height="46" rx="8" fill="#F8ECEC" stroke="#BF616A" stroke-width="1.2"/><text x="135" y="76" font-weight="700" fill="#2E3440" font-size="16.6">GPU HBM</text><text x="135" y="93" font-size="10.1" fill="#4C566A">vendor 80–192 GB · быстро, мало</text>
    <rect x="40" y="118" width="190" height="46" rx="8" fill="#FAF5E3" stroke="#EBCB8B"/><text x="135" y="138" font-weight="700" fill="#2E3440" font-size="16.6">CPU DRAM</text><text x="135" y="155" font-size="12" fill="#4C566A">vendor 1–2 TB/node</text>
    <rect x="40" y="180" width="190" height="46" rx="8" fill="#EFF4EA" stroke="#A3BE8C"/><text x="135" y="200" font-weight="700" fill="#2E3440" font-size="16.6">NVMe SSD</text><text x="135" y="217" font-size="9.5" fill="#4C566A">vendor 30+ TB · медленно, огромно</text>
    <rect x="40" y="242" width="190" height="46" rx="8" fill="#E8EEF5" stroke="#5E81AC"/><text x="135" y="262" font-weight="700" fill="#2E3440" font-size="13.8">Сеть / RDMA</text><text x="135" y="279" font-size="13.8" fill="#4C566A" font-weight="600">multi-node backends</text>
  </g>
  <g stroke="#4C566A" stroke-width="1.1">
    <line x1="135" y1="102" x2="135" y2="114" marker-end="url(#a97)"/>
    <line x1="135" y1="164" x2="135" y2="176" marker-end="url(#a97)"/>
    <line x1="135" y1="226" x2="135" y2="238" marker-end="url(#a97)"/>
  </g>
  <text x="135" y="312" text-anchor="middle" font-size="10.4" fill="#4C566A">мотивация §6: 1M-KV = 122.1 GiB (131 GB)</text>
  <text x="135" y="326" text-anchor="middle" font-size="12" fill="#4C566A">не влезает в H100 даже при B=1</text>

  <rect x="270" y="56" width="310" height="136" rx="12" fill="#E8EEF5" stroke="#5E81AC" stroke-width="1.3"/>
  <text x="288" y="78" font-size="16.6" font-weight="700" fill="#2E3440">LMCache — engine-side слой</text>
  <g font-size="9" fill="#2E3440">
    <text x="288" y="100" font-size="9.5">внешний server может пережить restart engine process</text>
    <text x="288" y="118" font-size="9.2">backends: CPU · SSD · Redis/Valkey · Mooncake · S3 · NIXL</text>
    <text x="288" y="136" font-size="9.9">sharing между requests и engine instances; CacheBlend</text>
    <text x="288" y="156" font-weight="600" font-size="13.7">выигрыш зависит от reuse probability,</text>
    <text x="288" y="174" font-weight="600" font-size="12.7">transfer bandwidth и стоимости recompute</text>
  </g>

  <rect x="600" y="56" width="300" height="136" rx="12" fill="#EFF4EA" stroke="#A3BE8C" stroke-width="1.3"/>
  <text x="618" y="78" font-size="16.6" font-weight="700" fill="#2E3440">Mooncake — платформа Kimi</text>
  <g font-size="9" fill="#2E3440">
    <text x="618" y="100" font-size="9.5">Store: глобальный KV-пул на простое CPU/DRAM/SSD</text>
    <text x="618" y="118" font-size="11.4">Transfer Engine: RDMA-переброс между P и D</text>
    <text x="618" y="136" font-size="10.2">Conductor: KV-aware планировщик, early rejection</text>
    <text x="618" y="156" font-weight="600" font-size="13.3">reported: +59–498% effective capacity;</text>
    <text x="618" y="174" font-weight="600" font-size="13.1">FAST'25 · 100+ млрд ток/день (авторы)</text>
  </g>

  <rect x="270" y="208" width="630" height="58" rx="12" fill="#F3EEF3" stroke="#B48EAD"/>
  <text x="288" y="230" font-size="16.6" font-weight="700" fill="#2E3440">Взаимодополнение уровней в распределённом стеке</text>
  <text x="288" y="250" font-size="11.5" fill="#2E3440">на 03.08.2026 vLLM документирует LMCache и Mooncake connectors для sharing/offload/PD:</text>
  <text x="288" y="262" font-size="13.8" font-weight="600" fill="#2E3440">engine + внешний KV-tier + transport + KV-aware orchestration</text>

  <rect x="270" y="282" width="630" height="48" rx="12" fill="#FAF0E8" stroke="#D08770"/>
  <text x="288" y="304" font-size="16.6" font-weight="700" fill="#2E3440">Анонсированный этаж — NVIDIA CMX (16.03.2026)</text>
  <text x="288" y="322" font-size="9.5" fill="#2E3440" font-weight="600">Pod-level context-memory tier на BlueField-4 и Spectrum-X; заявленные эффекты требуют workload-specific проверки.</text>
</svg>
