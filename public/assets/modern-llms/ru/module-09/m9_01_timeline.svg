<svg viewBox="0 0 940 300" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <title>Таймлайн инференс-стека</title>
  <desc>От MQA и PagedAttention к распределённым KV-платформам и компрессии кэша.</desc>
  <defs><marker id="a91" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1 L9 5 L1 9 Z" fill="#4C566A"/></marker></defs>
  <text x="30" y="30" font-size="23" font-weight="700" fill="#2E3440">Инференс-стек: от «просто буфер» к KV-центричной платформе</text>

  <line x1="50" y1="96" x2="900" y2="96" stroke="#5E81AC" stroke-width="1.4" marker-end="url(#a91)"/>
  <g text-anchor="middle" font-size="9.5">
    <circle cx="100" cy="96" r="4" fill="#4C566A"/><text x="100" y="80" font-weight="600" fill="#2E3440" font-size="13.8">2019 MQA</text><text x="100" y="114" font-size="12" fill="#4C566A">одна KV-голова;</text><text x="100" y="126" font-size="12" fill="#4C566A">первая экономия кэша</text>
    <circle cx="235" cy="96" r="5" fill="#5E81AC"/><text x="235" y="80" font-weight="600" fill="#2E3440" font-size="13.8">2023 GQA · vLLM</text><text x="235" y="114" font-size="12" fill="#4C566A">PagedAttention (блоки+CoW);</text><text x="235" y="126" font-size="12" fill="#4C566A">StreamingLLM: sinks</text>
    <circle cx="390" cy="96" r="5" fill="#88C0D0"/><text x="390" y="80" font-weight="600" fill="#2E3440" font-size="13.8">2024 MLA</text><text x="390" y="114" font-size="12" fill="#4C566A">латентный кэш V2 (−93%);</text><text x="390" y="126" font-size="12" fill="#4C566A">prefix caching → API-фича</text>
    <circle cx="545" cy="96" r="6" fill="#D08770"/><text x="545" y="80" font-weight="600" fill="#2E3440" font-size="13.8">2025 Mooncake</text><text x="545" y="114" font-size="12" fill="#4C566A">Best Paper FAST'25; стек Kimi;</text><text x="545" y="126" font-size="13.8" fill="#4C566A" font-weight="600">PD-disaggregation в движках</text>
    <circle cx="700" cy="96" r="6" fill="#A3BE8C"/><text x="700" y="80" font-weight="600" fill="#2E3440" font-size="13.8">2026 Dynamo 1.0</text><text x="700" y="114" font-size="12" fill="#4C566A">GA 16.03; до 7× в</text><text x="700" y="126" font-size="12" fill="#4C566A">конкретном R1-бенчмарке</text>
    <circle cx="845" cy="96" r="6" fill="#B48EAD"/><text x="845" y="80" font-weight="600" fill="#2E3440" font-size="11.8">2026 TurboQuant · CMX</text><text x="845" y="114" font-size="11.5" fill="#4C566A">квантование KV; новый</text><text x="845" y="126" font-size="13.7" fill="#4C566A" font-weight="600">context-memory tier</text>
  </g>

  <rect x="50" y="152" width="850" height="124" rx="12" fill="#ECEFF4" stroke="#D8DEE9"/>
  <text x="66" y="176" font-size="16.6" font-weight="700" fill="#2E3440">Четыре волны — четыре этажа модуля</text>
  <g font-size="9.5" fill="#2E3440">
    <text x="66" y="200" font-size="11.5"><tspan font-weight="600" fill="#5E81AC">Архитектура:</tspan> MQA → GQA → MLA/hybrid — лестница 2560 → 320 → 68.625 KiB/токен (§4)</text>
    <text x="66" y="222" font-size="11.5"><tspan font-weight="600" fill="#88C0D0">Система:</tspan> Orca-батчинг → PagedAttention (93.75% → 0.37% waste) → chunked prefill (§8, §11)</text>
    <text x="66" y="244" font-size="11.5"><tspan font-weight="600" fill="#D08770">Платформа:</tspan> prefix-cache contracts → LMCache/Mooncake tiers → PD-развод с Dynamo (§9–11)</text>
    <text x="66" y="266" font-size="11.5"><tspan font-weight="600" fill="#A3BE8C">Компрессия:</tspan> eviction → KIVI/TurboQuant; учебный 3-bit сценарий: 101 → 174 ток/с (§14–15)</text>
  </g>
</svg>
