<svg viewBox="0 0 940 330" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <title>PD-disaggregation</title>
  <desc>Клиент, роутер Dynamo, prefill-пул, NIXL-переброс, decode-пул; interference-числа.</desc>
  <defs><marker id="a98" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M1 1 L8 4.5 L1 8 Z" fill="#4C566A"/></marker></defs>
  <text x="30" y="30" font-size="23" font-weight="700" fill="#2E3440">Каждой фазе свой пул: паттерн PD-disaggregation</text>

  <g font-size="9.5" text-anchor="middle">
    <rect x="40" y="70" width="120" height="48" rx="8" fill="#ECEFF4" stroke="#D8DEE9"/><text x="100" y="91" font-weight="700" fill="#2E3440" font-size="16.6">Клиент</text><text x="100" y="108" font-size="13" fill="#4C566A" font-weight="600">запрос · стрим</text>
    <rect x="200" y="70" width="150" height="48" rx="8" fill="#F3EEF3" stroke="#B48EAD" stroke-width="1.3"/><text x="275" y="91" font-weight="700" fill="#2E3440" font-size="16.6">Dynamo Router</text><text x="275" y="108" font-size="13.8" fill="#4C566A" font-weight="600">KV-aware · xPyD</text>
    <rect x="392" y="56" width="210" height="76" rx="8" fill="#E8EEF5" stroke="#5E81AC" stroke-width="1.3"/><text x="497" y="80" font-weight="700" fill="#2E3440" font-size="13.8">Prefill-пул · пример TP=2</text><text x="497" y="98" font-size="10.4" fill="#4C566A" font-weight="600">compute-bound: считает KV промпта</text><text x="497" y="114" font-size="8.5" fill="#4C566A">меньший TP — фаза упирается в compute ceiling (FLOP/s)</text>
    <rect x="690" y="56" width="210" height="76" rx="8" fill="#F8ECEC" stroke="#BF616A" stroke-width="1.3"/><text x="795" y="80" font-weight="700" fill="#2E3440" font-size="13.8">Decode-пул · пример TP=8</text><text x="795" y="98" font-size="10.7" fill="#4C566A" font-weight="600">memory-bound: толстый KV на веса</text><text x="795" y="114" font-size="10.3" fill="#4C566A">больший TP — фаза упирается в BW</text>
  </g>
  <g stroke="#4C566A" stroke-width="1.1">
    <line x1="160" y1="94" x2="196" y2="94" marker-end="url(#a98)"/>
    <line x1="350" y1="94" x2="388" y2="94" marker-end="url(#a98)"/>
    <line x1="602" y1="94" x2="686" y2="94" marker-end="url(#a98)"/>
  </g>
  <text x="644" y="86" text-anchor="middle" font-size="13.8" font-weight="600" fill="#2E3440">NIXL: KV-переброс</text>
  <text x="644" y="110" text-anchor="middle" font-size="13.8" fill="#4C566A" font-weight="600">NVLink / RDMA</text>
  <path d="M795 132 C 795 168, 420 180, 108 176 C 104 176, 102 150, 102 122" fill="none" stroke="#A3BE8C" stroke-width="1.2" marker-end="url(#a98)"/>
  <text x="450" y="168" text-anchor="middle" font-size="13.8" fill="#A3BE8C" font-weight="600">стрим токенов без прерываний от чужих префиллов</text>

  <rect x="40" y="196" width="430" height="92" rx="12" fill="#ECEFF4" stroke="#D8DEE9"/>
  <text x="58" y="218" font-size="13.8" font-weight="700" fill="#2E3440">Interference-арифметика листа (одна GPU)</text>
  <g font-size="9.5" fill="#2E3440">
    <text x="58" y="240" font-size="11.5">монолитный prefill 8K: 132 мс → spike <tspan font-weight="700" fill="#BF616A">137 мс</tspan> (пример SLO 20–50)</text>
    <text x="58" y="260" font-size="11.5">chunked (512 = 8.27 мс) → арифметический интервал <tspan font-weight="700" fill="#A3BE8C">13.1 мс</tspan></text>
    <text x="58" y="278" fill="#4C566A" font-size="10.2">chunked остаётся локальным scheduler-рычагом и при раздельных пулах</text>
  </g>

  <rect x="490" y="196" width="410" height="92" rx="12" fill="#EFF4EA" stroke="#A3BE8C" stroke-width="1.2"/>
  <text x="508" y="218" font-size="16.6" font-weight="700" fill="#2E3440">NVIDIA Dynamo 1.0 (GA 16.03.2026)</text>
  <g font-size="9.5" fill="#2E3440">
    <text x="508" y="240" font-size="11.5">оркестрация над vLLM/SGLang/TRT-LLM;</text>
    <text x="508" y="260" font-size="13.8" font-weight="600">vendor-reported: до <tspan font-weight="700">7×</tspan> запросов в конкретном</text>
    <text x="508" y="278" font-size="10.8" font-weight="600">DeepSeek-R1 benchmark на Blackwell; не универсальный множитель</text>
  </g>

  <text x="30" y="314" font-size="11.5" fill="#2E3440">Continuous batching продолжает работать внутри пулов; цена разделения — KV-transfer, сеть и оркестрация:</text>
  <text x="30" y="328" font-size="11.5" fill="#2E3440">при малой нагрузке единый пул с chunked prefill часто проще (В5).</text>
</svg>
