  <rect x="515" y="216" width="130" height="31" rx="7" fill="#ECEFF4" stroke="#88C0D0" stroke-width="1.5"/>
  <text x="580" y="236" text-anchor="middle" font-family="DejaVu Sans, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.8" font-weight="600" fill="#2E3440">Add &amp; Norm</text>
  <text x="580" y="282" text-anchor="middle" font-family="DejaVu Sans, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="600" fill="#4C566A">повторить N раз</text>
