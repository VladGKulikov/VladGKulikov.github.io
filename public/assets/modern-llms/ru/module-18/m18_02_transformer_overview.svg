  <text x="845" y="164" text-anchor="middle" font-family="DejaVu Sans, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="700" fill="#2E3440">
    <tspan x="845" dy="0" font-weight="700">Память</tspan>
    <tspan x="845" dy="16" font-weight="700">encoder</tspan>
  </text>
  <rect x="40" y="415" width="150" height="60" rx="7" fill="#FFFFFF" stroke="#D08770" stroke-width="1.5"/>
