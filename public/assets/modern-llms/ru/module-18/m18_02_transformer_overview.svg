  <rect x="505" y="415" width="150" height="30" rx="7" fill="#ECEFF4" stroke="#EBCB8B" stroke-width="1.5"/>
  <text x="580" y="434" text-anchor="middle" font-family="DejaVu Sans, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.5" font-weight="600" fill="#2E3440">Add &amp; Norm</text>
  <rect x="505" y="452" width="150" height="30" rx="7" fill="#ECEFF4" stroke="#5E81AC" stroke-width="1.5"/>
  <text x="580" y="471" text-anchor="middle" font-family="DejaVu Sans, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.5" font-weight="600" fill="#2E3440">cross-attention</text>
  <rect x="505" y="489" width="150" height="30" rx="7" fill="#ECEFF4" stroke="#EBCB8B" stroke-width="1.5"/>
  <text x="580" y="508" text-anchor="middle" font-family="DejaVu Sans, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.5" font-weight="600" fill="#2E3440">Add &amp; Norm</text>
  <rect x="505" y="526" width="150" height="30" rx="7" fill="#ECEFF4" stroke="#B48EAD" stroke-width="1.5"/>
  <text x="580" y="545" text-anchor="middle" font-family="DejaVu Sans, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.5" font-weight="600" fill="#2E3440">position-wise FFN</text>
  <rect x="505" y="563" width="150" height="30" rx="7" fill="#ECEFF4" stroke="#EBCB8B" stroke-width="1.5"/>
  <text x="580" y="582" text-anchor="middle" font-family="DejaVu Sans, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.5" font-weight="600" fill="#2E3440">Add &amp; Norm</text>
  <text x="580" y="628" text-anchor="middle" font-family="DejaVu Sans, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="600" fill="#4C566A">повторить N раз</text>
  <line x1="845" y1="211" x2="845" y2="467" stroke="#5E81AC" stroke-width="1.4"/>
  <line x1="845" y1="467" x2="655" y2="467" stroke="#5E81AC" stroke-width="1.4" marker-end="url(#arrBlue)"/>
  <text x="750" y="455" text-anchor="middle" font-family="DejaVu Sans, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.5" font-weight="600" fill="#5E81AC">K, V из encoder</text>
  <line x1="675" y1="578" x2="735" y2="550" stroke="#4C566A" stroke-width="1.2" marker-end="url(#arr)"/>
  <rect x="735" y="505" width="155" height="88" rx="7" fill="#ECEFF4" stroke="#A3BE8C" stroke-width="1.5"/>
  <text x="812" y="531" text-anchor="start" font-family="DejaVu Sans, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="600" fill="#2E3440">
    <tspan x="757.904" dy="0" font-weight="600">Linear: d<tspan baseline-shift="sub" font-size="7.14px">model</tspan> → |V|</tspan>
    <tspan x="759.08" dy="18" font-weight="600">softmax по словарю</tspan>
  </text>
  <line x1="812" y1="593" x2="812" y2="625" stroke="#A3BE8C" stroke-width="1.2" marker-end="url(#arr)"/>
  <rect x="735" y="625" width="155" height="38" rx="7" fill="#FFFFFF" stroke="#A3BE8C" stroke-width="1.5"/>
  <text x="812" y="649" text-anchor="middle" font-family="DejaVu Sans, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="700" fill="#2E3440">p(следующий токен)</text>
  <text x="40" y="679" text-anchor="start" font-family="DejaVu Sans, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9" font-weight="400" fill="#4C566A" font-style="italic">В encoder self-attention двунаправлен; в decoder маска запрещает смотреть на будущие target-позиции.</text>
</svg>
