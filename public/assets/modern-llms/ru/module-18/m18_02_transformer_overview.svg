    <tspan x="115" dy="0" font-weight="600">Сдвинутые токены</tspan>
    <tspan x="115" dy="16" font-weight="600">target</tspan>
  </text>
  <line x1="190" y1="445" x2="250" y2="445" stroke="#4C566A" stroke-width="1.2" marker-end="url(#arr)"/>
  <rect x="250" y="403" width="170" height="84" rx="7" fill="#ECEFF4" stroke="#EBCB8B" stroke-width="1.5"/>
  <text x="335" y="430" text-anchor="start" font-family="DejaVu Sans, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="600" fill="#2E3440">
    <tspan x="281.408" dy="0" font-weight="600">Embedding × √d<tspan baseline-shift="sub" font-size="7.48px">model</tspan></tspan>
    <tspan x="270.32" dy="17" font-weight="600">+ positional encoding</tspan>
  </text>
