<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 690" width="920" height="690">
  <title>Оригинальный Transformer: два стека и один поток вероятностей</title>
  <desc>Полная encoder-decoder архитектура 2017 года: входные и сдвинутые целевые токены, позиционные кодировки, encoder, decoder с cross-attention и выходная softmax-голова.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M1 1 L9 5 L1 9 Z" fill="#4C566A"/>
    </marker>
    <marker id="arrBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M1 1 L9 5 L1 9 Z" fill="#5E81AC"/>
    </marker>
  </defs>
  <text x="460.0" y="28" text-anchor="middle" font-family="DejaVu Sans, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="600" fill="#2E3440">Оригинальный Transformer: два стека и один поток вероятностей</text>
  <rect x="40" y="92" width="150" height="60" rx="7" fill="#FFFFFF" stroke="#5E81AC" stroke-width="1.5"/>
  <text x="115" y="118" text-anchor="middle" font-family="DejaVu Sans, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="600" fill="#2E3440">
    <tspan x="115" dy="0" font-weight="600">Исходные токены</tspan>
    <tspan x="115" dy="16" font-weight="600">source</tspan>
  </text>
