    <tspan x="281.408" dy="0" font-weight="600">Embedding × √d<tspan baseline-shift="sub" font-size="7.48px">model</tspan></tspan>
    <tspan x="270.32" dy="17" font-weight="600">+ positional encoding</tspan>
  </text>
