</text>
<rect x="1025" y="545" width="380" height="165" rx="18" fill="#FBE5E8" stroke="#C9D4E2" stroke-width="2"/>
<text x="1050" y="590" text-anchor="start" font-family="Arial, sans-serif" font-size="27.6" font-weight="700" fill="#202A3B">
<tspan x="1050" dy="0">Плотная masked-модель</tspan>
</text>
<text x="1050" y="627" text-anchor="start" font-family="Arial, sans-serif" font-size="23.5" font-weight="600" fill="#56657A">
