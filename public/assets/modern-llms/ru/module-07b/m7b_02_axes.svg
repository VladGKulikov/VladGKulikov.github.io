<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<rect width="1600" height="900" fill="#FFFFFF"/>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#4676A8"/></marker></defs>
<text x="60" y="70" font-family="Arial, sans-serif" font-size="39.1" font-weight="700" fill="#202A3B">Две независимые оси</text>
<text x="60" y="108" font-family="Arial, sans-serif" font-size="19.6" fill="#56657A">Внутренний оператор и порядок фиксации выхода — разные решения</text>
<rect x="80" y="200" width="430" height="230" rx="18" fill="#E8F1FB" stroke="#C9D4E2" stroke-width="2"/>
<text x="105" y="247" text-anchor="start" font-family="Arial, sans-serif" font-size="28.2" font-weight="700" fill="#202A3B">
<tspan x="105" dy="0">Ось 1 · блок</tspan>
</text>
<text x="105" y="286" text-anchor="start" font-family="Arial, sans-serif" font-size="23.5" font-weight="600" fill="#56657A">
<tspan x="105" dy="0">Dense / MoE</tspan>
<tspan x="105" dy="22">Attention / SSM</tspan>
<tspan x="105" dy="22">Encoder–decoder / decoder-only</tspan>
</text>
<rect x="1090" y="200" width="430" height="230" rx="18" fill="#EFE8FA" stroke="#C9D4E2" stroke-width="2"/>
<text x="1115" y="247" text-anchor="start" font-family="Arial, sans-serif" font-size="28.2" font-weight="700" fill="#202A3B">
<tspan x="1115" dy="0">Ось 2 · генерация</tspan>
</text>
<text x="1115" y="286" text-anchor="start" font-family="Arial, sans-serif" font-size="19.6" font-weight="400" fill="#56657A">
<tspan x="1115" dy="0">AR</tspan>
<tspan x="1115" dy="22">Полный холст</tspan>
<tspan x="1115" dy="22">Блочная диффузия / редактирование</tspan>
</text>
<line x1="520" y1="315" x2="1070" y2="315" stroke="#4676A8" stroke-width="3" marker-end="url(#arrow)"/>
<text x="795" y="285" text-anchor="middle" font-family="Arial, sans-serif" font-size="28.2" font-weight="700" fill="#4676A8">
<tspan x="795" dy="0">независимы</tspan>
</text>
<rect x="165" y="545" width="380" height="165" rx="18" fill="#E8F6EC" stroke="#C9D4E2" stroke-width="2"/>
<text x="190" y="590" text-anchor="start" font-family="Arial, sans-serif" font-size="28.2" font-weight="700" fill="#202A3B">
<tspan x="190" dy="0">Плотная AR</tspan>
</text>
<text x="190" y="627" text-anchor="start" font-family="Arial, sans-serif" font-size="19.6" font-weight="400" fill="#56657A">
<tspan x="190" dy="0">обычный decoder</tspan>
</text>
<rect x="595" y="545" width="380" height="165" rx="18" fill="#FFF2CF" stroke="#C9D4E2" stroke-width="2"/>
<text x="620" y="590" text-anchor="start" font-family="Arial, sans-serif" font-size="23.5" font-weight="700" fill="#202A3B">
<tspan x="620" dy="0">MoE-диффузия</tspan>
</text>
<text x="620" y="627" text-anchor="start" font-family="Arial, sans-serif" font-size="19.6" font-weight="400" fill="#56657A">
