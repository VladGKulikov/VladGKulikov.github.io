<svg viewBox="0 0 940 330" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <title>QK-Clip трейс</title>
  <desc>Четыре головы, порог tau=100: гамма, корень из гаммы, новые максимумы; контраст с post-softmax клипом.</desc>
  <text x="30" y="30" font-size="23" font-weight="700" fill="#2E3440">QK-Clip: стрижка весов, не логитов (трейс листа, τ = 100, s = 0.5)</text>

  <rect x="40" y="52" width="860" height="128" rx="12" fill="#ECEFF4" stroke="#D8DEE9"/>
  <g font-family="DejaVu Sans Mono, ui-monospace, Menlo, monospace" font-size="10.5" fill="#2E3440">
    <text x="60" y="78" font-size="13.8" font-weight="600">голова           h₀      h₁      h₂      h₃</text>
    <line x1="60" y1="86" x2="880" y2="86" stroke="#D8DEE9" stroke-width="0.8"/>
    <text x="60" y="106" font-size="13.8" font-weight="600">max(QKᵀ)         45     <tspan fill="#D08770" font-weight="700">120</tspan>     <tspan fill="#BF616A" font-weight="700">260</tspan>      80</text>
    <text x="60" y="128" font-size="13.8" font-weight="600">γ = min(1, τ/max) 1     0.8333  0.3846   1</text>
    <text x="60" y="150" font-size="13.8" font-weight="600">W<tspan baseline-shift="sub" font-size="9.4">Q</tspan>, W<tspan baseline-shift="sub" font-size="9.4">K</tspan> ×= √γ    —     0.9129  0.6202   —</text>
    <text x="60" y="172" font-size="13.8" font-weight="600">новый max        45     <tspan fill="#A3BE8C" font-weight="700">100</tspan>     <tspan fill="#A3BE8C" font-weight="700">100</tspan>      80</text>
  </g>

  <rect x="40" y="196" width="420" height="80" rx="12" fill="#EFF4EA" stroke="#A3BE8C" stroke-width="1.2"/>
  <text x="58" y="218" font-size="16.6" font-weight="700" fill="#2E3440">Что именно исправляет QK-Clip</text>
  <g font-size="9.5" fill="#2E3440">
    <text x="58" y="238" font-size="11.5">рескейлятся параметры → следующий forward использует</text>
    <text x="58" y="256" font-size="11.5">обычный softmax на меньших логитах; probabilities</text>
    <text x="58" y="272" font-size="11.5">меняются, но post-softmax clipping не выполняется</text>
  </g>

  <rect x="480" y="196" width="420" height="80" rx="12" fill="#F8ECEC" stroke="#BF616A"/>
  <text x="498" y="218" font-size="16.6" font-weight="700" fill="#2E3440">Контраст: activation-only clip</text>
  <g font-size="9.5" fill="#2E3440">
    <text x="498" y="238" font-size="11.3">скрывает превышение в текущем view, но параметры не меняет;</text>
    <text x="498" y="256" font-size="11.5">source W<tspan baseline-shift="sub" font-size="8.3">Q</tspan> и W<tspan baseline-shift="sub" font-size="8.3">K</tspan> продолжают расти;</text>
    <text x="498" y="272" font-size="11.5">видимая величина ограничена, источник не скорректирован</text>
  </g>

  <rect x="40" y="290" width="860" height="30" rx="8" fill="#E8EEF5" stroke="#5E81AC"/>
  <text x="470" y="310" text-anchor="middle" font-size="13.8" font-weight="600" fill="#2E3440">Результат в проде: MuonClip = Muon + QK-Clip → Kimi K2, 15.5T токенов, 0 training spikes (arXiv 2507.20534)</text>
</svg>
