<svg viewBox="0 0 940 350" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <title>Muon и ортогонализация Ньютона–Шульца</title>
  <desc>Momentum, квинтика Джордана, полоса сингулярных чисел; врезка про кубический хвост.</desc>
  <defs><marker id="a85" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M1 1 L8 4.5 L1 8 Z" fill="#4C566A"/></marker></defs>
  <text x="30" y="30" font-size="23" font-weight="700" fill="#2E3440">Muon: выравнивание спектра обновления (числа листа: 64×32, сид 7)</text>

  <rect x="40" y="56" width="200" height="80" rx="8" fill="#ECEFF4" stroke="#D8DEE9"/>
  <text x="140" y="80" text-anchor="middle" font-size="16.6" font-weight="700" fill="#2E3440">momentum</text>
  <text x="140" y="100" text-anchor="middle" font-size="13.8" font-family="DejaVu Sans Mono, ui-monospace, Menlo, monospace" fill="#2E3440" font-weight="600">M = μ·M + g</text>
  <text x="140" y="120" text-anchor="middle" font-size="11" fill="#4C566A">σ(M): 13.81 … 2.70 — разброс ×5.1</text>

  <line x1="240" y1="96" x2="284" y2="96" stroke="#4C566A" stroke-width="1.2" marker-end="url(#a85)"/>

  <rect x="290" y="56" width="340" height="80" rx="12" fill="#E8EEF5" stroke="#5E81AC" stroke-width="1.4"/>
  <text x="460" y="78" text-anchor="middle" font-size="15.4" font-weight="700" fill="#2E3440">Ньютон–Шульц ×5: квинтика Джордана</text>
  <text x="460" y="98" text-anchor="middle" font-size="10.9" font-family="DejaVu Sans Mono, ui-monospace, Menlo, monospace" fill="#2E3440" font-weight="600">X ← 3.4445·X − 4.7750·(XXᵀ)X + 2.0315·(XXᵀ)²X</text>
  <text x="460" y="118" text-anchor="middle" font-size="10" fill="#4C566A">вход нормирован ‖·‖<tspan baseline-shift="sub" font-size="8.3">F</tspan>; только матмулы — bf16-дружелюбно</text>

  <line x1="630" y1="96" x2="674" y2="96" stroke="#4C566A" stroke-width="1.2" marker-end="url(#a85)"/>

  <rect x="680" y="56" width="220" height="80" rx="8" fill="#EFF4EA" stroke="#A3BE8C" stroke-width="1.3"/>
  <text x="790" y="80" text-anchor="middle" font-size="16.6" font-weight="700" fill="#2E3440">шаг θ ← θ − η·O</text>
  <text x="790" y="100" text-anchor="middle" font-size="13.8" fill="#2E3440">σ(O) ∈ [0.682, 1.133]</text>
  <text x="790" y="118" text-anchor="middle" font-size="12" fill="#4C566A">равный вес всем направлениям</text>

  <rect x="40" y="160" width="560" height="96" rx="12" fill="#FAF5E3" stroke="#EBCB8B"/>
  <text x="58" y="184" font-size="16.6" font-weight="700" fill="#2E3440">Полоса — осознанный размен, не брак</text>
  <g font-size="9.5" fill="#2E3440">
    <text x="58" y="206" font-size="10.9">‖OᵀO − I‖ = 2.16 после квинтики — Muon это устраивает: скорость шага важнее косметики.</text>
    <text x="58" y="226" font-size="11">Лист: +3 классические кубики (X ← 1.5X − 0.5·XXᵀX) → σ ∈ [0.998968, 1.0], ошибка 4.9·10⁻³ —</text>
    <text x="58" y="246" font-size="9.9">но это ×1.6 к стоимости ортогонализации; «полосы достаточно» — инженерное решение Джордана.</text>
  </g>

  <rect x="620" y="160" width="280" height="96" rx="8" fill="#F3EEF3" stroke="#B48EAD"/>
  <text x="638" y="184" font-size="16.6" font-weight="700" fill="#2E3440">Почему это помогает</text>
  <g font-size="9.5" fill="#2E3440">
    <text x="638" y="206" font-size="11.5" font-weight="600">Adam-подобные шаги непропорционально</text>
    <text x="638" y="224" font-size="10.4">кормят доминирующие направления матрицы;</text>
    <text x="638" y="242" font-size="11.3">ортогонализация делит шаг поровну (§10)</text>
  </g>

  <rect x="40" y="272" width="860" height="50" rx="12" fill="#ECEFF4" stroke="#D8DEE9"/>
  <text x="58" y="292" font-size="11.5" fill="#2E3440">Только для 2D-параметров (матриц); эмбеддинги/нормы остаются на AdamW. К 2026: NanoGPT-speedrun, Kimi K2 (15.5T, MuonClip),</text>
  <text x="58" y="310" font-size="11.5" fill="#2E3440">DeepSeek V4 — Muon как выбор фронтира; лестница вторых порядков §3: диагональ (Adam) → кронекер (Shampoo) → спектр (Muon).</text>
  <text x="898" y="342" font-size="9.7" font-style="italic" fill="#4C566A" text-anchor="end">все σ воспроизведены проверочным кодом курса; коэффициенты — github.com/KellerJordan/Muon</text>
</svg>
