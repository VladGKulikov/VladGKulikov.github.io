<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="880" viewBox="0 0 1100 880">
<title>Как расширялась задача предобучения</title>
<desc>История идей, а не рейтинг современных рецептов</desc>
<rect width="1100" height="880" fill="#FFFFFF"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9 Z" fill="#4C566A"/></marker></defs>
<text x="40" y="52" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="700" fill="#2E3440" text-anchor="start">Как расширялась задача предобучения</text>
<text x="40" y="97" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" fill="#4C566A" text-anchor="start">История идей, а не рейтинг современных рецептов</text>
<text x="40" y="171" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" fill="#2E3440" text-anchor="start">2020</text>
<rect x="225" y="132" width="835" height="124" rx="12" fill="#E8EEF5" stroke="#D8DEE9" stroke-width="1.3"/>
<text x="245" y="170" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" fill="#2E3440" text-anchor="start">Kaplan</text>
<text x="245" y="209" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" fill="#2E3440" text-anchor="start">Степенные зависимости потерь от масштаба.</text>
<path d="M195,202 L195,274" fill="none" stroke="#4C566A" stroke-width="2" marker-end="url(#arrow)"/>
<text x="40" y="319" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" fill="#2E3440" text-anchor="start">2022</text>
<rect x="225" y="280" width="835" height="124" rx="12" fill="#E8EEF5" stroke="#D8DEE9" stroke-width="1.3"/>
<text x="245" y="318" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" fill="#2E3440" text-anchor="start">Chinchilla</text>
<text x="245" y="357" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" fill="#2E3440" text-anchor="start">Как разделить фиксированный бюджет между N и D?</text>
<path d="M195,350 L195,422" fill="none" stroke="#4C566A" stroke-width="2" marker-end="url(#arrow)"/>
<text x="40" y="467" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" fill="#2E3440" text-anchor="start">2024</text>
<rect x="225" y="428" width="835" height="124" rx="12" fill="#E8EEF5" stroke="#D8DEE9" stroke-width="1.3"/>
<text x="245" y="466" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" fill="#2E3440" text-anchor="start">Данные и эксплуатация</text>
<text x="245" y="505" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" fill="#2E3440" text-anchor="start">Воспроизводимые фильтры; стоимость будущего инференса.</text>
<path d="M195,498 L195,570" fill="none" stroke="#4C566A" stroke-width="2" marker-end="url(#arrow)"/>
<text x="40" y="615" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" fill="#2E3440" text-anchor="start">2025</text>
<rect x="225" y="576" width="835" height="124" rx="12" fill="#E8EEF5" stroke="#D8DEE9" stroke-width="1.3"/>
<text x="245" y="614" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" fill="#2E3440" text-anchor="start">MuonClip</text>
<text x="245" y="653" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" fill="#2E3440" text-anchor="start">Геометрия матричного шага и контроль логитов.</text>
<path d="M195,646 L195,718" fill="none" stroke="#4C566A" stroke-width="2" marker-end="url(#arrow)"/>
<text x="40" y="763" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" fill="#2E3440" text-anchor="start">2026</text>
<rect x="225" y="724" width="835" height="124" rx="12" fill="#E8EEF5" stroke="#D8DEE9" stroke-width="1.3"/>
<text x="245" y="762" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" fill="#2E3440" text-anchor="start">Паспорта крупных запусков</text>
<text x="245" y="801" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" fill="#2E3440" text-anchor="start">Смесь, точность, оптимизатор и топология рассматриваются вместе.</text>
</svg>
