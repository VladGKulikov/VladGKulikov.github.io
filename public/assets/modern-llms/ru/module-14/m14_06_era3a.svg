<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker></defs>
<rect width="100%" height="100%" fill="#F8FAFC"/><text x="60" y="72" font-family="DejaVu Sans, Arial, sans-serif" font-size="38" font-weight="700" fill="#172033" text-anchor="start"><tspan x="60" dy="0">Unified interface не означает одно внутреннее представление</tspan></text><text x="60" y="121" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400" fill="#526071" text-anchor="start"><tspan x="60" dy="0">Понимание и генерация можно объединить общим потоком, общим backbone или общей системой контекста.</tspan></text><rect x="85" y="215" width="420" height="430" rx="24" fill="#DCEBFA" stroke="#CBD5E1" stroke-width="2"/><text x="113" y="272" font-family="DejaVu Sans, Arial, sans-serif" font-size="31" font-weight="700" fill="#172033" text-anchor="start"><tspan x="113" dy="0">Chameleon</tspan></text><text x="113" y="313" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400" fill="#526071" text-anchor="start"><tspan x="113" dy="0">Дискретные text/image</tspan><tspan x="113" dy="29">tokens в одном autoregressive</tspan><tspan x="113" dy="29">потоке. Самая прямая форма</tspan><tspan x="113" dy="29">early fusion.</tspan></text><rect x="590" y="215" width="420" height="430" rx="24" fill="#DFF3E4" stroke="#CBD5E1" stroke-width="2"/><text x="618" y="272" font-family="DejaVu Sans, Arial, sans-serif" font-size="31" font-weight="700" fill="#172033" text-anchor="start"><tspan x="618" dy="0">Janus</tspan></text><text x="618" y="313" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400" fill="#526071" text-anchor="start"><tspan x="618" dy="0">Разные visual encoders для</tspan><tspan x="618" dy="29">понимания и генерации;</tspan><tspan x="618" dy="29">общий Transformer</tspan><tspan x="618" dy="29">моделирует</tspan><tspan x="618" dy="29">последовательность.</tspan></text><rect x="1095" y="215" width="420" height="430" rx="24" fill="#FFF1CC" stroke="#CBD5E1" stroke-width="2"/><text x="1123" y="272" font-family="DejaVu Sans, Arial, sans-serif" font-size="31" font-weight="700" fill="#172033" text-anchor="start"><tspan x="1123" dy="0">InternVL-U</tspan></text><text x="1123" y="313" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400" fill="#526071" text-anchor="start"><tspan x="1123" dy="0">Multimodal LLM отвечает за</tspan><tspan x="1123" dy="29">контекст и reasoning;</tspan><tspan x="1123" dy="29">MMDiT-head — за image</tspan><tspan x="1123" dy="29">generation и editing.</tspan></text><rect x="80" y="720" width="1440" height="105" rx="24" fill="#EDE5FA" stroke="#CBD5E1" stroke-width="2"/><text x="112" y="768" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="600" fill="#172033" text-anchor="start"><tspan x="112" dy="0">Специализация полезна, когда модальности требуют разной детализации, временной частоты и</tspan><tspan x="112" dy="31">функции потерь.</tspan></text></svg>