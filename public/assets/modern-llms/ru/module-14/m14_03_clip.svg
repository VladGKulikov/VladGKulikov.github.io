<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker></defs>
<rect width="100%" height="100%" fill="#F8FAFC"/><text x="60" y="72" font-family="DejaVu Sans, Arial, sans-serif" font-size="38" font-weight="700" fill="#172033" text-anchor="start"><tspan x="60" dy="0">Контрастивное обучение: геометрия важнее лозунга</tspan></text><text x="60" y="121" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400" fill="#526071" text-anchor="start"><tspan x="60" dy="0">Учебная матрица 4×4 показывает роль температуры; SigLIP меняет нормировку, а не отменяет значение</tspan><tspan x="60" dy="29">отрицательных пар.</tspan></text><rect x="80" y="215" width="440" height="430" rx="24" fill="#DCEBFA" stroke="#CBD5E1" stroke-width="2"/><text x="108" y="272" font-family="DejaVu Sans, Arial, sans-serif" font-size="31" font-weight="700" fill="#172033" text-anchor="start"><tspan x="108" dy="0">CLIP / InfoNCE</tspan></text><text x="108" y="313" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400" fill="#526071" text-anchor="start"><tspan x="108" dy="0">Диагональ 0.8, фон 0.2. При</tspan><tspan x="108" dy="29">τ=0.1: p+=0.992619,</tspan><tspan x="108" dy="29">loss=0.007409. При τ=0.5:</tspan><tspan x="108" dy="29">p+=0.525325, loss=0.643738.</tspan></text><rect x="580" y="215" width="440" height="430" rx="24" fill="#FFF1CC" stroke="#CBD5E1" stroke-width="2"/><text x="608" y="272" font-family="DejaVu Sans, Arial, sans-serif" font-size="31" font-weight="700" fill="#172033" text-anchor="start"><tspan x="608" dy="0">Случайный ориентир</tspan></text><text x="608" y="313" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400" fill="#526071" text-anchor="start"><tspan x="608" dy="0">Если все сходства равны,</tspan><tspan x="608" dy="29">loss=ln N. Для N=4: 1.386294.</tspan><tspan x="608" dy="29">Это ориентир uniform</tspan><tspan x="608" dy="29">matching, не глобальный</tspan><tspan x="608" dy="29">минимум.</tspan></text><rect x="1080" y="215" width="440" height="430" rx="24" fill="#DFF3E4" stroke="#CBD5E1" stroke-width="2"/><text x="1108" y="272" font-family="DejaVu Sans, Arial, sans-serif" font-size="31" font-weight="700" fill="#172033" text-anchor="start"><tspan x="1108" dy="0">SigLIP</tspan></text><text x="1108" y="313" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400" fill="#526071" text-anchor="start"><tspan x="1108" dy="0">Парные sigmoid-слагаемые не</tspan><tspan x="1108" dy="29">требуют общего</tspan><tspan x="1108" dy="29">softmax-знаменателя. Batch</tspan><tspan x="1108" dy="29">composition и negatives всё</tspan><tspan x="1108" dy="29">равно влияют на обучение.</tspan></text><rect x="80" y="720" width="1440" height="105" rx="24" fill="#EDE5FA" stroke="#CBD5E1" stroke-width="2"/><text x="112" y="768" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="600" fill="#172033" text-anchor="start"><tspan x="112" dy="0">Большая batch size даёт N−1 in-batch negatives на строку, но статистическая отдача насыщается</tspan><tspan x="112" dy="31">и зависит от качества пар.</tspan></text></svg>