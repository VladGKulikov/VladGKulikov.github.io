<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker></defs>
<rect width="100%" height="100%" fill="#F8FAFC"/><text x="60" y="72" font-family="DejaVu Sans, Arial, sans-serif" font-size="38" font-weight="700" fill="#172033" text-anchor="start"><tspan x="60" dy="0">Четыре архитектурных семейства продолжают сосуществовать</tspan></text><text x="60" y="121" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400" fill="#526071" text-anchor="start"><tspan x="60" dy="0">История мультимодальных моделей — не лестница замены, а расширение набора способов представить, соединить и</tspan><tspan x="60" dy="29">генерировать модальности.</tspan></text><rect x="50" y="210" width="355" height="440" rx="24" fill="#DCEBFA" stroke="#CBD5E1" stroke-width="2"/><text x="78" y="264" font-family="DejaVu Sans, Arial, sans-serif" font-size="28.2" font-weight="700" fill="#172033" text-anchor="start"><tspan x="78" dy="0">2021 →</tspan><tspan x="78" dy="34">Contrastive</tspan><tspan x="78" dy="34">encoders</tspan></text><text x="78" y="372" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="400" fill="#526071" text-anchor="start"><tspan x="78" dy="0">CLIP и SigLIP</tspan><tspan x="78" dy="28">выравнивают</tspan><tspan x="78" dy="28">изображения и текст в</tspan><tspan x="78" dy="28">общем пространстве.</tspan><tspan x="78" dy="28">Сильны в retrieval и как</tspan><tspan x="78" dy="28">визуальные энкодеры.</tspan></text><path d="M405,430 L430,430" stroke="#475569" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="440" y="210" width="355" height="440" rx="24" fill="#DFF3E4" stroke="#CBD5E1" stroke-width="2"/><text x="468" y="264" font-family="DejaVu Sans, Arial, sans-serif" font-size="28.2" font-weight="700" fill="#172033" text-anchor="start"><tspan x="468" dy="0">2022–2024 →</tspan><tspan x="468" dy="34">Connectors</tspan></text><text x="468" y="338" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="400" fill="#526071" text-anchor="start"><tspan x="468" dy="0">Flamingo, BLIP-2 и LLaVA</tspan><tspan x="468" dy="28">соединяют готовые</tspan><tspan x="468" dy="28">vision- и</tspan><tspan x="468" dy="28">language-компоненты</tspan><tspan x="468" dy="28">через cross-attention,</tspan><tspan x="468" dy="28">Q-Former или MLP.</tspan></text><path d="M795,430 L820,430" stroke="#475569" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="830" y="210" width="355" height="440" rx="24" fill="#FFF1CC" stroke="#CBD5E1" stroke-width="2"/><text x="858" y="264" font-family="DejaVu Sans, Arial, sans-serif" font-size="28.2" font-weight="700" fill="#172033" text-anchor="start"><tspan x="858" dy="0">2024–2026 →</tspan><tspan x="858" dy="34">Unified generation</tspan></text><text x="858" y="338" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="400" fill="#526071" text-anchor="start"><tspan x="858" dy="0">Chameleon, Janus и</tspan><tspan x="858" dy="28">InternVL-U объединяют</tspan><tspan x="858" dy="28">понимание и генерацию,</tspan><tspan x="858" dy="28">но проводят внутренние</tspan><tspan x="858" dy="28">границы по-разному.</tspan></text><path d="M1185,430 L1210,430" stroke="#475569" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="1220" y="210" width="355" height="440" rx="24" fill="#EDE5FA" stroke="#CBD5E1" stroke-width="2"/><text x="1248" y="264" font-family="DejaVu Sans, Arial, sans-serif" font-size="28.2" font-weight="700" fill="#172033" text-anchor="start"><tspan x="1248" dy="0">2025–2026 →</tspan><tspan x="1248" dy="34">Omni output</tspan></text><text x="1248" y="338" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="400" fill="#526071" text-anchor="start"><tspan x="1248" dy="0">Qwen2.5/3.5-Omni</tspan><tspan x="1248" dy="28">координируют текст,</tspan><tspan x="1248" dy="28">зрение, аудио, видео и</tspan><tspan x="1248" dy="28">потоковую речь через</tspan><tspan x="1248" dy="28">Thinker–Talker.</tspan></text><rect x="80" y="720" width="1440" height="105" rx="24" fill="#FBE2E7" stroke="#CBD5E1" stroke-width="2"/><text x="112" y="768" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="600" fill="#172033" text-anchor="start"><tspan x="112" dy="0">Выбирайте семейство по контракту задачи: нужен ли быстрый retrofit, сжатие visual tokens,</tspan><tspan x="112" dy="31">генерация изображений или full-duplex speech.</tspan></text></svg>