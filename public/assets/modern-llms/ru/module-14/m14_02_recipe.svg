<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker></defs>
<rect width="100%" height="100%" fill="#F8FAFC"/><text x="60" y="72" font-family="DejaVu Sans, Arial, sans-serif" font-size="38" font-weight="700" fill="#172033" text-anchor="start"><tspan x="60" dy="0">Модульный VLM: где именно встречаются зрение и язык</tspan></text><text x="60" y="121" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400" fill="#526071" text-anchor="start"><tspan x="60" dy="0">Одинаковая формула «encoder + connector + LLM» скрывает разные контракты последовательности, памяти и</tspan><tspan x="60" dy="29">повторного использования.</tspan></text><rect x="90" y="205" width="420" height="255" rx="24" fill="#DCEBFA" stroke="#CBD5E1" stroke-width="2"/><text x="118" y="260" font-family="DejaVu Sans, Arial, sans-serif" font-size="29" font-weight="700" fill="#172033" text-anchor="start"><tspan x="118" dy="0">1 · Vision encoder</tspan></text><text x="118" y="299" font-family="DejaVu Sans, Arial, sans-serif" font-size="23.2" font-weight="600" fill="#526071" text-anchor="start"><tspan x="118" dy="0">Пиксели → патчи → визуальные</tspan><tspan x="118" dy="27">признаки. Определяет</tspan><tspan x="118" dy="27">разрешение, grid, temporal</tspan><tspan x="118" dy="27">stride и потерю деталей.</tspan></text><path d="M510,333 L580,333" stroke="#475569" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="590" y="205" width="420" height="255" rx="24" fill="#DFF3E4" stroke="#CBD5E1" stroke-width="2"/><text x="618" y="260" font-family="DejaVu Sans, Arial, sans-serif" font-size="29" font-weight="700" fill="#172033" text-anchor="start"><tspan x="618" dy="0">2 · Connector</tspan></text><text x="618" y="299" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="400" fill="#526071" text-anchor="start"><tspan x="618" dy="0">Меняет ширину, число visual</tspan><tspan x="618" dy="27">positions или способ доступа к</tspan><tspan x="618" dy="27">ним.</tspan></text><path d="M1010,333 L1080,333" stroke="#475569" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="1090" y="205" width="420" height="255" rx="24" fill="#FFF1CC" stroke="#CBD5E1" stroke-width="2"/><text x="1118" y="260" font-family="DejaVu Sans, Arial, sans-serif" font-size="29" font-weight="700" fill="#172033" text-anchor="start"><tspan x="1118" dy="0">3 · Language decoder</tspan></text><text x="1118" y="299" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="400" fill="#526071" text-anchor="start"><tspan x="1118" dy="0">Генерирует текст и использует</tspan><tspan x="1118" dy="27">vision через self-attention либо</tspan><tspan x="1118" dy="27">отдельный cross-attention.</tspan></text><rect x="90" y="505" width="420" height="180" rx="24" fill="#EDE5FA" stroke="#CBD5E1" stroke-width="2"/><text x="118" y="556" font-family="DejaVu Sans, Arial, sans-serif" font-size="28.2" font-weight="700" fill="#172033" text-anchor="start"><tspan x="118" dy="0">Вставка в поток</tspan></text><text x="118" y="593" font-family="DejaVu Sans, Arial, sans-serif" font-size="19.6" font-weight="400" fill="#526071" text-anchor="start"><tspan x="118" dy="0">Визуальные позиции создают</tspan><tspan x="118" dy="24">обычный decoder KV. Применима</tspan><tspan x="118" dy="24">смета §7.</tspan></text><rect x="590" y="505" width="420" height="180" rx="24" fill="#FBE2E7" stroke="#CBD5E1" stroke-width="2"/><text x="618" y="556" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="700" fill="#172033" text-anchor="start"><tspan x="618" dy="0">Q-Former / Resampler</tspan></text><text x="618" y="593" font-family="DejaVu Sans, Arial, sans-serif" font-size="19.6" font-weight="400" fill="#526071" text-anchor="start"><tspan x="618" dy="0">Большое число патчей сжимается в</tspan><tspan x="618" dy="24">ограниченный набор query outputs.</tspan></text><rect x="1090" y="505" width="420" height="180" rx="24" fill="#DCEBFA" stroke="#CBD5E1" stroke-width="2"/><text x="1118" y="556" font-family="DejaVu Sans, Arial, sans-serif" font-size="28.2" font-weight="700" fill="#172033" text-anchor="start"><tspan x="1118" dy="0">Gated cross-attention</tspan></text><text x="1118" y="593" font-family="DejaVu Sans, Arial, sans-serif" font-size="19.6" font-weight="400" fill="#526071" text-anchor="start"><tspan x="1118" dy="0">Зрительная память хранится</tspan><tspan x="1118" dy="24">отдельно; текстовый контекст не</tspan><tspan x="1118" dy="24">растёт на каждый патч.</tspan></text><rect x="80" y="735" width="1440" height="100" rx="24" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/><text x="112" y="783" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="600" fill="#172033" text-anchor="start"><tspan x="112" dy="0">До расчёта памяти выясните fusion topology: одинаковое число признаков может создавать</tspan><tspan x="112" dy="31">совершенно разный KV и compute.</tspan></text></svg>