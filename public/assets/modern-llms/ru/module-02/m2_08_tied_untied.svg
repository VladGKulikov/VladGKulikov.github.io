<svg viewBox="0 0 1100 600" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title>Tied и untied embeddings</title>
<desc>Документированные открытые конфигурации</desc>
<rect width="1100" height="600" fill="#FFFFFF"/>
<text x="45" y="50" text-anchor="start" font-size="28" font-weight="700" fill="#2E3440">
<tspan x="45" dy="0">Один словарь — одна или две матрицы</tspan>
</text>
<text x="45" y="82" text-anchor="start" font-size="16.1" font-weight="400" fill="#4C566A">
<tspan x="45" dy="0">Поле tie_word_embeddings нужно читать из конкретной конфигурации, а не угадывать по размеру модели.</tspan>
</text>
<rect x="55" y="120" width="470" height="345" rx="14" fill="#EFF4EA" stroke="#D8DEE9" stroke-width="1.5"/>
<text x="79" y="166" text-anchor="start" font-size="22" font-weight="700" fill="#2E3440">
<tspan x="79" dy="0">Tied: одна матрица E</tspan>
</text>
<text x="79" y="203" text-anchor="start" font-size="18" font-weight="400" fill="#4C566A">
<tspan x="79" dy="0">Input lookup использует E, а выходные</tspan>
<tspan x="79" dy="25">logits — Eᵀ.</tspan>
<tspan x="79" dy="25">Параметры: V·d.</tspan>
<tspan x="79" dy="25">Экономия относительно untied: V·d.</tspan>
<tspan x="79" dy="25">Документированный пример: Gemma</tspan>
<tspan x="79" dy="25">(tie_word_embeddings=true).</tspan>
</text>
<rect x="575" y="120" width="470" height="345" rx="14" fill="#E8EEF5" stroke="#D8DEE9" stroke-width="1.5"/>
<text x="599" y="166" text-anchor="start" font-size="22" font-weight="700" fill="#2E3440">
<tspan x="599" dy="0">Untied: E и U независимы</tspan>
</text>
<text x="599" y="203" text-anchor="start" font-size="18" font-weight="400" fill="#4C566A">
<tspan x="599" dy="0">E кодирует входные token IDs; U проектирует</tspan>
<tspan x="599" dy="25">hidden state в logits.</tspan>
<tspan x="599" dy="25">Параметры: 2V·d.</tspan>
<tspan x="599" dy="25">Роли матриц могут расходиться.</tspan>
<tspan x="599" dy="25">Документированные примеры: Llama 2/3/4,</tspan>
<tspan x="599" dy="25">DeepSeek V4, Kimi K3.</tspan>
</text>
<rect x="135" y="492" width="830" height="84" rx="12" fill="#FAF5E3" stroke="#EBCB8B" stroke-width="1.5"/>
<text x="550" y="532" text-anchor="middle" font-size="19" font-weight="700" fill="#2E3440">
<tspan x="550" dy="0">V=16 384, d=512 → одна матрица = 8 388 608 параметров;</tspan>
<tspan x="550" dy="25">untied удваивает матрицы словарного интерфейса.</tspan>
</text>
</svg>
