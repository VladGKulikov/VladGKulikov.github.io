<svg viewBox="0 0 1100 620" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title>Состав o200k_harmony</title>
<desc>Точное разделение mergeable и special IDs с алиасом 200018</desc>
<rect width="1100" height="620" fill="#FFFFFF"/>
<text x="45" y="50" text-anchor="start" font-size="28" font-weight="700" fill="#2E3440">
<tspan x="45" dy="0">o200k_harmony: точная арифметика идентификаторов</tspan>
</text>
<text x="45" y="82" text-anchor="start" font-size="16.1" font-weight="400" fill="#4C566A">
<tspan x="45" dy="0">Словарь обычного текста наследуется от o200k_base; Harmony добавляет протокольный диапазон.</tspan>
</text>
<rect x="55" y="130" width="625" height="115" rx="12" fill="#E8EEF5" stroke="#5E81AC" stroke-width="1.5"/>
<rect x="700" y="130" width="345" height="115" rx="12" fill="#F3EEF3" stroke="#B48EAD" stroke-width="1.5"/>
<text x="367" y="174" text-anchor="middle" font-size="25" font-weight="700" fill="#2E3440">
<tspan x="367" dy="0">199 998 mergeable IDs</tspan>
</text>
<text x="367" y="207" text-anchor="middle" font-size="17" font-weight="400" fill="#4C566A">
<tspan x="367" dy="0">ID 0…199 997 · обычный текст</tspan>
</text>
<text x="872" y="164" text-anchor="middle" font-size="22" font-weight="700" fill="#2E3440">
<tspan x="872" dy="0">1 091 имя special-токенов</tspan>
</text>
<text x="872" y="196" text-anchor="middle" font-size="19.4" font-weight="700" fill="#2E3440">
<tspan x="872" dy="0">1 090 уникальных ID</tspan>
</text>
<text x="872" y="224" text-anchor="middle" font-size="15" font-weight="400" fill="#4C566A">
<tspan x="872" dy="0">ID 199 998…201 087</tspan>
</text>
<rect x="55" y="285" width="300" height="155" rx="14" fill="#EFF4EA" stroke="#D8DEE9" stroke-width="1.5"/>
<text x="79" y="331" text-anchor="start" font-size="22" font-weight="700" fill="#2E3440">
<tspan x="79" dy="0">10 протокольных имён</tspan>
</text>
<text x="79" y="368" text-anchor="start" font-size="17" font-weight="400" fill="#4C566A">
<tspan x="79" dy="0">&lt;|start|&gt;, &lt;|message|&gt;,</tspan>
<tspan x="79" dy="24">&lt;|channel|&gt;, &lt;|call|&gt;, …</tspan>
</text>
<rect x="400" y="285" width="300" height="155" rx="14" fill="#FAF5E3" stroke="#D8DEE9" stroke-width="1.5"/>
<text x="424" y="331" text-anchor="start" font-size="22" font-weight="700" fill="#2E3440">
<tspan x="424" dy="0">1 081 reserved-имя</tspan>
</text>
<text x="424" y="368" text-anchor="start" font-size="17" font-weight="400" fill="#4C566A">
<tspan x="424" dy="0">&lt;|reserved_200000|&gt;, …,</tspan>
<tspan x="424" dy="24">&lt;|reserved_201087|&gt;</tspan>
</text>
<rect x="745" y="285" width="300" height="155" rx="14" fill="#FAF0E8" stroke="#D8DEE9" stroke-width="1.5"/>
<text x="769" y="331" text-anchor="start" font-size="22" font-weight="700" fill="#2E3440">
<tspan x="769" dy="0">Один намеренный алиас</tspan>
</text>
<text x="769" y="368" text-anchor="start" font-size="17" font-weight="400" fill="#4C566A">
<tspan x="769" dy="0">&lt;|endofprompt|&gt; =</tspan>
<tspan x="769" dy="24">&lt;|reserved_200018|&gt; = ID 200018</tspan>
</text>
<rect x="120" y="470" width="860" height="62" rx="12" fill="#EAF3F5" stroke="#88C0D0" stroke-width="1.5"/>
<text x="550" y="510" text-anchor="middle" font-size="24" font-weight="700" fill="#2E3440">
<tspan x="550" dy="0">199 998 + 1 090 = 201 088 уникальных идентификаторов</tspan>
</text>
<text x="550" y="570" text-anchor="middle" font-size="16" font-weight="400" fill="#4C566A">
<tspan x="550" dy="0">По умолчанию tiktoken.encode отклоняет зарегистрированное написание special-токена. Приложение явно</tspan>
<tspan x="550" dy="21">выбирает: управляющий ID или обычный текст.</tspan>
</text>
</svg>
