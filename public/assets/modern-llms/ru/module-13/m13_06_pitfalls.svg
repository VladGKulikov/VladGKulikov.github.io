<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker></defs>
<rect width="100%" height="100%" fill="#F8FAFC"/><text x="60" y="72" font-family="DejaVu Sans, Arial, sans-serif" font-size="38" font-weight="700" fill="#172033" text-anchor="start"><tspan x="60" dy="0">Почему больше вычислений не гарантирует лучший ответ</tspan></text><text x="60" y="121" font-family="DejaVu Sans, Arial, sans-serif" font-size="23.5" font-weight="600" fill="#526071" text-anchor="start"><tspan x="60" dy="0">Test-time scaling ограничен не одной причиной, а сочетанием способности модели, поиска, проверки и системной цены.</tspan></text><rect x="70" y="220" width="350" height="430" rx="24" fill="#FBE2E7" stroke="#CBD5E1" stroke-width="2"/><text x="98" y="275" font-family="DejaVu Sans, Arial, sans-serif" font-size="29" font-weight="700" fill="#172033" text-anchor="start"><tspan x="98" dy="0">Потолок</tspan><tspan x="98" dy="35">способности</tspan></text><text x="98" y="351" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400" fill="#526071" text-anchor="start"><tspan x="98" dy="0">Дополнительные</tspan><tspan x="98" dy="29">токены не создают</tspan><tspan x="98" dy="29">знание или</tspan><tspan x="98" dy="29">представление,</tspan><tspan x="98" dy="29">отсутствующее в</tspan><tspan x="98" dy="29">базовой модели.</tspan></text><rect x="455" y="220" width="350" height="430" rx="24" fill="#FFF1CC" stroke="#CBD5E1" stroke-width="2"/><text x="483" y="275" font-family="DejaVu Sans, Arial, sans-serif" font-size="29" font-weight="700" fill="#172033" text-anchor="start"><tspan x="483" dy="0">Немонотонность</tspan></text><text x="483" y="316" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400" fill="#526071" text-anchor="start"><tspan x="483" dy="0">Модель может</tspan><tspan x="483" dy="29">передумать</tspan><tspan x="483" dy="29">правильный ответ,</tspan><tspan x="483" dy="29">повторяться или</tspan><tspan x="483" dy="29">накопить раннюю</tspan><tspan x="483" dy="29">ошибку.</tspan></text><rect x="840" y="220" width="350" height="430" rx="24" fill="#EDE5FA" stroke="#CBD5E1" stroke-width="2"/><text x="868" y="275" font-family="DejaVu Sans, Arial, sans-serif" font-size="29" font-weight="700" fill="#172033" text-anchor="start"><tspan x="868" dy="0">Ошибка отбора</tspan></text><text x="868" y="316" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400" fill="#526071" text-anchor="start"><tspan x="868" dy="0">Верификатор</tspan><tspan x="868" dy="29">ограничивает</tspan><tspan x="868" dy="29">полезность выборки и</tspan><tspan x="868" dy="29">может быть объектом</tspan><tspan x="868" dy="29">эксплуатации.</tspan></text><rect x="1225" y="220" width="350" height="430" rx="24" fill="#DCEBFA" stroke="#CBD5E1" stroke-width="2"/><text x="1253" y="275" font-family="DejaVu Sans, Arial, sans-serif" font-size="29" font-weight="700" fill="#172033" text-anchor="start"><tspan x="1253" dy="0">Системная цена</tspan></text><text x="1253" y="316" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400" fill="#526071" text-anchor="start"><tspan x="1253" dy="0">Латентность, FLOPs и</tspan><tspan x="1253" dy="29">KV-память растут;</tspan><tspan x="1253" dy="29">параллелизм сервиса</tspan><tspan x="1253" dy="29">падает.</tspan></text><rect x="80" y="720" width="1440" height="105" rx="24" fill="#DFF3E4" stroke="#CBD5E1" stroke-width="2"/><text x="110" y="769" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="600" fill="#172033" text-anchor="start"><tspan x="110" dy="0">Зрелая политика умеет не только добавлять вычисления, но и рано остановиться, сменить</tspan><tspan x="110" dy="31">стратегию или обратиться к точному инструменту.</tspan></text></svg>