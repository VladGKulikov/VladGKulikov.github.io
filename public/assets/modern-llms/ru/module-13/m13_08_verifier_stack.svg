<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker></defs>
<rect width="100%" height="100%" fill="#F8FAFC"/><text x="60" y="69" font-family="DejaVu Sans, Arial, sans-serif" font-size="35" font-weight="700" fill="#172033" text-anchor="start"><tspan x="60" dy="0">Семейства верификаторов: от исполняемого правила до модели-судьи</tspan></text><text x="60" y="121" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400" fill="#526071" text-anchor="start"><tspan x="60" dy="0">Наиболее сложный проверяющий модуль не обязательно лучший: выбирайте самый точный и прозрачный сигнал,</tspan><tspan x="60" dy="29">доступный для задачи.</tspan></text><rect x="45" y="215" width="270" height="445" rx="24" fill="#DCEBFA" stroke="#CBD5E1" stroke-width="2"/><text x="73" y="268" font-family="DejaVu Sans, Arial, sans-serif" font-size="28.2" font-weight="700" fill="#172033" text-anchor="start"><tspan x="73" dy="0">Точное</tspan><tspan x="73" dy="32">правило</tspan></text><text x="73" y="339" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="400" fill="#526071" text-anchor="start"><tspan x="73" dy="0">Компилятор,</tspan><tspan x="73" dy="27">модульные тесты,</tspan><tspan x="73" dy="27">символьная</tspan><tspan x="73" dy="27">алгебра,</tspan><tspan x="73" dy="27">формальная</tspan><tspan x="73" dy="27">проверка,</tspan><tspan x="73" dy="27">симулятор.</tspan></text><rect x="355" y="215" width="270" height="445" rx="24" fill="#DFF3E4" stroke="#CBD5E1" stroke-width="2"/><text x="383" y="268" font-family="DejaVu Sans, Arial, sans-serif" font-size="28.2" font-weight="700" fill="#172033" text-anchor="start"><tspan x="383" dy="0">Outcome RM</tspan></text><text x="383" y="307" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="400" fill="#526071" text-anchor="start"><tspan x="383" dy="0">Одна оценка за</tspan><tspan x="383" dy="27">всё решение;</tspan><tspan x="383" dy="27">дешёвая</tspan><tspan x="383" dy="27">разметка, но</tspan><tspan x="383" dy="27">слабая</tspan><tspan x="383" dy="27">локализация</tspan><tspan x="383" dy="27">ошибки.</tspan></text><rect x="665" y="215" width="270" height="445" rx="24" fill="#FFF1CC" stroke="#CBD5E1" stroke-width="2"/><text x="693" y="268" font-family="DejaVu Sans, Arial, sans-serif" font-size="28.2" font-weight="700" fill="#172033" text-anchor="start"><tspan x="693" dy="0">Process RM</tspan></text><text x="693" y="307" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="400" fill="#526071" text-anchor="start"><tspan x="693" dy="0">Оценка шагов;</tspan><tspan x="693" dy="27">плотный сигнал и</tspan><tspan x="693" dy="27">раннее отсечение,</tspan><tspan x="693" dy="27">дорогая разметка.</tspan></text><rect x="975" y="215" width="270" height="445" rx="24" fill="#EDE5FA" stroke="#CBD5E1" stroke-width="2"/><text x="1003" y="268" font-family="DejaVu Sans, Arial, sans-serif" font-size="28.2" font-weight="700" fill="#172033" text-anchor="start"><tspan x="1003" dy="0">GenRM</tspan></text><text x="1003" y="307" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="400" fill="#526071" text-anchor="start"><tspan x="1003" dy="0">Критика и вердикт</tspan><tspan x="1003" dy="27">через</tspan><tspan x="1003" dy="27">предсказание</tspan><tspan x="1003" dy="27">следующего</tspan><tspan x="1003" dy="27">токена;</tspan><tspan x="1003" dy="27">рассуждение</tspan><tspan x="1003" dy="27">внутри проверки.</tspan></text><rect x="1285" y="215" width="270" height="445" rx="24" fill="#FBE2E7" stroke="#CBD5E1" stroke-width="2"/><text x="1313" y="268" font-family="DejaVu Sans, Arial, sans-serif" font-size="28.2" font-weight="700" fill="#172033" text-anchor="start"><tspan x="1313" dy="0">Reasoning</tspan><tspan x="1313" dy="32">RM</tspan></text><text x="1313" y="338" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="400" fill="#526071" text-anchor="start"><tspan x="1313" dy="0">Рубрика или разбор</tspan><tspan x="1313" dy="26">перед оценкой;</tspan><tspan x="1313" dy="26">исследовательские</tspan><tspan x="1313" dy="26">рецепты вроде</tspan><tspan x="1313" dy="26">RM-R1.</tspan></text><rect x="80" y="720" width="1440" height="105" rx="24" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/><text x="110" y="769" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="600" fill="#172033" text-anchor="start"><tspan x="110" dy="0">Для кода и формальных задач сначала используйте точную проверку. В субъективных областях</tspan><tspan x="110" dy="31">модель-судья кодирует рубрику или предпочтение, а не объективную истину.</tspan></text></svg>