<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker></defs>
<rect width="100%" height="100%" fill="#F8FAFC"/><text x="60" y="72" font-family="DejaVu Sans, Arial, sans-serif" font-size="38" font-weight="700" fill="#172033" text-anchor="start"><tspan x="60" dy="0">Три способа потратить вычисления во время вывода</tspan></text><text x="60" y="121" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400" fill="#526071" text-anchor="start"><tspan x="60" dy="0">Они могут сочетаться, но решают разные задачи и создают разные системные ограничения.</tspan></text><rect x="80" y="215" width="450" height="355" rx="24" fill="#DCEBFA" stroke="#CBD5E1" stroke-width="2"/><text x="108" y="271" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="700" fill="#172033" text-anchor="start"><tspan x="108" dy="0">Последовательная</tspan><tspan x="108" dy="36">глубина</tspan></text><text x="108" y="348" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400" fill="#526071" text-anchor="start"><tspan x="108" dy="0">Одна траектория становится</tspan><tspan x="108" dy="29">длиннее: план, проверка,</tspan><tspan x="108" dy="29">возврат к развилке, работа с</tspan><tspan x="108" dy="29">инструментом.</tspan></text><rect x="80" y="600" width="450" height="100" rx="24" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/><text x="108" y="644" font-family="DejaVu Sans, Arial, sans-serif" font-size="28.2" font-weight="700" fill="#172033" text-anchor="start"><tspan x="108" dy="0"></tspan></text><text x="108" y="674" font-family="DejaVu Sans, Arial, sans-serif" font-size="19.6" font-weight="400" fill="#526071" text-anchor="start"><tspan x="108" dy="0">Вопрос: когда остановиться?</tspan></text><rect x="590" y="215" width="450" height="355" rx="24" fill="#DFF3E4" stroke="#CBD5E1" stroke-width="2"/><text x="618" y="271" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="700" fill="#172033" text-anchor="start"><tspan x="618" dy="0">Параллельная</tspan><tspan x="618" dy="36">ширина</tspan></text><text x="618" y="348" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400" fill="#526071" text-anchor="start"><tspan x="618" dy="0">Несколько независимых</tspan><tspan x="618" dy="29">кандидатов или агентов</tspan><tspan x="618" dy="29">расширяют поиск.</tspan></text><rect x="590" y="600" width="450" height="100" rx="24" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/><text x="618" y="644" font-family="DejaVu Sans, Arial, sans-serif" font-size="28.2" font-weight="700" fill="#172033" text-anchor="start"><tspan x="618" dy="0"></tspan></text><text x="618" y="674" font-family="DejaVu Sans, Arial, sans-serif" font-size="19.6" font-weight="400" fill="#526071" text-anchor="start"><tspan x="618" dy="0">Вопрос: как выбрать или объединить?</tspan></text><rect x="1100" y="215" width="450" height="355" rx="24" fill="#EDE5FA" stroke="#CBD5E1" stroke-width="2"/><text x="1128" y="271" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="700" fill="#172033" text-anchor="start"><tspan x="1128" dy="0">Адаптивное</tspan><tspan x="1128" dy="36">распределение</tspan></text><text x="1128" y="348" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400" fill="#526071" text-anchor="start"><tspan x="1128" dy="0">Сложность, уверенность или</tspan><tspan x="1128" dy="29">среда определяют бюджет и</tspan><tspan x="1128" dy="29">стратегию.</tspan></text><rect x="1100" y="600" width="450" height="100" rx="24" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/><text x="1128" y="644" font-family="DejaVu Sans, Arial, sans-serif" font-size="28.2" font-weight="700" fill="#172033" text-anchor="start"><tspan x="1128" dy="0"></tspan></text><text x="1128" y="670" font-family="DejaVu Sans, Arial, sans-serif" font-size="19.6" font-weight="400" fill="#526071" text-anchor="start"><tspan x="1128" dy="0">Вопрос: какова цена ошибки</tspan><tspan x="1128" dy="20">маршрутизации?</tspan></text><rect x="80" y="745" width="1440" height="95" rx="24" fill="#FFF1CC" stroke="#CBD5E1" stroke-width="2"/><text x="110" y="792" font-family="DejaVu Sans, Arial, sans-serif" font-size="23.5" font-weight="600" fill="#172033" text-anchor="start"><tspan x="110" dy="0">Сквозной слой: проверка и управление. Без него глубина может стать повторением, а ширина — дорогой</tspan><tspan x="110" dy="28">коллекцией текстов.</tspan></text></svg>