<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker></defs>
<rect width="100%" height="100%" fill="#F8FAFC"/><text x="60" y="67" font-family="DejaVu Sans, Arial, sans-serif" font-size="33" font-weight="700" fill="#172033" text-anchor="start"><tspan x="60" dy="0">DeepSeek-R1: чистый эксперимент и практический многостадийный рецепт</tspan></text><text x="60" y="121" font-family="DejaVu Sans, Arial, sans-serif" font-size="23.5" font-weight="600" fill="#526071" text-anchor="start"><tspan x="60" dy="0">R1-Zero показывает, что может обнаружить RL; полная R1 добавляет формат, отбор данных и широкий чат-контракт.</tspan></text><text x="70" y="205" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="700" fill="#172033" text-anchor="start"><tspan x="70" dy="0">R1-Zero</tspan></text><text x="70" y="505" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="700" fill="#172033" text-anchor="start"><tspan x="70" dy="0">DeepSeek-R1</tspan></text><rect x="240" y="220" width="285" height="205" rx="24" fill="#DCEBFA" stroke="#CBD5E1" stroke-width="2"/><text x="268" y="270" font-family="DejaVu Sans, Arial, sans-serif" font-size="28.2" font-weight="700" fill="#172033" text-anchor="start"><tspan x="268" dy="0">Базовая модель</tspan></text><text x="268" y="307" font-family="DejaVu Sans, Arial, sans-serif" font-size="19.6" font-weight="400" fill="#526071" text-anchor="start"><tspan x="268" dy="0">Без</tspan><tspan x="268" dy="24">предварительного SFT</tspan><tspan x="268" dy="24">формата</tspan></text><path d="M525,322 L558,322" stroke="#475569" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="570" y="220" width="285" height="205" rx="24" fill="#DFF3E4" stroke="#CBD5E1" stroke-width="2"/><text x="598" y="270" font-family="DejaVu Sans, Arial, sans-serif" font-size="28.2" font-weight="700" fill="#172033" text-anchor="start"><tspan x="598" dy="0">RLVR</tspan></text><text x="598" y="307" font-family="DejaVu Sans, Arial, sans-serif" font-size="19.6" font-weight="400" fill="#526071" text-anchor="start"><tspan x="598" dy="0">Проверяемая награда</tspan><tspan x="598" dy="24">и ограничения</tspan><tspan x="598" dy="24">формата</tspan></text><path d="M855,322 L888,322" stroke="#475569" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="900" y="220" width="285" height="205" rx="24" fill="#FFF1CC" stroke="#CBD5E1" stroke-width="2"/><text x="928" y="270" font-family="DejaVu Sans, Arial, sans-serif" font-size="28.2" font-weight="700" fill="#172033" text-anchor="start"><tspan x="928" dy="0">Возникающее</tspan><tspan x="928" dy="29">поведение</tspan></text><text x="928" y="336" font-family="DejaVu Sans, Arial, sans-serif" font-size="19.6" font-weight="400" fill="#526071" text-anchor="start"><tspan x="928" dy="0">Длинные траектории,</tspan><tspan x="928" dy="24">самопроверка,</tspan><tspan x="928" dy="24">возвраты</tspan></text><path d="M1185,322 L1218,322" stroke="#475569" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="1230" y="220" width="285" height="205" rx="24" fill="#FBE2E7" stroke="#CBD5E1" stroke-width="2"/><text x="1258" y="270" font-family="DejaVu Sans, Arial, sans-serif" font-size="28.2" font-weight="700" fill="#172033" text-anchor="start"><tspan x="1258" dy="0">Ограничения</tspan></text><text x="1258" y="307" font-family="DejaVu Sans, Arial, sans-serif" font-size="19.6" font-weight="400" fill="#526071" text-anchor="start"><tspan x="1258" dy="0">Смешение языков и</tspan><tspan x="1258" dy="24">слабая читаемость</tspan></text><rect x="240" y="520" width="285" height="205" rx="24" fill="#DCEBFA" stroke="#CBD5E1" stroke-width="2"/><text x="268" y="570" font-family="DejaVu Sans, Arial, sans-serif" font-size="28.2" font-weight="700" fill="#172033" text-anchor="start"><tspan x="268" dy="0">Холодный старт</tspan></text><text x="268" y="607" font-family="DejaVu Sans, Arial, sans-serif" font-size="19.6" font-weight="400" fill="#526071" text-anchor="start"><tspan x="268" dy="0">Небольшой SFT-набор</tspan><tspan x="268" dy="24">читаемых решений</tspan></text><path d="M525,622 L558,622" stroke="#475569" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="570" y="520" width="285" height="205" rx="24" fill="#DFF3E4" stroke="#CBD5E1" stroke-width="2"/><text x="598" y="570" font-family="DejaVu Sans, Arial, sans-serif" font-size="28.2" font-weight="700" fill="#172033" text-anchor="start"><tspan x="598" dy="0">RL для</tspan><tspan x="598" dy="29">рассуждений</tspan></text><text x="598" y="636" font-family="DejaVu Sans, Arial, sans-serif" font-size="19.6" font-weight="400" fill="#526071" text-anchor="start"><tspan x="598" dy="0">Исследование под</tspan><tspan x="598" dy="24">проверяемой</tspan><tspan x="598" dy="24">наградой</tspan></text><path d="M855,622 L888,622" stroke="#475569" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="900" y="520" width="285" height="205" rx="24" fill="#FFF1CC" stroke="#CBD5E1" stroke-width="2"/><text x="928" y="570" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="700" fill="#172033" text-anchor="start"><tspan x="928" dy="0">Отбор + SFT</tspan></text><text x="928" y="607" font-family="DejaVu Sans, Arial, sans-serif" font-size="19.6" font-weight="400" fill="#526071" text-anchor="start"><tspan x="928" dy="0">Успешные траектории</tspan><tspan x="928" dy="24">становятся новыми</tspan><tspan x="928" dy="24">данными</tspan></text><path d="M1185,622 L1218,622" stroke="#475569" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="1230" y="520" width="285" height="205" rx="24" fill="#FBE2E7" stroke="#CBD5E1" stroke-width="2"/><text x="1258" y="570" font-family="DejaVu Sans, Arial, sans-serif" font-size="28.2" font-weight="700" fill="#172033" text-anchor="start"><tspan x="1258" dy="0">Общий RL</tspan></text><text x="1258" y="607" font-family="DejaVu Sans, Arial, sans-serif" font-size="19.6" font-weight="400" fill="#526071" text-anchor="start"><tspan x="1258" dy="0">Полезность,</tspan><tspan x="1258" dy="24">безопасность и</tspan><tspan x="1258" dy="24">следование</tspan><tspan x="1258" dy="24">инструкциям</tspan></text><rect x="80" y="750" width="1440" height="95" rx="24" fill="#EDE5FA" stroke="#CBD5E1" stroke-width="2"/><text x="110" y="797" font-family="DejaVu Sans, Arial, sans-serif" font-size="23.5" font-weight="600" fill="#172033" text-anchor="start"><tspan x="110" dy="0">Урок: SFT и RL выполняют разные роли. SFT задаёт форму, RL исследует, отбор превращает найденные</tspan><tspan x="110" dy="28">стратегии в данные.</tspan></text></svg>