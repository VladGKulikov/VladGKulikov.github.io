<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="793" viewBox="0 0 1100 793">
<title>Дистилляция меняет веса ученика</title>
<desc>Перенос наблюдаемых решений не гарантирует полного переноса способности.</desc>
<rect width="1100" height="793" fill="#FFFFFF"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9 Z" fill="#4C566A"/></marker></defs>
<text x="40" y="52" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="700" fill="#2E3440" text-anchor="start">Дистилляция меняет веса ученика</text>
<text x="40" y="97" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" fill="#4C566A" text-anchor="start">Перенос наблюдаемых решений не гарантирует полного переноса способности.</text>
<rect x="100" y="132" width="900" height="120" rx="12" fill="#E8EEF5" stroke="#D8DEE9" stroke-width="1.3"/>
<text x="120" y="170" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" fill="#2E3440" text-anchor="start">Учитель → траектории</text>
<text x="120" y="209" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" fill="#2E3440" text-anchor="start">Сгенерировать решения и проверить качество.</text>
<path d="M550,254 L550,280" fill="none" stroke="#4C566A" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="100" y="290" width="900" height="120" rx="12" fill="#E8EEF5" stroke="#D8DEE9" stroke-width="1.3"/>
<text x="120" y="328" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" fill="#2E3440" text-anchor="start">Отбор → обучающие данные</text>
<text x="120" y="367" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" fill="#2E3440" text-anchor="start">Контролировать разнообразие, ошибки, длину и разделение задач.</text>
<path d="M550,412 L550,438" fill="none" stroke="#4C566A" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="100" y="448" width="900" height="120" rx="12" fill="#E8EEF5" stroke="#D8DEE9" stroke-width="1.3"/>
<text x="120" y="486" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" fill="#2E3440" text-anchor="start">SFT → новые веса ученика</text>
<text x="120" y="525" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" fill="#2E3440" text-anchor="start">Могут измениться знания, представления и процедуры.</text>
<path d="M550,570 L550,596" fill="none" stroke="#4C566A" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="100" y="606" width="900" height="120" rx="12" fill="#E8EEF5" stroke="#D8DEE9" stroke-width="1.3"/>
<text x="120" y="644" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" fill="#2E3440" text-anchor="start">Отложенные задачи → оценка</text>
<text x="120" y="683" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" fill="#2E3440" text-anchor="start">Проверить качество, стоимость и перенос за пределы примеров.</text>
</svg>
