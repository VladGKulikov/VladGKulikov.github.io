<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker></defs>
<rect width="100%" height="100%" fill="#F8FAFC"/><text x="60" y="72" font-family="DejaVu Sans, Arial, sans-serif" font-size="38" font-weight="700" fill="#172033" text-anchor="start"><tspan x="60" dy="0">Четыре парадигмы вычислений во время вывода</tspan></text><text x="60" y="121" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400" fill="#526071" text-anchor="start"><tspan x="60" dy="0">Количество вычислений само по себе не определяет алгоритм: важно, где появляется новое состояние и кто</tspan><tspan x="60" dy="29">оценивает результат.</tspan></text><rect x="70" y="220" width="350" height="430" rx="24" fill="#DCEBFA" stroke="#CBD5E1" stroke-width="2"/><text x="98" y="275" font-family="DejaVu Sans, Arial, sans-serif" font-size="29" font-weight="700" fill="#172033" text-anchor="start"><tspan x="98" dy="0">Длинная</tspan><tspan x="98" dy="35">траектория</tspan></text><text x="98" y="351" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400" fill="#526071" text-anchor="start"><tspan x="98" dy="0">Одна модель</tspan><tspan x="98" dy="29">продолжает</tspan><tspan x="98" dy="29">рассуждение. Полезно</tspan><tspan x="98" dy="29">для связных</tspan><tspan x="98" dy="29">многошаговых задач.</tspan></text><rect x="455" y="220" width="350" height="430" rx="24" fill="#DFF3E4" stroke="#CBD5E1" stroke-width="2"/><text x="483" y="275" font-family="DejaVu Sans, Arial, sans-serif" font-size="29" font-weight="700" fill="#172033" text-anchor="start"><tspan x="483" dy="0">Повторная</tspan><tspan x="483" dy="35">выборка</tspan></text><text x="483" y="351" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400" fill="#526071" text-anchor="start"><tspan x="483" dy="0">Независимые</tspan><tspan x="483" dy="29">кандидаты</tspan><tspan x="483" dy="29">увеличивают</tspan><tspan x="483" dy="29">вероятность найти</tspan><tspan x="483" dy="29">удачный путь.</tspan></text><rect x="840" y="220" width="350" height="430" rx="24" fill="#FFF1CC" stroke="#CBD5E1" stroke-width="2"/><text x="868" y="275" font-family="DejaVu Sans, Arial, sans-serif" font-size="29" font-weight="700" fill="#172033" text-anchor="start"><tspan x="868" dy="0">Поиск с</tspan><tspan x="868" dy="35">проверкой</tspan></text><text x="868" y="351" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400" fill="#526071" text-anchor="start"><tspan x="868" dy="0">Верификатор</tspan><tspan x="868" dy="29">ранжирует, отсекает</tspan><tspan x="868" dy="29">или останавливает</tspan><tspan x="868" dy="29">генерацию.</tspan></text><rect x="1225" y="220" width="350" height="430" rx="24" fill="#EDE5FA" stroke="#CBD5E1" stroke-width="2"/><text x="1253" y="275" font-family="DejaVu Sans, Arial, sans-serif" font-size="29" font-weight="700" fill="#172033" text-anchor="start"><tspan x="1253" dy="0">Адаптивная</tspan><tspan x="1253" dy="35">политика</tspan></text><text x="1253" y="351" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400" fill="#526071" text-anchor="start"><tspan x="1253" dy="0">Бюджет и способ</tspan><tspan x="1253" dy="29">поиска выбираются по</tspan><tspan x="1253" dy="29">запросу и обратной</tspan><tspan x="1253" dy="29">связи.</tspan></text><rect x="80" y="720" width="1440" height="105" rx="24" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/><text x="110" y="769" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="600" fill="#172033" text-anchor="start"><tspan x="110" dy="0">Сравнивайте при фиксированной цене, времени или числе токенов. Без протокола сопоставимого</tspan><tspan x="110" dy="31">бюджета «лучше» остаётся неоднозначным.</tspan></text></svg>