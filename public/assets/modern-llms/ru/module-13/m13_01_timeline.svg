<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker></defs>
<rect width="100%" height="100%" fill="#F8FAFC"/><text x="60" y="67" font-family="DejaVu Sans, Arial, sans-serif" font-size="33" font-weight="700" fill="#172033" text-anchor="start"><tspan x="60" dy="0">Как вычисления во время вывода стали отдельной осью масштабирования</tspan></text><text x="60" y="121" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400" fill="#526071" text-anchor="start"><tspan x="60" dy="0">Сдвиг произошёл от приёмов работы с запросом к обученным, управляемым и адаптивным вычислительным</tspan><tspan x="60" dy="29">контрактам.</tspan></text><rect x="45" y="210" width="270" height="430" rx="24" fill="#DCEBFA" stroke="#CBD5E1" stroke-width="2"/><text x="73" y="259" font-family="DejaVu Sans, Arial, sans-serif" font-size="26.8" font-weight="700" fill="#172033" text-anchor="start"><tspan x="73" dy="0">До 2024</tspan><tspan x="73" dy="28">CoT и</tspan><tspan x="73" dy="28">self-consistency</tspan></text><text x="73" y="353" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="400" fill="#526071" text-anchor="start"><tspan x="73" dy="0">Длинные</tspan><tspan x="73" dy="26">объяснения и</tspan><tspan x="73" dy="26">повторная выборка</tspan><tspan x="73" dy="26">используются как</tspan><tspan x="73" dy="26">внешние стратегии</tspan><tspan x="73" dy="26">работы с запросом.</tspan></text><path d="M315,425 L343,425" stroke="#475569" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="355" y="210" width="270" height="430" rx="24" fill="#DFF3E4" stroke="#CBD5E1" stroke-width="2"/><text x="383" y="259" font-family="DejaVu Sans, Arial, sans-serif" font-size="28.2" font-weight="700" fill="#172033" text-anchor="start"><tspan x="383" dy="0">Сентябрь 2024</tspan><tspan x="383" dy="28">OpenAI o1</tspan></text><text x="383" y="325" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="400" fill="#526071" text-anchor="start"><tspan x="383" dy="0">Обучение и время</tspan><tspan x="383" dy="26">на решение</tspan><tspan x="383" dy="26">публично</tspan><tspan x="383" dy="26">представлены как</tspan><tspan x="383" dy="26">две оси</tspan><tspan x="383" dy="26">масштабирования.</tspan></text><path d="M625,425 L653,425" stroke="#475569" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="665" y="210" width="270" height="430" rx="24" fill="#FFF1CC" stroke="#CBD5E1" stroke-width="2"/><text x="693" y="259" font-family="DejaVu Sans, Arial, sans-serif" font-size="28.2" font-weight="700" fill="#172033" text-anchor="start"><tspan x="693" dy="0">Январь 2025</tspan><tspan x="693" dy="28">DeepSeek-R1</tspan></text><text x="693" y="325" font-family="DejaVu Sans, Arial, sans-serif" font-size="22.7" font-weight="600" fill="#526071" text-anchor="start"><tspan x="693" dy="0">R1-Zero изолирует</tspan><tspan x="693" dy="26">RL на проверяемой</tspan><tspan x="693" dy="26">награде; полная R1</tspan><tspan x="693" dy="26">добавляет</tspan><tspan x="693" dy="26">многостадийный</tspan><tspan x="693" dy="26">рецепт.</tspan></text><path d="M935,425 L963,425" stroke="#475569" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="975" y="210" width="270" height="430" rx="24" fill="#EDE5FA" stroke="#CBD5E1" stroke-width="2"/><text x="1003" y="259" font-family="DejaVu Sans, Arial, sans-serif" font-size="28.2" font-weight="700" fill="#172033" text-anchor="start"><tspan x="1003" dy="0">2024–2025</tspan><tspan x="1003" dy="28">Вычисления на</tspan><tspan x="1003" dy="28">выводе</tspan></text><text x="1003" y="353" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="400" fill="#526071" text-anchor="start"><tspan x="1003" dy="0">Исследуются</tspan><tspan x="1003" dy="26">глубина, ширина,</tspan><tspan x="1003" dy="26">верификаторы и</tspan><tspan x="1003" dy="26">адаптивное</tspan><tspan x="1003" dy="26">распределение</tspan><tspan x="1003" dy="26">бюджета.</tspan></text><path d="M1245,425 L1273,425" stroke="#475569" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="1285" y="210" width="270" height="430" rx="24" fill="#FBE2E7" stroke="#CBD5E1" stroke-width="2"/><text x="1313" y="259" font-family="DejaVu Sans, Arial, sans-serif" font-size="28.2" font-weight="700" fill="#172033" text-anchor="start"><tspan x="1313" dy="0">Снимок</tspan><tspan x="1313" dy="28">04.08.2026</tspan><tspan x="1313" dy="28">Контракты API</tspan></text><text x="1313" y="353" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="400" fill="#526071" text-anchor="start"><tspan x="1313" dy="0">Уровни усилия,</tspan><tspan x="1313" dy="26">динамические</tspan><tspan x="1313" dy="26">режимы, скрытое</tspan><tspan x="1313" dy="26">рассуждение и</tspan><tspan x="1313" dy="26">многоагентная</tspan><tspan x="1313" dy="26">работа требуют</tspan><tspan x="1313" dy="26">отдельного</tspan><tspan x="1313" dy="26">паспорта.</tspan></text><rect x="80" y="710" width="1440" height="115" rx="24" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/><text x="110" y="759" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="600" fill="#172033" text-anchor="start"><tspan x="110" dy="0">Современная ручка — не просто «больше токенов»: нужно различать глубину одной траектории,</tspan><tspan x="110" dy="31">ширину поиска, правило отбора и системную цену.</tspan></text></svg>