<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<rect width="1600" height="900" fill="#FFFFFF"/>
<text x="70" y="70" font-family="Arial,sans-serif" font-size="39.1" font-weight="700" fill="#2E3440">Два значения attention sink</text>
<text x="70" y="108" font-family="Arial,sans-serif" font-size="19.6" fill="#5B6472">Оба принимают массу вероятности, но только один является реальным токеном</text>
<rect x="90" y="190" width="650" height="360" rx="18" fill="#EAF1FB" stroke="#CBD3DF" stroke-width="2"/>
<text x="116" y="241" text-anchor="start" font-family="Arial,sans-serif" font-size="28.2" font-weight="700" fill="#2E3440">
<tspan x="116" dy="0">StreamingLLM sink</tspan>
</text>
<text x="116" y="284" text-anchor="start" font-family="Arial,sans-serif" font-size="19.6" font-weight="400" fill="#5B6472">
<tspan x="116" dy="0">initial real tokens</tspan>
<tspan x="116" dy="25">retain their K and V</tspan>
<tspan x="116" dy="25">window + first k positions</tspan>
</text>
<rect x="860" y="190" width="650" height="360" rx="18" fill="#F3EDFA" stroke="#CBD3DF" stroke-width="2"/>
<text x="886" y="241" text-anchor="start" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#2E3440">
<tspan x="886" dy="0">gpt-oss learned sink</tspan>
</text>
<text x="886" y="284" text-anchor="start" font-family="Arial,sans-serif" font-size="19.6" font-weight="400" fill="#5B6472">
<tspan x="886" dy="0">one scalar score per query head</tspan>
<tspan x="886" dy="25">inside softmax</tspan>
<tspan x="886" dy="25">removed before multiplication by V</tspan>
</text>
<defs><marker id="a22" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#4C78A8"/></marker></defs>
<line x1="740" y1="370" x2="850" y2="370" stroke="#4C78A8" stroke-width="3" marker-end="url(#a22)"/>
<rect x="260" y="650" width="1080" height="125" rx="18" fill="#FFF5DD" stroke="#CBD3DF" stroke-width="2"/>
<text x="286" y="698" text-anchor="start" font-family="Arial,sans-serif" font-size="28.2" font-weight="700" fill="#2E3440">
<tspan x="286" dy="0">Не обычный фиксированный key</tspan>
</text>
<text x="286" y="737" text-anchor="start" font-family="Arial,sans-serif" font-size="19.6" font-weight="400" fill="#5B6472">
<tspan x="286" dy="0">A fixed key produces q·k and changes with q; the learned sink is a constant score slot with</tspan>
<tspan x="286" dy="25">zero value.</tspan>
</text>
</svg>
