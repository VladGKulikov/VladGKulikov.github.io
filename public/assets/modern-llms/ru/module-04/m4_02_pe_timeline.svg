<text x="40" y="689" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" fill="#4C566A" text-anchor="start">NoPE (§9): отдельного позиционного слагаемого нет; информация может приходить через маску и слои.</text>
