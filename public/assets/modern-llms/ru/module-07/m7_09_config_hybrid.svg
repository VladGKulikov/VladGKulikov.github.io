<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<rect width="1600" height="900" fill="white"/>
<text x="70" y="70" font-family="Arial" font-size="39.1" font-weight="700" fill="#2E3440">Паспорт recurrent/hybrid serving</text>
<text x="70" y="110" font-family="Arial" font-size="19.6" fill="#5B6472">Одного ярлыка Mamba или linear attention недостаточно</text>
<rect x="70" y="210" width="420" height="220" rx="18" fill="#EAF1FB" stroke="#CBD3DF" stroke-width="2"/>
<text x="96" y="258" text-anchor="start" font-family="Arial" font-size="28.2" font-weight="700" fill="#2E3440">
<tspan x="96" dy="0">Layer types</tspan>
</text>
<text x="96" y="299" text-anchor="start" font-family="Arial" font-size="19.6" font-weight="400" fill="#5B6472">
<tspan x="96" dy="0">какие слои рекуррентны, какие</tspan>
<tspan x="96" dy="25">хранят KV</tspan>
</text>
<rect x="555" y="210" width="420" height="220" rx="18" fill="#EDF7ED" stroke="#CBD3DF" stroke-width="2"/>
<text x="581" y="258" text-anchor="start" font-family="Arial" font-size="28.2" font-weight="700" fill="#2E3440">
<tspan x="581" dy="0">SSM state</tspan>
</text>
<text x="581" y="299" text-anchor="start" font-family="Arial" font-size="23.5" font-weight="600" fill="#5B6472">
<tspan x="581" dy="0">layers × inner × state × dtype</tspan>
</text>
<rect x="1040" y="210" width="420" height="220" rx="18" fill="#FFF5DD" stroke="#CBD3DF" stroke-width="2"/>
<text x="1066" y="258" text-anchor="start" font-family="Arial" font-size="28.2" font-weight="700" fill="#2E3440">
<tspan x="1066" dy="0">Conv state</tspan>
</text>
<text x="1066" y="299" text-anchor="start" font-family="Arial" font-size="23.5" font-weight="600" fill="#5B6472">
<tspan x="1066" dy="0">channels × kernel width × dtype</tspan>
</text>
<rect x="70" y="510" width="420" height="220" rx="18" fill="#F3EDFA" stroke="#CBD3DF" stroke-width="2"/>
<text x="96" y="558" text-anchor="start" font-family="Arial" font-size="28.2" font-weight="700" fill="#2E3440">
<tspan x="96" dy="0">Attention cache</tspan>
</text>
<text x="96" y="599" text-anchor="start" font-family="Arial" font-size="19.6" font-weight="400" fill="#5B6472">
<tspan x="96" dy="0">KV heads × head width × context</tspan>
</text>
<rect x="555" y="510" width="420" height="220" rx="18" fill="#E8F7F5" stroke="#CBD3DF" stroke-width="2"/>
<text x="581" y="558" text-anchor="start" font-family="Arial" font-size="28.2" font-weight="700" fill="#2E3440">
<tspan x="581" dy="0">Execution</tspan>
</text>
<text x="581" y="599" text-anchor="start" font-family="Arial" font-size="21.7" font-weight="600" fill="#5B6472">
<tspan x="581" dy="0">sequential / scan / chunked kernel</tspan>
</text>
<rect x="1040" y="510" width="420" height="220" rx="18" fill="#FCEBEC" stroke="#CBD3DF" stroke-width="2"/>
<text x="1066" y="558" text-anchor="start" font-family="Arial" font-size="28.2" font-weight="700" fill="#2E3440">
<tspan x="1066" dy="0">Evidence</tspan>
</text>
<text x="1066" y="599" text-anchor="start" font-family="Arial" font-size="22" font-weight="600" fill="#5B6472">
<tspan x="1066" dy="0">paper · config · code · developer</tspan>
<tspan x="1066" dy="25">result</tspan>
</text>
</svg>
