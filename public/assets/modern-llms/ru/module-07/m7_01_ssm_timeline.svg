</text>
<text x="57" y="303" text-anchor="start" font-family="Arial" font-size="19.6" font-weight="400" fill="#5B6472">
<tspan x="57" dy="0">структурированная</tspan>
<tspan x="57" dy="24">длинная память</tspan>
</text>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#4C78A8"/></marker></defs>
