<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="551" viewBox="0 0 1100 551">
<title>Из форм матриц — точное число параметров</title>
<desc>Llama-3.1-8B: d=4096, d_ff=14336, Hq=32, Hkv=8, dh=128; без bias.</desc>
<rect width="1100" height="551" fill="#FFFFFF"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9 Z" fill="#4C566A"/></marker></defs>
<text x="40" y="52" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="700" fill="#2E3440" text-anchor="start">Из форм матриц — точное число параметров</text>
<text x="40" y="97" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" fill="#4C566A" text-anchor="start">Llama-3.1-8B: d=4096, d<tspan font-size="11.9" baseline-shift="sub">ff</tspan>=14336, H<tspan font-size="11.9" baseline-shift="sub">q</tspan>=32, H<tspan font-size="11.9" baseline-shift="sub">kv</tspan>=8, d<tspan font-size="11.9" baseline-shift="sub">h</tspan>=128; без bias.</text>
<rect x="40.0" y="132" width="498.0" height="149" rx="12" fill="#E8EEF5" stroke="#D8DEE9" stroke-width="1.3"/>
<text x="64.0" y="176" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" fill="#2E3440" text-anchor="start">Attention</text>
<text x="64.0" y="217" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" fill="#4C566A" text-anchor="start">2d·H<tspan font-size="12.6" baseline-shift="sub">q</tspan>·d<tspan font-size="12.6" baseline-shift="sub">h</tspan> + 2d·H<tspan font-size="12.6" baseline-shift="sub">kv</tspan>·d<tspan font-size="12.6" baseline-shift="sub">h</tspan></text>
<text x="64.0" y="242" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" fill="#4C566A" text-anchor="start">41,943,040 = 2.5d²</text>
<rect x="562.0" y="132" width="498.0" height="149" rx="12" fill="#F3EEF3" stroke="#D8DEE9" stroke-width="1.3"/>
<text x="586.0" y="176" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" fill="#2E3440" text-anchor="start">SwiGLU</text>
<text x="586.0" y="217" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" fill="#4C566A" text-anchor="start">3d·d<tspan font-size="12.6" baseline-shift="sub">ff</tspan></text>
<text x="586.0" y="242" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" fill="#4C566A" text-anchor="start">176,160,768 = 10.5d²</text>
<rect x="40.0" y="305" width="498.0" height="124" rx="12" fill="#FAF0E8" stroke="#D8DEE9" stroke-width="1.3"/>
<text x="64.0" y="349" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" fill="#2E3440" text-anchor="start">Две RMSNorm</text>
<text x="64.0" y="390" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" fill="#4C566A" text-anchor="start">2d = 8,192</text>
<rect x="562.0" y="305" width="498.0" height="124" rx="12" fill="#EFF4EA" stroke="#D8DEE9" stroke-width="1.3"/>
<text x="586.0" y="349" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" fill="#2E3440" text-anchor="start">Полный блок</text>
<text x="586.0" y="390" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" fill="#4C566A" text-anchor="start">13d² + 2d = 218,112,000</text>
<text x="40" y="470" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" fill="#4C566A" text-anchor="start">2Vd + 32(13d² + 2d) + d = 8,030,261,248</text>
<text x="40" y="512" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" fill="#4C566A" text-anchor="start">V=128256; две независимые таблицы и финальная RMSNorm.</text>
</svg>
