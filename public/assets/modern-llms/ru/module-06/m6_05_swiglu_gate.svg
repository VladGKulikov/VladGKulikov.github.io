<text x="40" y="52" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="700" fill="#2E3440" text-anchor="start">SwiGLU: три матрицы и произведение</text>
<text x="40" y="97" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" fill="#4C566A" text-anchor="start">Размер токена: d → d<tspan font-size="11.9" baseline-shift="sub">ff</tspan> → d. Нелинейный гейт не является вероятностью.</text>
<rect x="40" y="287" width="130" height="64" rx="12" fill="#EFF4EA" stroke="#D8DEE9" stroke-width="1.3"/>
<text x="105.0" y="324" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="600" fill="#2E3440" text-anchor="middle">x : d</text>
