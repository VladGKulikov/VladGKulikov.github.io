<text x="40" y="499" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" fill="#4C566A" text-anchor="start">W<tspan font-size="11.9" baseline-shift="sub">g</tspan>, W<tspan font-size="11.9" baseline-shift="sub">u</tspan>: d × d<tspan font-size="11.9" baseline-shift="sub">ff</tspan>; W<tspan font-size="11.9" baseline-shift="sub">d</tspan>: d<tspan font-size="11.9" baseline-shift="sub">ff</tspan> × d. P = 3d·d<tspan font-size="11.9" baseline-shift="sub">ff</tspan>.</text>
<text x="40" y="544" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" fill="#4C566A" text-anchor="start">gpt-oss: min(g,7) · σ(1.702 min(g,7)) · (clip(u,−7,7)+1), затем W<tspan font-size="11.9" baseline-shift="sub">d</tspan>.</text>
