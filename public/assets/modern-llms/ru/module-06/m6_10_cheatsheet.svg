<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="732" viewBox="0 0 1100 732">
<title>Как прочитать незнакомый блок</title>
<desc>Четыре вопроса — от потока данных к бюджету.</desc>
<rect width="1100" height="732" fill="#FFFFFF"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9 Z" fill="#4C566A"/></marker></defs>
<text x="40" y="52" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="700" fill="#2E3440" text-anchor="start">Как прочитать незнакомый блок</text>
<text x="40" y="97" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" fill="#4C566A" text-anchor="start">Четыре вопроса — от потока данных к бюджету.</text>
<rect x="40.0" y="132" width="1020.0" height="124" rx="12" fill="#EFF4EA" stroke="#D8DEE9" stroke-width="1.3"/>
<text x="64.0" y="176" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" fill="#2E3440" text-anchor="start">1. Поток данных</text>
<text x="64.0" y="217" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" fill="#4C566A" text-anchor="start">Что складывается? Читает ли FFN обновлённое состояние?</text>
<rect x="40.0" y="280" width="1020.0" height="124" rx="12" fill="#E8EEF5" stroke="#D8DEE9" stroke-width="1.3"/>
<text x="64.0" y="324" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" fill="#2E3440" text-anchor="start">2. Нормализация</text>
<text x="64.0" y="365" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" fill="#4C566A" text-anchor="start">Где стоит норма? По какой оси? Каковы ε, γ и точность?</text>
<rect x="40.0" y="428" width="1020.0" height="124" rx="12" fill="#F3EEF3" stroke="#D8DEE9" stroke-width="1.3"/>
<text x="64.0" y="472" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" fill="#2E3440" text-anchor="start">3. FFN</text>
<text x="64.0" y="513" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" fill="#4C566A" text-anchor="start">Как заданы гейт, активация и ограничения? Какова ширина?</text>
<rect x="40.0" y="576" width="1020.0" height="124" rx="12" fill="#FAF0E8" stroke="#D8DEE9" stroke-width="1.3"/>
<text x="64.0" y="620" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" fill="#2E3440" text-anchor="start">4. Бюджет</text>
<text x="64.0" y="661" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" fill="#4C566A" text-anchor="start">Какие веса обучаются и какие разделяются? Сложите размеры тензоров.</text>
</svg>
