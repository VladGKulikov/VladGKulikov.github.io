<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<rect width="1600" height="900" fill="#FFFFFF"/>
<text x="58" y="62" font-family="Arial, sans-serif" font-size="39.1" font-weight="700" fill="#20293A">Fine-grained и shared experts</text>
<text x="58" y="101" font-family="Arial, sans-serif" font-size="19.6" fill="#596579">Больше routing patterns — не то же самое, что больше доказанных навыков</text>
<defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#465A73"/></marker></defs>
<rect x="70" y="210" width="430" height="360" rx="18" fill="#E7F0FB" stroke="#C8D2E1" stroke-width="2"/>
<text x="95" y="257" text-anchor="start" font-family="Arial, sans-serif" font-size="28.2" font-weight="700" fill="#20293A">
<tspan x="95" dy="0">Coarse bank</tspan>
</text>
<text x="95" y="294" text-anchor="start" font-family="Arial, sans-serif" font-size="19.6" font-weight="400" fill="#596579">
<tspan x="95" dy="0">8 широких experts</tspan>
<tspan x="95" dy="24">top-2</tspan>
<tspan x="95" dy="24">C(8,2)=28 подмножеств</tspan>
</text>
<rect x="585" y="210" width="430" height="360" rx="18" fill="#E8F6EA" stroke="#C8D2E1" stroke-width="2"/>
<text x="610" y="257" text-anchor="start" font-family="Arial, sans-serif" font-size="23.5" font-weight="700" fill="#20293A">
<tspan x="610" dy="0">Fine-grained bank</tspan>
</text>
<text x="610" y="294" text-anchor="start" font-family="Arial, sans-serif" font-size="19.6" font-weight="400" fill="#596579">
<tspan x="610" dy="0">128 узких experts</tspan>
<tspan x="610" dy="24">top-4</tspan>
<tspan x="610" dy="24">C(128,4)=10 668 000</tspan>
<tspan x="610" dy="24">— только combinatorial upper bound</tspan>
</text>
<rect x="1100" y="210" width="430" height="360" rx="18" fill="#FFF2D3" stroke="#C8D2E1" stroke-width="2"/>
<text x="1125" y="257" text-anchor="start" font-family="Arial, sans-serif" font-size="28.2" font-weight="700" fill="#20293A">
<tspan x="1125" dy="0">Shared capacity</tspan>
</text>
<text x="1125" y="294" text-anchor="start" font-family="Arial, sans-serif" font-size="20.5" font-weight="600" fill="#596579">
<tspan x="1125" dy="0">always-on FFN</tspan>
<tspan x="1125" dy="24">мотивация: общая работа и меньше</tspan>
<tspan x="1125" dy="24">redundancy</tspan>
<tspan x="1125" dy="24">семантика требует intervention</tspan>
</text>
<line x1="505" y1="390" x2="575" y2="390" stroke="#465A73" stroke-width="3" marker-end="url(#arr)"/>
<line x1="1020" y1="390" x2="1090" y2="390" stroke="#465A73" stroke-width="3" marker-end="url(#arr)"/>
<rect x="250" y="665" width="1100" height="130" rx="18" fill="#EEE8FA" stroke="#C8D2E1" stroke-width="2"/>
<text x="275" y="712" text-anchor="start" font-family="Arial, sans-serif" font-size="28.2" font-weight="700" fill="#20293A">
<tspan x="275" dy="0">Интерпретация</tspan>
</text>
<text x="275" y="749" text-anchor="start" font-family="Arial, sans-serif" font-size="19.6" font-weight="400" fill="#596579">
<tspan x="275" dy="0">Group routing, continuous gate weights и коррелированные маршруты уменьшают прямой смысл</tspan>
<tspan x="275" dy="26">C(E,k).</tspan>
</text>
</svg>
